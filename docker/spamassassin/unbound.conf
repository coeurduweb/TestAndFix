# Unbound for SpamAssassin only: full recursion from the root, nothing kept in cache, so each
# DNSBL or SPF query reaches the authoritative servers (Spamhaus refuses public resolvers).
server:
    interface: 127.0.0.1
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    access-control: 127.0.0.0/8 allow
    username: "unbound"
    directory: "/etc/unbound"
    chroot: ""
    use-syslog: no
    logfile: ""
    verbosity: 0
    # no cache: every answer expires immediately
    cache-max-ttl: 0
    cache-min-ttl: 0
    cache-max-negative-ttl: 0
    prefetch: no
    serve-expired: no
    msg-cache-size: 1m
    rrset-cache-size: 2m
    key-cache-size: 1m
    neg-cache-size: 1m
    qname-minimisation: yes
    harden-glue: yes
    hide-identity: yes
    hide-version: yes
