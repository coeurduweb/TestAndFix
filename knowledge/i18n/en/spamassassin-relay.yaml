sa.rdns_none:
  title: "The sending IP has no reverse DNS"
  why: "The IP {ip} that delivered the message returns no name when queried in reverse DNS. Serious mail servers always have one: its absence suggests an infected machine or a hastily set up server, and several providers refuse these connections."
  fix:
    - "Ask the host or provider of the IP {ip} to create a PTR record, for example mail.{domain}."
    - "Point this name to {ip} in forward DNS (A record), so that both directions match."
    - "Announce this same name in HELO."
sa.rdns_dynamic:
  title: "The reverse DNS of the sending IP looks like a consumer connection"
  why: "The name {ptr} of the sending IP contains the IP address or words typical of home boxes and residential connections. SpamAssassin concludes that a computer or connected device is sending directly, which is typical behavior of infected machines."
  fix:
    - "Do not deliver directly from an office or home internet connection: go through the authenticated SMTP of your mail service."
    - "For a dedicated server, request an explicit reverse DNS such as mail.{domain} instead of the generic name of the host."
sa.rdns_localhost:
  title: "The public reverse DNS of the sending IP is localhost"
  why: "The public IP {ip} presents itself in reverse DNS as “localhost”. This is a configuration error that filters associate with abandoned or hijacked servers."
  fix:
    - "Have the PTR record of {ip} replaced with a real name (mail.{domain}) by the IP provider."
sa.helo_dynamic_ipaddr:
  title: "The server announces itself with a name that contains its IP"
  why: "The name announced in HELO ({helo}) is built from the IP address, like the automatic names of internet providers. A mail server normally announces itself with its own name."
  fix:
    - "Set the server's HELO name to a chosen name, for example mail.{domain}, which points to {ip}."
    - "Align the reverse DNS of {ip} with this same name."
  fix_by_provider:
    postfix: "Set myhostname = mail.example.fr in main.cf (or smtp_helo_name for outgoing HELO only)."
    exim: "Set primary_hostname in the main configuration, or helo_data in the remote_smtp transport."
sa.helo_dynamic_ipaddr2:
  title: "The server announces itself with a name that starts with its IP"
  why: "The HELO name ({helo}) starts with the four numbers of an IP address. This is the pattern of dynamic connection names, one of the most penalized by SpamAssassin among the HELO rules."
  fix:
    - "Give the server a proper name (mail.{domain}) and use it in HELO."
    - "If you cannot change the name, send through an authenticated SMTP relay."
  fix_by_provider:
    postfix: "Set smtp_helo_name = mail.example.fr in main.cf, then reload Postfix."
sa.helo_dynamic_split_ip:
  title: "The HELO name splits an IP address"
  why: "The HELO name ({helo}) contains an IP address cut into pieces, the pattern of dynamic names generated by providers. Heavy penalty."
  fix:
    - "Set an explicit HELO name (mail.{domain}) that resolves to {ip}."
sa.helo_dynamic_dhcp:
  title: "The HELO name suggests a DHCP or cable connection"
  why: "The HELO name ({helo}) contains a word specific to consumer connections (dsl, cable, dhcp). The server appears to be a private individual's machine."
  fix:
    - "Send through your mail service's SMTP relay instead of delivering from this connection."
sa.helo_localhost:
  title: "The server announces itself as localhost"
  why: "The server that delivered the message presented itself as “localhost”. No proper mail server does this: it is typical of a PHP script or a server installed without configuration. It is one of the heaviest HELO penalties."
  fix:
    - "Set the server's fully qualified host name (mail.{domain}) and use it in HELO."
    - "For a website that sends by itself, go through an SMTP extension to your mail service."
  fix_by_provider:
    postfix: "Set myhostname to a fully qualified name in main.cf; also check /etc/hostname."
    wordpress: "Install an SMTP extension and send through your mail service's server instead of mail()."
sa.helo_no_domain:
  title: "The HELO name is not a fully qualified domain name"
  why: "The server announces itself with a short name, without a domain ({helo}). The standard requires a full name. Common case: a Windows server, a NAS or a script that uses the machine's name."
  fix:
    - "Replace the HELO name with a full name such as mail.{domain}, which resolves to {ip}."
    - "On Exchange or a Windows server, set the FQDN of the sending connector."
  fix_by_provider:
    postfix: "Set myhostname to a qualified name (at least one dot) in main.cf."
sa.helo_misc_ip:
  title: "The HELO name looks like a dynamic IP address"
  why: "The HELO name ({helo}) contains a series of numbers that looks like an IP address. Light penalty, a sign of a generic host name."
  fix:
    - "Use a chosen HELO name, without an IP address in it."
sa.helo_static_host:
  title: "Static HELO name recognized from a large sending service"
  why: "The HELO name contains an IP, but SpamAssassin recognizes the format of a large sending service and cancels the dynamic HELO penalties."
  fix:
    - "Nothing to fix."
sa.khop_helo_fcrdns:
  title: "The HELO name does not match the reverse DNS"
  why: "The server announces itself as {helo} while its IP {ip} is named {ptr}. On an otherwise unauthenticated message, SpamAssassin sees a server lying about its identity."
  fix:
    - "Make three elements match: the HELO name, the reverse DNS of {ip} and the A record of this name."
    - "Also authenticate the message with SPF or DKIM: the rule no longer applies if either one passes."
sa.may_be_forged:
  title: "The reverse DNS of the sending IP does not point back to this IP"
  why: "The name {ptr} of the IP {ip} does not point back to {ip}. The receiving server marked it “may be forged”. Without a valid SPF or DKIM, this is enough to make the sender look suspicious."
  fix:
    - "Create the A record that points {ptr} to {ip}, or have the PTR changed to a name that already points to it."
    - "Authenticate the message (valid SPF or DKIM): the rule then no longer applies."
sa.ck_helo_generic:
  title: "The HELO name suggests a generic address pool"
  why: "The HELO name ({helo}) resembles the generic names of providers' address ranges. Almost no effect on the score, but other filters are stricter."
  fix:
    - "Use a dedicated HELO name (mail.{domain})."
sa.fsl_helo_bare_ip_1:
  title: "The server announces itself with a bare IP address"
  why: "The server said “HELO {helo}” with a plain IP address instead of a name. The standard requires a domain name, or an IP in square brackets as a last resort. Badly configured sending scripts often do this."
  fix:
    - "Configure the sending software to announce a full name (mail.{domain})."
    - "In PHPMailer or an SMTP library, fill in the Hostname or Helo option."
sa.fsl_helo_non_fqdn_1:
  title: "HELO name without a domain"
  why: "The HELO name ({helo}) is a single word, without a domain. Almost no score here, but the same error triggers HELO_NO_DOMAIN, which is much heavier."
  fix:
    - "Announce a full name such as mail.{domain}."
sa.rcvd_helo_ip_mismatch:
  title: "The HELO announces an IP that differs from the real IP"
  why: "The server announced itself with the IP {helo} while connecting from {ip}. This happens with a server behind a port redirection, or with software that announces an old IP."
  fix:
    - "Replace the IP announced in HELO with a full host name that resolves to {ip}."
sa.rcvd_illegal_ip:
  title: "A Received header contains an impossible IP address"
  why: "A Received line cites an IP address that cannot exist on the internet. Either it is a forged header, or a misconfigured device writes a documentation or test IP."
  fix:
    - "If the line comes from your server or application, correct the IP it records."
    - "Never insert a Received header by hand in a sending script."
sa.no_rdns_dotcom_helo:
  title: "The server presents itself as a major provider but has no reverse DNS"
  why: "The server announces in HELO the name of a major mail provider, but its IP {ip} has no reverse DNS. Real servers of these providers always have one: this is spoofing."
  fix:
    - "Configure your server to announce its own name, not a provider's."
sa.rcvd_fake_helo_dotcom:
  title: "The HELO name imitates a known domain name"
  why: "The server announces itself with a generic or spoofed name such as yahoo.com, localhost.com or mydomain.com. Example values left in a configuration produce exactly this."
  fix:
    - "Replace the example host name with mail.{domain}."
sa.tvd_rcvd_ip:
  title: "The sending server announced itself with an IP address"
  why: "Information: a Received line shows that the sender presented itself by an IP address. No weight here, but it reinforces other rules on HELO."
  fix:
    - "Configure a full HELO name on the sending server."
