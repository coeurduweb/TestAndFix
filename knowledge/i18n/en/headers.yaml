headers.message_id_missing:
  title: "The message has no Message-ID header"
  why: "Gmail requires a valid Message-ID on every message. Without one, the message looks like a send generated by a script, and the conversation thread cannot be rebuilt on the recipient's side."
  fix:
    - "Let the sending server add the Message-ID instead of building the headers by hand in your code."
    - "If your script writes the headers itself, add a Message-ID line in the form <unique-id@{domain}>."
    - "Send a test again and check that the header appears only once."
  fix_by_provider:
    wordpress: "Send through authenticated SMTP with a plugin such as WP Mail SMTP or FluentSMTP: PHPMailer then generates the Message-ID. Do not add an empty Message-ID to the $headers array of wp_mail()."
    postfix: "Postfix adds the missing Message-ID for messages submitted locally. For messages relayed from the network, add always_add_missing_headers = yes in main.cf, then run postfix reload."
headers.message_id_malformed:
  title: "The Message-ID does not follow the syntax <id@domain>"
  why: "A malformed Message-ID is a sign of a hand-written header. Some filters count it as a spam signal, and replies may not attach to the right thread."
  fix:
    - "Write the Message-ID between angle brackets, with a unique left part, an @, and a domain name on the right."
    - "Do not put any space or accented character in the identifier."
    - "The simplest option: delete the line from your code and let the sending server generate it."
headers.message_id_localhost:
  title: "The Message-ID ends with localhost or with an unqualified name"
  why: "A Message-ID ending in @localhost shows that the server that built the message does not know its own name. It is the usual signature of scripts and misconfigured servers."
  fix:
    - "Give the sending server a fully qualified name, for example mail.{domain}, that resolves in DNS."
    - "In your code, build the right-hand part of the Message-ID with {domain} instead of the machine's name."
  fix_by_provider:
    postfix: "In main.cf, set myhostname = mail.{domain} and mydomain = {domain}, then run postfix reload."
    wordpress: "PHPMailer's Message-ID uses the web server's name. Add a phpmailer_init filter that sets $phpmailer->Hostname = '{domain}', or go through an SMTP plugin."
headers.date_missing:
  title: "The Date header is missing"
  why: "Date is one of the two mandatory headers of any email. Without it, the message does not comply with RFC 5322, which Gmail and Yahoo require you to follow, and it will be misfiled in the inbox."
  fix:
    - "Let the sending server add the Date header instead of writing it yourself."
    - "If your code generates it, use the RFC 5322 format, with the time zone as +hhmm."
  fix_by_provider:
    postfix: "Add always_add_missing_headers = yes in main.cf if messages arrive from another machine without a Date, then run postfix reload."
    wordpress: "Go through an SMTP plugin: PHPMailer adds the Date header. Do not remove it in the wp_mail filter."
headers.date_future:
  title: "The message date is in the future"
  why: "A date set ahead puts the message at the top of the inbox for hours. Filters know this trick and penalize it. In your test, the measured gap is {value}."
  fix:
    - "Synchronize the clock of the server that generates the message with NTP (chrony or systemd-timesyncd)."
    - "Check the time zone declared in your application: a local time followed by +0000 produces this offset."
headers.date_too_old:
  title: "The message date is very old"
  why: "The message carries a date {value} earlier than when it was received. It will appear buried in the recipient's inbox, and filters often see a replayed message or a stuck queue."
  fix:
    - "Check that the Date header is calculated at the time of sending, not when the draft or template was created."
    - "Synchronize the server clock with NTP."
    - "If messages stay in the queue for a long time, look for the cause in the sending server's logs."
headers.date_malformed:
  title: "The Date header is not in the standard format"
  why: "An unreadable date is replaced by the time of receipt, or misread. Filters count this malformation as a sign of a homemade sending tool."
  fix:
    - "Write the date in this format: abbreviated English day name, comma, day, abbreviated English month name, year, time, time zone as +hhmm."
    - "Do not write the month in French, and do not use a time zone in letters such as CEST."
    - "In PHP, use date('r') or DateTime::RFC2822 instead of a homemade format."
headers.date_timezone_inconsistent:
  title: "The time zone of Date does not match the actual sending time"
  why: "The time given in Date and the one recorded by the first server differ by {value}. The recipient sees a wrong time, and this gap is a known signal for filters."
  fix:
    - "Set the time zone of your application (for example Europe/Paris) instead of forcing +0000."
    - "In PHP, set date.timezone in php.ini or call date_default_timezone_set('Europe/Paris') before generating the header."
headers.from_missing:
  title: "The message has no sender (From)"
  why: "From is mandatory. Without it, DMARC has no domain to check: most large webmail services reject the message or file it straight into the junk folder."
  fix:
    - "Add a From header with an address on your domain, for example contact@{domain}."
    - "In your sending tool, fill in the Sender or Sending address field of the campaign or form."
  fix_by_provider:
    wordpress: "In WP Mail SMTP or FluentSMTP, enter an address at {domain} in From Email and tick the option that forces this address for all sends."
headers.from_multiple:
  title: "The From header contains several addresses or appears several times"
  why: "Google requires a single address in From. Several addresses prevent DMARC from knowing which domain to check: the message is often rejected."
  fix:
    - "Keep only one address in From, the one at {domain}."
    - "Put the other addresses in Reply-To or Cc if they must receive replies."
    - "Check that your code does not add a second From to the one already provided by the sending library."
headers.from_no_display_name:
  title: "The sender has no display name"
  why: "The recipient sees only the raw address, often truncated on mobile. A recognizable sender is less often reported as spam."
  fix:
    - "Add a display name before the address: your company's name or the name of the person writing."
    - "If the name contains a comma, a period or accented characters, put it between straight double quotation marks."
  fix_by_provider:
    mailchimp: "In the campaign, click From, then fill in Name with your company's name."
    wordpress: "In WP Mail SMTP, enter From Name and tick Force From Name."
headers.from_display_name_has_address:
  title: "The display name contains an email address other than the real sender's"
  why: "The display name shows {value} while the real address is on {domain}. This is the most common spoofing technique: anti-phishing filters penalize it heavily."
  fix:
    - "Replace the display name with a name that contains no address: your company's name or the person's name."
    - "If you want replies to go to another address, use Reply-To, not the display name."
headers.from_display_name_brand_spoof:
  title: "The display name uses a well-known brand that is not yours"
  why: "The display name cites {value} while the message is sent from {domain}. Anti-phishing filters compare this name with the real domain and classify this type of message as a spoofing attempt."
  fix:
    - "Use your own company's name in the display name."
    - "If you send on behalf of this brand, send from its domain, with SPF, DKIM and DMARC configured by it."
headers.reply_to_other_domain:
  title: "Replies go to a different domain than the sender"
  why: "The message comes from {domain} but replies will go to {value}. This pattern is common in phishing: some filters penalize it, especially if the reply domain is recent."
  fix:
    - "If this is not intended, remove Reply-To or use an address at {domain}."
    - "If it is intended (outsourced customer service), create an address on {domain} that forwards to this service."
  fix_by_provider:
    mailchimp: "In the campaign, From section, check the address shown: Mailchimp also uses it as the reply address."
    wordpress: "Check the Reply-To field of your form plugin (Contact Form 7, WPForms, Gravity Forms): this is often where the visitor's address is inserted, which is normal for an internal notification."
headers.reply_to_freemail:
  title: "Replies go to a free email provider"
  why: "The message is sent from {domain} but asks the reader to reply to a {value} address. This is the typical pattern of fake-supplier fraud: filters spot it and penalize it."
  fix:
    - "Create a reply address on {domain} and use it in Reply-To."
    - "If you receive your mail at a free email provider, forward the address at {domain} to it rather than exposing the free address."
headers.sender_inconsistent:
  title: "The Sender header names a different domain than From"
  why: "Outlook then shows “{value} on behalf of {domain}”, which worries the recipient and increases reports as spam."
  fix:
    - "Remove the Sender header if the real sender is indeed {domain}."
    - "If your sending tool adds it, set up an authenticated sending domain on {domain}: most tools then remove Sender."
headers.return_path_other_domain:
  title: "The return address (Return-Path) is on another domain"
  why: "Bounces go to {envelope_domain} and not to {domain}. This is normal with a sending tool, but SPF cannot then align with {domain}: only DKIM can validate DMARC."
  fix:
    - "In your sending tool, set up a custom return domain (often called Return-Path, bounce domain or MAIL FROM) on a subdomain of {domain}."
    - "Publish the CNAME or MX record that the tool gives you for this subdomain."
  fix_by_provider:
    sendgrid: "Settings > Sender Authentication > Authenticate Your Domain: the wizard creates a return subdomain on {domain}."
    amazon_ses: "In the SES console, identity {domain} > Custom MAIL FROM domain: choose a subdomain, then publish the MX and the SPF TXT shown."
    mailgun: "The sending domain declared in Mailgun must be a subdomain of {domain} (for example mg.{domain}): it then serves as the Return-Path."
headers.to_missing:
  title: "The message has no visible recipient (To)"
  why: "Without To, the message looks like it was sent blind-copied to a list. It is a classic sign of unsolicited bulk sending for filters."
  fix:
    - "Send one message per recipient, with their address in To."
    - "For a list, use a sending tool that personalizes To for each contact instead of using blind copy."
headers.to_undisclosed:
  title: "The displayed recipient is “undisclosed-recipients”"
  why: "This label signals a group send in blind copy. Filters treat it as a bulk send without personalization, often filed as junk."
  fix:
    - "Do not put your contacts in Bcc for a group send: use a newsletter sending tool that addresses each message to a single recipient."
    - "For a few recipients, do a mail merge from your email client."
headers.subject_missing:
  title: "The message has no subject"
  why: "A message without a subject is rarely opened and often reported as spam. Combined with an empty body, it is classified as spam with high confidence by Microsoft filters when this option is enabled."
  fix:
    - "Add a subject that summarizes the message in a few words."
    - "Check that your template or form fills in the subject variable."
headers.subject_empty:
  title: "The message subject is empty"
  why: "The Subject header exists but contains nothing. It is almost always an unfilled template variable, and the message appears as “(no subject)” for the recipient."
  fix:
    - "Check the variable that feeds the subject in your template or code."
    - "Provide a default subject for when the variable is empty."
headers.subject_all_caps:
  title: "The subject is written in capitals"
  why: "A subject in capitals is perceived as aggressive and is one of the traditional criteria of spam filters. It also increases reports by recipients."
  fix:
    - "Rewrite the subject in lowercase, with a capital at the start of the sentence and on proper nouns."
    - "To emphasize a word, put it at the start of the subject rather than writing it in capitals."
headers.subject_emoji_excess:
  title: "The subject contains many emojis"
  why: "The subject contains {value} emojis. Beyond one or two, they make the message look like aggressive promotion and display poorly in some clients."
  fix:
    - "Keep a single emoji, at the start or end of the subject, if it adds meaning."
    - "Check that the subject still makes sense if the emoji is not displayed."
headers.subject_encoding_broken:
  title: "The subject contains incorrectly encoded accented characters"
  why: "The accented characters in the subject are not encoded according to RFC 2047. The recipient may see stray characters such as Ã©, and filters count this malformation against you."
  fix:
    - "Let your sending library encode the subject: pass it a UTF-8 string without encoding it yourself."
    - "In PHP with mail(), encode the subject with mb_encode_mimeheader($sujet, 'UTF-8', 'B'), or better, switch to PHPMailer."
    - "Do not split an encoded word in the middle of a multibyte character."
headers.subject_fake_reply:
  title: "The subject starts with RE: or TR: without being a real reply"
  why: "Making it look like an existing conversation is a well-known phishing technique. Filters check for the presence of In-Reply-To and References and penalize the imitation."
  fix:
    - "Remove RE:, TR: or FWD: from the subject of a first message."
    - "For a real reply, use the Reply function of your mail client, which adds In-Reply-To and References."
headers.x_mailer_phpmailer:
  title: "The headers reveal a send from a PHP script"
  why: "The {value} header shows that the message comes directly from a PHP script. Hacked PHP scripts are a major source of spam: some filters add points for this single clue."
  fix:
    - "Send through authenticated SMTP to a real mail server instead of the mail() function."
    - "Hide PHPMailer's X-Mailer header by giving it the value of a single space."
    - "Disable mail.add_x_header in php.ini to remove X-PHP-Originating-Script."
  fix_by_provider:
    wordpress: "Add in a custom plugin: add_action('phpmailer_init', function($m){ $m->XMailer = ' '; }); then configure WP Mail SMTP or FluentSMTP to send through authenticated SMTP."
    cpanel: "In MultiPHP INI Editor, set mail.add_x_header to Off for the domain."
headers.x_mailer_bulk_tool:
  title: "The message is sent with software associated with spam"
  why: "The X-Mailer header shows {value}, a bulk-mailing software widely used by spammers. Filters recognize its signature and penalize all the messages it produces."
  fix:
    - "Use a recognized sending platform that handles authentication, unsubscribes and bounces."
    - "If you keep this software, remove the X-Mailer header in its settings, but know that its signature remains recognizable elsewhere in the message."
headers.duplicate_single_instance:
  title: "A header that must be unique appears several times"
  why: "The {value} header appears several times. Gmail requires these headers to appear only once: a duplicate makes the message non-compliant and can cause a rejection."
  fix:
    - "Search your code or plugin for where {value} is added a second time."
    - "If a relay adds the header that is already present, remove it from your application and let the relay handle it."
headers.received_too_many:
  title: "The message went through an unusual number of servers"
  why: "The message carries {value} Received headers. A chain this long often betrays a redirect loop or a misconfigured relay, and a server ends up rejecting the message."
  fix:
    - "List the servers in the Received headers, from bottom to top, to spot the one that repeats."
    - "Remove chained redirects between mailboxes or between domains, and send the message directly from your sending server."
  fix_by_provider:
    postfix: "Postfix rejects beyond hopcount_limit (run postconf hopcount_limit to see the value). Look for the loop rather than raising this limit."
headers.precedence_bulk:
  title: "The Precedence header classifies the message as a bulk mailing"
  why: "Precedence: {value} indicates a bulk mailing. On a transactional message (invoice, password), it pushes the message to the promotions tabs or to the junk folder."
  fix:
    - "Remove Precedence from transactional messages."
    - "To prevent automatic replies, use Auto-Submitted: auto-generated instead, defined by RFC 3834."
headers.mime_version_missing:
  title: "The MIME-Version header is missing"
  why: "Without MIME-Version, the client may ignore the HTML parts, attachments and accented-character encoding. Filters see a message built without a sending library."
  fix:
    - "Add the line MIME-Version: 1.0 to the headers."
    - "Better: use a sending library (PHPMailer, Symfony Mailer, Nodemailer, Python's email library) that builds the MIME headers correctly."
headers.charset_missing:
  title: "The character set is not declared"
  why: "The text contains accented characters but no charset is declared: the client assumes ASCII and displays stray characters in place of the accented letters."
  fix:
    - "Declare the character set in the Content-Type of each text part: charset=UTF-8."
    - "In the HTML part, also add <meta charset='utf-8'> in the head."
headers.charset_mismatch:
  title: "The declared character set does not match the text"
  why: "The part is declared as {value} but its bytes are in another encoding. Accented characters display incorrectly and content filters read distorted text."
  fix:
    - "Save your templates in UTF-8 and declare charset=UTF-8."
    - "If your database is in latin1, convert the text to UTF-8 before inserting it into the message."
headers.line_too_long:
  title: "A line of the message exceeds 998 characters"
  why: "The longest line measures {value} characters. Beyond 998, servers may cut the line at random, which breaks the HTML, invalidates the DKIM signature or gets the message rejected."
  fix:
    - "Encode the HTML part in quoted-printable or base64: these encodings produce short lines."
    - "Or insert line breaks in the HTML, between the tags, before sending."
  fix_by_provider:
    wordpress: "Go through an SMTP plugin: PHPMailer automatically chooses quoted-printable when a line is too long."
headers.8bit_without_8bitmime:
  title: "8-bit content is sent without announcing it to the server"
  why: "The message contains 8-bit bytes, but the sending server has not declared them (BODY=8BITMIME). A strict relay may reject the message or garble the accented characters."
  fix:
    - "Encode the text parts in quoted-printable or base64: the message becomes 7-bit and goes through everywhere."
    - "Or check that your sending server announces BODY=8BITMIME when it relays 8-bit content."
  fix_by_provider:
    postfix: "Postfix converts to 7-bit when the remote server does not announce 8BITMIME (disable_mime_output_conversion = no, the default value). Check that this setting has not been changed."
headers.cte_inconsistent:
  title: "The declared transfer encoding does not match the content"
  why: "A part declared as {value} contains data that does not respect this encoding. The client may display unreadable text, and filters see a badly built message."
  fix:
    - "Let your sending library choose Content-Transfer-Encoding instead of forcing it."
    - "If the part contains accented characters, declare quoted-printable or base64 and actually encode the content."
    - "Never declare base64 or quoted-printable on a multipart part."
headers.raw_8bit_in_headers:
  title: "Some headers contain unencoded accented characters"
  why: "The {value} header contains raw non-ASCII bytes. Clients display them unpredictably, and some servers reject the message."
  fix:
    - "Pass display names and accented subjects to your sending library as a UTF-8 string: it will encode them."
    - "For attachment file names, let the library apply RFC 2231 encoding."
headers.headers_oversized:
  title: "The message headers are very large"
  why: "The headers weigh {value}. Google asks you to avoid excessively large headers: they often reveal stacked tracking headers or a relay loop."
  fix:
    - "List the X- headers added by your tools and remove those that serve no purpose."
    - "Check that no header is repeated at each pass through a relay."
headers.bcc_visible:
  title: "The Bcc header is visible to the recipient"
  why: "The blind-copy addresses were carried in the received message. They are exposed to all recipients, which is a privacy problem and looks like a homemade send."
  fix:
    - "Do not build the Bcc header by hand: pass the hidden recipients to the sending library, which puts them only in the SMTP envelope."
    - "For a group send, use a tool that addresses one message per recipient."
