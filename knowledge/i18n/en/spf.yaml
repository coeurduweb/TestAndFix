spf.missing:
  title: "The domain {envelope_domain} has no SPF record"
  why: "Without SPF, nothing tells recipients which servers are allowed to send for {envelope_domain}. Gmail, Yahoo and Outlook.com require this authentication: your messages risk the spam folder or rejection."
  fix:
    - "List all the services that send with an address from {envelope_domain}: mail, website, billing software, email marketing tool."
    - "Create a single TXT record at the root of {envelope_domain} starting with v=spf1, with an include: or an ip4: per service, and ending with ~all."
    - "Check the result with this test: SPF must show pass for the IP {ip}."
  fix_by_provider:
    google_workspace: "Add the TXT v=spf1 include:_spf.google.com ~all (Google Workspace documentation, Configure SPF)."
    microsoft_365: "At your DNS host, add the TXT v=spf1 include:spf.protection.outlook.com -all. Microsoft 365 does not allow creating it in its interface for a custom domain."
    ovh: "In the OVHcloud client area, DNS zone, Add an entry, type SPF: v=spf1 include:mx.ovh.com ~all (include:mx.ovh.ca for Canada and Asia-Pacific accounts). Valid for MX Plan, Email Pro and hosted Exchange."
    o2switch: "In cPanel, Authentication, Manage, Customize: o2switch states that the only include to use for its services is include:spf.jabatus.fr. Be wary of SPF records generated by AI tools."
    cpanel: "In Email, Email Deliverability, click Manage, then install the suggested SPF record (of the form v=spf1 +a +mx +ip4:… ~all). If the DNS is not managed by this server, copy it to your DNS host."
    plesk: "In Websites & Domains, DNS, add or complete the TXT v=spf1 (server template: Tools & Settings, DNS Settings)."
    ionos: "For a domain using IONOS DNS servers, enable the “IONOS SPF (TXT)” record. With external DNS, publish v=spf1 include:_spf-eu.ionos.com ~all."
    gandi: "Publish v=spf1 include:_mailcust.gandi.net ~all, and add include:_spf.gpaas.net if your site hosted at Gandi also sends."
    infomaniak: "Infomaniak automatically installs v=spf1 include:spf.infomaniak.ch -all when the DNS zone is hosted with them. Otherwise, publish this value."
    zoho: "Publish the value shown in the Zoho Mail admin console (documentation: v=spf1 include:zoho.com ~all)."
    proton: "In Settings, Domain names, Review, SPF tab, copy the suggested record (it contains include:_spf.protonmail.ch)."
    brevo: "Brevo does not require SPF to authenticate a domain. If you merge its include into your SPF, the official value is include:spf.brevo.com."
    mailchimp: "Nothing to add: Mailchimp sends with its own return domain, which its SPF already covers. Authenticate the domain with DKIM instead (Account & billing, Domains)."
    mailjet: "Publish v=spf1 include:spf.mailjet.com ~all (or add this include to your existing SPF)."
    sendgrid: "With automated security (the default), the sendgrid.net include is carried by the em… subdomain that SendGrid has you delegate by CNAME: publish the CNAMEs from Settings, Sender Authentication. Without this option, publish v=spf1 include:sendgrid.net ~all on this subdomain."
    mailgun: "Publish on the sending domain declared in Mailgun (often a subdomain such as mg.{domain}): v=spf1 include:mailgun.org ~all."
    amazon_ses: "By default SES uses an amazonses.com return domain, which is already covered. For a custom return domain (MAIL FROM), publish on this subdomain an MX 10 feedback-smtp.<region>.amazonses.com and the TXT v=spf1 include:amazonses.com ~all."
    postmark: "Postmark no longer requires SPF: create the custom Return-Path CNAME pointing to pm.mtasv.net instead, as shown in Sender Signatures, DNS Settings."
    hubspot: "Add to the root TXT record the include specific to your account (of the form include:123456.spf03.hubspotemail.net), to copy from Settings, Content, Domains & URLs, Email Sending."
    cloudflare_dns: "In DNS, Records, Add record, type TXT, name @, content v=spf1 … ~all. TXT records never go through the proxy."
spf.multiple_records:
  title: "The domain {envelope_domain} publishes several SPF records"
  why: "Two v=spf1 records cancel SPF: the recipient returns a permanent error, and {envelope_domain} loses all SPF authentication, including for services that are correctly declared."
  fix:
    - "Note the mechanisms of each existing SPF record."
    - "Merge them into one: a v=spf1 at the start, all the include: and ip4: after it, and a single all at the end."
    - "Delete the other v=spf1 records and run the test again."
  fix_by_provider:
    o2switch: "In cPanel, Zone Editor, delete the duplicate, then complete the remaining record via Authentication, Manage, Customize (INCLUDE section)."
    brevo: "Brevo gives this merge example: v=spf1 include:_spf.google.com include:spf.brevo.com mx ~all."
    cloudflare_dns: "In DNS, Records, filter on TXT, edit one of the records to merge the other into it, then delete the second."
spf.type99_only:
  title: "The SPF of {envelope_domain} is published in an obsolete record type"
  why: "Your SPF exists, but in the “SPF” record type (99) that no recipient reads any more. For them, {envelope_domain} has no SPF."
  fix:
    - "Recreate exactly the same content in a TXT record at the root of {envelope_domain}."
    - "Then delete the SPF (99) record."
spf.type99_leftover:
  title: "An old SPF (99) record remains on {envelope_domain}"
  why: "Only your TXT record is read. The old type 99 record serves no purpose, and it may be edited by mistake instead of the correct one."
  fix:
    - "Delete the SPF (99) record and keep only the TXT record."
spf.syntax_error:
  title: "The SPF of {envelope_domain} contains a syntax error"
  why: "A single syntax error makes the whole record invalid: recipients treat it as a permanent error, as if {envelope_domain} had no SPF."
  fix:
    - "Find the term in error flagged by the test in “{spf_record}”."
    - "Separate each term with a single space, with no space after the colons, with ip4: for IPv4 and ip6: for IPv6."
    - "Replace the record with the corrected version: {suggested_record}."
spf.unknown_mechanism:
  title: "The SPF of {envelope_domain} uses an unknown mechanism"
  why: "The SPF contains a word the standard does not know, often a typo. The whole record becomes invalid, and your messages lose SPF authentication."
  fix:
    - "Find the unknown term in “{spf_record}”."
    - "Correct it with one of the valid mechanisms: include:, ip4:, ip6:, a, mx, exists:, all."
    - "Publish the corrected version: {suggested_record}."
spf.version_invalid:
  title: "The SPF of {envelope_domain} does not start with v=spf1"
  why: "Your record looks like an SPF, but its beginning is not recognized. Recipients ignore it and consider that {envelope_domain} has no SPF."
  fix:
    - "Make the record start exactly with v=spf1 followed by a space, with no space or quotation mark before it."
    - "If your DNS interface adds the quotation marks itself, do not type them in the value."
    - "Publish: {suggested_record}."
spf.sender_id_record:
  title: "{envelope_domain} publishes an old Sender ID record (spf2.0)"
  why: "Sender ID is abandoned and no longer used by the major providers. The record serves no purpose and weighs down your domain's DNS response."
  fix:
    - "Delete the TXT record that starts with spf2.0/ and keep only the v=spf1 record."
spf.plus_all:
  title: "The SPF of {envelope_domain} allows the whole world (+all)"
  why: "With +all, anyone can send on behalf of {envelope_domain} and get a valid SPF. Recipients know this: this SPF does not protect you and may even be treated as a spam signal."
  fix:
    - "List the services that actually send for {envelope_domain}."
    - "Replace +all with ~all (or -all once you are sure of the list), and add the missing include: or ip4: entries."
    - "Publish: {suggested_record}."
spf.neutral_all:
  title: "The SPF of {envelope_domain} ends with ?all (neutral)"
  why: "With ?all, your SPF says nothing about servers that are not listed. A spoofer gets the same result as an unknown server, and your SPF does not help DMARC block it."
  fix:
    - "Check that all your sending services are in the record."
    - "Replace ?all with ~all, then with -all once the DMARC reports show no more legitimate sending that is not covered."
  fix_by_provider:
    gandi: "Replace ?all with ~all in v=spf1 include:_mailcust.gandi.net ?all."
    infomaniak: "Infomaniak offers a ?all variant. Prefer the default value v=spf1 include:spf.infomaniak.ch -all."
spf.no_all:
  title: "The SPF of {envelope_domain} does not end with an all mechanism"
  why: "Without a final all, your SPF does not say what to do with unauthorized servers: they get a neutral result, as if you had declared nothing about them."
  fix:
    - "Add ~all at the end of the record."
    - "Switch to -all once you are sure that all your sending services are listed."
spf.terms_after_all:
  title: "Some mechanisms of the SPF of {envelope_domain} are placed after all"
  why: "Everything after all is ignored. The service declared after all is therefore not authorized, and its messages fail SPF."
  fix:
    - "Move the terms placed after all to just before it."
    - "Publish: {suggested_record}."
spf.redirect_with_all:
  title: "The SPF of {envelope_domain} combines redirect= and all"
  why: "When all is present, the redirect is never followed: the servers you thought redirect= authorized are not authorized."
  fix:
    - "Choose one: either redirect= alone (the target domain decides everything), or include: entries followed by all."
    - "To keep the policy of the target domain while adding your own servers, replace redirect=target with include:target before all."
spf.redirect_target_invalid:
  title: "The SPF redirect of {envelope_domain} points to a domain without SPF"
  why: "Your SPF fully delegates to another domain that publishes no SPF. The result is a permanent error for all your messages."
  fix:
    - "Check the spelling of the domain given after redirect=."
    - "Publish an SPF on this target domain, or replace the redirect with your own include: entries followed by ~all."
spf.lookup_limit:
  title: "The SPF of {envelope_domain} makes {lookup_count} DNS lookups (maximum 10)"
  why: "Beyond 10 lookups, the recipient stops evaluating and returns a permanent error: {envelope_domain} loses the benefit of SPF for all its messages, even those of correctly declared services."
  fix:
    - "Remove the include: entries of services that {domain} no longer uses (former host, former email tool)."
    - "Remove a and mx if they do not match servers that send, or replace them with the matching ip4: addresses."
    - "Move marketing sends to a subdomain (for example news.{domain}) that has its own SPF."
    - "Check the new total with this test: it must stay at 10 or below."
  fix_by_provider:
    o2switch: "Remove +a and +mx if the only include:spf.jabatus.fr already covers your sends from o2switch."
    cpanel: "cPanel's default SPF contains +a and +mx (2 lookups): remove them if they serve no purpose, since the server's ip4: is enough."
    sendgrid: "With automated security, SendGrid's include is carried by the em… subdomain and does not count in the SPF of your root domain: remove include:sendgrid.net from the root if you added it there."
    mailchimp: "Mailchimp does not need an include in your SPF: remove it if it is there."
    brevo: "Brevo does not require an SPF include to authenticate a domain on a shared IP: remove include:spf.brevo.com if you have no dedicated IP."
spf.lookup_limit_near:
  title: "The SPF of {envelope_domain} is at {lookup_count} lookups, close to the limit"
  why: "All it takes is for one of your providers to add an include to its own SPF for yours to exceed 10 lookups and become invalid overnight."
  fix:
    - "Remove unnecessary include: entries now, and replace a and mx with ip4: where possible."
    - "Monitor this total after each addition of a new sending service."
spf.void_lookup_limit:
  title: "The SPF of {envelope_domain} contains more than two void lookups"
  why: "Several names cited in your SPF no longer exist. Beyond two, most recipients return a permanent error, and your SPF is worth nothing."
  fix:
    - "Find the terms that return nothing (the test lists them): former provider, typo, deleted subdomain."
    - "Delete them, or correct their spelling."
    - "Publish: {suggested_record}."
spf.mx_too_many_addresses:
  title: "The mx mechanism of the SPF of {envelope_domain} returns too many addresses"
  why: "Your MX records return more than 10 addresses: the mx mechanism produces a permanent error, and your whole SPF becomes invalid."
  fix:
    - "Remove mx from the SPF if your receiving servers do not send mail (this is the case at most providers, which have their own include:)."
    - "Otherwise, replace mx with the ip4: and ip6: addresses of the servers that actually send."
spf.ptr_mechanism:
  title: "The SPF of {envelope_domain} uses the ptr mechanism, which should be avoided"
  why: "ptr is slow and unreliable: some recipients do not evaluate it, and the servers it was meant to authorize then fail SPF. It also consumes DNS lookups."
  fix:
    - "Identify the servers that ptr was meant to cover."
    - "Replace ptr with their ip4: and ip6: addresses, or with the include: of their provider."
spf.include_no_spf:
  title: "The SPF of {envelope_domain} includes a domain that has no SPF"
  why: "An include: points to a domain without SPF. The standard then makes your whole SPF fail with a permanent error, not only this service."
  fix:
    - "Find the include flagged by the test, and check its spelling in the provider's documentation."
    - "If the service is no longer used, delete the include."
    - "Publish: {suggested_record}."
spf.include_permerror:
  title: "A domain included in the SPF of {envelope_domain} has an invalid SPF"
  why: "Your own record is correct, but an include: refers to an SPF that is in error. This error applies to all your messages."
  fix:
    - "Identify the faulty include flagged by the test."
    - "If it belongs to you (for example _spf.{domain}), correct it; otherwise, report the error to the provider."
    - "In the meantime, replace this include with the ip4: addresses of the service, if the provider publishes them."
spf.include_loop:
  title: "The SPF of {envelope_domain} includes itself (loop)"
  why: "Your SPF refers, directly or through an intermediary, back to itself. The recipient goes round in circles, stops, and returns a permanent error."
  fix:
    - "Delete the include: or redirect= entry that points to {envelope_domain} or to a subdomain that loops back to it."
    - "Publish: {suggested_record}."
spf.duplicate_terms:
  title: "The SPF of {envelope_domain} contains duplicate terms"
  why: "The same service appears twice. This is not an error, but each duplicate uses up one of the 10 allowed lookups."
  fix:
    - "Delete the repeated term and keep a single occurrence per service."
    - "For Brevo, keep include:spf.brevo.com, the documented value, and remove the old include:spf.sendinblue.com."
spf.softfail:
  title: "The IP {ip} is not authorized by the SPF of {envelope_domain} (softfail)"
  why: "The server that sent this message ({ip}, {provider}) is not declared in your SPF. Filters add spam points and, without aligned DKIM, DMARC fails."
  fix:
    - "Identify the service that sent this message: {provider}, IP {ip}, reverse DNS {ptr}."
    - "Add the official include: of this service to your SPF, or its ip4: address if it is your own server."
    - "Publish: {suggested_record}."
  fix_by_provider:
    google_workspace: "Add include:_spf.google.com."
    microsoft_365: "Add include:spf.protection.outlook.com."
    ovh: "Add include:mx.ovh.com (include:mx.ovh.ca for Canada and Asia-Pacific). For Private Exchange, add the ip4: addresses of the servers."
    o2switch: "Add include:spf.jabatus.fr through cPanel, Authentication, Manage, Customize."
    cpanel: "Add the server's ip4: address, or click Repair in Email Deliverability."
    ionos: "Add include:_spf-eu.ionos.com."
    gandi: "Add include:_mailcust.gandi.net, and include:_spf.gpaas.net for a site hosted at Gandi."
    infomaniak: "Add include:spf.infomaniak.ch."
    proton: "Add include:_spf.protonmail.ch."
    brevo: "Add include:spf.brevo.com, or better, set up the custom return domain (“Branded” CNAME) suggested in Senders, Domains, IPs, Domains."
    mailjet: "Add include:spf.mailjet.com."
    sendgrid: "Publish the em… CNAMEs, s1._domainkey and s2._domainkey from Settings, Sender Authentication. The SPF is then carried by the em… subdomain."
    mailgun: "Add include:mailgun.org to the SPF of the sending domain declared in Mailgun."
    amazon_ses: "Configure a custom MAIL FROM with the TXT v=spf1 include:amazonses.com ~all on this subdomain."
    hubspot: "Add the include specific to your account, shown in Settings, Content, Domains & URLs, Email Sending."
    wordpress: "If the message comes from the web server's mail() function, have the site send through your mail service's authenticated SMTP instead, using an SMTP extension."
spf.fail:
  title: "The IP {ip} is rejected by the SPF of {envelope_domain} (fail)"
  why: "Your SPF explicitly says that {ip} is not allowed to send for {envelope_domain}. Some recipients reject the message, and others file it as spam if DKIM does not rescue DMARC."
  fix:
    - "Check that the sending is legitimate: {provider}, IP {ip}, reverse DNS {ptr}. If you do not recognize this server, it is spoofing, and the SPF is doing its job."
    - "If it is legitimate, add the official include: of the service, or its ip4:, before -all."
    - "Publish: {suggested_record}, then run the test again."
  fix_by_provider:
    google_workspace: "Add include:_spf.google.com before -all."
    microsoft_365: "Add include:spf.protection.outlook.com before -all."
    ovh: "Add include:mx.ovh.com before -all."
    o2switch: "Add include:spf.jabatus.fr before -all."
    brevo: "Add include:spf.brevo.com before -all."
    mailjet: "Add include:spf.mailjet.com before -all."
    mailgun: "Add include:mailgun.org before -all on the sending domain."
    amazon_ses: "Add include:amazonses.com to the SPF of the custom MAIL FROM."
spf.temperror:
  title: "The SPF of {envelope_domain} could not be read (temporary DNS error)"
  why: "The DNS servers of {envelope_domain}, or of an included domain, did not respond in time. Recipients then delay your messages or evaluate them without SPF."
  fix:
    - "Run the test again in a few minutes to confirm that the error repeats."
    - "If it persists, check that all the name servers (NS) of {envelope_domain} respond and give the same SPF."
    - "Also check the DNSSEC signature of the zone: a broken signature produces the same symptom."
spf.helo_fail:
  title: "The SPF of the server name {helo} does not authorize the IP {ip}"
  why: "Your server presents itself under the name {helo}, but the SPF of this name does not authorize it. The effect is small on your normal messages, and stronger on your bounce messages."
  fix:
    - "Publish on the name {helo} an SPF that authorizes its IP: v=spf1 a -all (the name points to {ip})."
    - "Or use as HELO a name whose SPF already covers {ip}."
spf.helo_none:
  title: "The server name {helo} has no SPF"
  why: "An SPF on the server name lets you validate its technical messages, notably bounce messages. Its absence matters little, but it is a quick fix."
  fix:
    - "Publish the TXT record v=spf1 a -all on {helo}."
spf.string_too_long:
  title: "The SPF of {envelope_domain} exceeds 255 characters without being split"
  why: "A TXT string cannot exceed 255 characters. Your DNS interface refused or truncated the record: the end, often ~all or an include, has disappeared, and the SPF is wrong."
  fix:
    - "First shorten the record by removing unnecessary services."
    - "If it is still too long, enter it as several quoted strings separated by a space, splitting in the middle of a term if needed: they will be joined without a space."
    - "Check the result with dig TXT {envelope_domain}: the full text must appear."
spf.dns_response_too_large:
  title: "The DNS TXT response of {envelope_domain} exceeds 512 bytes ({value} bytes)"
  why: "All the TXT records of your domain are sent together when a recipient looks up the SPF. Beyond 512 bytes, some servers do not receive the response and treat {envelope_domain} as if it had no SPF."
  fix:
    - "Delete verification TXT records that are no longer useful (old google-site-verification, abandoned tools)."
    - "Shorten the SPF by removing unnecessary services."
    - "If possible, place a tool's sends on a subdomain that carries its own SPF."
spf.exp_modifier:
  title: "The SPF of {envelope_domain} uses the exp= modifier"
  why: "exp= is only useful to administrators who read rejections. It changes nothing for deliverability, and it adds a DNS lookup on failure."
  fix:
    - "Keep it only if you use the explanation text; otherwise remove it to simplify the record."
    - "If it is kept, check that the cited domain publishes a single ASCII TXT record."
spf.macros:
  title: "The SPF of {envelope_domain} uses macros"
  why: "Macros are legitimate, but they make your SPF depend on a third-party service that responds on the fly. If it goes down or disappears, your SPF fails without anything changing on your side."
  fix:
    - "Check that the service providing these macros is still under contract and available."
    - "Remove any “p” macro, which the standard discourages."
    - "If the number of services allows it, go back to classic include: and ip4: mechanisms."
spf.range_too_broad:
  title: "The SPF of {envelope_domain} authorizes a very broad range of addresses"
  why: "Your SPF authorizes an immense range, which necessarily contains servers that are not yours. A spoofer hosted in this range would pass SPF."
  fix:
    - "Replace the range with the addresses of your own servers only (/32 for a single IPv4 address)."
    - "For a sending service, use its official include: rather than its full range."
spf.non_sending_domain_open:
  title: "{domain} does not receive mail but does not forbid sending in its name"
  why: "A domain without mail is an easy target for spoofers. An SPF of “v=spf1 -all” and a DMARC p=reject are enough to make it unusable for them."
  fix:
    - "If {domain} never sends mail, publish the TXT record v=spf1 -all."
    - "Add a DMARC record v=DMARC1; p=reject on _dmarc.{domain}."
    - "Do not do this if a service (website, billing) sends with an address from {domain}."
spf.domain_nxdomain:
  title: "The domain {envelope_domain} does not exist in DNS"
  why: "DNS says that {envelope_domain} does not exist: no SPF can be read there, and this domain cannot receive bounce messages. Many servers refuse a sender whose domain does not exist (Postfix's reject_unknown_sender_domain setting, for example)."
  fix:
    - "Check the spelling of the domain entered, or of the sending address configured in your tool."
    - "If the domain was just bought, check with the registrar that it is active and delegated to the name servers of your DNS host."
    - "If it is a sending subdomain (bounce., mail.), create it in the DNS zone of the main domain, with at least its SPF record."
spf.unknown_modifier:
  title: "Unknown modifier in the SPF of {envelope_domain}: {value}"
  why: "Recipients ignore the modifiers they do not know: {value} therefore has no effect. If it was a typo for redirect=, the intended delegation does not happen."
  fix:
    - "If {value} is a typo (redirct=, redirection=), correct it to redirect=."
    - "Otherwise, remove it: it is often a leftover from an old configuration or a value copied from another record."
spf.permerror:
  title: "The SPF of {envelope_domain} is in permanent error"
  why: "Evaluation stops on an error ({value}). Recipients treat the message as having no valid SPF, some reject it, and DMARC cannot rely on SPF: only an aligned DKIM can still authenticate {envelope_domain}."
  fix:
    - "Run the SPF checker on {envelope_domain}: it indicates the term at fault and proposes a corrected record."
    - "If the reason mentions too many DNS lookups, remove the include: entries of services you no longer use, or replace a and mx with ip4:."
    - "If it mentions several records, merge them into a single TXT record starting with v=spf1."
    - "If it mentions an include: without SPF, correct the include's name or remove it."
    - "Run the evaluation again: the result must be pass for {ip}."
spf.eval_neutral:
  title: "The IP {ip} is neither authorized nor rejected by the SPF of {envelope_domain}"
  why: "The SPF of {envelope_domain} does not rule on {ip} ({value}). The neutral result does not count as a successful SPF for DMARC: if {ip} really does send for you, its messages lose this authentication."
  fix:
    - "If {ip} legitimately sends for {envelope_domain}, add ip4:{ip} (or the official include: of its provider) before the all."
    - "If the record has no all, end it with ~all, then with -all once all your services are listed."
    - "If a mechanism starts with ?, remove this ? or replace ?all with ~all."
spf.neutral:
  title: "The SPF of {envelope_domain} does not rule on {ip}"
  why: "Your SPF says neither yes nor no for the server that sent this message. A neutral result does not count as a successful SPF for DMARC: the message now relies only on DKIM, and a spoofer would get the same result."
  fix:
    - "Check that the sending is legitimate: {provider}, IP {ip}, reverse DNS {ptr}."
    - "If so, add the official include: of the service, or ip4:{ip}, before the all, without a ? qualifier."
    - "If the record has no final all, add ~all."
    - "Publish: {suggested_record}, then run the test again."
  fix_by_provider:
    google_workspace: "Add include:_spf.google.com before the all."
    microsoft_365: "Add include:spf.protection.outlook.com before the all."
    ovh: "Add include:mx.ovh.com before the all."
    o2switch: "Add include:spf.jabatus.fr before the all."
    brevo: "Add include:spf.brevo.com before the all."
    mailjet: "Add include:spf.mailjet.com before the all."
    mailgun: "Add include:mailgun.org before the all on the sending domain."
    amazon_ses: "Add include:amazonses.com to the SPF of the custom MAIL FROM."
