dmarc.missing:
  title: El dominio {domain} no tiene política DMARC
  why: Sin DMARC, cualquiera puede suplantar {domain} sin ser bloqueado, y no recibes ningún informe sobre los envíos hechos en tu nombre. Gmail, Yahoo y Outlook.com exigen DMARC a los remitentes de gran volumen y dirigen a los demás al spam o los rechazan.
  fix:
    - Crea una dirección para recibir los informes, por ejemplo dmarc@{domain}.
    - "Publica un TXT en _dmarc.{domain}: v=DMARC1; p=none; rua=mailto:dmarc@{domain}"
    - Lee los informes durante unas semanas, corrige los servicios no autenticados y después pasa a p=quarantine y luego a p=reject.
  fix_by_provider:
    google_workspace: Añade el TXT _dmarc en tu proveedor de DNS (no en la consola de Google). Google aconseja empezar con p=none y esperar 48 horas tras la puesta en marcha de SPF o DKIM.
    microsoft_365: Añade el TXT _dmarc en tu proveedor de DNS. Para el dominio onmicrosoft.com, el DMARC se crea en el centro de administración de Microsoft 365.
    ovh: Zona DNS, Añadir una entrada, tipo DMARC (formulario específico) o TXT, subdominio _dmarc. OVHcloud aconseja p=none y analizar los informes durante varias semanas.
    o2switch: "o2switch no documenta DMARC: en cPanel, Zone Editor, añade un TXT con el nombre _dmarc.{domain}."
    cpanel: "Email, Email Deliverability, Manage, sección DMARC: Install the Suggested Record (cPanel 124 o posterior). cPanel indica que DMARC requiere un SPF y un DKIM válidos."
    plesk: "Sitios web y dominios, DNS: añade o revisa el TXT _dmarc.{domain}; según la configuración del servidor, Plesk puede que ya haya creado uno."
    ionos: "Dominio, icono de engranaje, DNS, Añadir un registro, TXT, nombre de host _dmarc. No uses los valores p=rejet o p=quarantaine que aparecen en algunos ejemplos en francés: solo son válidos none, quarantine y reject."
    gandi: "Añade el TXT _dmarc; Gandi da el ejemplo p=reject y advierte de que puede bloquear los mensajes reenviados: empieza por p=none."
    infomaniak: "Manager, Seguridad global: el asistente DMARC crea el registro (modo simple o avanzado)."
    zoho: Añade el TXT _dmarc en tu proveedor de DNS, guiándote por la página DMARC de la ayuda de Zoho Mail.
    proton: "Settings, All settings, Domain names, Review, pestaña DMARC: copia el registro propuesto; Proton recomienda después p=quarantine."
    brevo: "Brevo exige un DMARC. Valor indicado: v=DMARC1; p=none; rua=mailto:rua@dmarc.brevo.com. Si ya existe un DMARC, añade solo ; rua=mailto:rua@dmarc.brevo.com al final y conserva un único registro."
    mailchimp: El procedimiento Account & billing, Domains incluye un TXT _dmarc cuyo valor aparece en tus instrucciones.
    sendgrid: "La autenticación de dominio de SendGrid propone el TXT _dmarc v=DMARC1; p=none;."
    amazon_ses: AWS recomienda empezar con p=none y pasar después a quarantine y reject; para la alineación SPF, configura un MAIL FROM personalizado.
    postmark: Postmark recomienda DMARC sea cual sea el volumen, empezando por p=none.
    sparkpost: "En la plataforma Bird, se exige un DMARC antes de cualquier envío; valor mínimo indicado: v=DMARC1; p=none; rua=mailto:dmarc-agg@dmarc.bird.com;"
    hubspot: "Settings, Content, Domains & URLs, Email Sending: HubSpot genera el valor del TXT _dmarc que hay que publicar."
    cloudflare_dns: "Email, DMARC Management, Enable: Cloudflare crea el registro o le añade su dirección rua (solo dominio raíz, función en beta)."
dmarc.subdomain_no_policy:
  title: Ni {domain} ni su dominio principal publican DMARC
  why: Envías desde un subdominio, pero ninguna política DMARC lo cubre. No se cumplen las exigencias de Gmail, Yahoo y Outlook.com, y el subdominio puede ser suplantado.
  fix:
    - "Publica un DMARC en el dominio principal: _dmarc.<dominio principal> con p=none y rua=, que cubre también todos sus subdominios."
    - Si el subdominio {domain} debe tener su propia política, publica además un TXT en _dmarc.{domain}.
    - Añade sp= para fijar la política de los subdominios existentes, y np= para la de los subdominios que no existen.
dmarc.multiple_records:
  title: El dominio {domain} publica varios registros DMARC
  why: "Con dos DMARC, los destinatarios ignoran los dos: {domain} se queda sin política ni informes, como si no tuviera DMARC."
  fix:
    - Localiza los dos registros en _dmarc.{domain}.
    - "Fusiónalos en uno solo: un único valor p=, y todas las direcciones de informes juntas en rua=, separadas por una coma."
    - Elimina el otro registro.
  fix_by_provider:
    brevo: "Brevo pide conservar un único DMARC: añade rua=mailto:rua@dmarc.brevo.com a la lista rua= de tu registro existente en lugar de crear un segundo."
dmarc.syntax_invalid:
  title: El registro DMARC de {domain} se ignora (sintaxis)
  why: "Tu registro no empieza exactamente por v=DMARC1. Los destinatarios lo tratan como si no existiera: ninguna política, ningún informe."
  fix:
    - Haz que el registro empiece por v=DMARC1; respetando mayúsculas y minúsculas.
    - Separa las etiquetas con punto y coma y usa el signo igual (p=none, no p:none).
    - "Publica: {suggested_record}."
dmarc.policy_invalid:
  title: La política DMARC de {domain} tiene un valor no válido
  why: "El valor de p= (o de sp=, np=) no se reconoce. Tu política estricta no se aplica: en el mejor de los casos el destinatario se conforma con p=none, y en el peor ignora tu DMARC."
  fix:
    - Usa solo none, quarantine o reject, en inglés y en minúsculas.
    - "Publica: {suggested_record}."
dmarc.record_at_apex:
  title: El DMARC de {domain} está publicado en el lugar equivocado
  why: Los destinatarios buscan DMARC en _dmarc.{domain}. El registro colocado en la raíz del dominio nunca se lee, así que {domain} se trata como si no tuviera DMARC.
  fix:
    - Crea el mismo TXT con el nombre _dmarc (la interfaz suele añadir .{domain} por sí misma).
    - Elimina el registro v=DMARC1 de la raíz.
dmarc.policy_none:
  title: La política DMARC de {domain} está en observación (p=none)
  why: "p=none cumple el mínimo que exigen Gmail, Yahoo y Outlook.com, pero no exige ningún tratamiento de los mensajes fraudulentos: un suplantador puede seguir usando {domain}."
  fix:
    - Analiza los informes recibidos en la dirección rua= para detectar los servicios legítimos no autenticados.
    - Corrígelos (SPF o DKIM alineados), luego pasa a p=quarantine y, por último, a p=reject.
    - "Para una subida progresiva, la RFC 9989 propone t=y (la política se aplica un nivel por debajo) en lugar de pct=."
dmarc.policy_none_stale:
  title: "{domain} lleva más de seis meses en p=none"
  why: La observación sirve para preparar el paso a una política activa. Tras seis meses, los informes suelen bastar para decidir, y {domain} sigue siendo suplantable mientras no avances.
  fix:
    - Comprueba en los informes DMARC que tus servicios de envío pasan SPF o DKIM alineado.
    - Pasa a p=quarantine, eventualmente con t=y durante unas semanas.
    - Si los informes no muestran rechazos legítimos, pasa a p=reject.
dmarc.pct_partial:
  title: "La política DMARC de {domain} solo afecta a una parte de los mensajes (pct={value})"
  why: "pct= debía aplicar la política a un porcentaje de los mensajes, pero se eliminó de la norma porque no se aplicaba de forma fiable. El resultado varía según el destinatario, y el logotipo BIMI de Gmail se rechaza mientras pct no esté en 100."
  fix:
    - Elimina pct= (o pon pct=100 si preparas BIMI para Gmail).
    - "Para una fase de prueba, usa t=y en su lugar: la política se aplica entonces un nivel por debajo."
dmarc.pct_zero:
  title: La política DMARC de {domain} está neutralizada (pct=0)
  why: Con pct=0, la política quarantine o reject no se aplica a ningún mensaje. Muestras una política estricta que no protege {domain}.
  fix:
    - Si todavía estás probando, sustituye pct=0 por t=y, la etiqueta prevista por la RFC 9989.
    - Si las pruebas han terminado, elimina pct=0.
dmarc.testing_flag:
  title: La política DMARC de {domain} está en modo prueba (t=y)
  why: Tu política se aplica un nivel por debajo de lo que se muestra. Es lo previsto durante una transición, pero la protección sigue siendo parcial.
  fix:
    - Cuando los informes sean satisfactorios, elimina t=y para aplicar plenamente p={value}.
dmarc.sp_weaker:
  title: Los subdominios de {domain} tienen una política DMARC más débil (sp=)
  why: "Tu dominio principal está protegido, pero sp= deja a sus subdominios con una política más débil. Un suplantador puede enviar desde facturas.{domain} sin ser bloqueado."
  fix:
    - Comprueba en los informes que ningún subdominio legítimo falla en DMARC.
    - Alinea sp= con p=, o elimina sp= para que los subdominios hereden p=.
    - Añade np=reject para bloquear los subdominios que no existen.
dmarc.np_absent:
  title: "{domain} no bloquea explícitamente sus subdominios inexistentes (np=)"
  why: Los suplantadores suelen inventar subdominios que no existen. La etiqueta np=reject los bloquea sin tocar tus subdominios reales.
  fix:
    - Añade np=reject a tu registro DMARC.
dmarc.rua_missing:
  title: El DMARC de {domain} no solicita ningún informe (rua= ausente)
  why: Sin rua=, no sabes quién envía en tu nombre ni qué servicios fallan. Es entonces imposible pasar sin riesgo a una política más estricta.
  fix:
    - Crea una dirección dedicada, por ejemplo dmarc@{domain}, o usa la de un servicio de análisis de informes.
    - Añade rua=mailto: seguido de esa dirección a tu registro.
  fix_by_provider:
    cloudflare_dns: "Email, DMARC Management, Enable añade una dirección rua de Cloudflare y muestra los informes en el panel."
    brevo: Puedes añadir rua=mailto:rua@dmarc.brevo.com, la dirección indicada por Brevo.
dmarc.rua_invalid_uri:
  title: Una dirección de informes DMARC de {domain} está mal escrita
  why: "Una dirección sin mailto: no se entiende; no recibes los informes, y si p= también es no válido, tu DMARC no se aplica en absoluto."
  fix:
    - "Antepón mailto: a cada dirección y sepáralas con comas, sin espacios."
    - "Publica: {suggested_record}."
dmarc.rua_external_unauthorized:
  title: La dirección externa de informes DMARC de {domain} no ha autorizado esos informes
  why: "Tus informes se envían a otro dominio que no ha publicado su acuerdo. Por tanto, los destinatarios se niegan a enviarlos: no recibes nada."
  fix:
    - "Pide al propietario del dominio de la dirección rua= que publique el TXT {domain}._report._dmarc.<su dominio> con el valor v=DMARC1 (los servicios de análisis suelen hacerlo por ti)."
    - Usa una dirección de {domain} que redirija a la dirección externa.
dmarc.ruf_present:
  title: El DMARC de {domain} solicita informes detallados de fallo (ruf=)
  why: Los informes ruf= pueden contener fragmentos de mensajes y direcciones personales. Se envían raramente, y la dirección que los recibe debe estar protegida.
  fix:
    - Conserva ruf= solo si alguien los procesa de verdad, y asegúrate de que la dirección esté protegida.
    - Si no, elimina ruf= y la etiqueta fo= que lo acompaña.
dmarc.fo_without_ruf:
  title: La etiqueta fo= del DMARC de {domain} no tiene efecto
  why: "fo= regula los informes de fallo, pero no se indica ninguna dirección ruf=: la etiqueta no sirve de nada."
  fix:
    - Elimina fo= o añade una dirección ruf= si de verdad quieres esos informes.
dmarc.obsolete_tags:
  title: El DMARC de {domain} contiene etiquetas eliminadas (ri=, rf=)
  why: Estas etiquetas ya no existen en la norma actual. No molestan, pero alargan el registro sin motivo.
  fix:
    - Elimina ri= y rf= del registro.
dmarc.unknown_tags:
  title: El DMARC de {domain} contiene una etiqueta desconocida
  why: "Una etiqueta mal escrita se ignora sin mensaje de error: el ajuste que creías haber hecho no existe."
  fix:
    - Corrige la ortografía de la etiqueta señalada por la prueba.
    - "Publica: {suggested_record}."
dmarc.psd_misused:
  title: El DMARC de {domain} se declara sufijo público (psd=y)
  why: psd=y está reservado a los registros de dominios. En tu dominio, puede hacer creer a los destinatarios que {domain} y sus subdominios son organizaciones distintas, lo que rompe la alineación de tus subdominios de envío.
  fix:
    - Elimina psd=y, o sustitúyelo por psd=n si quieres afirmar que {domain} es tu dominio organizativo.
dmarc.strict_alignment_breaks:
  title: La alineación estricta del DMARC de {domain} hace fallar este mensaje
  why: Tu servicio de envío usa un subdominio de {domain}, lo que basta con la alineación relajada. Con adkim=s o aspf=s, ese subdominio ya no cuenta y el mensaje falla en DMARC.
  fix:
    - Elimina adkim=s y aspf=s (el modo relajado r es el valor por defecto).
    - O haz que DKIM firme exactamente con d={domain} si quieres la alineación estricta.
  fix_by_provider:
    amazon_ses: AWS indica que la alineación SPF de un MAIL FROM personalizado supone no fijar aspf=s.
    google_workspace: "El ejemplo de la documentación de Google contiene adkim=s; aspf=s: no lo copies tal cual si un servicio de terceros envía desde un subdominio."
dmarc.fail_reject:
  title: Este mensaje falla en DMARC y {domain} exige su rechazo
  why: "Ninguna autenticación alineada con {domain} pasa, y tu política p=reject exige rechazar estos mensajes. En Gmail, Yahoo u Outlook.com, este mensaje sería rechazado."
  fix:
    - Identifica el servicio que envió este mensaje ({provider}, IP {ip}).
    - "Autentica {domain} en ese servicio: DKIM con d={domain} como prioridad, y SPF alineado si el servicio lo permite."
    - "Si ese servicio no debe enviar por {domain}, la política hace su trabajo: no la relajes."
dmarc.fail_quarantine:
  title: Este mensaje falla en DMARC y {domain} exige su cuarentena
  why: "Ninguna autenticación alineada con {domain} pasa. Tu política exige tratar estos mensajes como sospechosos: acaban en spam en la mayoría de los destinatarios."
  fix:
    - Identifica el servicio que envió este mensaje ({provider}, IP {ip}).
    - Configura DKIM con d={domain} en ese servicio, y SPF alineado si es posible.
    - "Repite la prueba: DMARC debe indicar pass."
dmarc.fail_none:
  title: Este mensaje falla en DMARC (política p=none)
  why: "Tu política no exige nada, pero el fallo es visible: Gmail exige la alineación de los envíos de gran volumen y Yahoo exige que DMARC pase. Este mensaje corre el riesgo de ir a spam, y nunca podrás endurecer la política sin corregir este flujo."
  fix:
    - Identifica el servicio ({provider}, IP {ip}) y autentica {domain} en ese servicio (DKIM con d={domain}).
    - Comprueba en los informes DMARC que ningún otro servicio está en el mismo caso.
dmarc.temperror:
  title: El DMARC de {domain} no se pudo leer (error DNS temporal)
  why: El destinatario no pudo leer tu política. Según él, el mensaje se retrasa o se trata sin DMARC.
  fix:
    - Repite la prueba para confirmar que el error se repite.
    - Comprueba que todos los servidores de nombres de {domain} responden y que la firma DNSSEC es válida.
dmarc.duplicate_tag:
  title: La etiqueta {value} aparece dos veces en el DMARC de {domain}
  why: "Una etiqueta repetida hace que el registro no sea válido según la sintaxis que DMARC toma de DKIM. Según el destinatario, tu DMARC se ignora por completo o solo se conserva uno de los dos valores: ya no sabes qué política se aplica."
  fix:
    - Abre el registro TXT _dmarc.{domain} en tu proveedor de DNS.
    - Conserva una sola aparición de {value}, con el valor deseado. Para varias direcciones de informes, ponlas en una sola etiqueta rua= separadas por una coma.
    - "Registro corregido propuesto: {suggested_record}."
dmarc.inherited:
  title: "{domain} aplica la política DMARC de {value}"
  why: "No hay registro en _dmarc.{domain}: los destinatarios aplican el de {value}, con su etiqueta sp= (o p= si no existe). Es el funcionamiento normal de DMARC para un subdominio; basta con saber qué política se deriva de ello."
  fix:
    - No hay nada que hacer si la política de {value} también te conviene a {domain}.
    - Para una política propia de {domain}, por ejemplo p=none mientras pones en marcha una nueva herramienta de envío, publica un TXT en _dmarc.{domain} que empiece por v=DMARC1.
    - Para ajustar todos los subdominios a la vez, modifica mejor sp= en el registro de {value}.
dmarc.invalid_tag_value:
  title: "Valor no válido en el DMARC de {domain}: {value}"
  why: Los destinatarios ignoran un valor que no entienden y aplican el valor por defecto de la etiqueta. El ajuste que creías haber hecho (alineación, opciones de informes) no existe, por tanto.
  fix:
    - Abre el registro TXT _dmarc.{domain} en tu proveedor de DNS.
    - "Corrige la etiqueta señalada: adkim y aspf aceptan r o s, fo acepta 0, 1, d o s separados por dos puntos."
    - "Registro corregido propuesto: {suggested_record}."
dmarc.strict_alignment:
  title: El DMARC de {domain} exige una alineación estricta ({value})
  why: "Con una alineación estricta, un mensaje firmado o enviado con un subdominio de {domain} falla en DMARC. Ahora bien, muchas herramientas de envío usan un subdominio para la dirección de retorno (em…, mg., bounce.): la estricta les quita la alineación SPF."
  fix:
    - Mantén la estricta solo si todos tus envíos usan exactamente {domain}, en DKIM (d=) y en la dirección de retorno.
    - "Si no, elimina adkim=s y aspf=s: el modo relajado (r) es el valor por defecto."
    - Comprueba en tus informes DMARC que ninguna fuente legítima falla antes de conservar la estricta.
