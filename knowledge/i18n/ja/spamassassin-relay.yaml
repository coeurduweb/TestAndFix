sa.rdns_none:
  title: "送信元 IP に逆引き DNS がありません"
  why: "メッセージを配送した IP {ip} は、逆引き DNS に問い合わせても名前を返しません。まともなメールサーバーは必ず逆引き名を持っています。その欠如は、感染したマシンや急ごしらえのサーバーを示唆し、複数のプロバイダーがこれらの接続を拒否します。"
  fix:
    - "IP {ip} のホスティング事業者またはプロバイダーに、PTR レコードを作成してもらってください（例：mail.{domain}）。"
    - "その名前を、DNS の正引き（A レコード）で {ip} に向け、両方向が一致するようにしてください。"
    - "同じ名前を HELO で名乗ってください。"
sa.rdns_dynamic:
  title: "送信元 IP の逆引き DNS が、一般家庭向け回線のように見えます"
  why: "送信元 IP の逆引き名 {ptr} には、IP アドレスや、ボックスや家庭用回線に典型的な単語が含まれています。SpamAssassin は、PC や接続機器が直接送信していると判断します。これは感染したマシンに典型的な振る舞いです。"
  fix:
    - "オフィスや家庭のインターネット接続から直接配送しないでください。認証付き SMTP のメールサービスを経由してください。"
    - "専用サーバーの場合は、ホスティング事業者の汎用的な名前ではなく、mail.{domain} のような明示的な逆引き DNS を依頼してください。"
sa.rdns_localhost:
  title: "送信元 IP の公開逆引き DNS が localhost です"
  why: "公開 IP {ip} の逆引き DNS が「localhost」を返しています。これは設定ミスであり、フィルターは放置されたサーバーや乗っ取られたサーバーと関連付けます。"
  fix:
    - "IP のプロバイダーに、{ip} の PTR を実際の名前（mail.{domain}）に置き換えてもらってください。"
sa.helo_dynamic_ipaddr:
  title: "サーバーが、自分の IP を含む名前で名乗っています"
  why: "HELO で名乗る名前（{helo}）は、プロバイダーの自動生成名のように IP アドレスから作られています。メールサーバーは通常、自分自身の名前で名乗ります。"
  fix:
    - "サーバーの HELO 名を、選んだ名前（例：mail.{domain}）に設定してください。その名前は {ip} を指している必要があります。"
    - "{ip} の逆引き DNS を、同じ名前に揃えてください。"
  fix_by_provider:
    postfix: "main.cf で myhostname = mail.your-domain.example を設定してください（送信の HELO だけを変える場合は smtp_helo_name）。"
    exim: "メイン設定で primary_hostname を設定するか、remote_smtp トランスポートで helo_data を設定してください。"
sa.helo_dynamic_ipaddr2:
  title: "サーバーが、自分の IP で始まる名前で名乗っています"
  why: "HELO の名前（{helo}）が、IP アドレスの4つの数字で始まっています。これは動的接続の名前の形式であり、HELO のルールの中でも SpamAssassin に最も減点されるものの一つです。"
  fix:
    - "サーバーに適切な名前（mail.{domain}）を付け、それを HELO で使ってください。"
    - "名前を変更できない場合は、認証付き SMTP リレーを経由して送信してください。"
  fix_by_provider:
    postfix: "main.cf で smtp_helo_name = mail.your-domain.example を設定し、Postfix を再読み込みしてください。"
sa.helo_dynamic_split_ip:
  title: "HELO の名前が IP アドレスを分割しています"
  why: "HELO の名前（{helo}）には、分割された IP アドレスが含まれています。これはプロバイダーが生成する動的な名前のパターンです。減点が大きいです。"
  fix:
    - "{ip} を指す明示的な HELO 名（mail.{domain}）を設定してください。"
sa.helo_dynamic_dhcp:
  title: "HELO の名前が、DHCP または CATV 回線を連想させます"
  why: "HELO の名前（{helo}）には、一般家庭向け回線に特有の語（dsl、cable、dhcp）が含まれています。サーバーは個人の端末のように見えます。"
  fix:
    - "この接続から直接配送するのではなく、メールサービスの SMTP リレーを経由して送信してください。"
sa.helo_localhost:
  title: "サーバーが localhost として名乗っています"
  why: "メッセージを配送したサーバーが、「localhost」という名前で名乗っています。まともなメールサーバーはこうしません。PHP スクリプトや、設定されないままインストールされたサーバーによく見られます。これは最も大きな HELO の減点の一つです。"
  fix:
    - "サーバーの完全修飾ホスト名（mail.{domain}）を設定し、それを HELO で使ってください。"
    - "送信元がウェブサイトそのものである場合は、mail() ではなく、メールサービスへの SMTP 拡張を経由させてください。"
  fix_by_provider:
    postfix: "main.cf で完全な名前を myhostname に設定してください。/etc/hostname も確認してください。"
    wordpress: "SMTP プラグインをインストールし、mail() ではなくメールサービスのサーバーを経由して送信してください。"
sa.helo_no_domain:
  title: "HELO の名前が完全修飾ドメイン名ではありません"
  why: "サーバーは、ドメインのない短い名前（{helo}）で名乗っています。標準では完全な名前が求められます。よくある原因は、マシン名を使う Windows サーバー、NAS、スクリプトです。"
  fix:
    - "HELO の名前を、mail.{domain} のような完全な名前に置き換えてください。その名前は {ip} に解決される必要があります。"
    - "Exchange や Windows サーバーでは、送信コネクターの FQDN を設定してください。"
  fix_by_provider:
    postfix: "main.cf で、修飾された名前（少なくとも1つのドットを含む）を myhostname に設定してください。"
sa.helo_misc_ip:
  title: "HELO の名前が動的な IP アドレスに似ています"
  why: "HELO の名前（{helo}）には、IP アドレスに似た数字の並びが含まれています。減点は小さく、汎用的なホスト名の兆候です。"
  fix:
    - "IP アドレスを含まない、選んだ HELO 名を使ってください。"
sa.helo_static_host:
  title: "大手の送信サービスとして認識された固定の HELO 名"
  why: "HELO の名前には IP が含まれていますが、SpamAssassin は大手の送信サービスの形式として認識し、動的 HELO の減点を取り消します。"
  fix:
    - "修正は不要です。"
sa.khop_helo_fcrdns:
  title: "HELO の名前が、逆引き DNS と一致しません"
  why: "サーバーは {helo} と名乗っていますが、その IP {ip} の名前は {ptr} です。認証されていないメッセージでは、SpamAssassin はこれを、自分の身元について嘘をつくサーバーとみなします。"
  fix:
    - "3つの要素を一致させてください：HELO 名、{ip} の逆引き DNS、その名前の A レコード。"
    - "メッセージも SPF または DKIM で認証してください。どちらかが pass すれば、このルールは適用されなくなります。"
sa.may_be_forged:
  title: "送信元 IP の逆引き DNS が、その IP に戻っていません"
  why: "IP {ip} の名前 {ptr} が、{ip} に戻って向いていません。受信サーバーはこれを「may be forged」と記録しました。SPF も有効な DKIM もなければ、これだけで送信者は疑わしく見えます。"
  fix:
    - "{ptr} を {ip} に向ける A レコードを作成するか、すでにその IP を指している名前に PTR を変更してください。"
    - "メッセージを認証してください（SPF または有効な DKIM）。そうすればこのルールは消えます。"
sa.ck_helo_generic:
  title: "HELO の名前が、汎用的なアドレスプールを連想させます"
  why: "HELO の名前（{helo}）は、プロバイダーのアドレス範囲にある汎用的な名前に似ています。スコアへの影響はほぼゼロですが、ほかのフィルターはより厳格です。"
  fix:
    - "専用の HELO 名（mail.{domain}）を使ってください。"
sa.fsl_helo_bare_ip_1:
  title: "サーバーが、裸の IP アドレスで名乗っています"
  why: "サーバーは、名前ではなく単なる IP アドレスで「HELO {helo}」と言いました。標準ではドメイン名が求められ、最後の手段として角括弧付きの IP が使われます。誤って設定された送信スクリプトによく見られます。"
  fix:
    - "送信ソフトウェアが完全な名前（mail.{domain}）で名乗るように設定してください。"
    - "PHPMailer やほかの SMTP ライブラリでは、Hostname または Helo のオプションを設定してください。"
sa.fsl_helo_non_fqdn_1:
  title: "ドメインのない HELO の名前"
  why: "HELO の名前（{helo}）は1語で、ドメインがありません。このメッセージではスコアはほぼゼロですが、同じ誤りは、はるかに重い HELO_NO_DOMAIN を発動させます。"
  fix:
    - "mail.{domain} のような完全な名前で名乗ってください。"
sa.rcvd_helo_ip_mismatch:
  title: "HELO が、実際の IP と異なる IP を名乗っています"
  why: "サーバーは IP {helo} で名乗りましたが、実際には {ip} から接続していました。ポートリダイレクトの背後にあるサーバーや、古い IP を名乗るソフトウェアで起こります。"
  fix:
    - "HELO で名乗る IP を、{ip} に解決される完全なホスト名に置き換えてください。"
sa.rcvd_illegal_ip:
  title: "Received ヘッダーに、存在し得ない IP が含まれています"
  why: "Received の行が、インターネット上には存在し得ない IP アドレスを記載しています。これは、偽造されたヘッダーか、ドキュメント用またはテスト用の IP を書き込む誤設定の機器のいずれかです。"
  fix:
    - "その行がお使いのサーバーまたはアプリケーションから来ている場合は、そこに書き込まれる IP を修正してください。"
    - "送信スクリプトで Received ヘッダーを手作業で挿入しないでください。"
sa.no_rdns_dotcom_helo:
  title: "サーバーは大手プロバイダーを名乗っていますが、逆引き DNS がありません"
  why: "サーバーは、大手メールプロバイダーの名前を HELO で名乗っていますが、その IP {ip} には逆引き DNS がありません。これらのプロバイダーの本物のサーバーには、必ず逆引き DNS があります。これはなりすましです。"
  fix:
    - "サーバーが、プロバイダーの名前ではなく、自分自身の名前で名乗るように設定してください。"
sa.rcvd_fake_helo_dotcom:
  title: "HELO の名前が、既知のドメイン名を模倣しています"
  why: "サーバーは、yahoo.com、localhost.com、mydomain.com のような汎用的または偽装された名前で名乗っています。設定に残されたサンプル値は、まさにこの結果を生みます。"
  fix:
    - "ホスト名のサンプル値を、mail.{domain} に置き換えてください。"
sa.tvd_rcvd_ip:
  title: "送信サーバーが IP アドレスで名乗りました"
  why: "情報：Received の行は、送信者が IP アドレスで名乗ったことを示しています。ここでは重みはありませんが、HELO に関するほかのルールを強めます。"
  fix:
    - "送信サーバーに、完全な HELO 名を設定してください。"
