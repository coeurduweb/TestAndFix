dnssec.bogus:
  title: "{domain} の DNSSEC 署名が無効です"
  why: "DNSSEC を検証するリゾルバーは、{domain} からのすべての応答を拒否します。そのリゾルバーにとって、SPF、DKIM の鍵、DMARC は存在しなくなります。メールは保留されるか拒否され、{domain} 宛てのメールは配信できなくなります。"
  fix:
    - "DNSViz（dnsviz.net）または Verisign の DNSSEC Analyzer でゾーンを確認し、問題のあるレコードを特定してください。"
    - "最近 DNS ホストを変更した場合は、レジストラーで古い DS レコードを削除し、新しいホストで DNSSEC を有効にして、その DS を公開してください。"
    - "緊急の場合は、レジストラーで DS レコードを削除してください。ゾーンは署名されていない状態になりますが、DS の TTL が過ぎれば解決できるようになります。"
  fix_by_provider:
    cloudflare_dns: "DNS の Settings、DNSSEC の項目で状態を確認してください。表示される DS が、レジストラーに公開されている DS と異なる場合は、後者を Cloudflare が示す値に置き換えてください。"
dnssec.ds_mismatch:
  title: "{domain} の DS レコードが、ゾーンの DNSSEC 鍵と一致しなくなりました"
  why: "レジストリは、{domain} のゾーンがもう公開していない鍵を宣言しています。検証を行うリゾルバーは、お客様のすべての DNS 応答を改ざんされたものと見なします。その結果、SPF、DKIM、DMARC、MX が見えなくなります。"
  fix:
    - "現在の DNS ホストが公開している鍵（DNSKEY レコード、またはホストの管理画面が示す DS の値）を確認してください。"
    - "レジストラーで古い DS を削除し、現在のホストの DS を追加してください。"
    - "古い DS の TTL が切れるまで待ってから（dig DS {domain} で確認できます）、テストをやり直してください。"
  fix_by_provider:
    cloudflare_dns: "DNS の Settings、DNSSEC で表示された DS レコードをコピーし、レジストラーの古い DS の代わりに貼り付けてください。"
dnssec.dnskey_missing:
  title: "{domain} は DNSSEC を宣言していますが、ゾーンは署名されていません"
  why: "レジストリに DS が残っていますが、{domain} のゾーンはもう署名されていません。検証を行うリゾルバーは、そのすべての応答を拒否します。その結果、一部の受信者に対してメールが機能しなくなります。"
  fix:
    - "次のどちらかを選んでください。現在の DNS ホストで DNSSEC を再度有効にするか、DS を削除するかです。"
    - "DS を削除するには、レジストラーの DNSSEC 画面でそれを削除してください。"
    - "再度有効にするには、DNS ホストで DNSSEC を有効にし、レジストラーの DS を新しい値に置き換えてください。"
dnssec.rrsig_expired:
  title: "{domain} の DNSSEC 署名が期限切れになりました"
  why: "ゾーンの署名は、もう有効ではありません。検証を行うリゾルバーは {domain} の応答を拒否します。そのため、SPF、DKIM の鍵、DMARC が見えなくなります。"
  fix:
    - "DNS ホストで、またはご自身のサーバーで、ゾーンの署名を再実行してください（例：BIND の rndc sign {domain}、またはお使いのソフトウェアの再署名コマンド）。"
    - "自動再署名（DNS サーバーが管理するオンライン署名）を設定し、再発しないようにしてください。"
    - "ゾーンをすぐに再署名できない場合は、レジストラーで DS を削除してください。"
dnssec.rrsig_expiring:
  title: "{domain} の DNSSEC 署名がまもなく期限切れになります"
  why: "期限までにゾーンが再署名されなければ、{domain} は検証を行うリゾルバーから読めなくなり、お客様のメールも同様になります。"
  fix:
    - "DNS ホストまたはご自身のサーバーで、自動再署名が有効であることを確認してください。"
    - "明日もう一度このテストを実行してください。有効期限が延びているはずです。"
dnssec.unsigned:
  title: "{domain} の DNS ゾーンは署名されていません（DNSSEC）"
  why: "DNSSEC がないと、ネットワーク上の攻撃者が、{domain} の DNS 応答（MX など）を偽造できます。これはメールの配信性の基準ではありませんが、メール転送の保護として最も強力な DANE の前提条件です。"
  fix:
    - "DNS ホストで DNSSEC を有効にしてください。"
    - "ホストが提供する DS レコードを、レジストラーで公開してください（レジストラーとホストが同じ場合は、多くの場合自動的に行われます）。"
    - "依存する前に、dnsviz.net で結果を確認してください。"
  fix_by_provider:
    cloudflare_dns: "DNS の Settings で Enable DNSSEC をクリックし、表示された DS レコードをレジストラーに追加してください。"
dnssec.algorithm_not_recommended:
  title: "{domain} のゾーンは非推奨のアルゴリズムで署名されています"
  why: "ゾーンの署名に使われているアルゴリズムは、署名に非推奨または禁止されています。リゾルバーによっては検証を停止し、お客様のゾーンを署名されていないもの、または無効なものとして扱うことがあります。"
  fix:
    - "DNS ホストに、ECDSAP256SHA256（13）へのアルゴリズム変更（ロールオーバー）を依頼してください。"
    - "変更中は、古い DS を削除する前に、新しい DS をレジストラーで公開し、TTL を守ってください。"
dnssec.nsec3_iterations:
  title: "{domain} のゾーンは、追加の反復回数を伴う NSEC3 を使っています"
  why: "NSEC3 の反復回数は、セキュリティを何も高めず、検証を重くします。一定のしきい値を超えると、リゾルバーはゾーンを安全でない、またはエラーとして扱うことがあり、メールのレコードの名前解決が失敗するおそれがあります。"
  fix:
    - "ゾーンの NSEC3 パラメーターを、反復 0 回、ソルトなしに設定してください。"
    - "DNS ホストが署名を管理している場合は、RFC 9276 の値を適用するよう依頼してください。"
dnssec.mx_zone_bogus:
  title: "{domain} の MX サーバーが、壊れた DNSSEC のゾーン内にあります"
  why: "受信サーバーの名前が、検証を行うリゾルバーで解決できなくなっています。{domain} 宛ての返信や拒否通知は、これらの送信者から配信できなくなります。"
  fix:
    - "MX の名前を含むドメインを特定し、その管理者（多くの場合はメールサービス）に連絡してください。"
    - "そのドメインがお客様のものである場合は、そのゾーンに「DNSSEC の署名が無効です」の項目の修正を適用してください。"
dnssec.ds_missing:
  title: "{domain} のゾーンは署名されていますが、レジストリに DS レコードがありません"
  why: "DNS ホストはゾーンに署名していますが、レジストリに DS がないため、信頼の連鎖はそこで止まっています。どのリゾルバーも {domain} を検証しません。DNSSEC の手間だけがかかり、その保護は得られません。DANE も機能しません。"
  fix:
    - "DNS ホストで、{domain} の DS レコードを確認してください（レジストラーが鍵を求める場合は、アルゴリズムを含む KSK）。"
    - "レジストラーで、そのドメインの DNSSEC の項目を開き、この DS を追加してください。ダイジェストの種類は 2（SHA-256）です。"
    - "伝播の後、dnsviz.net で信頼の連鎖を確認してください。写し間違いがあると、ゾーン全体が検証を行うリゾルバーにとって無効になります。"
  fix_by_provider:
    cloudflare_dns: "DNS の Settings、DNSSEC の項目で Enable DNSSEC をクリックしてください（DNSSEC がすでに有効な場合は DS record をクリック）。その値をレジストラーに写してください。Cloudflare Registrar を使っている場合は、DS が自動的に公開され、1〜2 日かかることがあります。"
dnssec.ds_sha1:
  title: "{domain} の DS は SHA-1 しか使っていません"
  why: "{domain} の DNSSEC の委任は、SHA-1 のダイジェストに依存しています。規格ではこれを公開することがもう禁止されています。検証を行うリゾルバーは今もこれを受け入れていますが、この委任は推奨事項に沿っていません。"
  fix:
    - "DNS ホストで、同じ鍵に対応するタイプ 2（SHA-256）の DS を確認してください。"
    - "それをレジストラーに、現在の DS と並べて追加してください。"
    - "新しい DS が公開され、古い DS の TTL が過ぎたら、タイプ 1 の DS を削除してください。"
