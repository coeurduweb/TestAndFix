sa.uribl_black:
  title: "リンクが URIBL のブラックリストのドメインを指しています"
  why: "メールのリンクに含まれるドメインが、URIBL のブラックリストにあります。このリストは、スパムで見られたドメインのためのものです。お客様自身のドメインがきれいであっても、それだけでスコアが大きく上がります。"
  fix:
    - "問題のあるリンク（{url}）を特定してください。第三者のドメイン（短縮サービス、画像、SNS など）の場合もあり、お客様のドメインとは限りません。"
    - "このリンクを削除するか置き換え、そのあとテストを再送信してください。"
    - "リストされたドメインがお客様のものである場合は、{delist_url} で削除を依頼する前に、原因（サイトの乗っ取り、同意のない送信キャンペーンなど）を探してください。"
sa.uribl_grey:
  title: "リンクが URIBL のグレーリストのドメインを指しています"
  why: "URIBL のグレーリストには、苦情を受けてはいるものの、スパム送信者と確定したわけではない、大量送信のドメインが含まれています。ニュースレターツールの追跡ドメインがここに載っていることもあります。"
  fix:
    - "リストされたドメイン（{url}）を特定してください。送信ツールの追跡ドメインである場合は、お客様自身のドメインの下にカスタムの追跡ドメインを設定してください。"
    - "お客様のドメインである場合は、苦情を減らし（見やすい配信停止、要求されたメールの送信）、そのあと {delist_url} で削除を依頼してください。"
sa.uribl_red:
  title: "リンクが URIBL のレッドリストのドメインを指しています"
  why: "URIBL のレッドリストは、ブラックリストに入れるほど確実ではないものの、URIBL が監視しているドメインを示します。SpamAssassin はほとんど減点しませんが、警告にはなります。"
  fix:
    - "示されたドメイン（{url}）を確認し、お客様のものでない場合はリンクを削除してください。"
sa.uribl_blocked:
  title: "URIBL への問い合わせが、テストサーバーで拒否されました"
  why: "管理上の通知です。URIBL が解析サーバーに応答しませんでした。このリストでは、リンクは確認されていませんが、お客様のメールに問題があるわけではありません。"
  fix:
    - "お客様の作業は不要です。"
sa.uribl_dbl_spam:
  title: "リンクが Spamhaus DBL（スパム）のドメインを指しています"
  why: "メールに含まれるドメインが、スパムのドメインとして Spamhaus DBL に登録されています。これはリンクに関する最も重い信号の 1 つであり、多くのゲートウェイがこのリストを使ってブロックします。"
  fix:
    - "問題のあるリンク（{url}）を特定してください。第三者のドメイン（短縮サービス、画像、SNS など）の場合もあり、お客様のドメインとは限りません。"
    - "このリンクを削除するか置き換え、そのあとテストを再送信してください。"
    - "リストされたドメインがお客様のものである場合は、{delist_url} で削除を依頼する前に、原因（サイトの乗っ取り、同意のない送信キャンペーンなど）を探してください。"
sa.uribl_dbl_phish:
  title: "リンクが Spamhaus DBL（フィッシング）のドメインを指しています"
  why: "リンクは、Spamhaus によってフィッシングサイトに分類されたドメインに続いています。お客様のドメインであれば、偽のログインページをホストするために乗っ取られた可能性が高いです。"
  fix:
    - "問題のあるリンク（{url}）を特定してください。第三者のドメイン（短縮サービス、画像、SNS など）の場合もあり、お客様のドメインとは限りません。"
    - "このリンクを削除するか置き換え、そのあとテストを再送信してください。"
    - "リストされたドメインがお客様のものである場合は、{delist_url} で削除を依頼する前に、原因（サイトの乗っ取り、同意のない送信キャンペーンなど）を探してください。"
sa.uribl_dbl_malware:
  title: "リンクが Spamhaus DBL（マルウェア）のドメインを指しています"
  why: "リンクは、Spamhaus によればマルウェアを配布しているドメインに続いています。WordPress サイトの場合、これは wp-content に不正なファイルが注入されている兆候であることがよくあります。"
  fix:
    - "問題のあるリンク（{url}）を特定してください。第三者のドメイン（短縮サービス、画像、SNS など）の場合もあり、お客様のドメインとは限りません。"
    - "このリンクを削除するか置き換え、そのあとテストを再送信してください。"
    - "リストされたドメインがお客様のものである場合は、{delist_url} で削除を依頼する前に、原因（サイトの乗っ取り、同意のない送信キャンペーンなど）を探してください。"
sa.uribl_dbl_abuse_spam:
  title: "リンクが、正規のドメインでスパムに悪用されているものを指しています"
  why: "Spamhaus は、正規のドメインであっても、そのページがスパム送信者に利用されている場合（ホスティング、フォーム、共有のサービス）を報告しています。このリンクは、関連付けによってお客様が不利になります。"
  fix:
    - "この共有サービスへのリンクを、お客様のドメインのページへのリンクに置き換えてください。"
sa.uribl_dbl_abuse_redir:
  title: "リンクが、スパム送信者に悪用されているリダイレクターを経由しています"
  why: "リンクは、スパム送信者も使っているリダイレクトまたは短縮のサービスを経由しています。SpamAssassin はほとんど減点しませんが、ほかのフィルターは減点します。"
  fix:
    - "短縮またはリダイレクトされたリンクではなく、最終的なアドレスを平文で書いてください。"
sa.uribl_dbl_abuse_phish:
  title: "リンクが、フィッシングに悪用されている正規のドメインを指しています"
  why: "リンクにある正規のドメインは、フィッシングページのホストにも使われています。フィルターはこれらのリンクを強く罰します。"
  fix:
    - "関係するコンテンツ（フォーム、文書）は、このサービスではなく、お客様自身のドメインでホストしてください。"
sa.uribl_dbl_abuse_malw:
  title: "リンクが、マルウェアの配布に悪用されている正規のドメインを指しています"
  why: "リンクのドメインは正規のサービスですが、その一部のアドレスがマルウェアを配布しています（ファイル保存、共有）。このリンクはお客様を大きく不利にします。"
  fix:
    - "ファイルを添付するか、この共有サービスを経由せずに、お客様のサイトでホストしてください。"
sa.uribl_dbl_blocked:
  title: "Spamhaus DBL への問い合わせが、テストサーバーで拒否されました"
  why: "管理上の通知です。DBL が解析サーバーに応答しませんでした。お客様のリンクとは無関係です。"
  fix:
    - "お客様の作業は不要です。"
sa.uribl_dbl_blocked_opendns:
  title: "Spamhaus DBL への問い合わせが拒否されました：公開リゾルバー"
  why: "管理上の通知です。解析サーバーは、Spamhaus に拒否された公開 DNS リゾルバーを経由しています。お客様のリンクとは無関係です。"
  fix:
    - "お客様の作業は不要です。"
sa.uribl_dbl_error:
  title: "Spamhaus DBL への問い合わせでエラーが発生しました"
  why: "技術的な通知です。リンクに、ドメイン名ではなく IP アドレスが含まれており、DBL に送られました。DBL はドメインだけを扱うため、結果は利用できません。"
  fix:
    - "IP アドレスを指すリンクを、ドメイン名を指すリンクに置き換えてください（NUMERIC_HTTP_ADDR も参照してください）。"
sa.uribl_abuse_surbl:
  title: "リンクが、SURBL の ABUSE リストのドメインを指しています"
  why: "リンクのドメインは、SURBL の ABUSE カテゴリにあります。スパムや悪用された送信で見られたドメインです。"
  fix:
    - "問題のあるリンク（{url}）を特定してください。第三者のドメイン（短縮サービス、画像、SNS など）の場合もあり、お客様のドメインとは限りません。"
    - "このリンクを削除するか置き換え、そのあとテストを再送信してください。"
    - "リストされたドメインがお客様のものである場合は、{delist_url} で削除を依頼する前に、原因（サイトの乗っ取り、同意のない送信キャンペーンなど）を探してください。"
sa.uribl_cr_surbl:
  title: "リンクが、SURBL によれば乗っ取られたサイトを指しています"
  why: "SURBL は、リンクのドメインを、正規で乗っ取られたサイトと分類しています。お客様のサイトであれば、ハッカーが追加したページをホストしている可能性が高いです。"
  fix:
    - "リンク先のサイト（{url}）を分析してください。更新されていない拡張機能やテーマ、不明な PHP ファイル、追加された管理者アカウントなどを確認します。"
    - "清掃の後、{delist_url} で削除を依頼してください。"
sa.uribl_ct_surbl:
  title: "リンクが、SURBL に登録された追跡ドメインを経由しています"
  why: "リンクは、クリック追跡のドメインを経由しています。SURBL はこのドメインを、同意が確認されていない送信（トラップアドレスへの送信を含む）に使われたものとして登録しています。これは、共有の追跡ドメインを悪質な送信者も使っている送信ツールの典型的なケースです。"
  fix:
    - "送信ツールで、カスタムの追跡ドメイン（{domain} のサブドメイン）を設定してください。"
    - "または、このメールのクリック追跡を無効にして、もう一度テストしてください。"
sa.uribl_dm_surbl:
  title: "メールが、使い捨てアドレスのドメインを引用しています（SURBL DM）"
  why: "メール内のドメインは、使い捨てのメールアドレスサービスに属しています。SpamAssassin はほとんど減点しません。これは情報として扱われます。"
  fix:
    - "使い捨てのアドレスがメール内にある場合（連絡先、署名など）は、お客様のドメインのアドレスに置き換えてください。"
sa.uribl_mw_surbl:
  title: "リンクが、SURBL によればマルウェアのドメインを指しています"
  why: "SURBL は、リンクのドメインをマルウェアの配布に関連付けています。ドメインがお客様のものである場合は深刻です。お客様のサイトが攻撃の中継に使われている可能性が高いです。"
  fix:
    - "問題のあるリンク（{url}）を特定してください。第三者のドメイン（短縮サービス、画像、SNS など）の場合もあり、お客様のドメインとは限りません。"
    - "このリンクを削除するか置き換え、そのあとテストを再送信してください。"
    - "リストされたドメインがお客様のものである場合は、{delist_url} で削除を依頼する前に、原因（サイトの乗っ取り、同意のない送信キャンペーンなど）を探してください。"
sa.uribl_ph_surbl:
  title: "リンクが、SURBL によればフィッシングのドメインを指しています"
  why: "SURBL は、リンクのドメインを、フィッシングページのホストとして分類しています。"
  fix:
    - "問題のあるリンク（{url}）を特定してください。第三者のドメイン（短縮サービス、画像、SNS など）の場合もあり、お客様のドメインとは限りません。"
    - "このリンクを削除するか置き換え、そのあとテストを再送信してください。"
    - "リストされたドメインがお客様のものである場合は、{delist_url} で削除を依頼する前に、原因（サイトの乗っ取り、同意のない送信キャンペーンなど）を探してください。"
sa.uribl_multi_surbl_headers:
  title: "送信者または Reply-To のドメインが SURBL に登録されています"
  why: "これはリンクではなく、送信または返信のアドレスのドメインが SURBL に登録されているということです。{domain} には、それ自体の評判の悪さがあります。"
  fix:
    - "{delist_url} で、{domain} のカテゴリと登録日を確認してください。"
    - "削除を依頼する前に、原因（サイトの乗っ取り、同意のない送信）に対処してください。"
sa.surbl_blocked:
  title: "SURBL への問い合わせが、テストサーバーで拒否されました"
  why: "管理上の通知です。SURBL が解析サーバーに応答しませんでした。お客様のリンクとは無関係です。"
  fix:
    - "お客様の作業は不要です。"
sa.uribl_rhs_dob:
  title: "リンクが、ごく最近登録されたドメインを指しています"
  why: "メールに含まれるドメインは、とても最近登録されたものです。スパム送信者は絶えずドメインを変えます。新しいドメインへのリンクは、新しく事業を始めた会社のサイトであっても疑わしく見えます。"
  fix:
    - "新しいドメインがお客様のものである場合は、大量の送信に使う前に数日待ってください。"
    - "それまでは、お客様が所有するより古いドメインにリンクを向けてください。"
sa.uribl_sbl:
  title: "リンク先ドメインのネームサーバーが Spamhaus SBL に登録されています"
  why: "リンクのドメインは、スパムのホストに使われている Spamhaus 登録の IP 上のネームサーバーを使っています。ホスティングを理由に、リンクが減点されます。"
  fix:
    - "問題のあるドメイン（{url}）と、その DNS ホストを特定してください。"
    - "お客様のドメインである場合は、ゾーンを信頼できる DNS ホストに移してください。"
sa.uribl_sbl_a:
  title: "リンク先ドメインの Web サーバーが Spamhaus SBL に登録されています"
  why: "リンクが指すサイトは、Spamhaus に登録された IP でホストされています。減点は小さいものの、評判の悪いホスティングを示す兆候です。"
  fix:
    - "サイトがお客様のものである場合は、ホスティング事業者に、IP が登録されている理由を尋ねるか、ホスティングを変更してください。"
sa.uribl_css:
  title: "リンク先ドメインのネームサーバーが Spamhaus CSS に登録されています"
  why: "リンク先ドメインのネームサーバーは、スパム送信のために自動的に検出された IP にあります。減点は小さいです。"
  fix:
    - "ドメインがお客様のものである場合は、DNS ホストに報告してください。"
sa.uribl_zen_blocked:
  title: "リンクに対する Spamhaus ZEN への問い合わせが、テストサーバーで拒否されました"
  why: "管理上の通知です。Spamhaus は解析サーバーの問い合わせを拒否しました。お客様のリンクとは無関係です。"
  fix:
    - "お客様の作業は不要です。"
sa.uribl_zen_blocked_opendns:
  title: "リンクに対する Spamhaus ZEN への問い合わせが拒否されました：公開リゾルバー"
  why: "管理上の通知です。解析サーバーは、公開リゾルバーを経由して Spamhaus に問い合わせています。"
  fix:
    - "お客様の作業は不要です。"
