sa.spf_pass:
  title: "エンベロープアドレスのSPFが有効です"
  why: "IP {ip} は {envelope_domain} のSPFレコードに正しく含まれています。これは想定どおりの状態です。SpamAssassin はこれにほとんど加点しませんが、これがないと、SPF側のDMARCアラインメントが失われます。"
  fix:
    - "対応不要です。送信ツールを追加または削除するたびに、{envelope_domain} のSPFレコードを更新し続けてください。"
sa.spf_fail:
  title: "エンベロープアドレスのSPFが厳格な失敗（-all）です"
  why: "{envelope_domain} は -all で終わるSPFを公開していますが、IP {ip} は含まれていません。SpamAssassin はこの結果をあまり重視しませんが、Gmail、Outlook、Yahoo にとっては認証の欠陥です。{domain} に揃った有効なDKIMがなければ、メッセージは迷惑メールになるか拒否されます。典型的な例は、ドメインの名義で送信する新しいツール（CRM、ショップ、フォームなど）が、SPFに追加されていないケースです。"
  fix:
    - "IP {ip} を所有しているサービスを特定してください（検出されたプロバイダー：{provider}）。"
    - "そのサービスの include: または ip4: の仕組みを、{envelope_domain} のSPFレコードに -all の前に追加してください。"
    - "そのサービスが、あなたに代わって送信すべきでない場合は、{domain} の名義での送信を停止してください。"
sa.spf_softfail:
  title: "エンベロープアドレスのSPFがソフトな失敗（~all）です"
  why: "IP {ip} は、~all で終わる {envelope_domain} のSPFで許可されていません。メッセージは拒否されませんが、SPFの利点を失い、DKIM がアラインされていなければ DMARC は失敗します。多くの場合、SPFに追加し忘れた送信ツールが原因です。"
  fix:
    - "IP {ip}（{provider}）から送信しているサービスを特定し、その include: を {envelope_domain} のSPFに追加してください。"
    - "送信が WordPress サーバーや共有ホスティングを経由している場合は、代わりに、メールサービスの認証付き SMTP で送信してください。"
  fix_by_provider:
    wordpress: "SMTP拡張機能（WP Mail SMTP、FluentSMTP など）をインストールし、PHP の mail() 関数ではなく、メールサービスのサーバー経由で送信してください。"
sa.spf_neutral:
  title: "エンベロープアドレスのSPFが中立（?all）です"
  why: "{envelope_domain} のSPFは、IP {ip} について許可も拒否もしていません。通常は ?all で終わっているためです。中立のSPFは何も保護しません。SpamAssassin はソフトフェイルよりも重く減点します。"
  fix:
    - "{envelope_domain} の名義で送信するすべてのサービスを列挙し、SPFに追加してください。"
    - "DMARC のレポートで正規の送信が失敗していないことが確認できたら、?all を ~all に、さらに -all に変更してください。"
sa.spf_none:
  title: "エンベロープアドレスにはSPFレコードがありません"
  why: "{envelope_domain} はSPFを公開していません。SpamAssassin はほとんど減点しませんが、Gmail と Yahoo は少なくとも SPF か DKIM のどちらかを求めており、誰でもこのドメインの名義で送信できてしまいます。"
  fix:
    - "{envelope_domain} のルートに、v=spf1 で始まる TXT レコードを作成してください。"
    - "送信サービス（メール、ニュースレター、サイト）ごとに include: を追加し、~all で終えてください。"
sa.spf_helo_pass:
  title: "サーバーのHELO名のSPFが有効です"
  why: "サーバーは {helo} と名乗り、その名前は自身のSPFで IP {ip} を許可しています。サーバーが正しく設定されているしるしです。"
  fix:
    - "対応不要です。"
sa.spf_helo_fail:
  title: "サーバーのHELO名がSPFに失敗しています"
  why: "サーバーは {helo} と名乗っていますが、その名前のSPFは IP {ip} を除外しています。別のサーバーの名前を借りている場合や、ホスト名のSPFがIPの変更に追随していない場合に起こります。"
  fix:
    - "サーバーに、自分のものであり、逆引きDNS（{ptr}）が一致する名前を名乗らせてください。"
    - "その名前のホストに対して、自身のIPを許可する最小限のSPFを公開してください。"
sa.spf_helo_softfail:
  title: "サーバーのHELO名がソフトなSPF失敗です"
  why: "{helo} のSPFは IP {ip} をカバーしておらず、~all で終わっています。サーバーが自分のものではない名前を借りているようです。SpamAssassin はこれをわずかに減点します。"
  fix:
    - "サーバーのHELO名（Postfix では myhostname）を、本来のホスト名に設定してください。"
    - "そのホスト名に SPF の「v=spf1 a -all」を追加してください。"
  fix_by_provider:
    postfix: "main.cf の myhostname を、IP の逆引きDNSに一致する名前に設定してから、Postfix を再読み込みしてください。"
sa.spf_helo_neutral:
  title: "サーバーのHELO名のSPFが中立です"
  why: "{helo} のSPFは IP {ip} について判断していません。影響は小さいですが、ホスト名に独自のSPFがないことを示しています。"
  fix:
    - "この名前が {ip} を指している場合は、{helo} に「v=spf1 a -all」を公開してください。"
sa.spf_helo_none:
  title: "サーバーのHELO名にSPFがありません"
  why: "サーバーが名乗る {helo} にはSPFがありません。非常によくあることで、スコアへの影響はほぼありませんが、ホスト名のSPFはDNSのレコード1行で済みます。"
  fix:
    - "このサーバーを管理している場合は、{helo} に TXT レコード「v=spf1 a -all」を追加してください。"
    - "プロバイダー（{provider}）のサーバーであれば、あなた側で対応することはありません。"
sa.t_spf_permerror:
  title: "エンベロープアドレスのSPFが恒久的なエラーです"
  why: "{envelope_domain} のSPFを評価できません。構文の誤り、v=spf1 レコードが2つある、または DNS 参照が10を超えている、のいずれかです。受信者はこれを失敗として扱い、DMARC はSPFを頼りにできません。"
  fix:
    - "{envelope_domain} に、v=spf1 で始まる TXT レコードが1つだけあることを確認してください。"
    - "include:、a、mx、ptr、exists を数えてください。10を超える場合は、使われていないサービスを削除するか、include: を ip4: に置き換えてください。"
    - "綴りの誤り（スペースの欠落、不正な ip4、もう存在しないドメインへの include）を修正してください。"
sa.t_spf_temperror:
  title: "エンベロープアドレスのSPFが一時的なエラーです"
  why: "DNSの障害（タイムアウト、DNSサーバーに到達できない）により、{envelope_domain} のSPFを読めませんでした。これが繰り返されると、メッセージはSPFなしで評価されます。"
  fix:
    - "テストをやり直してください。単発のエラーには対応は不要です。"
    - "再発する場合は、{envelope_domain} のDNSサーバーがすべて応答しているか、include: で指定されたドメインが存在するかを確認してください。"
sa.t_spf_helo_permerror:
  title: "HELO名のSPFが恒久的なエラーです"
  why: "名前 {helo} は無効なSPFを公開しています。そのためサーバーは、誤って設定されたホスト名で送信していることになります。"
  fix:
    - "{helo} のSPFを修正するか、「v=spf1 a -all」に置き換えてください。"
sa.t_spf_helo_temperror:
  title: "HELO名のSPFが一時的なエラーです"
  why: "{helo} のSPFを、DNSの障害により読めませんでした。単発であれば影響はありません。"
  fix:
    - "テストをやり直してください。エラーが続く場合は、{helo} のゾーンが応答しているか確認してください。"
sa.dkim_signed:
  title: "メッセージにDKIM署名があります"
  why: "メッセージは署名されています。SpamAssassin は非常に小さい加点を行いますが、署名が有効であれば取り消されます。壊れた署名だけがこのポイントを残します。"
  fix:
    - "DKIM_VALID も表示されていれば対応不要です。そうでなければ、DKIM_INVALID のルールを参照してください。"
sa.dkim_valid:
  title: "少なくとも1つのDKIM署名が有効です"
  why: "DKIM署名（ドメイン {dkim_domain}）が検証されました。つまり、メッセージは経路上で変更されておらず、署名したドメインがその責任を負っています。"
  fix:
    - "対応不要です。署名ドメインが {domain} であることだけ確認してください（ルール DKIM_VALID_AU）。"
sa.dkim_valid_au:
  title: "差出人ドメインのDKIM署名が有効です"
  why: "有効な署名は、From に表示されている {domain} のものです。これにより、SPF が失敗しても DMARC は通ります。"
  fix:
    - "対応不要です。"
sa.dkim_valid_ef:
  title: "エンベロープドメインのDKIM署名が有効です"
  why: "エンベロープドメイン {envelope_domain} もメッセージに署名しています。送信ツールとドメインの間に整合性があるしるしです。"
  fix:
    - "対応不要です。"
sa.dkim_invalid:
  title: "DKIM署名はありますが、無効です"
  why: "メッセージは署名されています（セレクター {selector}、ドメイン {dkim_domain}）が、検証に失敗しています。公開鍵がDNSに存在しないか異なるか、署名の後にメッセージが変更されています（ウイルス対策が追加したフッター、メーリングリスト、中継など）。SpamAssassin のスコアへの影響は小さいですが、SPF もアラインされていなければ DMARC は失敗します。"
  fix:
    - "{selector}._domainkey.{dkim_domain} のレコードが存在し、送信ツールの現在の公開鍵を含んでいるか確認してください。"
    - "鍵が正しい場合は、署名の後にメッセージを変更しているものを探してください。送信サーバーが追加した署名や注記、リンクの書き換え、メーリングリストの経由などです。"
    - "鍵を、改行や余分な引用符なしでコピーし直してください。DNS の管理画面で鍵が途中で切れることが、最もよくある不具合です。"
sa.dkim_adsp_all:
  title: "ドメインがすべてのメッセージに署名すべきなのに、署名がありません"
  why: "From のドメインは、すべてのメッセージに署名することで知られていますが、このメッセージには {domain} の有効な署名がありません。銀行やマーケットプレイスのような既知のドメインでは、これはなりすましの強い兆候です。"
  fix:
    - "実際に {domain} の名義で送信している場合は、送信ツールの鍵ではなく {domain} のDKIM鍵で署名してください。"
    - "{domain} があなたのドメインではない場合は、そのアドレスを From に使わないでください。自分のドメインのアドレスを使ってください。"
sa.dkim_adsp_nxdomain:
  title: "差出人のドメインがDNSに存在しません"
  why: "From に表示されているドメイン {domain} が DNS に存在しません。受信者は返信することも、何かを検証することもできず、多くの受信者がこのようなメッセージを拒否します。よくある原因は、フォームや CMS に残された noreply@monsite.local のようなテスト用アドレスです。"
  fix:
    - "送信アドレスを、あなたが所有する実在のドメインのアドレスに置き換えてください。"
    - "WordPress や CMS では、通知やフォームの「From」アドレスを確認してください。"
  fix_by_provider:
    wordpress: "SMTP拡張機能の設定（「From Email」欄）と、各フォーム（Contact Form 7 の「メール」タブ、「送信者」欄）で送信アドレスを設定してください。"
sa.dmarc_pass:
  title: "DMARCが有効です"
  why: "SPF または DKIM が通っており、From のドメイン {domain} と一致しています。これは、Gmail や Yahoo が大量送信に求める認証レベルです。"
  fix:
    - "対応不要です。ポリシーがまだ p=none なら、レポートが問題なければ quarantine、次に reject に進めてください。"
sa.dmarc_none:
  title: "DMARCが失敗しています（ポリシー p=none）"
  why: "SPF も DKIM も {domain} にアラインされていません。p=none ポリシーは何もブロックしないよう求めていますが、SpamAssassin は減点し、Gmail や Yahoo は DMARC の失敗を、特に大量送信において認証の欠陥として扱います。"
  fix:
    - "送信ツールで {domain} の名義のDKIM署名を有効にしてください。これが最も確実なアラインメントです。"
    - "または、{domain} の下でカスタムの Return-Path を設定して、SPF をアラインさせてください。"
    - "DMARC のレポート（rua）を読み、失敗している他の送信元を見つけてください。"
sa.dmarc_quar:
  title: "DMARCが失敗しています（ポリシー quarantine）"
  why: "メッセージは DMARC に失敗しており、{domain} 自身が迷惑メールに振り分けるよう求めています。受信者はこの指示に従うため、このメッセージは迷惑メールに届きます。"
  fix:
    - "送信ツール（{provider}）で {domain} のDKIM署名を有効にし、提供された鍵を公開してください。"
    - "署名ドメインの d= が {domain} または {domain} のサブドメインであることを確認してください。"
sa.dmarc_reject:
  title: "DMARCが失敗しています（ポリシー reject）"
  why: "メッセージは DMARC に失敗しており、{domain} は拒否を求めています。大手プロバイダーの多くは、このメッセージを単純に拒否します。このテストで受信されたのは、ブロックしないからにすぎません。"
  fix:
    - "他の送信の前に、このフローを {domain} の名義でDKIM署名してください。"
    - "その間も、DMARC のレポート（rua）で問題の送信元を特定するまでは、p=none に戻さないでください。"
sa.dmarc_missing:
  title: "DMARCポリシーが公開されていません"
  why: "{domain} はDMARCレコードを公開していません。SpamAssassin はほとんど減点しませんが、Gmail と Yahoo は大量送信者にこれを求めており、このドメインはなりすましに使われ得ます。"
  fix:
    - "_dmarc.{domain} に TXT レコードを作成してください。最低限 v=DMARC1; p=none; と、レポートを受け取るための rua アドレスを含めます。"
    - "数週間きれいなレポートが続いたら、p=quarantine、次に p=reject に進めてください。"
sa.dmarc_permerror:
  title: "DMARCレコードが無効です"
  why: "_dmarc.{domain} のレコードが読めません（未知のタグ、v=DMARC1 がない、または位置が誤っている、2つのレコードがある）。受信者はこれを無視するため、あなたのポリシーは適用されません。"
  fix:
    - "_dmarc.{domain} のTXTレコードが1つだけで、正確に v=DMARC1; で始まっていることを確認してください。"
    - "タグはセミコロンで区切り、DNS の管理画面が追加した余分な引用符を削除してください。"
sa.dmarc_temperror:
  title: "DMARCが評価されませんでした：一時的なDNSエラー"
  why: "_dmarc.{domain} へのDNS問い合わせが成功しませんでした。メッセージはDMARCなしで評価されました。"
  fix:
    - "テストをやり直してください。エラーが再発する場合は、{domain} のすべてのDNSサーバーが応答しているか確認してください。"
sa.arc_signed:
  title: "メッセージにARC署名があります"
  why: "中継者（メーリングリスト、転送、ゲートウェイ）が、それが見た認証結果を封印しています。情報としては中立です。"
  fix:
    - "対応不要です。"
sa.arc_valid:
  title: "ARCチェーンが有効です"
  why: "中継者が付けたARCシールは改変されていません。受信者はこれを使って、経路上でSPFかDKIMが壊れた転送メッセージを受け入れられます。"
  fix:
    - "対応不要です。"
sa.arc_invalid:
  title: "ARC署名はありますが、無効です"
  why: "中継者が、もう検証できないARCヘッダーを付けました。多くの場合、下流の機器がメッセージを変更したためです。影響は小さいですが、転送の際にメッセージはARCによる保護を失います。"
  fix:
    - "中継者が自社のもの（アンチスパムゲートウェイ、メーリングリスト）であれば、自身の変更後にARC署名を付けているか確認してください。"
    - "それ以外の場合は対応不要です。修正すべきなのは、中継している当事者です。"
sa.arc_trusted:
  title: "信頼された中継者が封印したARCチェーン"
  why: "メッセージは、テストサーバーがARC署名を認識する中継者を経由しています。好ましいシグナルです。"
  fix:
    - "対応不要です。"
sa.env_and_hdr_spf_match:
  title: "SpamAssassin付属の既定のSPFウェルカムリストに含まれる送信者"
  why: "そのアドレスは、SpamAssassin に付属する既定のウェルカムリストに含まれており、エンベロープが From と一致しています。大手の既知の送信者だけが対象となる加点です。"
  fix:
    - "対応不要です。"
sa.user_in_def_dkim_wl:
  title: "既定のDKIMウェルカムリストに含まれる送信者"
  why: "SpamAssassin には、署名のDKIMで認識される大手の既知送信者のリストが付属しています。メッセージはそのリストに含まれており、大きな加点を受けます。"
  fix:
    - "対応不要です。"
sa.user_in_def_spf_wl:
  title: "既定のSPFウェルカムリストに含まれる送信者"
  why: "送信者は、SpamAssassin に付属し、SPFで検証された既知のドメインのリストに含まれています。大きな加点です。"
  fix:
    - "対応不要です。"
sa.user_in_def_welcomelist:
  title: "既定のウェルカムリストに含まれる送信者"
  why: "送信者は、SpamAssassin に付属するウェルカムリストに含まれ、認証もされています。非常に大きな加点で、とても有名なサービスだけが対象となります。"
  fix:
    - "対応不要です。"
sa.to_eq_fm_spf_fail:
  title: "受信者と送信者が同一で、SPFが失敗しています"
  why: "メッセージは、受信者自身のアドレスから送られたように見えますが、SPFは失敗しています。これは「メールボックスがハッキングされました」という詐欺の手口です。正規の送信でも、サイトのフォームが所有者のアドレスを送信者にして、許可されていないサーバーから所有者宛てに送ると、この規則が発動します。"
  fix:
    - "サイトのフォームでは、From にドメインの技術用アドレス（例：site@{domain}）を設定し、認証付き SMTP で送信してください。"
    - "訪問者のアドレスは、From ではなく Reply-To に設定してください。"
  fix_by_provider:
    wordpress: "Contact Form 7 の「メール」タブで、「送信者」欄に技術用アドレスを、「追加のヘッダー」欄に Reply-To: [your-email] を入力してください。"
sa.to_eq_fm_dom_spf_fail:
  title: "受信者と送信者のドメインが同じで、SPFが失敗しています"
  why: "メッセージは一見、受信者のドメインから来たように見えますが、SPF が許可していないサーバーから送られています。ウェブサイトやプリンターが、公式のメールサービスを通さずに「社内」で送信している場合によく見られます。"
  fix:
    - "これらの送信は、認証付きでドメインのメールサービスの SMTP サーバーを経由させてください。"
    - "または、そのIPを管理しており固定である場合は、ウェブサーバーのIP {ip} を SPF に追加してください。"
sa.dkimwl_wl_high:
  title: "DKIMwlで信頼度「高」の署名ドメイン"
  why: "メッセージに署名したドメイン（{dkim_domain}）は、DKIMwl のリストで信頼度が高に分類されています。好ましいシグナルです。"
  fix:
    - "対応不要です。"
sa.dkimwl_wl_med:
  title: "DKIMwlで信頼度「中」の署名ドメイン"
  why: "署名ドメイン {dkim_domain} は、DKIMwl で中程度の信頼度で知られています。中立から好ましいシグナルです。"
  fix:
    - "対応不要です。"
sa.dkimwl_wl_medhi:
  title: "DKIMwlで信頼度「中から高」の署名ドメイン"
  why: "署名ドメイン {dkim_domain} は DKIMwl で高く評価されており、スコアから1点が差し引かれます。"
  fix:
    - "対応不要です。"
sa.dkimwl_bl:
  title: "DKIMwlでブロックされた署名ドメイン"
  why: "メッセージに署名したドメイン（{dkim_domain}）は、DKIMwl でブロックされた送信者に分類されています。このドメインが、あなたのものではなく送信ツールの共有ドメインである場合は、そのドメイン全体のレピュテーションが、あなたに不利に働いています。"
  fix:
    - "送信ツールの共有ドメインではなく、自分のドメイン {domain} で署名してください。"
    - "ブロックされたドメインがあなたのものである場合は、原因（アカウントの乗っ取り、購入したリスト）を探してから、DKIMwl に連絡してください。"
sa.dkimwl_blocked:
  title: "テストサーバーからのDKIMwlの問い合わせが拒否されました"
  why: "管理上の注意：DKIMwl は、メッセージを分析するサーバーからの応答を拒否しました。これはあなたの送信とは関係ありません。"
  fix:
    - "あなた側での対応は不要です。このテストでは DKIMwl の結果がないだけです。"
