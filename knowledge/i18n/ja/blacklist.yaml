blacklist.spamhaus_sbl:
  title: "IP {ip} は Spamhaus SBL に登録されています"
  why: "Spamhaus は、メールサーバーで最もよく使われているリストです。SBL に登録されると、多くの受信先でお客様のメールが拒否されます。多くの場合、接続の段階で拒否されます。"
  fix:
    - "IP {ip} の詳細ページ（{delist_url}）で、登録理由と SBL の案件番号を確認してください。"
    - "原因を取り除いてください。乗っ取られたアカウント、悪用されたフォーム、購入したアドレスリストなどが対象です。"
    - "ホスティング事業者またはインターネットサービスプロバイダーに連絡してください。Spamhaus によると、SBL の削除依頼は、その IP に責任を持つプロバイダーから行う必要があります。削除は無料です。"
    - "{ip} が送信サービス（{provider}）の共有 IP である場合は、そのサポートに連絡してください。この IP はお客様のものではないため、登録への対応はサービス側が行う必要があります。"
blacklist.spamhaus_css:
  title: "IP {ip} は Spamhaus CSS に登録されています"
  why: "Spamhaus が {ip} から送られるスパムを自動的に検出しました。登録が続いている間は、多くの受信先がお客様のメールを拒否します。"
  fix:
    - "送信元を探してください。不正アクセスされたメールアカウント、送信機能を持つ Web サイト（フォーム、拡張機能など）、またはロボットのように見える誤った HELO や逆引き DNS の設定が考えられます。"
    - "依頼の前に原因を修正してください。そうしないと、IP はすぐに再登録されます。"
    - "{delist_url} で削除を依頼できます（ご自身による削除依頼は回数が制限されています）。または登録の期限切れを待ってください。通常は最後の検出から 3 日後です。"
blacklist.spamhaus_xbl:
  title: "IP {ip} は Spamhaus XBL に登録されています（感染したマシン）"
  why: "Spamhaus は、{ip} が感染したマシンのように動作しているのを確認しました。多くの受信先がお客様のメールを拒否します。問題はメールにとどまりません。お客様のネットワーク上の機器が、第三者に制御されている可能性が高いです。"
  fix:
    - "{delist_url} で、検出された感染の種類と最後の検出時刻を確認してください。"
    - "{ip} の背後にあるパソコン、サーバー、IoT 機器を調べ、メールアカウントのパスワードを変更してください。"
    - "{ip} がサーバーである場合は、メールソフトウェア以外のすべてのプロセスについて、送信方向のポート 25 をブロックしてください。"
    - "マシンを清掃した後、{delist_url} で削除を依頼してください。"
blacklist.spamhaus_pbl:
  title: "IP {ip} は住宅用の IP 範囲に属しています（Spamhaus PBL）"
  why: "お客様のサーバーは、一般家庭向けの回線、または所有者がエンドユーザー専用に割り当てた範囲から直接送信しています。お客様に落ち度がなくても、多くの受信者がこの種の送信を拒否します。"
  fix:
    - "直接配送せず、メールサービスやプロバイダーの認証付き SMTP サーバー（ポート 587 または 465）から送信してください。"
    - "{ip} が、正しい逆引き DNS を持つ実際のメールサーバーの固定 IP である場合は、{delist_url} で除外を依頼できます。除外は 1 年間有効で、ネットワークのポリシーが許可している場合にのみ可能です。"
    - "複数のアドレスについては、その範囲を所有するインターネットサービスプロバイダーが削除を依頼する必要があります。"
  fix_by_provider:
    postfix: "relayhost = [smtp.your-provider.example]:587 を設定し、smtp_sasl_auth_enable = yes と smtp_tls_security_level = encrypt を指定してから、postfix reload を実行してください。"
    wordpress: "SMTP の拡張機能をインストールし、サーバーの mail() 関数ではなく、メールサービスの SMTP サーバーから送信してください。"
blacklist.spamhaus_drop:
  title: "IP {ip} は Spamhaus DROP の範囲に属しています"
  why: "Spamhaus は、{ip} の範囲全体が悪意のある主体に管理されていると判断しています。お客様側の設定では、この IP をメールに使えるようにすることはできません。"
  fix:
    - "この IP からの送信を停止してください。"
    - "ホスティング事業者または送信サービスを変更し、新しい IP を使う前に確認してください。"
blacklist.spamhaus_dbl_sender:
  title: "ドメイン {domain} は Spamhaus DBL に登録されています"
  why: "お使いのドメイン自体が、スパムまたは詐欺に関連すると判断されています。IP を変えても意味がありません。アドレスまたはリンクに {domain} を含むメールは、DBL を利用する受信者によって拒否されるか、迷惑メールに分類されます。"
  fix:
    - "{delist_url} でドメインの詳細ページを確認してください。"
    - "原因を探してください。フィッシングページを置かれてしまった乗っ取り被害のサイト、同意のないアドレスへのキャンペーン、オープンリダイレクトなどが考えられます。"
    - "原因を取り除いたら、{delist_url} で削除を依頼してください。Spamhaus の処理には最大 24 時間かかるとされていますが、削除は保証されていません。"
blacklist.spamhaus_dbl_abused:
  title: "{domain} のホスト名の 1 つが、悪用されたサイトとして Spamhaus DBL に登録されています"
  why: "Spamhaus は、お客様のドメインは正規のものだと判断しています。しかし、サイトの一部（改ざんされたページやオープンリダイレクトなど）が第三者に利用されています。この名前を含むメールはフィルタリングされます。"
  fix:
    - "{delist_url} で、登録されたホスト名と悪用の種類を確認してください。"
    - "サイトを清掃してください（CMS と拡張機能を更新し、追加されたファイルを削除します）。またはオープンリダイレクトを閉じてください。"
    - "修正を公開した後、{delist_url} で削除を依頼してください。"
  fix_by_provider:
    wordpress: "削除を依頼する前に、WordPress、テーマ、すべての拡張機能を更新し、不明な管理者アカウントを削除して、サイトのウイルススキャンを実行してください。"
blacklist.barracuda:
  title: "IP {ip} は Barracuda（BRBL）に登録されています"
  why: "Barracuda のゲートウェイで保護されている企業は、お客様のメールを拒否します。法人の取引先に多く見られるため、B2B の送信では不利になります。"
  fix:
    - "疑わしい送信の原因を取り除いてください（乗っ取られたアカウント、同意のないリスト、送信量の急増など）。"
    - "https://www.barracudacentral.org/rbl/removal-request のフォームに、IP {ip}、有効な連絡先メールアドレス、修正内容の説明を入力してください。"
    - "削除依頼は 1 回だけ送信してください。Barracuda は複数の依頼を無視し、通常は 12 時間以内に処理すると案内しています。"
blacklist.spamcop:
  title: "IP {ip} は SpamCop に登録されています"
  why: "受信者がお客様のメールをスパムとして報告しました。報告が続く限り、SpamCop を使うサーバーはお客様の送信を拒否します。"
  fix:
    - "https://www.spamcop.net/bl.shtml で、最後の報告日を確認してください。"
    - "同意を得ていないアドレスを送信先から外し、配信停止リンクが見えるようにしてください。"
    - "待ってください。SpamCop は最後の報告から 24 時間後に IP を自動的に削除します。早期の削除を求める問い合わせは不要とされています。"
blacklist.uceprotect_level1:
  title: "IP {ip} は UCEPROTECT レベル 1 に登録されています"
  why: "お客様の IP が、UCEPROTECT のトラップアドレス宛にメールを送信しました。大手プロバイダーでこのリストを使うところは少ないですが、一部の企業サーバーは参照しています。"
  fix:
    - "送信リストを整理してください。トラップアドレスは、古いファイルや購入したリストに含まれていることが多いです。"
    - "{ip} から、お客様が把握していないアカウントやサイトが送信していないか確認してください。"
    - "自動的な期限切れを待ってください。最後の検出から 7 日後です。有料の削除は必要ありません。"
blacklist.uceprotect_level2:
  title: "{ip} のネットワークは UCEPROTECT レベル 2 に登録されています"
  why: "狙われているのはお客様の IP ではなく、ホスティング事業者のアドレスブロックです。同じブロックの他の利用者が原因です。影響は、このレベルを使う少数のサーバーに限られます。"
  fix:
    - "削除費用は支払わないでください。依頼できるのはプロバイダーだけで、登録は自然に解除されます。"
    - "ホスティング事業者に登録を知らせ、問題のある顧客に対応してもらってください。"
    - "送信量が多い場合は、ホスティング事業者に別のブロックの IP を依頼するか、送信サービスを利用してください。"
blacklist.uceprotect_level3:
  title: "{ip} のホスティング事業者は、UCEPROTECT レベル 3 に全体として登録されています"
  why: "ホスティング事業者のすべてのアドレスが登録されています。お客様のアドレスも、何百万もの他のアドレスも対象です。このレベルでブロックするサーバーはごくわずかで、メール送信への影響は通常ありません。"
  fix:
    - "削除の手続きは行わず、費用も支払わないでください。対応できるのはホスティング事業者だけです。"
    - "特定の受信先が UCEPROTECT を理由にお客様のメールを拒否した場合に備えて、この情報を保管し、その受信先に伝えてください。"
blacklist.sorbs_closed:
  title: "SORBS は閉鎖されています。引用された登録は無効です"
  why: "SORBS のリストは稼働を停止しています。今も SORBS を引用するツールやサーバーは古い設定を使っており、拒否の本当の原因は別にあります。"
  fix:
    - "テストツールが報告する「SORBS への登録」はすべて無視してください。"
    - "受信者が SORBS を理由にお客様のメールを拒否した場合は、その管理者に、リストが閉鎖されていることと、設定から削除すべきことを伝えてください。"
blacklist.psbl:
  title: "IP {ip} は PSBL に登録されています"
  why: "お客様の IP が、スパムトラップのアドレスに送信しました。登録が続いている間は、SpamAssassin がお客様のメールにスコアを加算します。"
  fix:
    - "古い、または同意のないアドレスを送信リストから削除してください。"
    - "https://psbl.org/remove で、ご自身で IP を削除できます。無料で即時に反映されますが、トラップへの送信が続けば再び登録されます。"
blacklist.mailspike:
  title: "IP {ip} は Mailspike で評価が下がっています"
  why: "Mailspike は、{ip} が迷惑メールを送信していると判断しています。SpamAssassin などのフィルターは、お客様のメールにスコアを加算します。"
  fix:
    - "https://mailspike.io/ip_verify で、IP と理由を確認してください。"
    - "原因を取り除いてください（送信量の急増、無効なアドレス、感染したマシンなど）。"
    - "36 時間以内に登録が自然に解除されない場合は、同じページの削除フォームを使ってください。"
blacklist.spamrats_dyna:
  title: "IP {ip} は SpamRATS Dyna に登録されています（動的 IP と見なされています）"
  why: "{ip} の逆引き DNS（{ptr}）は、一般家庭の契約者のものによく似ています。SpamRATS を使うサーバーは、こうした直接送信を拒否します。"
  fix:
    - "ホスティング事業者に、個別の逆引き DNS を依頼してください（例：mail.{domain}）。IP や、dynamic、pool といった語は含めないでください。"
    - "IP が本当に一般家庭向けの回線である場合は、認証付き SMTP サーバーから送信してください。"
    - "その後、https://www.spamrats.com/removal.php で削除を依頼してください。"
blacklist.spamrats_noptr:
  title: "IP {ip} は SpamRATS NoPtr に登録されています（逆引き DNS がありません）"
  why: "{ip} には逆引き DNS がありません。SpamRATS はこの理由だけで登録します。大手プロバイダーも、この欠陥を理由に評価を下げます。"
  fix:
    - "ホスティング事業者に、{ip} の逆引き DNS を設定してもらい（例：mail.{domain}）、対応する A レコードを作成してください。"
    - "その後、https://www.spamrats.com/removal.php で削除を依頼してください。"
blacklist.spamrats_spam:
  title: "IP {ip} は SpamRATS Spam に登録されています"
  why: "SpamRATS が {ip} から送られるスパムを確認しました。このリストを使うサーバーは、お客様の送信を拒否します。"
  fix:
    - "送信の原因を探してください。乗っ取られたアカウント、悪用されたフォーム、同意のないリストなどが考えられます。"
    - "原因を取り除いたら、https://www.spamrats.com/removal.php で削除を依頼してください（自動削除の手続きがない場合は、連絡ページから依頼してください）。"
blacklist.surbl:
  title: "メール内のドメインが SURBL に登録されています（{value}）"
  why: "メール内のリンクが、スパムや詐欺に関連すると SURBL が判断しているドメインを指しています。リンクを解析するフィルターは、IP の評判に関係なく、このメールを迷惑メールに分類します。"
  fix:
    - "該当するドメイン（{value}）を確認し、https://www.surbl.org/surbl-analysis で登録カテゴリを調べてください。"
    - "お客様のドメインでない場合（短縮 URL、アフィリエイトリンク、他所でホストされている画像など）は、メールから削除してください。"
    - "お客様のドメインである場合は、サイトを清掃したうえで、同じページのフォームから削除を依頼してください。"
blacklist.uribl_black:
  title: "メール内のドメイン {value} は URIBL のブラックリストに登録されています"
  why: "メールに含まれるドメインが、URIBL のブラックリストに登録されています。SpamAssassin などのフィルターは、このメールに大きなスコアを加算します。"
  fix:
    - "https://lookup.uribl.com でドメイン（{value}）を確認してください。"
    - "お客様のドメインでない場合は、そのドメインへのリンクをメールから削除してください。"
    - "お客様のドメインである場合は、原因を修正したうえで、https://admin.uribl.com（ログインが必要）から削除を依頼してください。"
blacklist.uribl_grey_red:
  title: "メール内のドメイン {value} は URIBL のセカンダリリストに登録されています"
  why: "メール内のドメインが、重大度の低い URIBL のリストに登録されています。影響は小さいものの、他の不利な信号に加算されます。"
  fix:
    - "https://lookup.uribl.com で、ドメイン（{value}）と該当するリストを確認してください。"
    - "そのドメインがお客様のものである場合は、メールがそれを求めた人だけに送られていることを確認したうえで、https://admin.uribl.com から削除を依頼してください。"
blacklist.abusix:
  title: "IP {ip} は Abusix Mail Intelligence に登録されています"
  why: "Abusix が {ip} から望ましくない動きを確認しました。そのデータを使うサーバーやフィルターは、お客様のメールを拒否するか、評価を下げます。"
  fix:
    - "https://lookup.abusix.com/ で理由を確認してください。"
    - "原因を取り除いてから、同じページで削除を依頼してください（メールによる確認が求められます）。"
    - "依頼しなくても、登録は通常、最後の事象から 5.2 日で期限切れになります。"
blacklist.invaluement:
  title: "{list_name}：IP {ip} またはドメイン {domain} は Invaluement に登録されています"
  why: "Invaluement は企業のフィルターで使われています。登録されると、これらの顧客先でお客様のメールが拒否されます。"
  fix:
    - "https://www.invaluement.com/research/ で理由を確認してください。"
    - "原因を修正したうえで、https://www.invaluement.com/removal/ から削除を依頼してください。"
blacklist.microsoft_banned_ip:
  title: "Microsoft が IP {ip} をブロックしています"
  why: "Microsoft は、Microsoft 365 でホストされているすべてのドメイン宛てに、{ip} からのメールを拒否しています。多くのビジネス受信者に、お客様のメールが届かなくなっています。"
  fix:
    - "まず原因を取り除いてください（乗っ取られたアカウント、同意のないリスト、異常な送信量など）。"
    - "https://sender.office.com を開き、連絡先のメールアドレスと IP {ip} を入力してから、届いた確認メールのリンクをクリックし、Delist IP をクリックしてください。"
    - "ブロックが解除されるまで、最大 24 時間、場合によってはそれ以上かかることがあります。"
    - "拒否メッセージに 5.7.511 が表示された場合は、その拒否メッセージを delist@microsoft.com に転送してください。"
blacklist.query_blocked:
  title: "リスト {list_name} に問い合わせできませんでした"
  why: "このリストは回答せず、問い合わせを拒否しました。{ip} や {domain} について何かが分かったわけではありません。このリストについては、確認が行われなかっただけです。"
  fix:
    - "お客様の作業は不要です。別のツールがこのコードで登録を通知していても、それは誤報です。"
    - "ご自身で確認する場合は、このリストの照会ページ（{delist_url}）を使ってください。"
blacklist.ip_listed:
  title: "IP {ip} は {list_name} に登録されています"
  why: "{list_name} を参照する受信サーバーは、{ip} から届いたメールを拒否するか、迷惑メールに分類します。リストは、迷惑な送信や、乗っ取られたマシンの活動を確認すると登録します。"
  fix:
    - "リストのページ（{delist_url}）を開いてください。通常、登録理由と日付が表示されています。"
    - "依頼の前に原因を修正してください。乗っ取られたメールアカウント、悪用されたサイトのフォーム、購入した、または同意のない連絡先リスト、誤って設定されたサーバーなどが対象です。"
    - "リストの手続きに従って削除を依頼してください。リストによっては、悪用が止まってしばらくすると、自動的に削除するものもあります。"
    - "{ip} がお客様の送信サービスやホスティング事業者のものである場合は、その事業者に登録を伝えてください。削除を依頼するのは事業者の役目です。"
blacklist.domain_listed:
  title: "ドメイン {domain} は {list_name} に登録されています"
  why: "{list_name} を参照するフィルターは、{domain} を送信元にしたり、リンクに含めたりするメールを拒否するか、迷惑メールに分類します。よくある原因は、同意のない送信、または悪意のあるページを置かれた乗っ取り被害のサイトです。"
  fix:
    - "リストのページ（{delist_url}）を開き、登録理由を確認してください。"
    - "{domain} のサイトが乗っ取られた場合は、サイトを清掃し、ホスティングへのアクセスパスワードを変更してください。"
    - "送信が原因の場合は、同意のないアドレスへの送信を停止してください。"
    - "その後、リストの手続きに従って削除を依頼してください。"
blacklist.listed:
  title: "{value} は {list_name} に登録されています"
  why: "受信サーバーは、メールを受け入れる前に {list_name} を参照することがあります。{value} が登録されている間は、それに依存するメールが迷惑メールに分類されたり、拒否されたりすることがあります。"
  fix:
    - "リストのページ（{delist_url}）を開き、登録理由と日付を確認してください。"
    - "原因を特定して修正してください。乗っ取られたアカウント、悪用されたフォーム、同意のない送信、侵害されたサイトなどが考えられます。"
    - "その後、リストの手続きに従って削除を依頼してください。"
