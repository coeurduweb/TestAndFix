sa.freemail_from:
  title: "送信者が無料メールサービスを使っています"
  why: "送信元アドレスが一般向けのメールサービスにあります。スコアへの影響はほぼゼロですが、この規則はより重い規則の条件として使われます。また、Gmail や Orange から書かれた会社のメールは、自社ドメインのアドレスよりも信頼されにくくなります。"
  fix:
    - "ビジネス用の送信では、自社ドメインのアドレスを使ってください。"
    - "Gmail、Outlook.com、Yahoo のアドレスを From に使ってニュースレターを送らないでください。別のサービスから送ると、そのドメインに対して DMARC は通りません。また Yahoo は拒否ポリシーを公開しています。"
sa.freemail_replyto:
  title: "Reply-To が、送信者と異なる無料メールサービスになっています"
  why: "返信が、送信者のものとは異なる無料アドレスに送られます。これは詐欺の手口です（一方のアドレスから書き、返信は別の場所で受け取る）。ただし、訪問者の Gmail アドレスを Reply-To に入れる問い合わせフォームでも起こります。"
  fix:
    - "問い合わせフォームであれば、これは想定どおりです。From がご自身のドメインのアドレスで、SPF と DKIM で認証されていることだけ確認してください。"
    - "キャンペーンの場合は、Reply-To にご自身のドメインのアドレスを設定してください。"
sa.freemail_forged_replyto:
  title: "送信者は企業ですが、Reply-To が無料メールサービスになっています"
  why: "メッセージは企業のアドレスから届いていますが、Gmail や Outlook などのアドレスに返信するよう求めています。これは CEO 詐欺や偽の請求書に典型的で、2 点を超える減点になります。"
  fix:
    - "Reply-To にはご自身のドメインのアドレスを設定するか、Reply-To ヘッダーを削除してください。"
    - "訪問者のアドレスを Reply-To に入れるサイトのフォームの場合は、この減点を受け入れるか、訪問者のアドレスをメッセージ本文に書き写してください。"
  fix_by_provider:
    wordpress: "Contact Form 7 または WPForms では、訪問者が無料アドレスを持っている場合、Reply-To: [your-email] のヘッダーがこの規則を発動させます。社内向けの通知であれば問題ありません。"
sa.freemail_reply:
  title: "本文が、送信者と異なる無料アドレスを挙げています"
  why: "メッセージは、送信元とは別の無料アドレスに書くよう勧めています。詐欺では、まだ報告されていない受信箱へ返信させるためにこれが使われます。"
  fix:
    - "メッセージには、送信者と同じ連絡先アドレス、またはご自身のドメインのアドレスを記載してください。"
sa.freemail_envfrom_end_digit:
  title: "末尾が数字の無料のエンベロープ送信アドレス"
  why: "エンベロープ送信アドレスは、john.smith75@gmail.com のような無料の受信箱です。スパマーが大量に作成するアカウントは、このような形式であることがよくあります。減点は小さいです。"
  fix:
    - "この規則と周辺の規則を避けるため、ご自身のドメインのアドレスから送信してください。"
sa.freemail_replyto_end_digit:
  title: "末尾が数字の無料の Reply-To"
  why: "返信先アドレスは、識別子の末尾が数字である無料の受信箱です。ほかの freemail の規則に加わる弱いシグナルです。"
  fix:
    - "Reply-To には、ご自身のドメインのアドレスを使ってください。"
sa.freemail_forged_fromdomain:
  title: "無料の送信者が、別のエンベロープドメインから送信されています"
  why: "From は無料アドレス（Gmail、Orange など）ですが、エンベロープは別のドメインに属しています。これは、Gmail のアドレスを送信者に設定したツールやサイトが生成するものです。メッセージは無料プロバイダーのドメインに整合できず、そのドメインが DMARC を公開している場所では必ず DMARC に失敗します。"
  fix:
    - "送信者には、ご自身のドメインのアドレスを使い、送信ツールで認証してください。"
    - "ドメインがない場合は、サードパーティのサービスからではなく、無料プロバイダーの Web メールから直接送信してください。"
sa.header_from_different_domains:
  title: "From のドメインが、エンベロープのドメインと異なります"
  why: "From は {domain} を表示していますが、Return-Path は {envelope_domain} に属しています。これは、返信を自社ドメインで管理する多くの送信ツール（Brevo、Mailchimp、Mailjet）の既定の設定です。減点は小さいですが、その場合 SPF は DMARC のために整合しません。"
  fix:
    - "送信ツールで、{domain} の下にカスタム Return-Path（例: bounce.{domain}）を設定してください。"
    - "それができない場合は、DKIM が {domain} で署名していることを確認し、DMARC が通るようにしてください。"
  fix_by_provider:
    brevo: "Brevo の「ドメイン」セクションで {domain} を認証してください。その場合、DKIM 署名はご自身のドメインで行われ、Return-Path が {domain} の下になくても、DMARC は DKIM で通ります。"
    mailchimp: "Mailchimp の Domains セクションで {domain} を認証してください。その場合、DKIM 署名はご自身のドメインで行われ、Return-Path が {domain} の下になくても、DMARC は DKIM で通ります。"
    amazon_ses: "SES のアイデンティティで、カスタム MAIL FROM（{domain} のサブドメイン）を設定してください。"
sa.replyto_without_to_cc:
  title: "Reply-To はあるが、To も Cc もありません"
  why: "メッセージに返信先アドレスはありますが、表示される受信者がいません。すべての受信者が Bcc に入っています。これは、リストを Bcc に入れてメールソフトから一斉送信する方法で、スパムによく見られる形式です。"
  fix:
    - "To ヘッダーを追加してください。個別送信の場合は受信者のアドレス、リストを Bcc に入れておく場合はご自身のアドレスにしてください。"
    - "数十人を超える受信者には、各メッセージを個別に送るツールを使ってください。"
sa.to_no_brkts_dynip:
  title: "山括弧のない宛先と、一般消費者向け回線の送信 IP"
  why: "To に裸のアドレス（「氏名 <...>」なし）があり、メッセージは住宅用回線の reverse DNS を持つ IP から送信されています。この組み合わせは感染したマシンがスパムを送る特徴で、3 点の減点になります。"
  fix:
    - "宛先は名前と山括弧を付けて書いてください：\"Taro Yamada\" <name@your-domain.example>。送信ツールは、名前欄が入力されていれば自動的にこの形式にします。"
    - "List-Unsubscribe ヘッダーと配信停止リンクを追加してください。この規則の複数の変種が適用されなくなります。"
sa.to_no_brkts_from_mssp:
  title: "山括弧のない宛先と、形式の誤った送信者"
  why: "宛先のアドレスは裸で、From は名前と山括弧の間にスペースなし（Name<address>）で書かれています。この 2 つの書式の欠陥が一緒にあると、手作りの送信スクリプトであることがわかります。"
  fix:
    - "宛先は名前と山括弧を付けて書いてください：\"Taro Yamada\" <name@your-domain.example>。送信ツールは、名前欄が入力されていれば自動的にこの形式にします。"
    - "List-Unsubscribe ヘッダーと配信停止リンクを追加してください。この規則の複数の変種が適用されなくなります。"
sa.to_no_brkts_html_img:
  title: "山括弧のない宛先、画像 1 つだけの HTML"
  why: "宛先アドレスが裸で、メッセージは画像 1 つだけの HTML です。象徴的なスコアですが、画像スパムの特徴です。"
  fix:
    - "宛先は名前と山括弧を付けて書いてください：\"Taro Yamada\" <name@your-domain.example>。送信ツールは、名前欄が入力されていれば自動的にこの形式にします。"
    - "List-Unsubscribe ヘッダーと配信停止リンクを追加してください。この規則の複数の変種が適用されなくなります。"
sa.to_no_brkts_html_only:
  title: "山括弧のない宛先と、HTML のみのメッセージ"
  why: "宛先アドレスが裸で、メッセージにテキスト版がありません。これは PHP の mail() 関数や、生の HTML を送る自作スクリプトが作るものです。2 点近くの減点です。"
  fix:
    - "宛先は名前と山括弧を付けて書いてください：\"Taro Yamada\" <name@your-domain.example>。送信ツールは、名前欄が入力されていれば自動的にこの形式にします。"
    - "List-Unsubscribe ヘッダーと配信停止リンクを追加してください。この規則の複数の変種が適用されなくなります。"
sa.to_no_brkts_msft:
  title: "山括弧のない宛先と、Outlook のヘッダー"
  why: "メッセージは Outlook から送られたと主張していますが、宛先アドレスは裸です。Outlook は通常そうしません。Outlook を模倣する送信ソフトが対象になります。"
  fix:
    - "宛先は名前と山括弧を付けて書いてください：\"Taro Yamada\" <name@your-domain.example>。送信ツールは、名前欄が入力されていれば自動的にこの形式にします。"
    - "List-Unsubscribe ヘッダーと配信停止リンクを追加してください。この規則の複数の変種が適用されなくなります。"
sa.to_no_brkts_nordns_html:
  title: "山括弧のない宛先、reverse DNS のない IP、HTML のみ"
  why: "宛先アドレスが裸で、メッセージは HTML のみ、IP には reverse DNS がありません。3 つの欠陥は、即席で作られたサーバーを示しています。"
  fix:
    - "宛先は名前と山括弧を付けて書いてください：\"Taro Yamada\" <name@your-domain.example>。送信ツールは、名前欄が入力されていれば自動的にこの形式にします。"
    - "List-Unsubscribe ヘッダーと配信停止リンクを追加してください。この規則の複数の変種が適用されなくなります。"
sa.to_no_brkts_pcnt:
  title: "山括弧のない宛先と、本文中のパーセント表示"
  why: "宛先アドレスが裸で、パーセントが強調されています（「-50 %」）。送信ツールも配信停止リンクもなしに送られたプロモーションの特徴です。"
  fix:
    - "宛先は名前と山括弧を付けて書いてください：\"Taro Yamada\" <name@your-domain.example>。送信ツールは、名前欄が入力されていれば自動的にこの形式にします。"
    - "List-Unsubscribe ヘッダーと配信停止リンクを追加してください。この規則の複数の変種が適用されなくなります。"
sa.to_malformed:
  title: "To ヘッダーの形式が正しくありません"
  why: "To フィールドに有効なアドレスがありません。差し込みタグが空のまま、または置き換えられずに残っていることがよくあります。または、アドレスのない名前だけです。"
  fix:
    - "送信ツールまたはスクリプトで、宛先に使っている差し込み変数を確認してください。"
    - "\"名前\" <address@your-domain.example> の形式、またはアドレスのみを使ってください。"
sa.to_in_subj:
  title: "宛先のアドレスが件名に含まれています"
  why: "件名に受信者のメールアドレス全体が含まれています。スパムや偽のメール通知でよく使われる手口です（「contact@your-domain.example：メールボックスが一杯です」）。減点は小さいです。"
  fix:
    - "件名は、メールアドレスではなく名前で個人化してください。"
sa.to_eq_fm_html_only:
  title: "送信者が宛先と同一で、HTML のみのメッセージ"
  why: "メッセージは一見、宛先本人から届いたように見え、HTML だけを含みます。これはアカウントの偽の警告の形式です。受信者のアドレスを送信元にして、サイトの所有者に送るフォームも、この規則を発動させます。"
  fix:
    - "From には、受信用アドレスとは異なる、ドメインの技術的なアドレスを使ってください。"
    - "メッセージにテキスト版を追加し、DKIM で署名してください。"
sa.to_eq_fm_dom_html_only:
  title: "送信者と宛先が同じドメインで、HTML のみのメッセージ"
  why: "メッセージは、受信企業の内部から来たように見せかけています。認証もテキスト版もありません。「情報システム部」を装ったフィッシングはこの方法を使います。正当な例は、Web サーバーから送られるサイトの通知です。"
  fix:
    - "これらのメッセージは、ドメインで DKIM 署名するか、メールサービスの認証付き SMTP から送信してください。"
    - "テキストパート（multipart/alternative）を追加してください。"
sa.to_eq_fm_direct_mx:
  title: "送信者が宛先と同一で、メールサーバーに直接届けられています"
  why: "メッセージは自分から自分へ送られ、送信サーバーを経由せず、受信サーバーに直接届けられています。象徴的なスコアですが、次の規則（HTML のみ）と組み合わさると重くなります。"
  fix:
    - "MX に直接ではなく、メールサービスの SMTP サーバーを経由して送信してください。"
sa.to_eq_fm_html_direct:
  title: "送信者が宛先と同一で、HTML のみ、直接配送"
  why: "メッセージは一見、宛先本人から届き、HTML だけを含み、受信サーバーに直接配送されています。これは「パスワードの有効期限切れ」という偽の通知の典型的な形式です。この規則だけで 3.5 点を超えます。"
  fix:
    - "From に宛先のアドレスを決して入れないでください。専用の送信用アドレスを使ってください。"
    - "送信は認証付きの SMTP サーバーを経由し、テキスト版を追加してください。"
sa.localpart_in_subject:
  title: "宛先の識別子が件名に含まれています"
  why: "件名に、宛先アドレスの @ より前の部分が含まれています（「jsmith、あなた向けのオファー」）。スパマーは、アドレスしか分からない場合にこのように個人化します。名前ではなく、アドレスのタグを挿入するツールも同じ効果を生みます。"
  fix:
    - "件名は、連絡先の実際の名前で個人化するか、まったく個人化しないでください。"
    - "名前が空のとき、差し込み変数がアドレスに置き換わらないことを確認してください。"
sa.from_in_to_and_subj:
  title: "送信元アドレスが、宛先と件名にも含まれています"
  why: "同じアドレスが、送信者、宛先、そして件名に含まれています。「お使いの {domain} のメールボックスは無効になります」という偽のメッセージに典型的な特徴です。"
  fix:
    - "件名からアドレスを削除し、宛先とは別の送信用アドレスを使ってください。"
sa.from_blank_name:
  title: "送信者名が空です"
  why: "From は \"\" <アドレス> の形式です。引用符で囲まれた空の名前欄です。スクリプトや CMS で名前の変数が設定されていないと、このようになります。"
  fix:
    - "送信ツールで送信者名（会社名または個人名）を入力してください。"
    - "名前が使えない場合は、空の引用符を付けず、アドレスだけを書いてください。"
  fix_by_provider:
    wordpress: "SMTP プラグインの From Name 欄に入力してください。入力がないと、一部のプラグインは空の名前を書き込みます。"
sa.from_no_user:
  title: "送信用アドレスに @ より前の識別子がありません"
  why: "送信用アドレスが @ドメイン または <> の形式です。受信者は返信できず、フィルターはそれを作られたアドレスとみなします。"
  fix:
    - "スクリプトの送信者変数を修正してください。@ より前の識別子が空です。"
sa.from_excess_base64:
  title: "送信者名が不必要に base64 でエンコードされています"
  why: "送信者名は、アクセントを含まないのに base64 でエンコードされています。一部のツールは既定でこれを行い、スパマーもフィルターから名前を隠すためにこれを行います。象徴的なスコアです。"
  fix:
    - "送信ライブラリには、必要なときだけエンコードさせ、base64 ではなく quoted-printable を使わせてください。"
sa.from_illegal_chars:
  title: "From に、エンコードされていない文字があります"
  why: "送信者名に、ヘッダー用のエンコードを経ずに、アクセント付きまたは特殊な文字がそのまま含まれています。一部のソフトでは正しく表示されません。"
  fix:
    - "送信者名を RFC 2047 に従ってエンコードしてください（文字セットに UTF-8 を宣言すれば、ライブラリが行います）。"
sa.from_local_digits:
  title: "送信用アドレスに長い数字の並びがあります"
  why: "送信用アドレスの識別子に、連続する 11 桁以上の数字が含まれています。自動的に生成されるアドレスの形式です。象徴的なスコアです。"
  fix:
    - "読みやすい送信用アドレス（contact@、newsletter@）を使ってください。"
sa.from_local_hex:
  title: "送信用アドレスに長い 16 進数の並びがあります"
  why: "送信用アドレスの識別子が、ランダムなコードに似ています（0-9 と a-f の 11 文字以上）。ツールが生成するアドレスに典型的です。象徴的なスコアです。"
  fix:
    - "From には読みやすいアドレスを表示し、技術的な識別子は Return-Path に残してください。"
sa.from_local_novowel:
  title: "送信用アドレスに子音が続く部分があります"
  why: "@ より前の識別子に、7 つの子音が連続しています。ランダムなアドレスの兆候です。頭字語や地域の名前にも当たることがあります。"
  fix:
    - "可能であれば、より読みやすい送信用アドレス（contact@、info@）を使ってください。"
sa.from_domain_novowel:
  title: "送信者のドメインに子音が続く部分があります"
  why: "ドメイン {domain} には、7 つの連続する子音があります。ランダムに生成されたドメインのパターンです。頭字語や複合名詞でも、理由なく発動することがあります。"
  fix:
    - "ドメインが古く、認証済みであれば、緊急の対応は不要です。新しい送信ドメインでは、発音しやすい名前を選んでください。"
sa.from_starts_with_nums:
  title: "送信用アドレスが複数の数字で始まっています"
  why: "識別子は、少なくとも 3 桁の数字の後に文字が続く形で始まっています（123info@...）。使い捨てアドレスによく見られる形式です。"
  fix:
    - "単語で始まる送信用アドレスを使ってください。"
sa.from_misspaced:
  title: "From の名前とアドレスの間にスペースがありません"
  why: "From が \"名前\"<アドレス> とスペースなしで書かれています。規格は許容しますが、正当なソフトでこのように書くことはほとんどありません。自作の送信スクリプトの特徴です。"
  fix:
    - "引用符で囲んだ名前と開き山括弧の間にスペースを入れてください。"
sa.from_wsp_lead:
  title: "From の開き山括弧の後にスペースがあります"
  why: "送信用アドレスが、山括弧の後にスペースを入れて < contact@your-domain.example> と書かれています。この欠陥はスクリプトの文字列連結の誤りから生じ、SpamAssassin は 3 点を超えて減点します。"
  fix:
    - "From ヘッダーの組み立てを修正し、山括弧の内側にスペースが入らないようにしてください。"
sa.from_wsp_trail:
  title: "From の閉じ山括弧の前にスペースがあります"
  why: "アドレスが <contact@your-domain.example > と、閉じ山括弧の前にスペースを入れて書かれています。入力欄の末尾に残ったスペースであることがよくあります。2 点を超えます。"
  fix:
    - "From を組み立てる前に、値の末尾のスペースを削除（trim）してください。"
sa.from_unbal1:
  title: "From に閉じ山括弧がありません"
  why: "From の開き山括弧が閉じられていません。ヘッダーは無効で、一部のソフトは送信者を表示しません。"
  fix:
    - "スクリプトまたはツールの設定で送信者の文字列を修正してください：\"名前\" <アドレス>。"
sa.from_addr_ws:
  title: "送信用アドレスにスペースが含まれています"
  why: "From から抽出されたメールアドレスにスペースが含まれており、無効になっています。コピー＆ペーストや、連結の誤った変数であることがよくあります。約 3 点。"
  fix:
    - "設定またはコードで、送信用アドレスからスペースを削除してください。"
sa.from_long_dom:
  title: "送信ドメインが異常に長いです"
  why: "送信ドメインの最初のラベルが、ドットなしで 30 文字以上あります。自動生成された使い捨てドメインによく見られる形式です。"
  fix:
    - "短く識別しやすいドメインから送信してください。長いドメインは、必要であればウェブ用に残してください。"
sa.fromspace:
  title: "送信者名の開き引用符の後にスペースがあります"
  why: "送信者名が引用符で始まり、その後にスペースがあります（\" Example Studio\"）。スパムソフトに見られる特有の形式です。"
  fix:
    - "送信ツールの設定で、送信者名の先頭のスペースを削除してください。"
sa.apostrophe_from:
  title: "送信用アドレスにアポストロフィーが含まれています"
  why: "メールアドレス自体（名前ではない）にアポストロフィーが含まれています。許可されていますが珍しく、多くは名前が誤ってアドレスに入ったことを示します。"
  fix:
    - "アポストロフィーが、表示名（「Example's Studio」など）から誤ってアドレスに貼り付けられたものでないか確認してください。"
sa.name_email_diff:
  title: "送信者名が、別のメールアドレスになっています"
  why: "表示名が、実際の送信アドレスとは異なるメールアドレスです。例えば \"service@bank.example\" <x@other.example>。これは典型的ななりすましの手口です。"
  fix:
    - "送信者名には、会社名または個人名などの平文を入れてください。アドレスは入れないでください。"
sa.from_suspicious_ntld:
  title: "送信者のドメインが、悪用されやすい拡張子を使っています"
  why: "ドメイン {domain} の拡張子は、スパマーが大量に使う新しい拡張子の一つです（格安のドメイン）。この減点は、それを選んだ正当な企業にも及びます。"
  fix:
    - "送信には、.fr、.com、または業界で定着した拡張子のドメインを優先してください。"
    - "このドメインを使い続ける場合は、SPF、DKIM、DMARC を丁寧に設定して補ってください。"
sa.from_suspicious_ntld_fp:
  title: "悪用されやすいドメイン拡張子で、会話の兆候がありません"
  why: "{domain} の拡張子は悪用リストに含まれており、メッセージは返信でもメーリングリストの送信でもありません。約 2 点。"
  fix:
    - "キャンペーンは、より一般的な拡張子のドメインから、または List-* ヘッダーを追加するメーリングリストから送信してください。"
sa.pds_from_2_emails:
  title: "From に 2 つの異なるアドレスが含まれています"
  why: "From ヘッダーは、名前の部分でアドレスを表示し、送信には別のアドレスを使っています。なりすましは、信頼されたアドレスを表示するためにこれを使います。約 3.5 点。"
  fix:
    - "表示名を平文の名前に置き換えてください。From に現れるアドレスは 1 つだけにしてください。"
sa.pds_from_name_to_domain:
  title: "送信者名が宛先のドメインを含んでいます"
  why: "表示される送信者名が、宛先のドメイン（「your-domain.example」）です。偽の受信箱管理通知の手口です。象徴的なスコアですが、示唆的です。"
  fix:
    - "送信者名には、ご自身のブランド名を使ってください。"
sa.t_fromname_equals_to:
  title: "送信者名が宛先のアドレスです"
  why: "表示される送信者名が、受信者自身のアドレスです。偽のメール通知は、社内の連絡のように見せるためにこれを行います。"
  fix:
    - "送信者名には、ご自身の名前またはブランド名を使ってください。"
sa.t_fromname_spoofed_email:
  title: "送信者名が別のアドレスを装っています"
  why: "表示名に、実際の送信アドレスと一致しないアドレスが含まれています。テスト用のルールで、重みはありませんが、なりすましのパターンです。"
  fix:
    - "送信者名にはメールアドレスを入れないでください。"
sa.t_pds_to_eq_from_name:
  title: "送信者名が宛先のアドレスです"
  why: "表示される送信者名が、宛先のアドレスです。テスト用のルールで、重みはありません。"
  fix:
    - "送信者として、ご自身の名前またはブランド名を表示してください。"
sa.hk_random_from:
  title: "送信用アドレスの識別子がランダムに見えます"
  why: "@ より前の識別子が、ランダムに選ばれた文字列のように見えます。大量に生成されたスパムのアドレスはこの形式です。"
  fix:
    - "読みやすいアドレス（contact@、newsletter@、bounce@）を使ってください。bounce-、mail- で始まる識別子、または + や = を含む識別子は、この規則では無視されます。"
sa.hk_random_envfrom:
  title: "エンベロープアドレスの識別子がランダムに見えます"
  why: "エンベロープアドレス（Return-Path）の識別子が、ランダムな見た目をしています。送信ツールは符号化された ID を使いますが、この規則が無視する + や = を含む形式（VERP）です。"
  fix:
    - "読みやすいアドレス（contact@、newsletter@、bounce@）を使ってください。bounce-、mail- で始まる識別子、または + や = を含む識別子は、この規則では無視されます。"
sa.hk_random_replyto:
  title: "返信先アドレスの識別子がランダムに見えます"
  why: "返信先アドレスが、ランダムな文字列に似ています。受信用に作られた使い捨ての受信箱を連想させます。"
  fix:
    - "読みやすいアドレス（contact@、newsletter@、bounce@）を使ってください。bounce-、mail- で始まる識別子、または + や = を含む識別子は、この規則では無視されます。"
sa.sorted_recips:
  title: "宛先の一覧がアルファベット順に並んでいます"
  why: "メッセージは、表示される多数の宛先に宛てられ、アルファベット順に並んでいます。アドレス帳のファイルを順に処理するソフトの動作です。受信者はすべてのアドレスを見ることができるため、プライバシーの問題もあります。"
  fix:
    - "同じメッセージを、表示される数十人の宛先に送らないでください。宛先ごとに 1 通ずつ、適切なツールで送信してください。"
sa.suspicious_recips:
  title: "宛先のアドレスが非常によく似ています"
  why: "多くの宛先のアドレスがほぼ同じです（contact1@、contact2@...）。生成されたリストや購入したリストの兆候です。2.5 点を超えます。"
  fix:
    - "宛先ごとに 1 通ずつ送り、生成または推測されたアドレスをリストから削除してください。"
sa.spoofed_freemail:
  title: "出所の証明がない無料メールアドレス"
  why: "From は Gmail、Outlook などのアドレスですが、メッセージは SPF または DKIM で認証されておらず、プロバイダーのサーバーから送られたものでもありません。つまり、誰かが別のサーバーから無料アドレスを使っています。"
  fix:
    - "無料アドレスからのメッセージは、プロバイダー自身（Web メールまたはプロバイダーの SMTP）から送信してください。"
    - "サイトやツールからは、ご自身のドメインのアドレスを使ってください。"
sa.forged_gmail_rcvd:
  title: "gmail.com の送信者が、Google のサーバーを経由していません"
  why: "送信用アドレスは @gmail.com ですが、メッセージは Google を経由していません。そのため gmail.com に整合できず、それを検証する受信者では DMARC に失敗します。"
  fix:
    - "サイトや送信ツールで送信者として @gmail.com を使わないでください。ご自身のドメインのアドレスを使ってください。"
    - "Gmail を使い続けたい場合は、アカウントを使って smtp.gmail.com 経由で送信するようツールを設定してください。"
  fix_by_provider:
    wordpress: "SMTP プラグインで、Gmail モード（OAuth）を選ぶか、From アドレスをご自身のドメインのアドレスに置き換えてください。"
sa.forged_yahoo_rcvd:
  title: "yahoo.com の送信者が、Yahoo のサーバーを経由していません"
  why: "送信用アドレスは @yahoo.com ですが、メッセージは Yahoo を経由していません。Yahoo は厳格な DMARC を公開しており、多くの受信者がこれらのメッセージを拒否します。"
  fix:
    - "サイトやツールからの送信には、Yahoo のアドレスをご自身のドメインのアドレスに置き換えてください。"
