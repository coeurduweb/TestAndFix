redirects.loop:
  title: "リダイレクトの連鎖が循環しています"
  why: "{url} は、すでに訪問したアドレスにリダイレクトしています。ブラウザーは「リダイレクトが多すぎます」というエラーで中断し、クローラーはページに到達できません。このアドレスではサイトに接続できません。"
  fix:
    - "上の連鎖の中で、互いにリダイレクトし合っている2つのアドレスを特定してください。"
    - "それらを生成しているルールを探してください：.htaccess、nginx の設定、CMS のリダイレクトプラグイン、CDN のページルール。"
    - "よくある原因は、サーバーが https を強制しているのに、CDN やプロキシが http で通信していることです。その場合は %{HTTPS} ではなく、ヘッダー X-Forwarded-Proto を確認してください。"
    - "最終的なアドレスへ直接送る1つのルールだけを残し、測定をやり直してください。"
  fix_by_provider:
    wordpress: "設定 > 一般 で、「WordPress アドレス (URL)」と「サイトアドレス (URL)」の両方に、同じ https のアドレスを設定してください。その後、リダイレクトを行うプラグイン（Redirection、Really Simple SSL、キャッシュプラグイン）を1つずつ無効にし、無効にするたびに測定をやり直してください。最後に、ルートの .htaccess のルールを確認してください。"
redirects.too_many:
  title: "リダイレクトの連鎖が止まりません"
  why: "{url} から {value} 回のリクエストを送った後も、連鎖が続いています。Google のクローラーがたどるのは最大 10 ホップまでです。それを超えると、最終ページはクロールされず、ホップごとに訪問者の表示が遅くなります。"
  fix:
    - "上の連鎖を読み、どこで目的地に近づかなくなるかを確認してください。"
    - "連続するリダイレクトを、最終的なアドレスへの1つの 301 リダイレクトに置き換えてください。"
redirects.private_target:
  title: "連鎖の先がプライベートアドレスです"
  why: "{url} は、プライベートまたはローカルのアドレスである {ip} を指しています。インターネットからは誰も到達できません。DNS の設定ミスか、内部サーバーを指すリダイレクトです。"
  fix:
    - "ドメインが公開されている場合は、その A レコードまたは AAAA レコードを、サーバーの公開 IP を指すように修正してください。"
    - "リダイレクトが内部サーバー（プレプロダクション、イントラネット）を指している場合は、その宛先を公開アドレスに置き換えてください。"
redirects.unreachable:
  title: "連鎖の中のアドレスが応答しません"
  why: "{url} へのリクエストが失敗しました：{value}。訪問者にはブラウザーのエラーページが表示され、クローラーは何もクロールできません。"
  fix:
    - "名前が存在しない場合は、DNS ホスティング事業者で A レコードまたは CNAME を作成するか、そこへ向かうリダイレクトを修正してください。"
    - "接続が拒否されるか、タイムアウトする場合は、Web サーバーがポート 80 と 443 で待ち受けていて、ファイアウォールがそれらを通すことを確認してください。"
    - "TLS ネゴシエーションが失敗する場合は、その名前の証明書をサーバーにインストールしてください。"
redirects.chain_long:
  title: "到達するまでにリダイレクトが多すぎます"
  why: "{url} は、{final} に到達する前に {value} 回のリダイレクトを経由しています。ホップごとに接続を最初から確立することになり、特にモバイルでは表示が遅れます。また、古いアドレスへのリンクは、シグナルを十分に引き継ぎません。"
  fix:
    - "古いアドレスそれぞれを、1つの 301 リダイレクトで {final} に直接向けてください。"
    - "http から https、www のルールは、上で提案したルールのように1つにまとめてください。"
    - "内部リンク、サイトマップ、canonical タグを、最終的なアドレスに更新してください。"
redirects.temporary_for_permanent:
  title: "恒久的な変更に一時的なリダイレクトが使われています"
  why: "{url} は、恒久的な変更であるにもかかわらず {status}（一時的なリダイレクト）を返しています：{value}。一時的なリダイレクトは、古いアドレスがまだ正しいと検索エンジンに伝えます。そのため Google は古いアドレスを表示し続けることがあり、リンクのシグナルも引き継がれにくくなります。"
  fix:
    - "このホップを生成しているルールで、ステータスコードを 301（メソッドを維持する必要がある場合は 308）に置き換えてください。"
    - "測定をやり直してください。表示は 301 または 308 である必要があります。"
  fix_by_provider:
    wordpress: "ルールがリダイレクトのプラグイン（例：ツール > Redirection）によるものであれば、それを開いて 301 を選んでください。.htaccess にある場合は、[R,L] または [R=302,L] を [R=301,L] に置き換えてください。"
redirects.redirect_to_error:
  title: "リダイレクト先がエラーページです"
  why: "{url} は {final} にリダイレクト（{value}）しますが、そのページは {status} を返します。訪問者はエラーに到達し、Google はそのページをインデックスから削除します。リダイレクトの効果は失われます。"
  fix:
    - "リダイレクトの宛先を、200 を返すページに変更してください。同等の新しいページか、それが無理な場合は親のカテゴリーです。"
    - "開始アドレスが短縮リンク（bit.ly、tinyurl.com など）の場合は、短縮サービスのアカウントで宛先を変更してください。サーバーのルールを書く必要はありません。"
    - "コンテンツが完全に存在しなくなった場合は、リダイレクトを削除し、古いアドレスが 410 を返すようにしてください。"
    - "宛先が 5xx を返す場合は、宛先のサーバーが停止しています。そのエラーログを確認してください。"
redirects.final_error:
  title: "アドレスがエラーで応答しています"
  why: "{url} はリダイレクトなしで {status} を返しています。このアドレスにまだ訪問やリンクがある場合、それらはエラーに行き着きます。Google は 4xx の URL をインデックスから削除します。"
  fix:
    - "ページが移動している場合は、新しいアドレスへの 301 リダイレクトを追加してください。"
    - "意図的に削除された場合は、404 または 410 のままにして、そこへ向かうリンクを削除してください。"
    - "エラーが 5xx の場合は、サーバーまたはアプリケーションのエラーログを確認してください。"
redirects.redirect_without_location:
  title: "リダイレクトのステータスコードに、宛先のアドレスがありません"
  why: "{url} は {status} を返しますが、宛先を示していません（Location ヘッダーがありません）。ブラウザーは空のページに留まり、クローラーはそこで止まります。"
  fix:
    - "この {status} を生成しているルールまたはコードに、完全な宛先アドレスを指定した Location ヘッダーを追加してください。"
    - "リダイレクトが必要ない場合は、ページが 200 を返すようにしてください。"
redirects.https_to_http:
  title: "リダイレクトが https から http に戻っています"
  why: "{url} は、平文の {target} にリダイレクトしています。訪問者は途中で暗号化を失い、ブラウザーには「保護されていません」と表示されます。また、HSTS を公開しているサイトは、自分自身をブロックすることになります。"
  fix:
    - "このリダイレクトの宛先を、https:// の同等のアドレスに変更してください。"
    - "CMS のサイトアドレス設定を確認してください。https:// で始まる必要があります。"
  fix_by_provider:
    wordpress: "設定 > 一般 で、「WordPress アドレス (URL)」と「サイトアドレス (URL)」の両方が https:// で始まる必要があります。"
redirects.http_not_redirected:
  title: "http のバージョンが https にリダイレクトされていません"
  why: "{url} は、https://{domain} にリダイレクトせず、平文で配信されています。https を付けずにアドレスを入力した訪問者は、暗号化されていないページに留まり、ブラウザーによって「保護されていません」と表示されます。"
  fix:
    - "まだであれば、{domain} の証明書をインストールしてください（Let's Encrypt はほとんどのホスティング事業者で無料です）。"
    - "上で提案したルールを追加してください。http から https への 301 リダイレクトを1つだけにします。"
    - "CDN の背後にある場合は、CDN の「常に HTTPS を使用」オプションを有効にしてください。"
  fix_by_provider:
    wordpress: "設定 > 一般 で、サイトの2つのアドレスを https:// に変更し、その後、上の 301 ルールを .htaccess の先頭、「# BEGIN WordPress」ブロックの前に追加してください。"
redirects.hsts_missing:
  title: "https のページに HSTS がありません"
  why: "{domain} は HSTS を公開していません。そのため、https を付けずに訪問するたびに、ブラウザーはまず http を使い、そこで仲介者がリダイレクトを傍受または乗っ取る可能性があります。"
  fix:
    - "上で提案したヘッダーを、サイトの https 設定に追加してください。"
    - "すべてのサブドメインに証明書があるか確信がなければ、短い期間（max-age=300）から始め、その後 1年に延長してください。"
    - "{domain} のすべてのサブドメインが https で応答する場合にのみ includeSubDomains を追加してください。"
redirects.hsts_short:
  title: "HSTS の有効期間が短すぎます"
  why: "{domain} の HSTS ヘッダーは {value} しか有効ではありません。この期間に訪問がないと、ブラウザーはルールを忘れ、次の訪問では http を使います。"
  fix:
    - "サイトが https で安定したら、max-age を 31536000（1年）に設定してください。"
redirects.hsts_no_subdomains:
  title: "HSTS がサブドメインを対象にしていません"
  why: "HSTS は {domain} を保護しますが、そのサブドメインは保護しません。忘れられたサブドメインは、平文で到達可能なままです。これは任意ですが、ブラウザーのプリロードリストには必要です。"
  fix:
    - "{domain} のすべてのサブドメインが、有効な証明書で https 応答することを確認してください。"
    - "その場合は、上のようにヘッダーに includeSubDomains を追加してください。"
redirects.meta_refresh:
  title: "HTTP リダイレクトではなく、meta refresh によるリダイレクトが使われています"
  why: "{url} は最初にページを読み込み、その後 {value} 秒後に meta タグによって {target} に送ります。訪問者は不要なページをダウンロードします。Google はこの仕組みを理解しますが、サーバー側のリダイレクトを推奨しており、0 以外の遅延は一時的なものとして扱います。"
  fix:
    - "そのタグを、上で提案したサーバー側の 301 リダイレクトに置き換えてください。"
    - "その後、中間ページを削除してください。"
redirects.refresh_header:
  title: "3xx コードではなく、Refresh ヘッダーによるリダイレクトが使われています"
  why: "{url} は通常どおり応答した後、Refresh ヘッダーを使って {value} 秒後に {target} へ移動するようブラウザーに指示しています。これは標準的な HTTP リダイレクトではありません。301 コードを使ってください。"
  fix:
    - "Refresh ヘッダーを、上で提案したサーバー側の 301 リダイレクトに置き換えてください。"
redirects.js_redirect:
  title: "HTTP リダイレクトではなく、JavaScript によるリダイレクトが使われています"
  why: "{url} は、スクリプトによってのみ {target} に送ります。JavaScript がなければ（一部のクローラー、リンクのプレビュー、ブロッキングするブラウザー）リダイレクトは行われず、Google はページのレンダリングが成功した場合にのみこれを認識します。"
  fix:
    - "スクリプトを、上で提案したサーバー側の 301 リダイレクトに置き換えてください。"
    - "JavaScript しか使えない場合（ルールのない静的ホスティング）は、少なくとも即時の meta refresh と、{target} への目に見えるリンクを追加してください。"
redirects.js_seen:
  title: "ページ内のスクリプトが、別の場所に送る可能性があります"
  why: "{url} の HTML には、{target} へのアドレス変更が含まれています。ページには独自のコンテンツがあるため、check はこれをたどりませんでした。おそらく、操作や条件に依存しています。"
  fix:
    - "このリダイレクトを毎回の訪問で行う必要がある場合は、サーバー側の 301 で行ってください。"
redirects.canonical_missing:
  title: "最終ページが canonical アドレスを宣言していません"
  why: "{url} は canonical アドレスを宣言していません。同じページがパラメーター付きや別のアドレスでも応答する場合、Google はどのアドレスを表示するかを自分で選びます。"
  fix:
    - "上で提案したタグを <head> に追加し、ページの絶対アドレスを指定してください。"
  fix_by_provider:
    wordpress: "Yoast SEO と Rank Math は canonical タグを標準で追加します。これらのいずれかが有効で、このコンテンツの種類がそれらの設定でインデックスから除外されていないことを確認してください。"
redirects.canonical_mismatch:
  title: "canonical が、リダイレクトの到達先と一致していません"
  why: "リダイレクトは {url} に到達しますが、そのページは {target} を canonical として宣言しています。2つのシグナルが矛盾しています。Google はどちらかを選ぶ可能性があり、リダイレクトは canonical を直接指すべきでした。"
  fix:
    - "{target} が正しいアドレスであれば、リダイレクトを直接そこに到達させてください。"
    - "{url} が正しいアドレスであれば、上で提案したとおり canonical タグを修正してください。"
redirects.canonical_relative:
  title: "canonical が相対パスで書かれています"
  why: "そのページは {value} を canonical として宣言していますが、スキームもドメインも含まれていません。Google は絶対アドレスを推奨します。ほかのドメインにあるサイトのコピーは、そうでなければ同じ canonical を引き継いでしまいます。"
  fix:
    - "上で提案したように、完全なアドレスを書いてください。"
redirects.final_noindex:
  title: "最終ページがインデックスを禁止しています"
  why: "{url} は、検索結果に表示しないよう検索エンジンに求めています。リダイレクトの到達先がこのページであれば、これらのアドレスへの検索トラフィックはすべて失われます。"
  fix:
    - "ページが見つかるべき場合は、noindex を X-Robots-Tag ヘッダー（サーバーの設定）または meta robots タグ（CMS の SEO 設定）から削除してください。"
  fix_by_provider:
    wordpress: "設定 > 表示設定 で、「検索エンジンがこのサイトをインデックスしないように要求する」のチェックを外してください。Yoast SEO または Rank Math では、このコンテンツの種類のインデックス設定も確認してください。"
redirects.cert_invalid:
  title: "{domain} の証明書が無効です"
  why: "{domain} が提示した証明書は拒否されています：{value}。ブラウザーはセキュリティ警告の背後でページをブロックするため、訪問者がリダイレクトに到達することはありません。"
  fix:
    - "ホスティング事業者のパネルから {domain} の証明書を更新するか再インストールしてください（Let's Encrypt の場合は発行をやり直してください）。"
    - "その名前が対象になっていない場合は、{domain} を名前に含む証明書を発行してください（両方が応答する場合は www の有無の両方を含めます）。"
    - "チェーンが認識されない場合は、認証局が提供する中間証明書を、サイトの証明書と一緒にインストールしてください。"
redirects.cert_expiring:
  title: "{domain} の証明書がまもなく期限切れです"
  why: "{domain} の証明書は、あと {value} 日しか有効ではありません。期限までに更新されなければ、ブラウザーは警告の背後でサイトをブロックします。"
  fix:
    - "ホスティング事業者のパネルまたは certbot のタスクで、自動更新が有効であることを確認してください。"
    - "今すぐ手動で更新を実行し、測定をやり直してください。"
redirects.heavy_body:
  title: "最終ページの HTML が非常に重いです"
  why: "{url} の HTML 文書のサイズは {value} です。Googlebot が読むのは最初の 2 MB だけです。それ以降はインデックスに考慮されず、訪問者はダウンロードが完了するまで待ちます。"
  fix:
    - "大きなインラインデータ（base64 の画像、大きな JSON のブロック、埋め込みのスタイルとスクリプト）を HTML から外し、別ファイルに移してください。"
    - "非常に長いリストはページ分割してください。"
redirects.uncompressed:
  title: "最終ページが圧縮されていません"
  why: "{url} は、ブラウザーが受け入れられるにもかかわらず、{value} の圧縮されていないテキストを送っています。gzip または Brotli の圧縮によって、通常は容量が3分の1から5分の1になり、表示が速くなります。"
  fix:
    - "Apache：text/html、text/css、application/javascript、application/json に対して deflate（または brotli）モジュールを有効にしてください。"
    - "nginx：http ブロックに gzip on; と gzip_types text/css application/javascript application/json; を追加してください。"
redirects.slow:
  title: "連鎖が遅いです"
  why: "{url} に到達するまでに {value} ms かかり、そのうち {ttfb} ms は最終ページの最初のバイトを待つ時間です。訪問者は何かが表示されるまで待たされます。"
  fix:
    - "上のホップごとの詳細を確認してください。DNS や接続が大半を占める場合は、経由するホップとドメインの数を減らしてください。"
    - "最初のバイトまでの待ち時間が大半を占める場合は、CMS またはサーバーのページキャッシュ（LiteSpeed Cache、WP Rocket、nginx のキャッシュ）を有効にしてください。"
    - "変更の前後に、上で提案した curl コマンドを再実行してください。これは、あなたの端末から同じフェーズを測定します。"
redirects.variants_diverge:
  title: "サイトのバージョンが、同じアドレスに到達していません"
  why: "アドレスの入力方法によって、{domain} は {value} 種類の異なるページに到達します。Google は重複を見つけ、それらの間でリンクのシグナルを分散させ、訪問者は必ずしも同じバージョンにたどり着けません。"
  fix:
    - "基準となるアドレスを1つ選んでください。ここでは {final} です。"
    - "ほかのすべてのバージョンを、上で提案したルールによって、そのアドレスへの1つの 301 リダイレクトに向けてください。"
redirects.variant_extra_hops:
  title: "一部のバージョンが、複数のリダイレクトを経由しています"
  why: "{final} に到達する前に、これらのバージョンは複数のリダイレクトを連続して経由します（例：http、次に https、次に www）：{value}。ルールは1つで十分であり、回避できたホップごとに最初の訪問が速くなります。"
  fix:
    - "連続するルールを、上で提案した1つのルールに置き換えてください。これにより、すべてのバージョンが {target} に直接向かいます。"
redirects.variant_unreachable:
  title: "サイトのバージョンが応答しません"
  why: "{value} が応答しません。このアドレスの形式で入力する訪問者、または古いリンクをたどる訪問者は、リダイレクトされる代わりにエラーに行き着きます。"
  fix:
    - "その名前が DNS に存在しない場合は作成し（例：www から {domain} への CNAME）、その後 301 でリダイレクトしてください。"
    - "その名前は存在するが https で応答しない場合は、サイトの証明書にその名前を追加してください。"
redirects.language_redirect:
  title: "言語によるリダイレクトです。一時的であることは適切です"
  why: "{url} は、ブラウザーが通知する言語に応じて、{status} で {target} に送ります。これは内容の交渉です。恒久的なリダイレクトにすると、その言語が全訪問者と検索エンジンに固定されてしまいます。"
  fix:
    - "このコードは一時的なままにしてください。検索エンジン向けには、リダイレクトではなく hreflang のリンクで言語版を宣言してください。"
