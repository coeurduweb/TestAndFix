attachments.dangerous_extension:
  title: "添付ファイルの種類が、Gmail によりブロックされています"
  why: "ファイル {value} は、セキュリティ上の理由から Gmail が受け付けない種類です。このメッセージは Gmail に拒否され、ほかのほとんどのメールサービスでも拒否される可能性が非常に高いです。"
  fix:
    - "添付ファイルを削除してください。"
    - "ファイルを {domain} のダウンロード領域または共有サービスに置き、リンクをメッセージに記載してください。"
    - "ブロックを回避するために拡張子を変更しないでください。Gmail はアーカイブの中身も検査します。"
attachments.archive_with_dangerous:
  title: "添付アーカイブに、ブロック対象の種類のファイルが含まれています"
  why: "添付アーカイブには {value} が含まれています。これは禁止されたファイル種類です。Gmail はアーカイブを開き、中に含まれる禁止種類をブロックするため、メッセージは拒否されます。"
  fix:
    - "アーカイブをメッセージから削除してください。"
    - "{domain} のダウンロードリンクで、ファイルを共有してください。"
attachments.encrypted_archive:
  title: "添付アーカイブが、パスワードで保護されています"
  why: "アーカイブ {value} は暗号化されているため、どのフィルターも中身を検査できません。Gmail は、ほかのアーカイブを含むパスワード保護アーカイブを拒否し、ほかのフィルターはこれらを不審なものとして扱います。"
  fix:
    - "暗号化アーカイブを使わずに送ってください。種類が許可されていれば、通常の添付ファイルとして送れます。"
    - "機密文書は、認証付きの安全な保管場所に置き、そのリンクだけを送ってください。"
attachments.double_extension:
  title: "添付ファイルの拡張子が二重になっています"
  why: "ファイル {value} は文書に見せかけていますが、実際の拡張子は末尾のものです。これはプログラムを開かせる最も典型的な手口であり、フィルターはこれをブロックします。"
  fix:
    - "ファイル名を、実際の形式に対応する拡張子1つだけにしてください。"
    - "実際にはプログラムであるファイルは、メールで送らないでください。ダウンロードリンクを使ってください。"
attachments.filename_bidi_override:
  title: "添付ファイル名に、表示の向きを逆転させる文字が含まれています"
  why: "ファイル名に、拡張子を逆向きに表示させる不可視の文字が含まれています。プログラムを文書のように見せかける手口であり、悪意のあるものとして扱われます。"
  fix:
    - "ファイル名は、コピーせずにキーボードで入力し直してください。"
    - "送信する前に、ファイルの実際の種類を確認してください。"
attachments.office_macro:
  title: "添付の Office 文書に、マクロが含まれています"
  why: "ファイル {value} にはマクロが含まれています。マクロは悪意のあるソフトウェアの主要な経路です。Gmail は悪意があると判断したマクロをブロックし、Office は、インターネットから受け取ったファイルのマクロを既定で無効にします。"
  fix:
    - "マクロなしで文書を保存してください：ファイル > 名前を付けて保存、形式は .docx、.xlsx、または .pptx。"
    - "受信者が文書を編集する必要がなければ、PDF にして送ってください。"
attachments.html_attachment:
  title: "HTML ページが、メッセージに添付されています"
  why: "ファイル {value} は、ブラウザーで Web ページとして開きます。この形式は主に偽のフォームによるフィッシングに使われるため、フィルターは強く警戒します。"
  fix:
    - "内容をメッセージ本文に入れるか、{domain} のページに公開して、そのリンクを送ってください。"
    - "保存しておく必要がある文書であれば、PDF にして送ってください。"
attachments.pdf_active_content:
  title: "添付の PDF に、コードや自動実行される動作が含まれています"
  why: "PDF {value} には、JavaScript、開いたときに実行される動作、または隠しファイルが含まれています。通常の文書にはこれらは必要ないため、フィルターは潜在的に悪意のあるものとして扱います。"
  fix:
    - "動的なフォームを使わず、元の文書から標準の書き出しオプションで PDF を作り直してください。"
    - "または PDF に印刷し直してください（「Microsoft Print to PDF」または「PDF として保存」）。コードと埋め込みファイルは消えます。"
attachments.pdf_with_links:
  title: "メッセージのリンクが、添付の PDF の中に隠されています"
  why: "メッセージは短く、リンクは PDF {value} の中にあります。リンクを添付ファイルに入れるのは、リンク検査を回避する既知の方法です。一部のフィルターはこれを考慮します。"
  fix:
    - "重要なリンクは、{domain} のアドレスでメッセージ本文に記載してください。"
    - "文書の内容を説明する文を数行加えてください。"
attachments.too_large:
  title: "メッセージが大きすぎて、一部のメールサービスでは受信できません"
  why: "エンコード後の添付ファイルを含めたメッセージのサイズは {value} です。Google は個人の Gmail アカウントの添付ファイル上限を 25 MB としています。Orange は 1 メッセージあたり最大 45 MB までしか受け付けません。これを超えると、メッセージが拒否される可能性があります。"
  fix:
    - "重いファイルは添付せず、代わりにダウンロードリンクを記載してください。"
    - "PDF は「Web」または「画面」品質で書き出し直し、写真のサイズを小さくしてください。"
    - "送信用のエンコードで、サイズはおよそ3分の1増えることに注意してください。"
  fix_by_provider:
    google_workspace: "作成画面の Google ドライブ ボタンで、添付ファイルとしてではなく重いファイルを挿入してください。"
    microsoft_365: "Outlook では、OneDrive からファイルを添付し、「コピーを添付」ではなく「リンクの共有」を選んでください。"
attachments.large:
  title: "添付ファイルのサイズが大きいです"
  why: "添付ファイルのサイズは {value} です。メッセージは送れますが、受信者のボックスを圧迫し、モバイルではダウンロードに時間がかかります。一斉送信では、送られるデータの総量が大きくなります。"
  fix:
    - "添付する前に、文書を圧縮し、画像のサイズを小さくしてください。"
    - "複数の受信者へ送る場合は、ダウンロードリンクを使うことをお勧めします。"
attachments.type_mismatch:
  title: "添付ファイルの実際の形式が、ファイル名と一致していません"
  why: "ファイル {value} の拡張子が、実際の内容と一致していません。フィルターはファイルのシグネチャを確認し、この不一致を偽装の試みとして扱います。"
  fix:
    - "ファイルを作成したアプリケーションで開き、表示どおりの形式で保存し直してください。"
    - "添付する時に、お使いのアプリケーションがファイル名を変更していないか確認してください。"
attachments.no_filename:
  title: "添付ファイルに、ファイル名がありません"
  why: "受信者には「noname」や「ATT00001」と表示され、どう開けばよいかわかりません。ファイル名のない添付ファイルは、手作業で作られたメッセージの兆候にもなります。"
  fix:
    - "コード内で、添付ファイルごとにわかりやすい名前を付けてください。例：invoice-2026-11.pdf"
    - "送信ライブラリに Content-Disposition を書き出させてください。ファイル名パラメーターにアクセント付き文字が含まれる場合は、RFC 2231 に従ってエンコードされます。"
attachments.winmail_dat:
  title: "メッセージに winmail.dat ファイルが含まれています"
  why: "Outlook が TNEF 形式でメッセージを送りました。Microsoft 製品以外では、受信者には読めない winmail.dat ファイルしか見えず、本来の添付ファイルはその中に入っています。"
  fix:
    - "Outlook で「ファイル > オプション > メール > メッセージの作成」を開き、「リッチテキスト」の代わりに「HTML」を選んでください。"
    - "特定の連絡先のプロパティで、その連絡先にリッチテキストを設定しないでください。"
  fix_by_provider:
    microsoft_365: "Exchange Online PowerShell で、外部向けの TNEF を無効にしてください：Set-RemoteDomain Default -TNEFEnabled $false"
attachments.attachment_without_body:
  title: "添付ファイルが、本文なしで送られています"
  why: "メッセージには添付ファイルが1つだけあり、本文はほとんどありません。これは偽の請求書など、罠を仕込んだメッセージに典型的な形式です。フィルターも受信者も、このようなメッセージを疑います。"
  fix:
    - "数文を加えてください：自分が誰か、ファイルの内容、送る理由。"
    - "会社名と連絡手段を含む署名を追加してください。"
