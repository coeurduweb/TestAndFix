headers.message_id_missing:
  title: "メールに Message-ID ヘッダーがありません"
  why: "Gmail は、すべてのメールに有効な Message-ID を要求します。これがないと、メールはスクリプトで作られた送信のように見え、受信者側でスレッドを再構成できません。"
  fix:
    - "ヘッダーをコードで手作業で組み立てず、送信サーバーに Message-ID を追加させてください。"
    - "スクリプトが自分でヘッダーを書いている場合は、<一意の識別子@{domain}> の形式で Message-ID の行を追加してください。"
    - "テストを送信し、そのヘッダーが 1 回だけ表示されることを確認してください。"
  fix_by_provider:
    wordpress: "SMTP 認証付きで送信し、WP Mail SMTP や FluentSMTP などの拡張機能を使ってください。すると PHPMailer が Message-ID を生成します。wp_mail() の $headers 配列には、空の Message-ID を追加しないでください。"
    postfix: "Postfix は、ローカルから投入されたメールに不足している Message-ID を追加します。ネットワークから中継されたメールについては、main.cf に always_add_missing_headers = yes を追加してから、postfix reload を実行してください。"
headers.message_id_malformed:
  title: "Message-ID が <識別子@ドメイン> の構文に従っていません"
  why: "形式の誤った Message-ID は、ヘッダーが手で書かれたことの兆候です。一部のフィルターはこれをスパムの手がかりとして数えます。また、返信が正しいスレッドに結び付かないおそれがあります。"
  fix:
    - "Message-ID は山かっこ < > で囲み、左側に一意の識別子、@、右側にドメイン名を書いてください。"
    - "識別子にスペースやアクセント文字を含めないでください。"
    - "最も簡単な方法は、コードからその行を削除し、送信サーバーに生成させることです。"
headers.message_id_localhost:
  title: "Message-ID が localhost または完全修飾されていない名前で終わっています"
  why: "@localhost で終わる Message-ID は、メールを作ったサーバーが自分自身の名前を知らないことを示します。スクリプトや誤って設定されたサーバーによく見られる兆候です。"
  fix:
    - "送信サーバーに完全な名前（例：mail.{domain}）を与え、DNS で解決できるようにしてください。"
    - "コードでは、Message-ID の右側を、マシン名ではなく {domain} を使って組み立ててください。"
  fix_by_provider:
    postfix: "main.cf で myhostname = mail.{domain} と mydomain = {domain} を設定してから、postfix reload を実行してください。"
    wordpress: "PHPMailer の Message-ID は Web サーバーの名前を使います。$phpmailer->Hostname = '{domain}' を設定する phpmailer_init フィルターを追加するか、SMTP 拡張機能を使ってください。"
headers.date_missing:
  title: "Date ヘッダーがありません"
  why: "Date は、すべてのメールに必須の 2 つのヘッダーのうちの 1 つです。これがないと、メールは RFC 5322 に準拠しません。Gmail と Yahoo はこの規格への準拠を求めており、受信箱で誤って分類されます。"
  fix:
    - "Date ヘッダーは自分で書かず、送信サーバーに追加させてください。"
    - "コードで生成する場合は、+hhmm 形式のタイムゾーンを含む RFC 5322 の形式を使ってください。"
  fix_by_provider:
    postfix: "別のマシンから Date のないメールが届く場合は、main.cf に always_add_missing_headers = yes を追加してから、postfix reload を実行してください。"
    wordpress: "SMTP 拡張機能を使ってください。PHPMailer は Date ヘッダーを追加します。wp_mail のフィルターでそれを削除しないでください。"
headers.date_future:
  title: "メールの日付が未来になっています"
  why: "未来の日付は、メールを数時間にわたって受信箱の先頭に置きます。フィルターはこの手口を知っており、減点対象にします。テストで測定したずれは {value} です。"
  fix:
    - "メールを生成するサーバーの時計を、NTP（chrony または systemd-timesyncd）で同期してください。"
    - "アプリケーションで宣言しているタイムゾーンを確認してください。現地時間の後に +0000 を付けると、このずれが生じます。"
headers.date_too_old:
  title: "メールの日付が非常に古くなっています"
  why: "メールの日付は、受信時点より {value} 前になっています。受信者の受信箱の下に埋もれて表示されます。フィルターは、これを再送されたメールや、詰まったキューの結果と見なすことがよくあります。"
  fix:
    - "Date ヘッダーが、下書きやテンプレートを作成した時点ではなく、送信時点で計算されていることを確認してください。"
    - "NTP でサーバーの時計を同期してください。"
    - "メールが長時間キューに残る場合は、送信サーバーのログで原因を探してください。"
headers.date_malformed:
  title: "Date ヘッダーが標準の形式ではありません"
  why: "読み取れない日付は、受信時刻に置き換えられるか、誤って解釈されます。フィルターは、この形式の誤りを、手作りの送信ツールの兆候として数えます。"
  fix:
    - "日付は次の形式で書いてください。英語の曜日の省略形、カンマ、日、英語の月の省略形、年、時刻、+hhmm 形式のタイムゾーンです。"
    - "月をフランス語で書いたり、CEST のような文字のタイムゾーンを使ったりしないでください。"
    - "PHP では、独自の形式ではなく date('r') または DateTime::RFC2822 を使ってください。"
headers.date_timezone_inconsistent:
  title: "Date のタイムゾーンが、実際の送信時刻と一致しません"
  why: "Date に書かれた時刻と、最初のサーバーが記録した時刻が {value} ずれています。受信者は誤った時刻を見ることになり、このずれはフィルターに知られた兆候です。"
  fix:
    - "+0000 を強制するのではなく、アプリケーションのタイムゾーン（例：Europe/Paris）を設定してください。"
    - "PHP では、php.ini で date.timezone を設定するか、ヘッダーを生成する前に date_default_timezone_set('Europe/Paris') を呼び出してください。"
headers.from_missing:
  title: "メールに送信者（From）がありません"
  why: "From は必須です。これがないと、DMARC は検証するドメインを持ちません。ほとんどの大手 Web メールは、メールを拒否するか、直接迷惑メールに分類します。"
  fix:
    - "From ヘッダーに、お客様のドメインのアドレス（例：contact@{domain}）を追加してください。"
    - "メール配信ツールでは、キャンペーンまたはフォームの「送信者」または「送信元アドレス」の項目に入力してください。"
  fix_by_provider:
    wordpress: "WP Mail SMTP または FluentSMTP で、From Email に {domain} のアドレスを入力し、すべての送信でそのアドレスを強制するオプションにチェックを入れてください。"
headers.from_multiple:
  title: "From ヘッダーに複数のアドレスがあるか、複数回現れています"
  why: "Google は From に 1 つのアドレスだけを求めています。複数のアドレスがあると、DMARC はどのドメインを検証すべきか判断できず、メールは拒否されることがよくあります。"
  fix:
    - "From には {domain} のアドレスを 1 つだけ残してください。"
    - "ほかのアドレスは、返信を受け取る必要がある場合は Reply-To または Cc に入れてください。"
    - "コードが、送信ライブラリーが既に追加している 2 つ目の From を追加していないか確認してください。"
headers.from_no_display_name:
  title: "送信者に表示名がありません"
  why: "受信者には、生のアドレスしか見えません。モバイルでは途中で切れることもあります。認識しやすい送信者は、スパムとして報告される頻度が低くなります。"
  fix:
    - "アドレスの前に表示名を追加してください。会社名、またはメールを書く人の名前です。"
    - "名前にカンマ、ピリオド、アクセント付きの文字が含まれる場合は、まっすぐな二重引用符で囲んでください。"
  fix_by_provider:
    mailchimp: "キャンペーンで From をクリックし、Name に会社名を入力してください。"
    wordpress: "WP Mail SMTP で From Name を入力し、Force From Name にチェックを入れてください。"
headers.from_display_name_has_address:
  title: "表示名に、実際の送信者とは別のメールアドレスが含まれています"
  why: "表示名には {value} と表示されていますが、実際のアドレスは {domain} にあります。これは最も一般的ななりすましの手口です。フィッシング対策のフィルターは、これを厳しく罰します。"
  fix:
    - "表示名を、アドレスを含まない名前に置き換えてください。会社名、またはメールを書く人の名前です。"
    - "返信を別のアドレスに届けたい場合は、表示名ではなく Reply-To を使ってください。"
headers.from_display_name_brand_spoof:
  title: "表示名に、お客様のものではない既知のブランド名が含まれています"
  why: "表示名には {value} と書かれていますが、メールは {domain} から送られています。フィッシング対策のフィルターは、この名前を実際のドメインと比べ、このタイプのメールをなりすましの試みとして分類します。"
  fix:
    - "表示名には、お客様自身の会社名を使ってください。"
    - "そのブランドの代わりにメールを送信する場合は、そのブランドのドメインから、そのブランドが設定した SPF、DKIM、DMARC を使って送信してください。"
headers.reply_to_other_domain:
  title: "返信が、送信者とは別のドメインに届くようになっています"
  why: "メールは {domain} から送られていますが、返信は {value} に届きます。この構成はフィッシングでよく見られます。一部のフィルターはこれを減点します。特に返信先のドメインが新しい場合は、その傾向が強くなります。"
  fix:
    - "意図したものでなければ、Reply-To を削除するか、{domain} のアドレスを設定してください。"
    - "意図したもの（外部委託したカスタマーサービスなど）であれば、{domain} にアドレスを作成し、そのサービスに転送してください。"
  fix_by_provider:
    mailchimp: "キャンペーンの From の項目で、表示されているアドレスを確認してください。Mailchimp は、これを返信先アドレスとしても使います。"
    wordpress: "フォームの拡張機能（Contact Form 7、WPForms、Gravity Forms）の Reply-To 欄を確認してください。訪問者のアドレスがここに入ることが多く、社内向けの通知であれば正常です。"
headers.reply_to_freemail:
  title: "返信が無料のメールサービスに届くようになっています"
  why: "メールは {domain} から送られていますが、{value} のアドレスに返信するよう求めています。これは偽の取引先を装った詐欺の典型的な手口です。フィルターはこれを検出し、厳しく罰します。"
  fix:
    - "{domain} に返信用アドレスを作成し、それを Reply-To に使ってください。"
    - "メールを無料サービスで受け取っている場合は、{domain} のアドレスを無料アドレスに転送し、無料アドレスを公開しないようにしてください。"
headers.sender_inconsistent:
  title: "Sender ヘッダーが From とは別のドメインを示しています"
  why: "Outlook には「{value} の代理：{domain}」と表示されます。受信者が不安を感じ、スパムとして報告される件数が増えます。"
  fix:
    - "実際の送信者が {domain} である場合は、Sender ヘッダーを削除してください。"
    - "送信ツールがこのヘッダーを追加する場合は、{domain} を認証済みの送信ドメインとして設定してください。ほとんどのツールは、その場合 Sender を削除します。"
headers.return_path_other_domain:
  title: "戻りアドレス（Return-Path）が別のドメインにあります"
  why: "バウンスは {envelope_domain} に届き、{domain} には届きません。送信ツールを使う場合はこれが普通ですが、そのため SPF を {domain} に揃えることはできません。DMARC を検証できるのは DKIM だけになります。"
  fix:
    - "送信ツールで、カスタムの戻りドメイン（Return-Path、bounce domain、MAIL FROM と呼ばれることが多い）を、{domain} のサブドメインに設定してください。"
    - "そのサブドメインについて、ツールが示す CNAME または MX のレコードを公開してください。"
  fix_by_provider:
    sendgrid: "Settings > Sender Authentication > Authenticate Your Domain の順に進んでください。ウィザードが {domain} 上に戻りドメインを作成します。"
    amazon_ses: "SES コンソールで、アイデンティティ {domain} > Custom MAIL FROM domain の順に進み、サブドメインを選択してから、表示された MX と SPF の TXT を公開してください。"
    mailgun: "Mailgun に登録する送信ドメインは、{domain} のサブドメインである必要があります（例：mg.{domain}）。そのドメインが Return-Path として使われます。"
headers.to_missing:
  title: "メールに表示される宛先（To）がありません"
  why: "To がないと、メールはリストへの Bcc で送られたように見えます。フィルターにとって、これは依頼されていない大量送信の典型的な兆候です。"
  fix:
    - "受信者ごとに 1 通ずつ、その人のアドレスを To に入れて送信してください。"
    - "リストの場合は、Bcc ではなく、連絡先ごとに To を個別に設定する配信ツールを使ってください。"
headers.to_undisclosed:
  title: "表示される宛先が「undisclosed-recipients」です"
  why: "このラベルは、Bcc による一括送信であることを示します。フィルターはこれをパーソナライズされていない大量送信として扱い、迷惑メールに分類することがよくあります。"
  fix:
    - "まとめて送るために、連絡先を Bcc に入れないでください。各メールを 1 人の受信者に宛てて送る、ニュースレター用の配信ツールを使ってください。"
    - "数人だけの場合は、お使いのメールソフトの差し込み（結合）機能を使ってください。"
headers.subject_missing:
  title: "メールに件名がありません"
  why: "件名のないメールは開かれることがほとんどなく、スパムとして報告されることがよくあります。本文が空の場合と組み合わさると、この機能が有効な Microsoft のフィルターは、高い確信度でスパムに分類します。"
  fix:
    - "メールの内容を数語でまとめた件名を追加してください。"
    - "テンプレートまたはフォームが、件名の変数を実際に入力しているか確認してください。"
headers.subject_empty:
  title: "件名が空です"
  why: "Subject ヘッダーはありますが、中身がありません。ほとんどの場合、入力されなかったテンプレートの変数が原因で、受信者には「（件名なし）」と表示されます。"
  fix:
    - "件名を埋めているテンプレートまたはコードの変数を確認してください。"
    - "変数が空の場合に備えて、既定の件名を用意してください。"
headers.subject_all_caps:
  title: "件名がすべて大文字で書かれています"
  why: "すべて大文字の件名は攻撃的に受け取られ、従来のスパムフィルターの基準の 1 つになっています。また、受信者によるスパム報告も増えます。"
  fix:
    - "件名は小文字で書き直し、文頭と固有名詞だけを大文字にしてください。"
    - "特定の単語を強調する場合は、大文字で書くのではなく、件名の先頭に置いてください。"
headers.subject_emoji_excess:
  title: "件名に絵文字が多すぎます"
  why: "件名には {value} 個の絵文字があります。1 つか 2 つを超えると、メールが攻撃的なプロモーションのように見え、一部のクライアントでは正しく表示されません。"
  fix:
    - "意味がある場合に限り、件名の先頭または末尾に絵文字を 1 つだけ残してください。"
    - "絵文字が表示されなくても、件名の意味が通じることを確認してください。"
headers.subject_encoding_broken:
  title: "件名のアクセント文字が正しくエンコードされていません"
  why: "件名のアクセント文字が RFC 2047 に従ってエンコードされていません。受信者には「Ã©」のような余計な文字が見えるおそれがあり、フィルターはこの形式の誤りをお客様に不利に数えます。"
  fix:
    - "件名は UTF-8 の文字列として送信ライブラリーに渡し、エンコードはライブラリーに任せてください。"
    - "PHP の mail() を使う場合は、mb_encode_mimeheader($sujet, 'UTF-8', 'B') でエンコードするか、より良いのは PHPMailer に移行することです。"
    - "エンコードされた単語を、マルチバイト文字の途中で分割しないでください。"
headers.subject_fake_reply:
  title: "件名が、実際の返信ではないのに RE: または TR: で始まっています"
  why: "既存の会話を装うのは、フィッシングとして知られた手口です。フィルターは In-Reply-To と References の有無を確認し、この偽装を罰します。"
  fix:
    - "最初のメールの件名から RE:、TR:、FWD: を削除してください。"
    - "実際の返信の場合は、メールソフトの「返信」機能を使ってください。これで In-Reply-To と References が追加されます。"
headers.x_mailer_phpmailer:
  title: "ヘッダーから、PHP スクリプトによる送信であることが分かります"
  why: "X-Mailer ヘッダーの {value} は、メールが PHP スクリプトから直接送られたことを示しています。ハッキングされた PHP スクリプトは、スパムの主要な供給源になっています。一部のフィルターは、この手がかりだけで減点します。"
  fix:
    - "mail() 関数ではなく、認証付き SMTP で実際のメールサーバーから送信してください。"
    - "PHPMailer の X-Mailer ヘッダーは、空白 1 文字の値を設定して隠してください。"
    - "php.ini で mail.add_x_header を無効にし、X-PHP-Originating-Script を削除してください。"
  fix_by_provider:
    wordpress: "独自の拡張機能に次を追加してください：add_action('phpmailer_init', function($m){ $m->XMailer = ' '; }); そのうえで、認証付き SMTP で送信するよう WP Mail SMTP または FluentSMTP を設定してください。"
    cpanel: "MultiPHP INI Editor で、そのドメインの mail.add_x_header を Off に設定してください。"
headers.x_mailer_bulk_tool:
  title: "メールが、スパムと関連付けられたソフトウェアで送信されています"
  why: "X-Mailer ヘッダーには {value} と書かれています。スパム送信者がよく使う大量送信ソフトウェアです。フィルターはその署名を認識し、そのソフトウェアが作るすべてのメールを減点します。"
  fix:
    - "認証、配信停止、バウンスを処理する、信頼された配信プラットフォームを使ってください。"
    - "このソフトウェアを使い続ける場合は、その設定で X-Mailer ヘッダーを削除してください。ただし、その署名はメールの他の部分にも残り、判別できる状態のままであることに注意してください。"
headers.duplicate_single_instance:
  title: "1 回だけ現れるべきヘッダーが、複数回現れています"
  why: "ヘッダー {value} が複数回現れています。Gmail は、これらのヘッダーが 1 回だけ現れることを求めています。重複があるとメールは規格に適合せず、拒否の原因になることがあります。"
  fix:
    - "コードまたは拡張機能の中で、{value} が 2 回目に追加されている箇所を探してください。"
    - "中継サーバーが、すでにあるヘッダーを追加している場合は、アプリケーションからそれを削除し、中継サーバーに任せてください。"
headers.received_too_many:
  title: "メールが、通常より多くのサーバーを経由しています"
  why: "メールには {value} 個の Received ヘッダーがあります。これほど長い経路は、リダイレクトのループや誤って設定された中継を示すことがよくあります。最終的には、サーバーがメールを拒否します。"
  fix:
    - "Received ヘッダーのサーバーを下から上に並べ、同じものが繰り返されていないか確認してください。"
    - "メールボックス間またはドメイン間で連続するリダイレクトを削除し、メールを送信サーバーから直接送ってください。"
  fix_by_provider:
    postfix: "Postfix は hopcount_limit を超えると拒否します（値は postconf hopcount_limit で確認できます）。この上限を上げるのではなく、ループを探してください。"
headers.precedence_bulk:
  title: "Precedence ヘッダーが、メールを大量送信として分類しています"
  why: "Precedence: {value} は、大量送信であることを示します。請求書やパスワードのような取引メールに付くと、メールはプロモーションタブや迷惑メールフォルダーへ移されます。"
  fix:
    - "取引メールからは Precedence を削除してください。"
    - "自動返信を防ぐには、代わりに RFC 3834 で定義された Auto-Submitted: auto-generated を使ってください。"
headers.mime_version_missing:
  title: "MIME-Version ヘッダーがありません"
  why: "MIME-Version がないと、クライアントは HTML の部分、添付ファイル、アクセント文字のエンコードを無視することがあります。フィルターは、これを送信ライブラリーを使わずに作られたメールと見なします。"
  fix:
    - "ヘッダーに MIME-Version: 1.0 の行を追加してください。"
    - "より良いのは、MIME ヘッダーを正しく組み立てる送信ライブラリーを使うことです（PHPMailer、Symfony Mailer、Nodemailer、Python の email ライブラリーなど）。"
headers.charset_missing:
  title: "文字セットが宣言されていません"
  why: "テキストにアクセント文字がありますが、文字セットが指定されていません。クライアントは ASCII だと推測し、アクセント付きの文字の代わりに余計な文字を表示します。"
  fix:
    - "テキストの各パートの Content-Type に文字セットを宣言してください：charset=UTF-8。"
    - "HTML の部分では、head に <meta charset='utf-8'> も追加してください。"
headers.charset_mismatch:
  title: "宣言された文字セットが、テキストと一致しません"
  why: "このパートは {value} と宣言されていますが、そのバイト列は別のエンコードになっています。アクセント文字が正しく表示されず、コンテンツのフィルターは歪んだテキストを読むことになります。"
  fix:
    - "テンプレートを UTF-8 で保存し、charset=UTF-8 を宣言してください。"
    - "データベースが latin1 の場合は、メールに挿入する前にテキストを UTF-8 に変換してください。"
headers.line_too_long:
  title: "メールの 1 行が 998 文字を超えています"
  why: "最も長い行は {value} 文字です。998 文字を超えると、サーバーが行を任意の場所で切ることがあり、それにより HTML が壊れたり、DKIM 署名が無効になったり、メールが拒否されたりするおそれがあります。"
  fix:
    - "HTML の部分を quoted-printable または base64 でエンコードしてください。どちらのエンコードも短い行になります。"
    - "または、送信前に HTML のタグの間へ改行を挿入してください。"
  fix_by_provider:
    wordpress: "SMTP の拡張機能を使ってください。PHPMailer は、行が長すぎる場合に自動的に quoted-printable を選びます。"
headers.8bit_without_8bitmime:
  title: "8 ビットのコンテンツが、サーバーに通知されずに送信されています"
  why: "メールには 8 ビットのバイトが含まれていますが、送信サーバーがそれを宣言していません（BODY=8BITMIME）。厳格な中継はメールを拒否したり、アクセント文字を壊したりすることがあります。"
  fix:
    - "テキストの部分を quoted-printable または base64 でエンコードしてください。メールは 7 ビットになり、どこでも通ります。"
    - "または、8 ビットを送信する場合に、送信サーバーが BODY=8BITMIME を通知していることを確認してください。"
  fix_by_provider:
    postfix: "リモートサーバーが 8BITMIME を通知しない場合、Postfix は 7 ビットに変換します（disable_mime_output_conversion = no が既定値です）。この設定が変更されていないか確認してください。"
headers.cte_inconsistent:
  title: "宣言された転送エンコードが、コンテンツと一致しません"
  why: "{value} と宣言されたパートに、そのエンコードの規則に従わないデータが含まれています。クライアントは判読できないテキストを表示することがあり、フィルターは組み立てが誤ったメールと見なします。"
  fix:
    - "Content-Transfer-Encoding は強制せず、送信ライブラリーに選ばせてください。"
    - "パートにアクセント文字が含まれる場合は、quoted-printable または base64 を宣言し、実際にコンテンツをエンコードしてください。"
    - "multipart のパートに base64 や quoted-printable を宣言しないでください。"
headers.raw_8bit_in_headers:
  title: "ヘッダーに、エンコードされていないアクセント文字が含まれています"
  why: "ヘッダー {value} に、ASCII 以外の生のバイトが含まれています。クライアントはそれを予測できない形で表示し、一部のサーバーはメールを拒否します。"
  fix:
    - "表示名やアクセント付きの件名は、UTF-8 の文字列として送信ライブラリーに渡してください。ライブラリーがエンコードします。"
    - "添付ファイルの名前については、RFC 2231 のエンコードをライブラリーに適用させてください。"
headers.headers_oversized:
  title: "メールのヘッダーが非常に大きくなっています"
  why: "ヘッダーのサイズは {value} です。Google は、極端に大きなヘッダーを避けるよう求めています。大きなヘッダーは、追跡用のヘッダーが積み重なっていること、または中継のループを示すことがよくあります。"
  fix:
    - "ツールが追加する X- ヘッダーを一覧にし、使われていないものを削除してください。"
    - "中継のたびに繰り返し付加されているヘッダーがないか確認してください。"
headers.bcc_visible:
  title: "Bcc ヘッダーが受信者に見えています"
  why: "Bcc のアドレスが、受信したメールに含まれてしまっています。すべての受信者にこれらのアドレスが公開されるため、プライバシーの問題になり、手作りの送信のように見えます。"
  fix:
    - "Bcc ヘッダーを手で組み立てないでください。非表示の受信者は送信ライブラリーに渡し、SMTP のエンベロープにだけ入れさせてください。"
    - "一括送信の場合は、受信者ごとに 1 通ずつ送るツールを使ってください。"
