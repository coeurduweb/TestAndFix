mx.domain_nxdomain:
  title: "送信元ドメイン {domain} が存在しません"
  why: "DNS は {domain} が存在しないと応答しています。受信者は送信者を確認することも、返信することもできません。ほとんどの受信側はメッセージを拒否し、ほかはスパムに分類します。"
  fix:
    - "メールソフトやメール送信サービスに設定した送信元アドレスのドメイン名のつづりを確認してください。"
    - "ドメインが正しい場合は、レジストラーで有効期限が切れていないこと、ネームサーバー（NS）が正しく登録されていることを確認してください。"
    - "ドメインが名前解決されたら、少なくとも MX、SPF、DMARC を公開してください。"
mx.missing:
  title: "ドメイン {domain} に MX レコードがありません"
  why: "MX がないと、{domain} 宛ての返信や未達通知は、ドメインの Web サーバーに送られます。Web サーバーは通常これを受け付けません。また、受信可能なメールがないドメインの送信者を減点するフィルターもあります。"
  fix:
    - "{domain} がメールを受信する必要がある場合は、メールサービス事業者が提供する MX を追加してください。"
    - "{domain} が決して受信しない場合は、Null MX（0 .）を公開し、Reply-To と、受信可能なドメイン上の Return-Path を持つアドレスでメッセージを送信してください。"
  fix_by_provider:
    google_workspace: "Google 管理コンソールで MX 設定ウィザードに従い、ドメインに提示された値を正確にコピーしてください。"
    microsoft_365: "Microsoft 365 管理センターで、設定 > ドメイン の順に進み、{domain} を選んで、DNS レコードのタブに表示された MX レコードを追加してください。"
    cloudflare_dns: "DNS > Records で、種類 MX のレコードを追加してください：名前 @、メールサーバーと優先度はメールサービス事業者が提供する値を使用します。"
mx.cname_target:
  title: "{domain} の MX が CNAME のエイリアスを指しています"
  why: "MX の宛先は、A レコードを直接持つ名前でなければなりません。CNAME を使うと、一部のサーバーは配送や検証を拒否することがあり、{domain} 宛てのメッセージが失われる恐れがあります。"
  fix:
    - "CNAME の最終的な宛先（A レコードを持つ名前）を特定してください。"
    - "MX のエイリアス名を、その最終的な名前に置き換えるか、CNAME の代わりにその名前の A レコードを作成してください。"
    - "優先度は同じにし、古い MX を削除してください。"
mx.ip_literal:
  title: "{domain} の MX が、名前ではなく IP アドレスを含んでいます"
  why: "MX に IP アドレスを入れることはできません。その値は存在しない名前として扱われます。{domain} 宛てのメールは失敗するか、次の MX に回され、送信元ドメインの検証も失敗します。"
  fix:
    - "サーバー用の名前（例：mx.{domain}）を作成し、対象の IP アドレスへの A レコードを設定してください。"
    - "MX レコードの IP アドレスを、この名前に置き換えてください。"
mx.target_nxdomain:
  title: "{domain} の MX が、存在しない名前を指しています"
  why: "{domain} の MX に記載されたサーバーには、アドレスがありません。このドメインへはメッセージが一切配送できなくなり、一部の受信者は送信元アドレスが無効に見えるため、送信を拒否します。"
  fix:
    - "公開されている MX を、現在のメールサービス事業者が示す値と比較してください。移行時に変わることがあります。"
    - "誤った名前を修正するか、対象サーバーの欠けている A レコードを作成してください。"
    - "もう存在しない旧事業者の MX を削除してください。"
mx.private_address:
  title: "{domain} の MX が、プライベートアドレスを指しています"
  why: "{domain} のメールサーバーが、インターネットから到達できない内部アドレスで公表されています。このドメイン宛てのメッセージはキューに残り、その後エラーとして戻ります。"
  fix:
    - "MX の A レコードで、内部アドレスを公開サーバーのアドレスに置き換えてください。"
    - "このプライベートアドレスが内部 DNS 用の場合は、内部ビューと公開ゾーンを分けてください。"
mx.unreachable:
  title: "{domain} のどの MX サーバーも、ポート 25 で応答しません"
  why: "{domain} の受信サーバーが応答していません。このドメイン宛ての返信や未達通知は蓄積された後にエラーとして戻り、一部の受信者がアドレスを逆確認する処理も失敗します。"
  fix:
    - "MX が示すサーバーで SMTP サービスが動作し、ポート 25 で待ち受けていることを確認してください。"
    - "サーバーのファイアウォールとホスティング事業者のファイアウォールを確認してください。受信のポート 25 は開放されている必要があります。"
    - "MX が古いサーバーを指している場合は、現在のメールサービス事業者のサーバーに置き換えてください。"
mx.null_mx_on_sending_domain:
  title: "{domain} は受信しないと宣言（Null MX）していますが、送信しています"
  why: "Null MX は、{domain} がメールを受信しないことを公に宣言しています。そのため受信者が送信を拒否する場合があり、誰もあなたに返信したり、未達通知を返したりできなくなります。"
  fix:
    - "{domain} から送信する必要がある場合は、「0 .」の MX を削除し、メールサービス事業者の MX を公開してください。"
    - "{domain} が本当に受信すべきでない場合は、受信可能なドメイン（例：送信サービスのドメイン）を Return-Path に使い、有効な Reply-To を追加してください。"
mx.null_mx_mixed:
  title: "{domain} で、Null MX とほかの MX が混在しています"
  why: "Null MX は「このドメインは受信しない」と言い、ほかの MX は逆のことを言っています。受信側のソフトウェアによって、{domain} へのメッセージや返信の扱いが予測できなくなります。"
  fix:
    - "{domain} がメールを受信するかどうかを決めてください。"
    - "受信する場合は「0 .」の MX レコードを削除してください。受信しない場合は、ほかのすべての MX を削除してください。"
mx.envelope_domain_cannot_receive:
  title: "リターンドメイン {envelope_domain} が未達通知を受け取れません"
  why: "配送できなかったことの通知は、リターンアドレス（Return-Path）に送られます。{envelope_domain} に MX もアドレスもなければ、リストの無効なアドレスは一切わからず、多くのサーバーはメッセージを直接拒否します。"
  fix:
    - "{envelope_domain} に、送信サービスの MX、またはカスタムのリターンドメイン用に送信サービスが指定するレコードを追加してください。"
    - "それができない場合は、Return-Path に受信可能なドメインのアドレスを使ってください。"
  fix_by_provider:
    postfix: "Return-Path はエンベロープアドレスを反映します。アプリケーションの sender_canonical_maps と sendmail の -f オプションを確認してください。"
mx.postmaster_rejected:
  title: "postmaster@{domain} のアドレスが拒否されています"
  why: "メールプロバイダーやブラックリストの運営者は、問題が起きたときに postmaster@{domain} に連絡します。このアドレスが存在しなければ通知を受け取れず、いくつかの掲載解除の手続きでは、このアドレスが機能している必要があります。"
  fix:
    - "メールで postmaster@{domain}（および abuse@{domain}）のエイリアスを作成してください。"
    - "実際に読まれているメールボックスに転送してください。"
  fix_by_provider:
    google_workspace: "管理コンソールで、ユーザーまたはグループの代替アドレス（エイリアス）として postmaster を追加してください。"
    microsoft_365: "Exchange 管理センターで、メールボックスまたはグループの追加アドレスとして postmaster@{domain} を追加してください。"
    cpanel: "Email、転送 で、postmaster@{domain} をメインのメールボックスに転送するよう設定してください。"
    postfix: "/etc/aliases に postmaster: 自分のアカウント を追加して newaliases を実行するか、virtual_alias_maps に 1行追加してください。"
mx.some_target_without_address:
  title: "{domain} の MX に、IP アドレスがありません"
  why: "サーバー {value} が MX として宣言されていますが、その名前からはアドレスが得られません。送信側は、無駄な問い合わせの後にこれを飛ばします。優先度が最も高い場合、メールは残りの MX だけで配送されることになります。"
  fix:
    - "{domain} の DNS ゾーンで、{value} を指している MX を探してください。"
    - "そのサーバーがもう存在しない場合は、この MX を削除してください。"
    - "存在する場合は、{value} の A レコード（IPv6 アドレスがあれば AAAA も）を作成するか、MX のつづりの誤りを修正してください。"
mx.host_unreachable:
  title: "MX の {value} がポート 25 で応答しません"
  why: "{domain} のほかの MX は応答していますが、{value}（{ip}）は応答していません。このサーバーに当たった送信者は待たされた後、次の MX を試します。メールは届きますが、遅延します。"
  fix:
    - "一時的な停止を除外するため、テストを再実行してください。"
    - "失敗が確認された場合は、{value} の SMTP サービスが動作していること、そしてファイアウォールとホスティング事業者で受信のポート 25 が開放されていることを確認してください。"
    - "このサーバーがもう使われていない場合は、{domain} のゾーンからその MX を削除してください。"
