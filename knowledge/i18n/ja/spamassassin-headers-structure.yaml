  fix:
    - "Dateヘッダーは、特に遅延送信、キューに入った、または再送信されたメッセージについて、実際の送信時点で生成してください。"
    - "メッセージを作成するサーバーの時計とタイムゾーンを確認してください。"
    - "メッセージがキューに残っていた場合は、すぐに送られなかった理由を探してください（中継サーバーの飽和、WordPress の cron の遅延など）。"
sa.date_in_past_24_48:
