sa.date_in_past_96_xx:
  title: "メッセージの日付が4日以上過去になっています"
  why: "メッセージは到着の4日以上前の日付です。転送されたスパムや、そのまま再利用された古いテンプレートが、この特徴を持ちます。約3.5点の加点です。"
  fix:
    - "Dateヘッダーは、特に遅延送信、キューに入った、または再送信されたメッセージについて、実際の送信時点で生成してください。"
    - "メッセージを作成するサーバーの時計とタイムゾーンを確認してください。"
    - "メッセージがキューに残っていた場合は、すぐに送られなかった理由を探してください（中継サーバーの飽和、WordPress の cron の遅延など）。"
sa.invalid_date:
  title: "Dateヘッダーの形式が無効です"
  why: "Date ヘッダーが想定の形式ではありません（フランス語の月名、ISO 形式の 2026-11-10、タイムゾーンなし）。日付を自分で整形するスクリプトは、よく間違えます。"
  fix:
    - "日付を RFC 5322 の形式にしてください：曜日と月は英語の略語、時刻、数値のタイムゾーン（オフセット）。"
    - "PHP では date(DATE_RFC2822) を使うか、PHPMailer に生成させてください。"
sa.invalid_date_tz_absurd:
  title: "Dateのタイムゾーンが不可能な値です"
  why: "Date の時差が存在しません（例：+0160 や +2500）。日付を生成するコードの計算ミスです。"
  fix:
    - "時差を手で計算するのではなく、言語の日付関数で生成してください。"
sa.msgid_from_mta_header:
  title: "Message-IDを中継サーバーが追加しました"
  why: "メッセージは Message-ID なしで送られ、中間のサーバーがそれを追加しました。記号的なスコアですが、送信ソフトウェアが不完全であることを示しています。"
  fix:
    - "Message-ID は、メッセージを作成するアプリケーションに生成させてください。"
sa.msgid_short:
  title: "Message-IDが異常に短いです"
  why: "Message-ID が16文字未満、またはその左側の部分が5文字未満です。一意でない可能性があります。記号的なスコアです。"
  fix:
    - "長く一意な識別子（タイムスタンプとランダム値）を生成し、その後に @{domain} を付けてください。"
sa.msgid_multiple_at:
  title: "Message-IDに @ が複数あります"
  why: "Message-ID に @ が2つあります。コードが @ の後に完全なメールアドレスを貼り付けたことが原因の場合が多いです。形式が無効です。"
  fix:
    - "Message-ID は、@ の後にドメインだけを付けて作成してください：<識別子@{domain}>"
sa.msgid_hdr_malf:
  title: "MessageIDヘッダーの綴りが誤っています"
  why: "メッセージにハイフンのない「MessageID」ヘッダーがあります。そのようなヘッダーは存在しません。送信ソフトウェアは Message-ID と書くつもりでした。"
  fix:
    - "送信コードでヘッダー名を Message-ID に修正してください。"
sa.invalid_msgid:
  title: "Message-IDが規格に合っていません"
  why: "Message-ID が <識別子@ドメイン> の形式に従っていません（山括弧がない、スペースがある、アクセントがある）。受信者はスレッドを正しく扱えないことがあります。"
  fix:
    - "識別子を山括弧で囲み、ASCII の文字だけを使い、スペースを含めないでください。"
sa.subj_all_caps:
  title: "件名がすべて大文字です"
  why: "件名がすべて大文字で書かれています。減点は中程度ですが、読者がスパムとして報告しやすいのもこの特徴です。"
  fix:
    - "件名は、先頭だけ大文字で残りは小文字で書いてください。大文字は1語までにしてください。"
sa.subject_needs_encoding:
  title: "件名に、エンコードされていない文字があります"
  why: "件名にアクセントや特殊文字が、エンコードされずにそのまま送られています。ソフトウェアによっては、読めない文字として表示されます。"
  fix:
    - "件名を UTF-8 として宣言し、ライブラリにエンコードさせてください（=?UTF-8?Q?...?=）。"
    - "PHP の mail() を使う場合は、mb_encode_mimeheader() で件名をエンコードしてください。"
sa.subj_illegal_chars:
  title: "件名に、不正な生の文字が多すぎます"
  why: "件名に、エンコードされていない8ビット文字が複数含まれています。エンコードせずにスクリプトから送られた、アクセント付きのフランス語の件名は、このルールを1.5点で発動させます。"
  fix:
    - "件名を RFC 2047 でエンコードしてください（UTF-8、quoted-printable または base64）。"
  fix_by_provider:
    wordpress: "mail() ではなく wp_mail() を使ってください。WordPress は件名を正しくエンコードします。"
sa.bad_enc_header:
  title: "ヘッダーのエンコードが不正です"
  why: "ヘッダーに、空白で分断された、または ?= で閉じられていないエンコード語（=?UTF-8?Q?...）があります。テキストはコードのまま表示されます。記号的なスコアです。"
  fix:
    - "文字列を手で組み立てるのではなく、送信ライブラリのエンコード関数を使ってください。"
sa.hdrs_lcase:
  title: "ヘッダーの大文字小文字が通常と異なります"
  why: "ヘッダーの一部が通常と異なる大文字小文字で書かれています（「from:」、「Content-type:」）。スパム送信ソフトには、見分けられる書き方の癖があります。記号的なスコアです。"
  fix:
    - "標準の表記を使ってください：From、To、Subject、Message-ID、Content-Type。"
sa.t_many_hdrs_lcase:
  title: "大文字小文字が通常と異なるヘッダーが複数あります"
  why: "複数のヘッダーの大文字小文字が通常と異なります。重みのないテストルールです。"
  fix:
    - "ヘッダー名は標準の表記を使ってください。"
sa.unclosed_bracket:
  title: "ヘッダーに閉じられていない角括弧があります"
  why: "ヘッダーに閉じ括弧のない「[123」があります。テンプレートの変数が正しく埋められていないか、ヘッダーが途中で切れたことがよくあります。約1.5点の加点です。"
  fix:
    - "生成されたヘッダー（件名、From、X- ヘッダー）を読み直し、この括弧を生成している変数を修正してください。"
sa.unresolved_template:
  title: "ヘッダーに未置換のテンプレート変数があります"
  why: "ヘッダーに、%NOM や %EMAIL のような記号がそのまま残っています。送信ソフトウェアが変数を置換しませんでした。これは、設定の誤ったスパムソフトの特徴です。"
  fix:
    - "% を含むヘッダーを特定し、テンプレートまたはスクリプトの変数を修正してください。"
sa.pling_query:
  title: "件名に感嘆符と疑問符があります"
  why: "件名に「!」と「?」の両方が含まれています。減点は小さいですが、扇動的な件名の典型的な癖です。"
  fix:
    - "件名では強い句読点を1つだけ使うか、使わないでください。"
sa.gappy_subject:
  title: "件名の文字が間隔を空けて書かれています"
  why: "件名の中で、単語が区切り記号を挟んで1文字ずつ書かれています。キーワードフィルターを回避する手口です。減点は小さいです。"
  fix:
    - "件名では単語を普通に書いてください。"
sa.subj_dollars:
  title: "件名がドル建ての金額で始まっています"
  why: "件名がドル建ての金額で始まっています。減点は小さいです。"
  fix:
    - "件名は、価格ではなく内容を表す単語で始めてください。"
sa.subj_buy:
  title: "件名が「Buy」で始まっています"
  why: "件名が「Buy」または「Buying」で始まっています。このルールは英語だけを対象としています。"
  fix:
    - "件名を、購入の指示ではなく、オファーの内容を説明する表現に言い換えてください。"
sa.xprio:
  title: "認証されていないメッセージにX-Priorityヘッダーがあります"
  why: "メッセージに優先度ヘッダーがあり、認証もされていません。記号的なスコアですが、より重いルールの条件として使われます。"
  fix:
    - "X-Priority ヘッダーを削除してください。配信到達性を改善するものではありません。"
    - "メッセージに DKIM 署名をしてください。"
sa.xprio_short_subj:
  title: "高い優先度と非常に短い件名"
  why: "メッセージが優先度を要求し、件名が9文字未満です（「Urgent」「Facture」など）。詐欺でよく見られる組み合わせです。"
  fix:
    - "X-Priority を削除し、内容を説明する件名を書いてください。"
sa.x_ip:
  title: "X-IPヘッダーがあります"
  why: "メッセージに X-IP ヘッダーがあります。一部の Web メールやスクリプトが追加します。記号的なスコアです。"
  fix:
    - "緊急ではありません。スクリプトが追加している場合は、削除して構いません。"
sa.spammy_xmailer:
  title: "スパムに使われることで知られる送信ソフトウェア"
  why: "X-Mailer ヘッダーは、スパムソフトが何年も模倣してきた、特定の古い Outlook または Outlook Express のバージョンを宣言しています。約2.5点の加点です。"
  fix:
    - "スクリプトの X-Mailer ヘッダーを削除するか修正してください。使っていないソフトウェアを模倣しないでください。"
sa.php_script:
  title: "PHPスクリプトから送信されたメッセージ"
  why: "X-PHP-Script ヘッダーは、共有ホスティングで PHP の mail() 関数によって送信されたことを示します。ハッキングされたサイトは、この経路でスパムを送ります。"
  fix:
    - "サイトのメールは、mail() ではなく、メールサービスの認証付き SMTP で送信してください。"
  fix_by_provider:
    wordpress: "SMTP拡張機能（WP Mail SMTP、FluentSMTP、Post SMTP）をインストールし、メールサービスのサーバーを設定してください。"
    cpanel: "cPanel でメールアドレスを作成し、アプリケーションでそのサーバーを認証付きで使ってください。"
sa.php_script_mua:
  title: "バージョンのないPHPスクリプトから送信されたメッセージ"
  why: "メッセージは PHP の mail() から送られ、「X-Mailer: PHP」とバージョンなしで宣言しています。急いで書かれたスクリプトの特徴です。"
  fix:
    - "認証付き SMTP を使うライブラリ（PHPMailer、Symfony Mailer）を経由してください。"
sa.php_nover_mua:
  title: "バージョンなしで「PHP」と宣言された送信ソフトウェア"
  why: "X-Mailer ヘッダーには、単に「PHP」とだけ書かれています。本物のメールソフトは、名前とバージョンを示します。"
  fix:
    - "スクリプトの X-Mailer ヘッダーを削除するか、送信ライブラリを使ってください。"
    - "メッセージに DKIM 署名をしてください。これでこのルールは適用されなくなります。"
sa.php_orig_script:
  title: "元のPHPスクリプトの指定と、その他の自動送信の特徴"
  why: "X-PHP-Originating-Script ヘッダーが、メッセージを送った PHP スクリプトの名前を示しており、内容には自動スパムの特徴があります。サイトでは、悪用されたフォームを示している可能性があります。"
  fix:
    - "ヘッダーで、どの PHP ファイルがメッセージを送ったかを確認してください。その名前に心当たりがなければ、サイトは侵害されている可能性が高いです。"
    - "正規の送信は、認証付き SMTP を経由させてください。"
sa.xm_phpmailer_forged:
  title: "X-MailerのPHPMailerヘッダーが不完全です"
  why: "X-Mailer ヘッダーには PHPMailer が「version」という語とともに書かれていますが、番号がありません。本物の PHPMailer のヘッダーにはバージョンが書かれています。このヘッダーは作られたか、改変されています。"
  fix:
    - "PHPMailer に既定の X-Mailer を書かせるか、XMailer プロパティを空白に設定して、このヘッダーを送らないようにしてください。"
sa.mailing_list_multi:
  title: "メーリングリスト管理ツールのヘッダー"
  why: "メッセージには、メーリングリストのヘッダーが複数あります。SpamAssassin はこれをリストの送信と認識し、他のルールを緩めます。それでも1点の加点です。"
  fix:
    - "対応不要です。これらのヘッダーは有用です。List-Unsubscribe と List-Id は残してください。"
sa.list_prtl_same_user:
  title: "リストのヘッダーが不完全で、送信者と受信者が同じです"
  why: "メッセージには List-Unsubscribe がありますが List-Id がなく、送信者が受信者と同じ識別子を持っています。偽のリスト送信の組み合わせです。"
  fix:
    - "メーリングリストを送る場合は、一貫性のある List-Id ヘッダーを追加してください。"
    - "別の送信アドレスを使い、DKIM で署名してください。"
sa.header_spam:
  title: "スパム送信ソフトに典型的なヘッダー"
  why: "メッセージには、スパムソフトにほとんどしか見られないヘッダー（Newsletter-ID、UID、X-Company-Address、Antivirus など）が含まれています。自作のツールは、理由なくこれらを追加することがあります。"
  fix:
    - "生のメッセージで問題のヘッダーを特定し、ツールまたはスクリプトから削除してください。"
sa.ratware_zero_tz:
  title: "Dateが+0000で、送信者がスパムソフトの形式です"
  why: "日付は協定世界時で、メッセージは HTML で、アドレスはスパムソフトで見られるパターンに従って名前から作られています。"
  fix:
    - "Date を実際のタイムゾーンで生成し、メッセージにテキストパートを追加してください。"
sa.forged_mua_outlook:
  title: "Outlookから送られたと名乗るが、その特徴を持たないメッセージ"
  why: "X-Mailer ヘッダーは Outlook を名乗っていますが、Message-ID は Outlook が生成するものと一致しません。正当に見せるために Outlook を模倣するスクリプトは、逆の効果を生みます。"
  fix:
    - "スクリプトまたはツールで、Outlook を模倣する X-Mailer ヘッダーを削除してください。"
sa.forged_outlook_html:
  title: "テキストパートのない「Outlook」のメッセージ"
  why: "Outlook は HTML と一緒に常にテキスト版を送ります。Outlook から来たと名乗るのに HTML しかないメッセージは、模倣されています。減点は小さいです。"
  fix:
    - "テキストパートを追加し、Outlook から送信していない場合は Outlook の X-Mailer を削除してください。"
sa.forged_outlook_tags:
  title: "Outlookが生成する構造のない「Outlook」のHTML"
  why: "Outlook は常に完全な HTML を生成します。これらのタグのない「Outlook」のメッセージは、別の場所で作られたものです。減点は小さいです。"
  fix:
    - "完全な HTML 文書（html、head、meta charset、body）を生成し、Outlook の X-Mailer を模倣しないでください。"
sa.dos_outlook_to_mx:
  title: "「Outlook」のメッセージが受信者のサーバーに直接渡されました"
  why: "メッセージは Outlook から送られたと名乗っていますが、送信サーバーを経由せず、受信サーバーに直接渡されました。Outlook は必ずサーバーを経由します。これはボットの特徴です。約3点の加点です。"
  fix:
    - "メールサービスの SMTP サーバーで送信し、Outlook を模倣する X-Mailer ヘッダーを削除してください。"
sa.mimeole_direct_to_mx:
  title: "X-MimeOLEヘッダーがあり、サーバーに直接渡されています"
  why: "メッセージには Microsoft ソフトの X-MimeOLE ヘッダーがあり、受信サーバーに直接届いています。感染したマシンに典型的な組み合わせです。"
  fix:
    - "メールサービスの SMTP サーバーを経由するか、メッセージに DKIM 署名をしてください。"
sa.dos_body_high_no_mid:
  title: "8ビット文字を含む本文で、Message-IDがありません"
  why: "メッセージに Message-ID がなく、本文にアクセント付きの文字があります。Message-ID のないスクリプトから送られたフランス語のメッセージでは、約4点の加点になります。"
  fix:
    - "Message-ID を追加してください（MISSING_MID を参照）。これだけでこのルールは除去されます。"
sa.cte_8bit_mismatch:
  title: "テキストが7ビットと宣言されていますが、アクセントを含んでいます"
  why: "テキストパートは7ビット（純粋な ASCII）と宣言されていますが、アクセント付きの文字を含んでいます。受信者にはテキストが壊れて表示されるおそれがあります。"
  fix:
    - "テキストパートに、Content-Transfer-Encoding: quoted-printable（または 8bit）と charset=UTF-8 を宣言してください。"
sa.has_x_outgoing_spam_stat:
  title: "X-OutGoing-Spam-Statusヘッダーがあります"
  why: "送信サーバーが X-OutGoing-Spam-Status ヘッダーを追加しました（cPanel は送信フィルターでこれを行います）。SpamAssassin は、このようなヘッダーを信頼できないと判断し、1点加算します。"
  fix:
    - "cPanel サーバーを管理している場合は、送信メッセージへのこのヘッダーの追加を無効にするか、追加しない中継を経由してください。"
  fix_by_provider:
    cpanel: "このヘッダーは、cPanel の Exim の送信フィルターから来ています。無効にできるのはサーバー管理者（WHM）だけです。"
sa.rand_mktg_header:
  title: "名前が部分的にランダムなマーケティング追跡ヘッダー"
  why: "メッセージには、送信のたびに名前が変わるキャンペーン追跡ヘッダーがあります。スパムソフトに見られる特徴です。"
  fix:
    - "固定の追跡ヘッダー名を使うか、削除してください。"
sa.jh_spammy_headers:
  title: "主にスパムで見られる珍しいヘッダー"
  why: "メッセージには Complaint-To、Tracking-Code、List-Open のようなヘッダーがあり、これはほぼスパムでしか見られません。"
  fix:
    - "このヘッダーを、メールソフトウェアから削除してください。"
sa.no_dns_for_from:
  title: "エンベロープドメインにMXも IPアドレスもありません"
  why: "{envelope_domain}（返送を受け取るドメイン）が DNS に存在しないか、MX も A レコードもありません。エラーの返送は失われ、多くのサーバーは到達できない送信者を拒否します。"
  fix:
    - "メールを受け取るドメイン（MX レコードのあるもの）の下の Return-Path を使ってください。"
    - "{envelope_domain} が送信ツールの技術用サブドメインである場合は、そのツールが求める MX またはレコードを公開してください。"
