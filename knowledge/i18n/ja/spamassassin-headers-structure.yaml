  why: "メッセージは到着の6～12時間前の日付です。原因は同じです。キューに残った、作成日が再利用された、またはタイムゾーンです。"
  fix:
    - "Dateヘッダーは、特に遅延送信、キューに入った、または再送信されたメッセージについて、実際の送信時点で生成してください。"
