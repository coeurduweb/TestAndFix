    - "スクリプトでは、ローカル時刻に +0000 を付けるのではなく、時差を含めて送信時点の Date を生成してください。"
    - "予約送信の場合、Date は、キャンペーン作成時点ではなく、実際の送信時点のものである必要があります。"
sa.t_date_in_future_q_plus:
  title: "メッセージの日付が4か月以上未来になっています"
  why: "Date は受信時点より4か月以上後です。重みのないテストルールですが、日付の誤りは明らかです。"
  fix:
    - "メッセージを生成するサーバーまたは端末の時刻とタイムゾーンを確認してください（NTP を有効にし、タイムゾーンは Europe/Paris に設定）。"
