  why: "メッセージは日付から1～2日後に到着しました。一時的な拒否の後で長く再試行するサーバーが、このずれを生みます。"
  fix:
    - "Dateヘッダーは、特に遅延送信、キューに入った、または再送信されたメッセージについて、実際の送信時点で生成してください。"
