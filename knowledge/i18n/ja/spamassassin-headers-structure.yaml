sa.missing_date:
  title: "Dateヘッダーがありません"
  why: "メッセージにDateヘッダーがありません。このヘッダーは必須です。ヘッダーを手で組み立てるスクリプトはよく忘れ、多くのプロバイダーは RFC 5322 に従わないメッセージを拒否します。"
  fix:
    - "RFC 5322 の形式で Date ヘッダーを追加するか、送信ライブラリに生成させてください（PHPMailer、Symfony Mailer、Nodemailer はこれを行います）。"
sa.missing_from:
  title: "Fromヘッダーがありません"
  why: "メッセージは送信者を示していません。From ヘッダーは RFC 5322 で必須で、Gmail もこれを守ることを求めています。DMARC は完全にこのヘッダーに依存しています。"
  fix:
    - "自分のドメインのアドレスを使って、From ヘッダーを追加してください。"
sa.missing_headers:
  title: "Toヘッダーがありません"
  why: "メッセージに To ヘッダーがありません。すべての受信者が Bcc（ブラインドカーボンコピー）に入っている場合で、求められていない大量送信によく使われる方法です。"
  fix:
    - "受信者のアドレスを使って To ヘッダーを追加してください。Bcc で送る場合は、自分のアドレスでも構いません。"
    - "大量送信には、受信者ごとに1通ずつ送るツールを使ってください。"
sa.missing_mid:
  title: "Message-IDヘッダーがありません"
  why: "メッセージに一意の識別子がありません。ほとんどのサーバーは送信時にそれを追加するため、ないということは、スクリプトがメッセージを直接渡したことを示します。Gmail は有効な Message-ID がないメッセージを拒否することがあります。"
  fix:
    - "<識別子@{domain}> の形式の一意の Message-ID を生成するか、送信ライブラリに任せてください。"
    - "送信 SMTP サーバーが、Message-ID がない場合に追加することを確認してください。"
  fix_by_provider:
    postfix: "main.cf で always_add_missing_headers = yes を設定すると、Postfix が不足している Date、Message-ID、From を補完します。"
sa.missing_subject:
  title: "Subjectヘッダーがありません"
  why: "メッセージに件名がまったくありません（ヘッダーが空ではなく、存在しません）。約2点の加点です。送信スクリプトによくある不備です。"
  fix:
    - "分かりやすく内容を説明する件名を追加してください。"
sa.missing_mimeole:
  title: "X-MSMail-Priorityヘッダーがあり、X-MimeOLEがありません"
  why: "メッセージには、Outlook Express 固有の優先度ヘッダーがありますが、それに常に付いてくるヘッダーがありません。PHP のライブラリが X-MSMail-Priority を模倣して追加することがあり、SpamAssassin はそれを検出します。"
  fix:
    - "スクリプトが追加した X-MSMail-Priority と X-Priority ヘッダーを削除してください。何の効果もありません。"
    - "残す場合は、メッセージに DKIM 署名をしてください。これでこのルールは適用されなくなります。"
sa.missing_mime_hb_sep:
  title: "MIMEヘッダーと内容の間に空行がありません"
  why: "MIME パートで、ヘッダーと内容の間に空行がありません。メッセージの形式が不正で、正しく表示されないおそれがあります。記号的なスコアです。"
  fix:
    - "MIME を手で連結するのではなく、送信ライブラリを使って構築してください。"
sa.no_headers_message:
  title: "ヘッダーがほとんどないメッセージ"
  why: "Date、To、Message-ID、Received がすべて欠けています。メッセージは、通常の送信経路を通らずに挿入されました。"
  fix:
    - "必須のヘッダーを生成するライブラリを使い、実際の送信サーバーからテストを送信してください。"
sa.date_in_future_03_06:
  title: "メッセージの日付が3～6時間未来になっています"
  why: "Dateヘッダーの時刻が、サーバーへの到着時より3～6時間後になっています。よくある原因は、タイムゾーンの誤った宣言です（パリの時刻を +0000 と書く、またはその逆）。3点を超える加点です。"
  fix:
    - "メッセージを生成するサーバーまたは端末の時刻とタイムゾーンを確認してください（NTP を有効にし、タイムゾーンは Europe/Paris に設定）。"
    - "スクリプトでは、ローカル時刻に +0000 を付けるのではなく、時差を含めて送信時点の Date を生成してください。"
    - "予約送信の場合、Date は、キャンペーン作成時点ではなく、実際の送信時点のものである必要があります。"
sa.date_in_future_06_12:
  title: "メッセージの日付が6～12時間未来になっています"
  why: "Date は受信時点より6～12時間先行しています。サーバーの時計またはタイムゾーンが誤っているか、大陸間のずれが誤って宣言されています。"
  fix:
    - "メッセージを生成するサーバーまたは端末の時刻とタイムゾーンを確認してください（NTP を有効にし、タイムゾーンは Europe/Paris に設定）。"
    - "スクリプトでは、ローカル時刻に +0000 を付けるのではなく、時差を含めて送信時点の Date を生成してください。"
    - "予約送信の場合、Date は、キャンペーン作成時点ではなく、実際の送信時点のものである必要があります。"
sa.date_in_future_12_24:
  title: "メッセージの日付が12～24時間未来になっています"
  why: "Date は12～24時間先行しています。スパム送信者は、受信箱の上位に残るために未来の日付を付けます。誤って設定されたサーバーも同じ効果を生みます。3点を超える加点です。"
  fix:
    - "メッセージを生成するサーバーまたは端末の時刻とタイムゾーンを確認してください（NTP を有効にし、タイムゾーンは Europe/Paris に設定）。"
    - "スクリプトでは、ローカル時刻に +0000 を付けるのではなく、時差を含めて送信時点の Date を生成してください。"
    - "予約送信の場合、Date は、キャンペーン作成時点ではなく、実際の送信時点のものである必要があります。"
sa.date_in_future_24_48:
