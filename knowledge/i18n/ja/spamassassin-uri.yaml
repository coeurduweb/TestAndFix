sa.uri_try_3ld:
  title: "行動喚起（CTA）用サブドメイン（try.、get.、check.、join.、my. など）へのリンク"
  why: "リンクが .com または .net のホストを指しており、その名前は try、start、get、save、check、act、compare、join、learn、request、visit、my のいずれかで始まります（get.your-offer.example.com、check.your-service.example.com など）。スパマーはこの種の行動喚起サブドメインを作ります。正当なサービスがこれを使っても減点されます。"
  fix:
    - "リンクは、これらの語で始まるサブドメインではなく、メインドメイン（www.{domain}）またはパス（/trial など）に向けてください。"
sa.uri_try_usme:
  title: "「try」または「get」で始まる .us、.me、.mobi、.club へのリンク"
  why: "行動喚起のリンクが、.us、.me、.mobi、.club のドメインを指しています。これらの拡張子はスパマーがよく使います。"
  fix:
    - "メインドメインへのリンクを使い、メッセージに DKIM で署名してください（この規則は署名済みメッセージには適用されません）。"
sa.uri_optout_3ld:
  title: "「remove」または「stop」型のサブドメインへの配信停止リンク"
  why: "配信停止リンクが remove.example.com や stop.example.net のようなホストを指しています。キャンペーンごとにドメインを変えるスパマーに見られる特徴です。"
  fix:
    - "配信停止のページは、ご自身のドメインまたは送信ツールのドメインのパス（/unsubscribe など）に置いてください。"
sa.uri_optout_usme:
  title: "「remove」または「stop」の配信停止リンクが .us、.me、.mobi、.club にあります"
  why: "配信停止リンクが、悪用されやすい拡張子の停止用サブドメインを指しています。"
  fix:
    - "送信ツールのネイティブな配信停止リンクを使ってください。"
sa.uri_novowel:
  title: "子音が長く続くホスト名へのリンク"
  why: "リンクが、7 つの子音が続くホストを指しています。これはランダムに生成されたドメインに似ています。送信ツールの追跡ドメイン（符号化された ID）が、ときどきこの規則を発動させます。"
  fix:
    - "送信ツールで、読みやすいカスタム追跡ドメイン（track.{domain} など）を設定してください。"
sa.uri_hex:
  title: "16 進数の長い並びを含むホスト名へのリンク"
  why: "リンクのホスト名に、少なくとも 6 文字の 16 進数（a1b2c3）が含まれています。生成されたサブドメインに典型的です。減点は小さいです。"
  fix:
    - "リンクには、特にクリック追跡のために、読みやすいホスト名を使ってください。"
sa.numeric_http_addr:
  title: "ドメイン名の代わりに IP アドレスへのリンク"
  why: "リンクが IP アドレス（http://203.0.113.10/...）を指しています。まともなサイトはメールでこのようなリンクを使わず、リンクフィルターは何も検証できません。1 点を超えます。"
  fix:
    - "IP アドレスをサイトのドメイン名に置き換えてください。"
    - "テストや検証用のリンクがテンプレートに残っている場合は、本番のアドレスに置き換えてください。"
sa.normal_http_to_ip:
  title: "公開 IPv4 アドレスへのリンク"
  why: "リンクが公開 IP アドレスを指しています。象徴的なスコアですが、NUMERIC_HTTP_ADDR は通常同時に発動します。"
  fix:
    - "リンクにはドメイン名を使ってください。"
sa.https_http_mismatch:
  title: "リンクの表示テキストと実際の宛先のドメインが異なります"
  why: "リンクには https://www.your-domain.example と表示されていますが、実際には別のドメインに飛びます。これはフィッシングの基本的な手口です。追跡ドメインを経由しながら最終的なアドレスをそのまま表示するニュースレターも、この規則を発動させます。"
  fix:
    - "https:// のアドレスをリンクの文字列にしないでください。「ショップを見る」のようなラベルを付けてください。"
    - "または、表示されるドメインと実際のドメインが一致するように、{domain} のサブドメインでクリック追跡を設定してください。"
sa.http_escaped_host:
  title: "% でエンコードされたリンクのホスト名"
  why: "リンクのホスト名に、エンコードされた文字（ドットの代わりの %2E）が含まれています。本当の宛先を隠すための手法です。減点は小さいです。"
  fix:
    - "ホスト名は平文で書いてください。エンコードしてよいのは ? の後のパラメーターだけです。"
sa.http_excessive_escapes:
  title: "不要な % エンコードを含むリンク"
  why: "リンクが、通常の文字（a の %61 など）をエンコードしています。象徴的なスコアです。"
  fix:
    - "リンクでは、エンコードが必要な文字（スペース、アクセント、&）だけをエンコードしてください。"
sa.weird_port:
  title: "通常と異なるポートを含むリンク"
  why: "リンクが通常とは異なるネットワークポート（https://your-domain.example:8443/）を指定しています。忘れられた検証環境や管理画面のリンクであることがよくあります。象徴的なスコアです。"
  fix:
    - "ポート番号なしの、サイトの公開アドレスを使ってください。"
sa.uri_truncated:
  title: "分析中に切り詰められたリンクがあります"
  why: "リンクが 8,192 文字を超えているか、メッセージのリンクが多すぎます。SpamAssassin はすべてを解析していません。象徴的なスコアですが、このサイズのリンクは異常です。"
  fix:
    - "長すぎるリンク（過剰な追跡パラメーター）を短くし、リンクの数を制限してください。"
sa.uri_data:
  title: "data: のリンク（アドレスに埋め込まれたコンテンツ）"
  why: "リンクが data: スキームを使い、文書（多くは HTML）をアドレス自体に埋め込んでいます。サーバーなしで偽のページを表示するためのフィッシング手法です。"
  fix:
    - "このリンクを、サイトでホストされたページへのリンクに置き換えてください。"
sa.uri_wpadmin:
  title: "WordPress の管理画面へのリンク"
  why: "リンクが WordPress サイトの /wp-admin/ を指しています。フィッシングは、改ざんされた WordPress に偽のページを置きます。ニュースレターに管理画面のリンクを入れるのも誤りです。"
  fix:
    - "リンクを、ページの公開アドレス（/wp-admin/ を含まない）に置き換えてください。"
  fix_by_provider:
    wordpress: "リンクは、編集画面ではなく、記事の「投稿を表示」ボタンからコピーしてください。"
sa.uri_wp_hacked:
  title: "wp-content または wp-includes 内の PHP または HTML ファイルへのリンク"
  why: "リンクが wp-content または wp-includes 内の .php または .html ファイルを指しています。これらのディレクトリには通常、画像と内部スクリプトしかありません。改ざんした者がページを置くときの典型的な場所です。2.5 点を超えます。"
  fix:
    - "リンクがご自身のものである場合は、そのファイルを確認してください。そこにあるべきものでなければ、サイトは侵害されています。"
    - "正当な文書へのリンクには、公開ページのアドレス、または uploads 内の PDF のアドレスを使ってください。"
    - "メッセージを認証してください（SPF または DKIM）。この規則は認証済みメッセージには適用されません。"
sa.uri_php_redir:
  title: "redirect.php を経由するリンク"
  why: "リンクが redirect.php スクリプトを経由し、別のアドレスへ転送しています。第三者サイトのオープンリダイレクトは、悪意ある宛先を隠すために使われます。"
  fix:
    - "宛先のアドレスをリンクに直接書いてください。"
sa.url_shortener_disabled:
  title: "悪用のため無効化された短縮リンク"
  why: "短縮リンクが、悪用を理由に短縮サービスによって停止されています。読者は警告ページにたどり着き、SpamAssassin は 2 点を加算します。"
  fix:
    - "短縮リンクを、ページの完全なアドレスに置き換えてください。"
    - "メールに公開の短縮サービスを使わないでください。スパマーと共有されています。"
sa.url_shortener_chained:
  title: "別の短縮サービスへ転送する短縮リンク"
  why: "短縮リンクが、別の短縮リンクへ進みます。最終的な宛先を隠すための連鎖です。象徴的なスコアですが、リンクフィルターはこれを減点します。"
  fix:
    - "短縮サービスを使わず、最終的なアドレスを直接使ってください。"
sa.t_short_shortner:
  title: "主に短縮リンクからなる短いメッセージ"
  why: "メッセージは数語と短縮リンクからなります。SpamAssassin のリストでは、youtu.be、amzn.to、wp.me、eepurl.com（Mailchimp）も数えられます。スパムや乗っ取られたアカウントのメッセージの典型的な特徴です。テスト用のルールで、重みはありません。"
  fix:
    - "メッセージに文脈を追加し、ページの完全なアドレスを使ってください。"
sa.redir_url_chained:
  title: "複数のリダイレクターを経由するリンク"
  why: "リンクが複数の転送サービスを順に経由します。象徴的なスコアですが、宛先を隠す典型的な手段です。"
  fix:
    - "連鎖を 1 回の通過（送信ツールの追跡）に限り、その後に最終的なアドレスを置いてください。"
sa.redir_url_loop:
  title: "自分自身に戻るリダイレクトのリンク"
  why: "リダイレクトのリンクが自分自身に戻ります。読者は決してページに到達できません。"
  fix:
    - "ブラウザでリンクをテストし、リダイレクトを修正してください。"
sa.redir_url_maxchain:
  title: "リダイレクトが多すぎるリンク"
  why: "リンクのリダイレクトが多すぎるため、解析が打ち切られました。ブラウザも中断することがあります。"
  fix:
    - "メッセージのリンクから最終ページまでのリダイレクトの数を減らしてください。"
sa.gb_google_obfur:
  title: "Google のリダイレクトの後ろに隠されたリンク"
  why: "リンクは、Google の検索結果ページからコピーされた google.com/url?...&url=... のアドレスです。本当の宛先を隠し、スパマーはブラックリストを回避するために使います。"
  fix:
    - "リンクを開き、ページの実際のアドレスをブラウザのアドレスバーからコピーしてください。"
sa.uri_google_proxy:
  title: "Google の画像プロキシを経由するリンク"
  why: "リンクまたは画像が googleusercontent.com/proxy/ を経由しています。これは Gmail が、キャッシュする画像に与えるアドレスです。Gmail で受信したメッセージから画像をコピーすると現れます。"
  fix:
    - "画像は元のファイル、またはサイト上のアドレスから挿入し直してください。"
sa.uri_dq_unsub:
  title: "IP アドレスへの配信停止リンク"
  why: "配信停止リンクが IP アドレスを指しています。受信者もフィルターも送信者を特定できません。"
  fix:
    - "配信停止は、ドメイン名（ご自身のもの、または送信ツールのもの）の下でホストしてください。"
sa.spoof_com2com:
  title: "ホスト名の途中と末尾に .com があるリンク"
  why: "bank.com.other-site.example のようなホスト名は、既知のドメインを模倣しています。象徴的なスコアですが、なりすましのパターンです。"
  fix:
    - "「.com」を含むサブドメインは避け、実際のドメインを使ってください。"
sa.spoof_com2oth:
  title: "ホスト名の途中に .com があるリンク"
  why: "ホスト名の途中に「.com.」が含まれています（example.com.your-site.example）。象徴的なスコアです。"
  fix:
    - "途中に .com を含まないホスト名を使ってください。"
sa.long_hex_uri:
  title: "非常に長い 16 進数の並びを含むリンク"
  why: "リンクに、128 文字の 16 進数の ID が含まれています。受信者ごとにパーソナライズされた追跡リンクが、ときどきこれを生成します。1 点。"
  fix:
    - "リンクが送信ツールの追跡リンクである場合は、より短い ID を使うか、カスタム追跡ドメインを使ってください。"
sa.uppercase_uri:
  title: "リンクのプロトコルの大文字と小文字が不自然です"
  why: "リンクの先頭に大文字と小文字が混在しています（hTTps://）。単純なフィルターを回避するための手口です。約 3 点。"
  fix:
    - "すべてのリンクで https:// を小文字で書いてください。"
sa.uri_excess_slashes:
  title: "プロトコルの後のスラッシュが多すぎるリンク"
  why: "リンクが https:/// （スラッシュが 3 つ以上）で始まっています。ブラウザは修正しますが、フィルターはこれを回避の試みとみなします。2.5 点。"
  fix:
    - "リンクを修正してください：https:// の直後にドメインを続けます。"
    - "リンクを組み立てているテンプレートの変数を確認してください（ドメインが空、余分なスラッシュ）。"
sa.body_uri_only:
  title: "本文がリンクだけです"
  why: "メッセージはリンクまたはクリック可能な画像だけに縮小されています。象徴的なスコアですが、乗っ取られたアカウントから送られるメッセージの特徴です。"
  fix:
    - "リンクを説明する文を 1〜2 文追加し、メッセージに DKIM で署名してください。"
sa.mxg_email_frag:
  title: "# の後にメールアドレスを含むリンク"
  why: "リンクの # の後にメールアドレスが含まれています。フィッシングは、これを使って偽のログインページに自動入力します。減点は小さいです。"
  fix:
    - "受信者の識別子は、メールアドレスを平文で入れず、不透明なパラメーターで渡してください。"
sa.tracker_id:
  title: "追跡 ID だけからなる段落"
  why: "メッセージの段落が、ランダムなコードだけで構成されています。スパマーが各メッセージを一意にするために追加するコードに似ています。減点は小さいです。"
  fix:
    - "本文に表示される技術的な ID を削除し、リンクまたはヘッダーに入れてください。"
sa.uri_firebaseapp:
  title: "firebaseapp.com または web.app でホストされたアプリへのリンク"
  why: "リンクが Firebase でホストされたアプリを指しています。これらの無料ホスティングはフィッシングページによく使われます。正当なアプリでも約 3 点になります。"
  fix:
    - "Firebase のアプリにカスタムドメインを関連付け、リンクではそのドメインを使ってください。"
sa.t_pds_other_bad_tld:
  title: "信頼性の低いドメイン拡張子へのリンク"
  why: "リンクが、ルールで信頼性が低いとされる拡張子を指しています。テスト用のルールで重みはありませんが、ほかのフィルターはこれらの拡張子を減点します。"
  fix:
    - "ご自身のドメインである場合は、キャンペーンのリンクにより一般的な拡張子の利用を検討してください。"
sa.shortener_short_img:
  title: "短い HTML で、クリック可能な画像と短縮リンク"
  why: "メッセージは、短縮リンクへのクリック可能な画像を含む極めて短い HTML です。典型的なスパムの組み合わせです。2 点を超えます。"
  fix:
    - "短縮リンクを完全なアドレスに置き換え、メッセージにテキストを追加してください。"
    - "注意：youtu.be、amzn.to、wp.me、eepurl.com は短縮サービスとして数えられます。長いアドレスを使ってください。"
sa.uri_wp_hacked_2:
  title: 'メッセージ内のアドレスが wp-content/plugins、wp-content/themes、wp-includes を指しています'
  why: 'メッセージ内のアドレス（リンクまたは画像）が、WordPress の技術フォルダを指しています。ハッキングされたサイトは、そこに悪意のあるページやファイルを隠すため、このルールがあります。正当な画像でも、テーマが配信するロゴやプラグインの代替画像などがこの場所を指すことがあります。問題のアドレスは証拠に示されています。'
  fix:
    - 'メッセージの画像は、テーマやプラグインのフォルダではなく、メディアライブラリ（/wp-content/uploads/）から配信してください。'
    - 'WooCommerce では、画像のない商品の写真の代わりに、プラグインの placeholder.webp 画像が使われます。商品に画像を設定するか、画像のある商品でテストしてください。'
    - 'アドレスが、ご自身で設定したものと一致しない場合は、サイトを確認してください。侵害されている可能性があります。'
