sa.html_message:
  title: "メッセージに HTML が含まれています"
  why: "情報：メッセージには HTML パートが含まれています。スコアはゼロです。ニュースレターでは標準的です。"
  fix:
    - "修正は不要です。HTML と並べて、必ずテキスト版（multipart/alternative）を含めてください。"
sa.html_mime_no_html_tag:
  title: "<html> タグのない HTML メッセージ"
  why: "メッセージには HTML しか含まれておらず、その HTML には <html> タグさえありません。断片をそのまま貼り付けた状態です。スクリプトや一部のエディターがこうした出力を作ります。"
  fix:
    - "完全な文書を送信してください：<!DOCTYPE html>、<html>、meta charset を含む <head>、<body>。"
    - "テキストパートを追加してください。"
sa.html_image_only_04:
  title: "画像を含み、テキストがほとんどない HTML メッセージ（テキスト 0〜400 バイト）"
  why: "HTML には画像が 1 つ以上あり、テキストは 400 バイト未満です。実際にはポスターです。フィルターは画像を読めないため、これは画像スパムの手口です。よくあるケースは、Canva から書き出したチラシを本文に貼り付けたものです。"
  fix:
    - "画像の中ではなく、HTML に実際のテキスト（見出し、段落、行動喚起）を入れてください。"
    - "実際のテキストで、少なくとも数百語を目指してください。画像は挿絵として使ってください。"
    - "各画像に説明的な alt 属性を設定してください。"
sa.html_image_only_08:
  title: "画像があり、テキストが非常に少ない HTML（400〜800 バイト）"
  why: "画像と 400〜800 バイトのテキストがあります。主要な内容は画像の中にあります。減点は 1.5 点を超えます。"
  fix:
    - "画像の中ではなく、HTML に実際のテキスト（見出し、段落、行動喚起）を入れてください。"
    - "実際のテキストで、少なくとも数百語を目指してください。画像は挿絵として使ってください。"
    - "各画像に説明的な alt 属性を設定してください。"
sa.html_image_only_12:
  title: "画像があり、テキストが少ない HTML（800〜1,200 バイト）"
  why: "画像と 800〜1,200 バイトのテキストがあります。2 点を超えます。最も減点される区分で、大きなバナーと 2 行の文章でできたニュースレターに典型的です。"
  fix:
    - "画像の中ではなく、HTML に実際のテキスト（見出し、段落、行動喚起）を入れてください。"
    - "実際のテキストで、少なくとも数百語を目指してください。画像は挿絵として使ってください。"
    - "各画像に説明的な alt 属性を設定してください。"
sa.html_image_only_16:
  title: "画像があり、テキストが少ない HTML（1,200〜1,600 バイト）"
  why: "画像と 1,200〜1,600 バイトのテキストがあります。画像に対するテキストの比率は依然として低いです。"
  fix:
    - "画像の中ではなく、HTML に実際のテキスト（見出し、段落、行動喚起）を入れてください。"
    - "実際のテキストで、少なくとも数百語を目指してください。画像は挿絵として使ってください。"
    - "各画像に説明的な alt 属性を設定してください。"
sa.html_image_only_20:
  title: "画像があり、テキストが少ない HTML（1,600〜2,000 バイト）"
  why: "画像と 1,600〜2,000 バイトのテキストがあります。"
  fix:
    - "画像の中ではなく、HTML に実際のテキスト（見出し、段落、行動喚起）を入れてください。"
    - "実際のテキストで、少なくとも数百語を目指してください。画像は挿絵として使ってください。"
    - "各画像に説明的な alt 属性を設定してください。"
sa.html_image_only_24:
  title: "画像があり、テキストが少ない HTML（2,000〜2,400 バイト）"
  why: "画像と 2,000〜2,400 バイトのテキストがあります。段落を 1 つ追加すれば、多くの場合この区分から抜けられます。"
  fix:
    - "画像の中ではなく、HTML に実際のテキスト（見出し、段落、行動喚起）を入れてください。"
    - "実際のテキストで、少なくとも数百語を目指してください。画像は挿絵として使ってください。"
    - "各画像に説明的な alt 属性を設定してください。"
sa.html_image_only_28:
  title: "画像があり、テキストが少ない HTML（2,400〜2,800 バイト）"
  why: "画像と 2,400〜2,800 バイトのテキストがあります。減点される最後の区分で、減点が目立つ水準です。"
  fix:
    - "画像の中ではなく、HTML に実際のテキスト（見出し、段落、行動喚起）を入れてください。"
    - "実際のテキストで、少なくとも数百語を目指してください。画像は挿絵として使ってください。"
    - "各画像に説明的な alt 属性を設定してください。"
sa.html_image_only_32:
  title: "画像があり、テキストがやや少ない HTML（2,800〜3,200 バイト）"
  why: "画像と 2,800〜3,200 バイトのテキストがあります。象徴的なスコアです。メッセージはしきい値をほぼ抜けています。"
  fix:
    - "画像の中ではなく、HTML に実際のテキスト（見出し、段落、行動喚起）を入れてください。"
    - "実際のテキストで、少なくとも数百語を目指してください。画像は挿絵として使ってください。"
    - "各画像に説明的な alt 属性を設定してください。"
sa.html_image_ratio_02:
  title: "画像の面積に対して、テキストがごくわずかです"
  why: "テキストは、宣言された画像の面積に比べて非常に小さいです。象徴的なスコアですが、HTML_IMAGE_ONLY 規則の前兆を示します。"
  fix:
    - "HTML のテキストを追加するか、画像の宣言された寸法（width、height）を小さくしてください。"
sa.html_image_ratio_04:
  title: "画像の面積に対して、テキストが少ないです"
  why: "画像の面積に対するテキストの比率が低いです。象徴的なスコアです。"
  fix:
    - "HTML のテキストを追加するか、画像の宣言された寸法（width、height）を小さくしてください。"
sa.html_image_ratio_06:
  title: "画像に対するテキストの比率がかなり低いです"
  why: "画像の面積に対するテキストの比率がまだ低いです。象徴的なスコアです。"
  fix:
    - "HTML のテキストを追加するか、画像の宣言された寸法（width、height）を小さくしてください。"
sa.html_image_ratio_08:
  title: "画像に対するテキストの比率が少し低いです"
  why: "画像の面積に対するテキストの比率が、しきい値のすぐ下にあります。象徴的なスコアです。"
  fix:
    - "HTML のテキストを追加するか、画像の宣言された寸法（width、height）を小さくしてください。"
sa.html_short_link_img_1:
  title: "非常に短い HTML で、クリック可能な画像があります"
  why: "HTML は 1 KB 未満で、クリック可能な画像を含みます。これはスパムの「ポスターをクリック」形式です。ここでは象徴的なスコアですが、短縮リンクと組み合わさると 2 点になります（SHORTENER_SHORT_IMG）。"
  fix:
    - "クリック可能な画像の周囲にテキストを追加し、同等のテキストリンクも置いてください。"
sa.html_short_link_img_2:
  title: "短い HTML で、クリック可能な画像があります"
  why: "HTML は 1〜1.5 KB で、クリック可能な画像を含みます。象徴的なスコアです。"
  fix:
    - "クリック可能な画像の周囲にテキストを追加し、同等のテキストリンクも置いてください。"
sa.html_short_link_img_3:
  title: "やや短い HTML で、クリック可能な画像があります"
  why: "HTML は 1.5〜2 KB で、クリック可能な画像を含みます。減点は小さいです。"
  fix:
    - "クリック可能な画像の周囲にテキストを追加し、同等のテキストリンクも置いてください。"
sa.html_font_low_contrast:
  title: "文字の色が背景に近すぎます"
  why: "テキストの一部が背景とほぼ同じ色のため、見えないか読めません。スパマーはこの方法でフィルターを欺くためにテキストを隠します。ニュースレターでは、背景画像の上の白い文字（SpamAssassin は背景画像を認識しません）や、背景色と同じ色で隠されたプレヘッダーから生じることがよくあります。"
  fix:
    - "淡い文字を置くセルには、背景画像に加えて背景色（bgcolor または background-color）を設定してください。"
    - "プレヘッダーは、背景と同じ色ではなく display:none と mso-hide:all で隠してください。"
sa.html_font_size_huge:
  title: "非常に大きな HTML フォント（24 以上）"
  why: "メッセージは非常に大きなフォントサイズを使っています。象徴的なスコアで、非常に強調されたスタイルに関する情報です。"
  fix:
    - "必須の対応はありません。非常に大きなサイズは、短い見出しに限って使ってください。"
sa.html_font_size_large:
  title: "大きな HTML フォント（18〜24）"
  why: "メッセージは大きめのフォントサイズを使っています。影響のない情報です。"
  fix:
    - "修正は不要です。"
sa.html_font_face_bad:
  title: "HTML のフォント名が無効です"
  why: "<font face=\"...\"> タグの値が、フォント名ではありません（数字、特殊文字）。象徴的なスコアです。"
  fix:
    - "単純なフォント名をカンマで区切って使ってください：Arial, Helvetica, sans-serif。"
sa.t_kam_html_font_invalid:
  title: "HTML の色指定が無効です"
  why: "color や bgcolor の属性値が読めません：# がない、5 桁のコード、未知の名前などです。テスト用のルールで重みはありませんが、複合ルール（CONTENT_AFTER_HTML）に組み込まれます。"
  fix:
    - "色は、# を付けた完全な 16 進数で書いてください：#1a3c6e。"
sa.html_obfuscate_05_10:
  title: "HTML タグの 5〜10% が単語を分断しています"
  why: "タグが単語の途中に挿入されています（Pro<b>mo</b>tion）。スパマーはキーワードを隠すためにこれを行います。単語の一部にだけスタイルを適用するエディターも、同じ効果を生みます。"
  fix:
    - "単語の途中でタグ（<span>、<b>、<font>）によって分断されている語を見つけ、HTML を整理してください。"
    - "HTML が Word または Google ドキュメントからのコピーの場合は、書式なしでテキストを貼り付け、スタイルを設定し直してください。"
sa.html_obfuscate_10_20:
  title: "HTML タグの 10〜20% が単語を分断しています"
  why: "かなりの割合のタグが単語を分断しています。減点は小さいです。"
  fix:
    - "単語の途中でタグ（<span>、<b>、<font>）によって分断されている語を見つけ、HTML を整理してください。"
    - "HTML が Word または Google ドキュメントからのコピーの場合は、書式なしでテキストを貼り付け、スタイルを設定し直してください。"
sa.html_obfuscate_20_30:
  title: "HTML タグの 20〜30% が単語を分断しています"
  why: "約 4 分の 1 のタグが単語を分断しています。2 点の減点です。"
  fix:
    - "単語の途中でタグ（<span>、<b>、<font>）によって分断されている語を見つけ、HTML を整理してください。"
    - "HTML が Word または Google ドキュメントからのコピーの場合は、書式なしでテキストを貼り付け、スタイルを設定し直してください。"
sa.html_obfuscate_90_100:
  title: "ほぼすべての HTML タグが単語を分断しています"
  why: "ほぼすべてのタグが単語の途中に置かれています。意図的な難読化か、非常に不完全に生成された HTML です。2 点。"
  fix:
    - "単語の途中でタグ（<span>、<b>、<font>）によって分断されている語を見つけ、HTML を整理してください。"
    - "HTML が Word または Google ドキュメントからのコピーの場合は、書式なしでテキストを貼り付け、スタイルを設定し直してください。"
sa.html_tag_balance_body:
  title: "body タグの開きと閉じが一致しません"
  why: "</body> が欠けているか、<body> が余分にあります。テンプレートが別のテンプレートに挿入された場合によく起こります。減点は小さいです。"
  fix:
    - "<body>...</body> の組は 1 つだけにし、貼り付けられたブロックのものは削除してください。"
sa.html_tag_balance_head:
  title: "head タグの開きと閉じが一致しません"
  why: "HTML に </head> のない <head>、またはその逆があります。CMS によってテンプレートが断片に分割された場合によくあるケースです。約 1 点。"
  fix:
    - "<body> の前で head タグを閉じ、テンプレートではなく、生成された最終 HTML を確認してください。"
sa.html_tag_balance_center:
  title: "center タグの開きと閉じが一致しません"
  why: "HTML に、正しく閉じられていない <center> タグがあります。SpamAssassin はこれを不正に生成されたスパムの HTML とみなし、3.5 点を加算します。古いニュースレターのテンプレートでよく見られます。"
  fix:
    - "<center> タグを、表に対する align=\"center\" または style の text-align:center に置き換えてください。"
    - "それができない場合は、各 <center> に対応する </center> があることを確認してください。"
sa.html_extra_close:
  title: "HTML の閉じタグが多すぎます"
  why: "HTML が、開かれたことのないタグを閉じています。象徴的なスコアですが、Outlook での表示が予測できなくなることがあります。"
  fix:
    - "HTML をバリデーターに通し、対応する開きタグのない閉じタグを削除してください。"
sa.html_text_invisible_font:
  title: "色またはフォントサイズのために見えなくなっているテキスト"
  why: "いくつかのテキストブロックが、色またはサイズのために見えなくなっています。象徴的なスコアですが、フィルターを汚染する信号です。"
  fix:
    - "不要な隠しテキストを削除してください。プレヘッダーには、display:none で隠した 1 つのブロックを使ってください。"
sa.html_text_invisible_style:
  title: "CSS で隠されたテキストが多く、ほかのスパムの兆候もあります"
  why: "メッセージには、display:none または visibility:hidden で隠された要素が 5 つを超えて含まれ、さらに別の欠陥も組み合わさっています。ニュースレターの編集者は、モバイル版やデスクトップ版のブロックをこの方法で隠すことがよくあります。送信にインフラの問題もある場合は、これだけでしきい値を超えることがあります。"
  fix:
    - "隠しブロックを減らしてください。プレヘッダーは 1 つだけにし、モバイル用の代替は最小限にしてください。"
    - "この規則に伴う別の欠陥（多くの場合は reverse DNS がないこと）を修正してください。"
sa.html_nonelement_30_40:
  title: "HTML タグの 30〜40% が標準ではありません"
  why: "タグの大部分が標準の HTML ではありません。Word からコピーされた Office のタグ（<o:p>、<v:...>）や、Outlook 向けに生成されたタグが原因であることがよくあります。象徴的なスコアです。"
  fix:
    - "Word から貼り付けた HTML を整理し、Outlook 固有のタグは条件付きブロックに限定してください。"
sa.html_comment_saved_url:
  title: "HTML は保存された Web ページです"
  why: "HTML に、Web ページを保存したときに Internet Explorer が追加する「saved from url」コメントが含まれています。Web ページをそのまま送信するのは、スパマーの手口です。"
  fix:
    - "ファイルの先頭にある <!-- saved from url=... --> コメントを削除してください。"
    - "保存された Web ページからではなく、メールエディターでメッセージを作成してください。"
sa.html_title_subj_diff:
  title: "HTML の title が件名よりかなり長いです"
  why: "HTML の <title> タグが、件名の 3.5 倍以上の長さです。テンプレートに、長い汎用のタイトル（「社内ニュースレター、11 月号とお知らせ」）が残っている場合に起こります。2 点を超えます。"
  fix:
    - "<title> には件名と同じテキスト、または短いタイトルを入れてください。"
    - "送信ツールで、テンプレートのタイトルがキャンペーンの件名で埋まるかどうか確認してください。"
sa.html_short_center:
  title: "center タグで中央揃えされた、非常に短い HTML"
  why: "384 バイト未満の HTML が <center> で中央揃えされています。最小限のスパムの形式です。中程度の減点です。"
  fix:
    - "実際の内容を追加し、<center> をスタイルに置き換えてください。"
sa.html_off_page:
  title: "ページ外に配置された HTML 要素"
  why: "要素が、上または左に -100 px 以上ずれて配置されており、画面の外にあります。テキストを隠す手法で、一部のテンプレートがプレヘッダーにも使います。"
  fix:
    - "負の位置指定ではなく、display:none でプレヘッダーを隠してください。"
    - "メッセージに DKIM で署名してください。この規則は適用されなくなります。"
sa.html_entity_ascii:
  title: "HTML エンティティで書かれた ASCII テキスト"
  why: "通常の文字が、テキストではなくエンティティ（&#80;&#114;&#111;...）で書かれています。語を隠す手法です。一部のジェネレーターは、すべてのメールアドレスをこの形式でエンコードします。"
  fix:
    - "テキストは UTF-8 で平文に書いてください。エンティティにするのは、必要な文字（&amp;、&lt;）だけにしてください。"
sa.html_embeds:
  title: "HTML に埋め込みオブジェクトがあります"
  why: "HTML に <embed>、<object>、<applet> タグがあります。一般的なメールソフトはどれもこれを表示しません。象徴的なスコアです。"
  fix:
    - "埋め込みの動画やアニメーションは、それをホストしているページへのリンクを付けた、クリック可能な画像に置き換えてください。"
sa.html_attach:
  title: "HTML の添付ファイル"
  why: "メッセージに HTML ファイルが添付されています。フィッシングは、リンクフィルターを回避して偽のログインページを表示するためにこれを使います。象徴的なスコアですが、多くのゲートウェイがこれらの添付をブロックします。"
  fix:
    - "内容を本文に入れるか PDF にするか、サイトへのリンクを提供してください。"
sa.html_charset_faraway:
  title: "予期しない言語の HTML 文字セット"
  why: "HTML が、テストサーバーが受け付けない言語（アジアやキリル文字）の文字セットを宣言しています。サーバーが ok_locales を制限している場合にのみ発動します。"
  fix:
    - "<meta charset=\"utf-8\"> を宣言し、メッセージ全体を UTF-8 でエンコードしてください。"
sa.html_shrt_cmnt_obfu_many:
  title: "単語の途中にある短い HTML コメントが多数あります"
  why: "短い HTML コメントが単語の途中に挿入されています。キーワードを隠す手法です。"
  fix:
    - "メッセージ本文から HTML コメントを削除してください。少なくとも、テキストに貼り付いたものは削除してください。"
sa.obfuscating_comment:
  title: "単語を分断する HTML コメント"
  why: "HTML コメントが 2 文字の間に置かれています（Fr<!-- -->ee）。一部のエディターは、テキストの途中に書式用のコメントを残します。"
  fix:
    - "テキストに貼り付いた HTML コメントは削除してください。Outlook の条件付きコメントだけをブロックの間に残してください。"
sa.many_span_in_text:
  title: "単語の中に挿入された多数の span タグ"
  why: "span タグが単語の途中で開いて閉じています。エディターは、一部の文字の色や太さを変えると、こうしたタグを生成します。2.5 点近くになります。"
  fix:
    - "テキストを整理し、スタイルは単語全体に適用し、単語の一部には適用しないでください。"
    - "書式なしでテキストをエディターに貼り付け、スタイルを設定し直してください。"
sa.content_after_html:
  title: "閉じの html タグの後にコンテンツがあり、ほかの兆候もあります"
  why: "</html> の後にテキストがあります。スパマーはフィルターを欺くためにランダムなテキストを置きます。フッターや追跡ピクセルを文書の後に追加するツールも、同じ効果を生みます。"
  fix:
    - "すべてのコンテンツ（フッター、追跡ピクセル、表記）は </body></html> の前に置いてください。"
sa.content_after_html_weak:
  title: "閉じの html タグの後にコンテンツがあります"
  why: "</html> の後にテキストが続いています。送信サーバーやウイルス対策ソフトが追加した署名や法的表示であることがよくあります。1 点。"
  fix:
    - "フッターを追加しているのがご自身のサーバーである場合は、それを </body> の前に挿入するよう設定するか、無効にしてください。"
    - "そうでなければ、</html> の後にあるコンテンツをテンプレートから移動してください。"
sa.mixed_href_case:
  title: "href 属性の大文字と小文字が混在しています"
  why: "リンクが <a href= と <A HREF= や <a HREF= の両方で書かれています。この混在は、異なる元から組み立てられた HTML、またはスパムツールに由来します。2 点近くになります。"
  fix:
    - "すべてのタグと属性を小文字で書いてください。HTML フォーマッターなら自動的に行えます。"
sa.mixed_img_case:
  title: "大文字と小文字が混在した img タグ"
  why: "画像タグが大文字と小文字を混在して書かれています（<Img）。手で作成されたか、スパムツールで書き換えられた HTML の兆候です。"
  fix:
    - "<img を小文字で書いてください。"
sa.ac_div_bonanza:
  title: "空の div が 10 個以上続いています"
  why: "HTML に、多くは空の <div> タグが 10 個以上続いています。象徴的なスコアです。エディターのレイアウトの名残です。"
  fix:
    - "空の div を削除し、余白やテーブルの間隔を使ってください。"
sa.ac_br_bonanza:
  title: "改行が 30 個以上続いています"
  why: "HTML に、<br> が 30 個以上連続しています。テキストを表示範囲の外へ押しやる手法、または改行で行うレイアウトです。象徴的なスコアです。"
  fix:
    - "<br> の連続を、CSS の余白（padding、margin）による間隔に置き換えてください。"
sa.long_invisible_text:
  title: "長い隠しテキストのブロック"
  why: "メッセージに、見えない長いテキストのブロックが含まれています。スパマーは、ベイズフィルターを「汚染」するためにそこへテキストを置きます。"
  fix:
    - "不要な隠しテキストのブロックを削除してください。プレヘッダーは 1 文であるべきです。"
sa.word_invis:
  title: "見えなくなっている単語が 1 つあります"
  why: "単語が、フォントサイズ 0 または透明な色によって隠されています。これは隠蔽の手法ですが、ニュースレターのテンプレートもプレヘッダーの間隔にこれを使います。3 点。"
  fix:
    - "テキストを含む font-size:0 または color:transparent の要素を削除してください。"
    - "プレヘッダーには display:none を使い、間隔には、隠されたブロック内の &zwnj;&nbsp; 文字を使ってください。"
sa.t_remote_image:
  title: "メッセージが外部の画像を読み込みます"
  why: "メッセージは、購読に関するテキストなしで、外部サーバーでホストされた画像を表示しています。テスト用のルールで、重みはありません。単なる指摘です。"
  fix:
    - "必須の対応はありません。受信者がなぜこのメッセージを受け取っているかを説明するテキストを追加してください。"
sa.dc_image_spam_html:
  title: "画像スパムの可能性（HTML）"
  why: "メッセージには、大きな画像、ほとんどないテキスト、リンクなしがあります。GIF にテキストを表示する画像スパムの特徴です。"
  fix:
    - "テキストを HTML にし、少なくともご自身のサイトへのリンクを 1 つ追加してください。"
sa.dc_image_spam_text:
  title: "テキストが少ない画像スパムの可能性"
  why: "大きな画像、ほとんどないテキスト、リンクなし。DC_IMAGE_SPAM_HTML と同じ特徴です。"
  fix:
    - "実際のテキストと、ご自身のサイトへのリンクを追加してください。"
sa.long_img_uri:
  title: "非常に長い識別子を含む画像アドレス"
  why: "画像が、45 文字以上のセグメントを含むアドレスから読み込まれています。トラッキングピクセルのようなものです。送信ツールはこの種のアドレスを生成します。減点は小さいです。"
  fix:
    - "メッセージの画像は、ご自身のドメイン配下の読みやすいアドレスでホストしてください。"
sa.uri_img_wp_redir:
  title: "WordPress.com の画像プロキシから配信される画像"
  why: "画像が i0.wp.com または i2.wp.com を経由しています。Jetpack の画像高速化サービスです。スパマーは、画像の出所を隠すためにこのプロキシを使います。SpamAssassin は 1 点を加算します。Jetpack が有効な WordPress の記事の画像を、ニュースレターが再利用したときに起こります。"
  fix:
    - "サイト上の画像の直接のアドレス（https://{domain}/wp-content/uploads/...）を使ってください。"
  fix_by_provider:
    wordpress: "Jetpack の画像高速化（Site Accelerator）を無効にするか、メディアライブラリから画像の元のアドレスをコピーしてください。"
