images.missing_alt:
  title: "画像に代替テキストがありません"
  why: "これらの画像には alt 属性がありません（その一覧は、この異常の下に表示されています）。画像がブロックされると、複数のメールクライアントで既定の設定になっているため、受信者には空の枠しか見えません。"
  fix:
    - "各画像に alt 属性を追加し、何が写っているか、または何をするかを記載してください（例：「冬のコレクションを見る」）。"
    - "純粋に装飾のための画像には、alt=\"\" を設定してください。"
  fix_by_provider:
    mailchimp: "画像をクリックし、Edit を選んで Alt text の欄に入力してください。"
    brevo: "エディターで画像を選択し、右側のパネルで「代替テキスト」の欄に入力してください。"
images.http_insecure:
  title: "暗号化されていない http で画像が読み込まれています"
  why: "画像 {url} は暗号化なしで読み込まれています。一部のクライアントはこれを表示しないか、警告を表示します。また、Microsoft のフィルターはスパムスコアを上げることがあります。"
  fix:
    - "各画像のアドレスで、http:// を https:// に置き換えてください。"
    - "画像をホストしているサーバーの証明書が有効であることを確認してください。"
images.third_party_host:
  title: "画像が第三者のサイトでホストされています"
  why: "画像 {url} は、{domain} でもメール送信ツールでもないサイトから読み込まれています。そのサイトが画像を削除したり、評判が悪かったりすると、画像が消えるか、メッセージも一緒に問題になります。"
  fix:
    - "画像をダウンロードし、{domain} または送信ツールの画像ライブラリでホストしてください。"
    - "その画像を使用する権利があることを確認してください。"
images.ip_host:
  title: "IP アドレスから画像が読み込まれています"
  why: "画像 {url} は、ドメイン名ではなく IP アドレスから読み込まれています。これは場当たり的に作られたサーバーの兆候であり、Microsoft のものを含むフィルターは、メッセージに対してこれを減点材料として数えます。"
  fix:
    - "画像をドメイン名でホストしてください。例：https://{domain}/img/"
images.unreachable:
  title: "メッセージ内の画像が読み込まれません"
  why: "画像 {url} は {status} を返しています。受信者には空の枠や壊れたアイコンが表示され、半分しか中身のないメッセージは不審に見えます。"
  fix:
    - "ブラウザーで画像のアドレスを開き、エラーを確認してください。"
    - "テンプレートのパスを修正するか、画像を再度公開してください。"
    - "ホスティング事業者がリファラーのないリクエストをブロックしている場合は、該当フォルダーの画像への直接の読み込みを許可してください。"
images.wrong_content_type:
  title: "画像のアドレスが、画像ではない内容を返しています"
  why: "アドレス {url} は、画像ではなく {value} 型の内容を返しています。多くの場合、ログインページやエラーページです。画像は表示されません。"
  fix:
    - "画像が公開されており、ログインを要求しないことを確認してください。"
    - "共有ページのリンクではなく、画像ファイルへの直接リンクを使ってください。"
images.too_heavy:
  title: "画像のサイズが非常に大きいです"
  why: "画像 {url} のサイズは {value} です。モバイルでは表示に時間がかかり、データ通信量も消費します。読者は、見る前にメッセージを閉じてしまうことがよくあります。"
  fix:
    - "メッセージ内で表示される寸法に合わせて画像をリサイズしてください。高解像度の画面向けに、余裕を持たせるのは問題ありません。"
    - "写真は JPEG で、ロゴやベタ塗りの画像は PNG で圧縮してください。"
images.image_heavy:
  title: "画像がテキストを大きく上回っています"
  why: "メッセージの大半が画像で構成されています。画像がブロックされると、受信者にはほとんど何も見えず、フィルターがメッセージを判断するテキストも少なすぎます。"
  fix:
    - "重要な情報（オファー、日付、価格、ボタン）は画像から出し、HTML のテキストで書いてください。"
    - "画像は説明のために使い、メッセージを伝えるためには使わないでください。"
images.inline_cid_many:
  title: "メッセージに、埋め込みの添付画像が多数含まれています"
  why: "メッセージには、cid: で参照される埋め込み画像が {value} 件含まれています。それぞれがメッセージを重くし、一部のクライアントはこれらを添付ファイルとしても表示するため、不審な送信に見えます。"
  fix:
    - "画像を {domain} または送信ツールにホストし、https のアドレスで参照してください。"
    - "ダウンロードなしで表示させたい場合は、埋め込み画像はロゴ1つにとどめてください。"
  fix_by_provider:
    microsoft_365: "Outlook では、本文に貼り付けた画像が埋め込み画像になります。ニュースレターの場合は、メールクライアントではなく送信ツールを使ってください。"
    wordpress: "通知用のプラグインが画像を埋め込み添付として追加する場合は、そのオプションを無効にし、サイトでホストした画像を使ってください。"
images.tracking_pixel:
  title: "メッセージに開封測定用のピクセルが含まれています"
  why: "メッセージには、開封を測定する目に見えない画像が含まれています。ニュースレターではよくありますが、Microsoft Defender の「Web bugs」オプションを有効にしている組織では、これらのメッセージを高い信頼度でスパムに分類します。"
  fix:
    - "トランザクションメールや個人的なやり取りでは、送信ツールの開封測定を無効にしてください。"
    - "Microsoft 365 を使う企業へのニュースレターでは、ピクセルあり・なしで到達率を比較してください。"
images.tracking_pixel_without_content:
  title: "メッセージには追跡ピクセルしかなく、ほかにほぼ何もありません"
  why: "追跡ピクセルを含むほぼ空のメッセージは、主にアドレスが有効かどうかを確かめるために使われます。これはスパム送信者の手口であり、フィルターはそれを認識します。"
  fix:
    - "テンプレートの内容が送信時に実際に渡されているか確認してください。"
    - "技術的なテストメッセージであれば、追跡ピクセルを削除してください。"
images.missing_dimensions:
  title: "画像に幅が宣言されていません"
  why: "幅が宣言されていないと、大きな画像が Outlook for Windows ではみ出すことがあり、画像がブロックされるとレイアウトがずれます。"
  fix:
    - "各画像に width 属性を追加してください（ピクセル単位、単位なし）。縦横比が固定されている場合は height も追加してください。"
    - "モバイルでの表示のために、style='max-width:100%;height:auto' を追加してください。"
images.redirecting_src:
  title: "画像のアドレスがリダイレクトを経由しています"
  why: "画像 {url} は、リダイレクトの後に配信されています。表示が遅くなり、一部の画像プロキシはすべてのリダイレクトをたどらないことがあります。"
  fix:
    - "メッセージには、画像ファイルの最終的なアドレスを記載してください。"
