sa.mime_html_only:
  title: "メッセージにテキスト版がありません"
  why: "メッセージには HTML しか含まれていません。直接の減点は小さいものの、いくつかのより重いルール（TO_NO_BRKTS_HTML_ONLY、TO_EQ_FM_HTML_ONLY など）の条件になります。PHP のスクリプトや一部のエディターは HTML だけを送信します。"
  fix:
    - "読みやすい text/plain パートと HTML パートを含む multipart/alternative で送信してください。"
    - "送信ツールでテキスト版の自動生成を有効にし、生成されたテキストを確認してください。"
  fix_by_provider:
    wordpress: "wp_mail() は 1 つのパートしか送信しません。テキスト版を追加するには、phpmailer_init フックに登録した関数内で $phpmailer->AltBody を設定してください。"
sa.mime_html_only_multi:
  title: "multipart メッセージにテキストパートがありません"
  why: "メッセージは multipart/alternative（テキストと HTML）と宣言していますが、HTML しか含まれていません。構造上はテキスト版があると示しているのに、実際には存在しません。象徴的なスコアです。"
  fix:
    - "不足している text/plain パートを追加するか、メッセージを単純な text/html にしてください。"
sa.mime_html_mostly:
  title: "HTML の隣にあるテキストパートがほぼ空です"
  why: "テキスト版は存在しますが、ほぼ空です（「お使いのソフトでは HTML を読めません」）。フィルターはこれをテキストがないものとして扱います。"
  fix:
    - "テキスト版を HTML と同じ内容で埋めてください：見出し、段落、プレーンテキストのリンク。"
sa.mpart_alt_diff:
  title: "テキスト版と HTML 版の内容が異なります"
  why: "テキスト版は HTML とほとんど一致していません。汎用的な文章、古い内容、別のテンプレートのテキスト版などです。スパマーは無害な文章をテキストに、本当の内容を HTML に入れます。"
  fix:
    - "この配信の最終的な HTML から、テキスト版を作り直してください。"
    - "古いテンプレートのテキスト版を残さないでください。"
sa.mpart_alt_diff_count:
  title: "テキスト版の単語数が HTML よりかなり少ないです"
  why: "テキストと HTML の間で異なる単語数が大きく偏っています。テキスト版が HTML の内容を反映していません。1 点を超える減点になります。"
  fix:
    - "HTML からテキスト版を自動生成し、その後で修正してください。"
sa.mime_no_text:
  title: "multipart メッセージに、テキストとして識別できるパートがありません"
  why: "メッセージは multipart ですが、テキストとして宣言されたパートがありません。すべてが添付ファイルか、テキスト以外の型です。象徴的なスコアですが、X-Mailer に PHP が含まれていると 3 点近くになります。"
  fix:
    - "メッセージの内容を説明する text/plain または text/html パートを追加してください。"
sa.mime_qp_long_line:
  title: "quoted-printable の行が長すぎます"
  why: "quoted-printable でエンコードされた行が、規格の長さ（76 文字）を超えています。象徴的なスコアですが、一部のサーバーはこれらの行を分割し、HTML や DKIM 署名を壊すことがあります。"
  fix:
    - "quoted-printable のエンコードは自分で書かず、送信ライブラリに任せてください。"
sa.mime_base64_text:
  title: "プレーンテキストが base64 でエンコードされています"
  why: "ASCII のみのテキストパートが base64 でエンコードされており、単純なフィルターには読めなくなっています。アクセントのないテキストには理由がありません。スパマーは内容を隠すためにこれを行います。1.5 点を超えます。"
  fix:
    - "テキストパートは quoted-printable または 7bit でエンコードし、charset=UTF-8 を宣言してください。"
sa.base64_length_79_inf:
  title: "79 文字を超える base64 の行"
  why: "base64 でエンコードされたパートの行が長すぎます。MIME の規格ではこの行は 76 文字に制限されています。分割せずに base64_encode() でエンコードするスクリプトは、1 行だけの出力を作ります。1.5 点。"
  fix:
    - "base64 を 76 文字の行に分割するか（PHP では chunk_split()）、送信ライブラリにエンコードさせてください。"
sa.base64_length_78_79:
  title: "78 文字の base64 の行"
  why: "base64 パートの行が 78 文字あり、規定の 76 文字を超えています。減点は小さいです。"
  fix:
    - "base64 を 76 文字の行に分割してください。"
sa.mime_header_ctype_only:
  title: "Content-Type はあるが、ほかの MIME ヘッダーがありません"
  why: "メッセージに Content-Type はありますが、MIME-Version がありません。MIME を使うなら必須です。ヘッダーが手書きされたことを示しています。減点は小さいです。"
  fix:
    - "MIME-Version: 1.0 ヘッダーを追加するか、ライブラリでメッセージを構築してください。"
sa.mime_suspect_name:
  title: "添付ファイル名が内容と一致しません"
  why: "添付ファイルの拡張子が、宣言された型と一致しません（例: PDF が画像として宣言されている）。マルウェアはこのように偽装します。"
  fix:
    - "添付ファイルは正しい MIME 型で添付してください（PDF なら application/pdf）。ライブラリは拡張子から型を判定します。"
sa.mime_charset_faraway:
  title: "予期しない言語の MIME 文字セット"
  why: "メッセージの一部が、テストサーバーが受け付けない言語の文字セットで宣言されています。この規則は、サーバーが ok_locales を制限している場合にのみ発動します。"
  fix:
    - "メッセージ全体を UTF-8 でエンコードしてください。"
sa.charset_faraway_header:
  title: "ヘッダーに、予期しない言語の文字セットがあります"
  why: "件名または送信者名が、外国の文字セット（big5、koi8-r など）でエンコードされています。この規則は、サーバーが ok_locales を制限している場合にのみ発動しますが、その場合は 3 点を超えます。"
  fix:
    - "件名と送信者名を UTF-8 でエンコードしてください。"
sa.bogus_mime_version:
  title: "MIME-Version ヘッダーが無効です"
  why: "MIME-Version ヘッダーの値が 1.0 ではありません。1.0 が唯一存在する値です。スクリプトがこのヘッダーを手書きし、誤字が入った場合によく見られます。"
  fix:
    - "MIME-Version: 1.0 と正確に書いてください。"
sa.mimepart_limit_exceeded:
  title: "MIME パートが多すぎます"
  why: "メッセージには MIME パートが非常に多く、SpamAssassin は解析を打ち切りました。象徴的なスコアですが、このようなメッセージはすべてのフィルターで疑わしいとされます。"
  fix:
    - "添付ファイルをアーカイブにまとめるか、ダウンロードリンクを提供してください。"
sa.empty_message:
  title: "テキスト内容のないメッセージ"
  why: "メッセージにテキストも添付ファイルもありません。空のテスト送信やアドレス確認のメッセージは、このような特徴を持ちます。2 点を超えます。"
  fix:
    - "空の送信ではなく、実際の内容でテストしてください。"
sa.pp_mime_fake_ascii_text:
  title: "ASCII と宣言されたテキストに、それ以外の文字が含まれています"
  why: "テキストパートは ASCII と宣言されている（または何も宣言していない）のに、アクセント付きの文字を含んでいます。受信側では「é」が「Ã©」になることがあります。"
  fix:
    - "テキストパートには Content-Type: text/plain; charset=UTF-8 を宣言してください。"
sa.t_mime_malf:
  title: "MIME ヘッダーが本文の中にあります"
  why: "本文に、パートのヘッダーであるべき Content-Type 行が含まれています。MIME の構造が壊れています。テスト用のルールで、重みはありません。"
  fix:
    - "MIME はライブラリで構築し、パートのヘッダーと内容の間に空行があることを確認してください。"
sa.body_8bits:
  title: "本文に長い 8 ビット文字の並びがあります"
  why: "本文に、ASCII 以外のバイト列が長く続いています。非ラテン文字の言語や、誤ってエンコードされたテキストに典型的です。ok_languages を制限しているサーバーにのみ関係します。1.5 点。"
  fix:
    - "宣言されたエンコード（UTF-8）を確認し、誤って変換されたテキストがないか確かめてください。"
sa.null_in_body:
  title: "メッセージに NUL バイトがあります"
  why: "メッセージに、メールでは禁止されている NUL 文字が含まれています。通常、エンコードされていないバイナリファイルを挿入したか、UTF-16 のテキストが原因です。1.6 点。"
  fix:
    - "添付ファイルは base64 でエンコードし、テキストは UTF-16 ではなく UTF-8 で保存してください。"
sa.mime_php_no_text:
  title: "テキストパートがなく、X-Mailer が PHP です"
  why: "PHP のスクリプトが、テキストパートのないマルチパートメッセージを送信しています。3 点近くになります。大量送信スクリプトの特徴です。"
  fix:
    - "メッセージにテキストパートを追加し、X-Mailer PHP ヘッダーを削除してください。"
    - "AltBody を設定した PHPMailer または Symfony Mailer を使ってください。"
sa.malf_html_b64:
  title: "<html> タグのない HTML が base64 でエンコードされています"
  why: "メッセージは <html> タグのない HTML の断片で、base64 でエンコードされています。この 2 つの欠陥が一緒になると、大量送信ツールの特徴になります。"
  fix:
    - "完全な HTML 文書を quoted-printable でエンコードして送信してください。"
sa.encrypted_message:
  title: "暗号化されたメッセージ"
  why: "メッセージは暗号化されています（PGP または S/MIME）。スパマーはほとんど行いません。1 点のボーナスです。"
  fix:
    - "修正は不要です。"
sa.microsoft_executable:
  title: "Windows プログラムが添付されています"
  why: "添付ファイルが Windows のプログラムまたはスクリプトであるか、それらを実行する拡張子を持っています。SpamAssassin では減点は小さいですが、ほとんどのプロバイダーはこれらの添付ファイルをブロックします。"
  fix:
    - "実行ファイルやスクリプトは決して添付せず、サイト上のダウンロードリンクを提供してください。"
    - ".url または .lnk（ショートカット）が誤って添付されていないか確認してください。"
sa.gmd_pdf_encrypted:
  title: "暗号化された PDF が添付されています"
  why: "添付の PDF がパスワードで保護されているか暗号化されているため、解析できません。マルウェアは保護された PDF をよく利用します。"
  fix:
    - "PDF を保護せずに送信するか、安全なリンクで文書を共有してください。"
sa.gmd_pdf_empty_body:
  title: "本文が空の PDF 添付"
  why: "メッセージには PDF しかなく、テキストがありません。請求書や見積書が自動送信される場合によくあるケースですが、偽の請求書によるフィッシングでも使われます。"
  fix:
    - "文書を紹介する数行を追加してください（請求書番号、金額、連絡先）。"
  fix_by_provider:
    wordpress: "WooCommerce または請求書用プラグインで、PDF に添付されるメール本文を補完してください。"
sa.any_bounce_message:
  title: "自動返信メッセージ"
  why: "メッセージは不達通知、不在応答、またはウイルス警告です。情報の提供のみです。テストしようとしたメッセージではありません。"
  fix:
    - "メッセージをテスト用アドレスに送ったか、返信を誤って転送していないか確認してください。"
sa.bounce_message:
  title: "サーバーからの不達通知"
  why: "メッセージは、サーバーが送信した不達通知です。情報の提供のみです。"
  fix:
    - "このテストでは修正は不要です。このような通知が多く届く場合は、送信リストを整理してください。"
