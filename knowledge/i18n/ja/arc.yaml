arc.chain_fail:
  title: "ARCチェーンが壊れています"
  why: "中継サーバーがARCヘッダーを追加しましたが、それらはもう検証できません。受信側は、転送によるDMARCの失敗をARCで補うことができず、{domain} が p=quarantine または p=reject を適用している場合、メッセージは迷惑メールになるか拒否されるおそれがあります。"
  fix:
    - "ヘッダーから、失敗しているARCインスタンス（i=1、i=2…）と、それを追加したサーバーを特定してください（ARC-Sealの d= フィールド）。"
    - "そのサーバーが自社のもの（ゲートウェイ、ウイルス対策、メーリングリストなど）であれば、自身の変更後にメッセージへ署名しているか、DNSに公開された鍵を使っているかを確認してください。"
    - "第三者のサーバーであれば、そのサーバーの管理者に、メッセージの完全なヘッダーを送ってください。"
arc.seal_invalid:
  title: "ARCシール（ARC-Seal）が検証できません"
  why: "ARCチェーンを守るシールが無効です。チェーン全体が拒否され、それが運んでいた認証結果も失われます。"
  fix:
    - "失敗しているARC-Sealの d= と s= フィールドを読み、s._domainkey.d のDNSレコードを照会して、鍵が存在するか確認してください。"
    - "鍵を最近変更した場合は、処理中のメッセージが配信されるまで、古い鍵を再公開してください。"
    - "シールを付けたサーバーより後ろのサーバーが、ARCヘッダーを書き換えていないか確認してください。"
arc.message_signature_invalid:
  title: "最後のARC封印の後にメッセージが変更されました"
  why: "最後のARC仲介者より後ろのサーバーが、署名された本文またはヘッダーを変更しました。ARCチェーンは無効になり、DMARCの失敗を救えたはずの証明も失われます。"
  fix:
    - "Received ヘッダーで、次のサーバーを特定してください（フッターの追加、件名の変更、ウイルス対策など）。"
    - "そのサーバーが、変更後に自分でARCインスタンスを追加するように設定するか、メッセージを変更しないように設定してください。"
arc.incomplete_set:
  title: "ARCインスタンスが不完全です"
  why: "同じARCインスタンスに属する3つのヘッダーのうち1つが欠けています。チェーンは無効になり、受信側にとって意味を持たなくなります。"
  fix:
    - "不完全なインスタンス（i=）と、それを追加したサーバーを特定してください。"
    - "そのサーバーが3つのヘッダーを必ず一緒に出力しているか、また下流のフィルターがいずれかを削除していないか確認してください。"
arc.instance_sequence:
  title: "ARCインスタンスの番号付けに矛盾があります"
  why: "ARCインスタンスが欠けているか、2回現れています。受信側はチェーンを無効と判断し、メッセージからARCによる利点が失われます。"
  fix:
    - "ヘッダーで番号の飛びや重複を特定し、それを生成したサーバーを確認してください。"
    - "そのサーバーが、既に存在する最大の番号の次の番号で新しいインスタンスを付けるように修正してください。"
arc.cv_inconsistent:
  title: "ARCシールの cv= フィールドに矛盾があります"
  why: "最初のシールは cv=none を示し、以降のシールは cv=pass か cv=fail を示す必要があります。値に矛盾があると、チェーン全体が無効になります。"
  fix:
    - "問題のインスタンスを追加したサーバーを特定してください（ARC-Sealの d= フィールド）。"
    - "そのサーバーのARCソフトウェア（例：OpenARC、Rspamd のARCモジュール）を更新するか、異常を開発元に報告してください。"
arc.too_many_instances:
  title: "メッセージに50を超えるARCインスタンスがあります"
  why: "ARCチェーンは50段までに制限されています。これほど多い場合は、ほぼ常に2つのサーバー間で転送ループが起きています。最終的には拒否されます。"
  fix:
    - "Received ヘッダーを読み、互いにメッセージを送り返している2つのサーバーを特定してください。"
    - "ループを作っている転送ルールまたはエイリアスを削除してください。"
arc.missing_on_forward:
  title: "ARCなしで中継されたため、DMARCに失敗しています"
  why: "中継者が、ARCによる証明を残さずにメッセージを転送または変更しました。受信側にはDMARCの失敗だけが見え、{domain} のポリシーが適用されます。その結果、メッセージが迷惑メールになるか、拒否されるおそれがあります。"
  fix:
    - "中継者が自社のサーバー（自動転送、メーリングリスト、ゲートウェイ）であれば、そのサーバーでARCシーリングを有効にしてください。"
    - "元の送信元で、{domain} のDKIM署名を付けてもらってください。DKIM署名は単純な転送の後も残りますが、SPFは残りません。"
    - "メーリングリストの場合は、元のドメインが厳格なDMARCポリシーを公開しているとき、Fromアドレスをリストのアドレスに置き換えるオプションを、そのソフトウェアで有効にしてください。"
  fix_by_provider:
    postfix: "転送を行うサーバーに、ARCミルター（OpenARC、または arc モジュールを備えた Rspamd）を追加してください。"
arc.valid_untrusted:
  title: "ARCは有効ですが、DMARCは失敗しています"
  why: "中継者は、メッセージが通過する前に認証されていたことを正しく証明しています。受信側は、そのシーラーを信頼するなら、DMARCの失敗にもかかわらずメッセージを配信できますが、そうする義務はありません。"
  fix:
    - "受信側のメールを管理している場合は、ARCシーラーのドメインを、信頼するシーラーの一覧に追加してください。"
    - "送信側での恒久的な解決策は、{domain} に揃えたDKIM署名です。転送後も残ります。"
  fix_by_provider:
    microsoft_365: "Microsoft Defender ポータルで、Email & collaboration、Policies & rules、Threat policies、Email Authentication Settings を開き、ARC タブで Add をクリックして、ARC-Seal ヘッダーの d= フィールドにあるドメインを入力してください（自社のドメインではありません）。PowerShell では、Set-ArcConfig -Identity Default -ArcTrustedSealers \"sealer-domain.example\" を使います（このコマンドは既存の一覧を置き換えます）。"
