dmarc-report.forwarding:
  title: "{ip}（逆引き DNS：{ptr}）による転送の可能性があります"
  why: "{domain} からの {value} 件のメールが、メールを中継するサーバー（アドレスの転送、メーリングリスト）経由で届いています。この場合、SPF は仕組み上失敗します。これは正常です。転送されたメールが認証されたままなのは、DKIM のおかげだけです。"
  fix:
    - "{ip} を SPF に追加しないでください。お客様が管理していないサーバーに、{domain} の名義でメールを送信する許可を与えてしまいます。"
    - "すべての送信が、d={domain} を指定した DKIM で署名されていることを確認してください。転送を生き延びられる認証は、それだけです。"
    - "ほかに必要な対応はありません。p=reject に移行する前に、転送の途中で DKIM 署名が壊れたメール（件名や本文を変更するリストなど）は DMARC に失敗し、拒否されるおそれがあることに注意してください。"
dmarc-report.more_sources:
  title: "整合していないほかの送信元 {value} 件は、詳細が表示されません"
  why: "各カテゴリで、件数の多い上位 10 件だけに詳細ページがあります。それ以外は、件数と整合状況を含めて送信元の表に掲載されています。"
  fix:
    - "送信元の表を開き、メール数で並べ替えてください。"
    - "ここに詳細がある送信元から先に対応してください。送信サービスを 1 つ修正すると、複数の IP がまとめて解決することがよくあります。"
dmarc-report.low_volume:
  title: "レポートの件数がまだ少ないです（{value} 件のメール）"
  why: "提出されたレポートがカバーしているのは {value} 件のメールだけです。月 1 回の配信や、ほとんど使われていないツールは、まだ表示されていない可能性があります。整合率はまだ代表的な値ではありません。"
  fix:
    - "今後数週間分のレポートを、レポートを送ってくるすべての受信者から提出してください。"
    - "このレポートだけを根拠に、DMARC のポリシーを厳しくしないでください。"
