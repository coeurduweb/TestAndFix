infrastructure.shared_ip:
  title: "メッセージは {provider} の共有 IP から送信されています"
  why: "IP の評判は {provider} の他の顧客と共有されています。送信量が少ないか不定期な場合は利点ですが、隣の顧客が不適切に送信すると不利になります。ドメインの評判は、あなたのものとして残ります。"
  fix:
    - "送信量が少ない場合は、共有 IP のままにしてください。定期的な送信量のない専用 IP は、評判を確立しにくいためです。"
    - "大量に定期的に送信する場合は、{provider} の専用 IP の提供内容を確認してください。"
    - "いずれにしても、{domain} を（DKIM 整合で）認証し、ドメインの評判が IP に依存しないようにしてください。"
  fix_by_provider:
    postmark: "Postmark は、月に 30 万通以上を送信するアカウントに専用 IP を割り当てています。"
    sendgrid: "SendGrid は、Pro（Email API）および Advanced（Marketing Campaigns）のプランから専用 IP を割り当てています。"
    brevo: "Brevo の Enterprise プランには専用 IP が含まれます。ほかのプランにもオプションで追加できます。"
    amazon_ses: "SES には、標準またはマネージドの専用 IP があり、追加料金がかかります。"
    mailchimp: "専用 IP は有料オプションで、Mailchimp の判断により割り当てられます。"
    hubspot: "Dedicated IP または Transactional Email のモジュールがない場合、マーケティングメールは HubSpot の共有 IP を経由します。"
infrastructure.ipv6_not_in_spf:
  title: "サーバーが IPv6（{ip}）で送信しましたが、そのアドレスは SPF にありません"
  why: "SPF はサーバーの IPv4 を許可していますが、このメッセージは IPv6 から送られました。ネットワーク経路によって、メッセージが SPF に通ったり失敗したりするため、問題の原因が分かりにくくなります。"
  fix:
    - "SPF に ip6:{ip}（またはサーバーの /64 プレフィックス）を追加してください。"
    - "この IPv6 にも reverse DNS と、対応する AAAA レコードがあることを確認してください。"
    - "対応が難しい場合は、サーバーを IPv4 のみで送信するよう設定してください。"
  fix_by_provider:
    postfix: "IPv4 を強制するには、main.cf に smtp_address_preference = ipv4 または inet_protocols = ipv4 を設定し、postfix reload を実行してください。"
infrastructure.web_server_mail:
  title: "メッセージは Web サーバーから送られ、メールサービスを経由していません"
  why: "サイトはサーバーの mail() 関数で直接送信しています。Return-Path はサーバーのもの（{envelope_domain}）になり、整合した SPF も {domain} の DKIM もありません。これらのメッセージ（フォーム、注文、パスワード）は、迷惑メールに入ることがよくあります。"
  fix:
    - "サイトは、ご自身のメールサービスの認証付き SMTP サーバー、またはトランザクションメールのサービスから送信させてください。"
    - "送信者には、実在する {domain} のアドレスを使ってください。"
    - "テストをやり直してください。{domain} で SPF と DKIM の両方が通る必要があります。"
  fix_by_provider:
    wordpress: "SMTP プラグインをインストールし、{domain} のアカウントでメールサービスの SMTP サーバー（TLS の 587 番ポート、または SSL の 465 番ポート）を設定してから、プラグインからテストメールを送信してください。"
    cpanel: "ホスティングを続ける場合は、cPanel で {domain} のメールボックスを作成し、サイトからその認証付き SMTP で送信させてください。cPanel は、構成によっては DKIM が PHP のメールに署名しない場合があると案内しています。"
    o2switch: "cPanel で {domain} のアドレスを作成し、サイトでそれを認証付き SMTP として使ってください。o2switch は、自社サービスの SPF として include:spf.jabatus.fr のみを挙げています。"
infrastructure.dns_inconsistent:
  title: "{domain} の DNS サーバーが、すべて同じ応答を返すわけではありません"
  why: "問い合わせた DNS サーバーによって、受信者は新しい構成か古い構成のどちらかを見ることになります。SPF、DKIM、DMARC の結果が、明確な理由なくメッセージごとに変わります。"
  fix:
    - "レジストラに登録されたネームサーバーの一覧を、現在の DNS ホスティングの一覧と比較し、古いホスティングのものを削除してください。"
    - "セカンダリサーバーを管理している場合は、ゾーンのシリアル番号を増やし、ゾーン転送が機能しているか確認してください。"
    - "テストをやり直してください。すべてのサーバーが同じレコードを返す必要があります。"
infrastructure.dns_lame_server:
  title: "{domain} に登録されている DNS サーバーが正しく応答していません"
  why: "{domain} へのクエリの一部が、応答しないサーバーに届いています。受信者は一時的なエラーを受け取り、メッセージの配送を遅らせたり、正しく評価できなかったりします。"
  fix:
    - "テストで示された問題のサーバーを特定してください。"
    - "そのサーバーをレジストラのネームサーバー一覧から削除するか、{domain} のゾーンを提供するよう設定してもらってください。"
infrastructure.cname_at_apex:
  title: "{domain} のゾーンのルートが CNAME のエイリアスになっています"
  why: "ルートの CNAME は、そこに MX や SPF を公開することを禁じます。DNS サーバーによって、これらのレコードは無視されるか、CNAME のほうが無視されます。そのため、メールは不安定に動作します。"
  fix:
    - "ルートの CNAME を A と AAAA レコードに置き換えるか、DNS ホスティングのフラット化機能（ALIAS、ANAME、CNAME flattening）を使ってください。"
    - "その後、ルートに MX と TXT（SPF）を通常どおり公開してください。"
  fix_by_provider:
    cloudflare_dns: "Cloudflare は、ルートに置かれた CNAME をアドレスに解決します（CNAME flattening）。その後、MX と TXT がルートに公開され、配信されていることを確認してください。"
infrastructure.mail_host_proxied:
  title: "{domain} のメールサーバーが Cloudflare のプロキシの後ろに隠れています"
  why: "MX のアドレスは Cloudflare の Web プロキシのもので、メールを転送しません。{domain} 宛てのメッセージ（返信や不達通知を含む）は配送できません。"
  fix:
    - "Cloudflare で、MX に記載されたホスト名の A または AAAA レコードを開いてください。"
    - "それを DNS only（グレーの雲）に切り替え、実際のメールサーバーの IP を指していることを確認してください。"
  fix_by_provider:
    cloudflare_dns: "DNS, Records：レコードをクリックし、Proxy status（DNS only）を無効にしてから保存してください。"
infrastructure.domain_expiring:
  title: "ドメイン {domain} の期限が 30 日以内に切れます"
  why: "期限が切れると、ドメインは機能しなくなります。メール、サイト、認証がすべて同時に止まり、ドメインは第三者に再登録されることもあります。"
  fix:
    - "レジストラでドメインを更新してください。"
    - "自動更新を有効にし、登録されている支払い方法が有効であることを確認してください。"
infrastructure.open_relay:
  title: "{domain} のサーバー {value} はオープンリレーです"
  why: "誰でもこのサーバーを経由してスパムを送信できます。数時間でブロックリストに登録され、正当な送信もすべて拒否されます。"
  fix:
    - "直ちにリレーを信頼されたネットワークと認証済みのユーザーに制限してください。"
    - "キューを確認し、保留中のスパムを削除してください。"
    - "その後、ブロックリストを確認し、必要な削除を依頼してください。"
  fix_by_provider:
    postfix: "main.cf で smtpd_relay_restrictions = permit_mynetworks, permit_sasl_authenticated, reject_unauth_destination を設定し、mynetworks を 127.0.0.0/8 [::1]/128 に限定してから、postfix reload を実行してください。"
    exim: "relay_from_hosts の hostlist が localhost だけを含み、RCPT の ACL が認証なしのローカル以外の宛先を拒否することを確認してください。"
infrastructure.smtp_banner_mismatch:
  title: "{domain} の MX サーバーが、別の名前（{value}）を名乗っています"
  why: "サーバーは、MX と reverse DNS の名前とは異なる名前を名乗っています。ブロッキングにはなりませんが、送信時に HELO として使うのと同じ名前であることが多く、そこでメッセージの評価に影響します。"
  fix:
    - "サーバーに、バナー、HELO、reverse DNS、A レコードのすべてで使う一意の名前を付けてください。"
  fix_by_provider:
    postfix: "バナーは $myhostname（smtpd_banner）から取られます。myhostname を MX の名前に設定してください。"
infrastructure.ns_single:
  title: "{domain} のネームサーバーは 1 つだけです"
  why: "そのサーバーが停止すると、{domain} のすべての名前が応答しなくなります。サイト、MX、SPF、DKIM、DMARC が同時に消え、届いたメールもエラーで戻されるようになります。"
  fix:
    - "DNS ホスティングに、そのネームサーバーの一覧を尋ねてください。ほとんどは少なくとも 2 つを提供しています。"
    - "レジストラで、{domain} に少なくとも 2 つのネームサーバーを登録してください。"
    - "自分で DNS サーバーを運用している場合は、ゾーン転送で同期される、別の事業者のセカンダリサーバーを追加してください。"
infrastructure.ns_unresolvable:
  title: "{domain} のネームサーバーに、アドレスがありません"
  why: "サーバー {value} は {domain} に登録されていますが、その名前から IP アドレスが得られません。リゾルバーは問い合わせできず、時間を無駄にします。これが唯一の有効なサーバーであれば、ドメイン全体が応答しなくなります。"
  fix:
    - "レジストラで、{domain} のネームサーバー一覧を DNS ホスティングが示すものと比べ、{value} の名前を修正してください。"
    - "{value} がご自身のドメイン（ns1.{domain} など）の名前である場合は、その IP アドレスをレジストラに登録してください（グルーレコード、glue）。"
    - "そのサーバーがもう存在しない場合は、委任から削除してください。"
infrastructure.ns_same_network:
  title: "{domain} のネームサーバーがすべて同じネットワークにあります"
  why: "サーバーはすべてネットワーク {value} にあります。そのネットワークの障害や攻撃で、すべてが同時に切断され、{domain} はどこでも応答しなくなります。RFC 2182 は、異なるネットワークに分散したセカンダリサーバーを求めています。"
  fix:
    - "DNS ホスティングが分散型のエニーキャストサービスを提供している場合は、この確認は無視して構いません。"
    - "そうでなければ、別の事業者のネームサーバー（ゾーン転送で同期される DNS の二次サービス）を追加してください。"
    - "そのサーバーをレジストラと {domain} のゾーンに登録してください。"
infrastructure.ns_parent_child_mismatch:
  title: "レジストリと {domain} のゾーンに登録されたネームサーバーが異なります"
  why: "レジストリと {domain} のゾーンが、同じサーバーを挙げていません。リゾルバーによって、応答がどちらの一覧から来るかが異なります。1 つのホスティングで行った変更は、一部の受信者にしか見えません。"
  fix:
    - "詳細に表示される 2 つの一覧を確認してください。レジストリ（親）の一覧と、ゾーンの一覧です。"
    - "どの DNS ホスティングを正とするか決め、レジストラの一覧とゾーンの NS レコードをそのサーバーに揃えてください。"
    - "ホスティングを変えたばかりの場合は、両側から古いサーバーを削除し、NS の TTL が切れるまで古いゾーンを更新し続けてください。"
infrastructure.soa_missing:
  title: "{domain} のゾーンに読み取れる SOA がありません"
  why: "どのネームサーバーも {domain} の SOA レコードを返しませんでした。登録されたサーバーはおそらくゾーンを提供していません。ドメインの DNS 応答（MX、SPF、DKIM）が不確かになるか、消えてしまいます。"
  fix:
    - "DNS ホスティングで、{domain} のゾーンが存在し、有効であることを確認してください。"
    - "レジストラに登録されたネームサーバーと、ホスティングから割り当てられたものを比較してください。"
    - "自分のサーバーであれば、DNS サーバーのログでゾーンがエラーなく読み込まれていることを確認し、再読み込みしてください。"
infrastructure.soa_serial_mismatch:
  title: "{domain} のサーバーがゾーンの同じバージョンを持っていません"
  why: "SOA のシリアル番号が異なります（{value}）。あるサーバーが最新の変更を受け取っていません。問い合わせたサーバーによって、受信者は古いか新しいバージョンのレコードを見ることになります。"
  fix:
    - "ゾーンを変更したばかりであれば、数分後に確認をやり直してください。"
    - "差異が続く場合は、最後の変更時にプライマリサーバーでシリアル番号が増えているか確認してください。"
    - "セカンダリへのゾーン転送が許可され、機能しているか確認してください（サーバーのログ、NOTIFY）。または DNS ホスティングに同期を依頼してください。"
infrastructure.caa_missing:
  title: "{domain} に CAA レコードがありません"
  why: "CAA がないと、どの認証局でも {domain} の証明書を発行できます。これはエラーではありませんが、ウェブサイトやメールサーバーに対して不正に取得された証明書を防ぐ保護が 1 つ欠けています。"
  fix:
    - "実際に証明書を発行している認証局（ウェブサイト、MX、MTA-STS ポリシー）を確認してください。発行元は各証明書に記載されています。"
    - "{domain} のルートに、認証局ごとの issue レコードを公開してください。"
    - "拒否された要求を知らせてもらうために、必要に応じて iodef を追加してください。"
infrastructure.caa_unknown_critical:
  title: "未知の重要な CAA レコードが {domain} の証明書をブロックしています"
  why: "タグ {value} は重要（フラグ 128）とマークされていますが、認識されたタグではありません。認証局はその場合、すべての発行を拒否しなければなりません。証明書（サイト、MX、MTA-STS）の更新が失敗します。"
  fix:
    - "{domain} の DNS ゾーンで、タグが {value} である CAA レコードを探してください。"
    - "issue、issuewild、iodef のスペルミスであれば修正するか、フラグを 0 に戻してください。"
    - "役に立っていないレコードは削除してください。"
infrastructure.domain_expired:
  title: "ドメイン {domain} は期限切れです"
  why: "有効期限（{value}）を過ぎています。レジストラはいつでもドメインを停止できます。サイト、メール、認証がすべて同時に止まり、やがてドメインは削除され、第三者による再登録の対象になります。"
  fix:
    - "レジストラで {domain} を直ちに更新してください。期限切れの後もしばらくは、通常どおり更新できます。"
    - "登録されている所有者のメールアドレスと支払い方法が有効であることを確認し、今後の通知を受け取れるようにしてください。"
    - "自動更新を有効にしてください。"
infrastructure.domain_hold:
  title: "ドメイン {domain} は保留（hold）中です"
  why: "ステータス {value} により、{domain} は DNS から外されています。ドメインのどの名前も応答しません。サイト、MX、SPF も同様です。宛てのメールは戻され、送信は認証で失敗します。"
  fix:
    - "レジストラに連絡してください。ステータスの理由（未払い、紛争、削除の要請など）を把握しています。"
    - "受信箱で、レジストラからのメッセージを探してください。多くは所有者の連絡先情報の確認依頼で、そのリンクをたどってください。"
    - "serverHold はレジストリが設定したものです。これもレジストラを通してください。レジストラがレジストリとの連絡を担当します。"
infrastructure.domain_pending_delete:
  title: "ドメイン {domain} は削除処理中です"
  why: "ステータス {value} は、{domain} が削除され、その後再販されることを示します。ドメインはすでに機能していません。消去されると、誰でも登録して、あなた宛てのメールを受信し、あなたの名義で送信できるようになります。"
  fix:
    - "すぐにレジストラに連絡してください。redemptionPeriod の段階であれば、通常は有料で復元できます。"
    - "pendingDelete のみの場合は、もう復元できません。ドメインが解放され次第再登録するか、メールアドレスを移行する準備をしてください。"
    - "ドメインを取り戻したら、自動更新を有効にしてください。"
infrastructure.domain_not_registered:
  title: "ドメイン {domain} は登録されていません"
  why: "レジストリは {domain} を把握していません。存在しないか、削除されています。このドメインのどのアドレスもメールを受信できず、認証もできません。誰でも登録できる状態です。"
  fix:
    - "入力したドメイン名のスペルを確認してください。"
    - "ドメインがかつてあなたのものだった場合は、レジストラに連絡し、空いていればできるだけ早く再登録してください。"
    - "メッセージで受け取ったリンクの場合は、たどらないでください。誰でもこのドメインを登録し、好きなページを公開できます。"
