phishing.safe_browsing:
  title: "Google Safe Browsing がこのリンクを危険と分類しています（{value}）"
  why: "Google は {url} を危険なサイトの一覧（{value}）に分類しました。Chrome を含む Safe Browsing を使うブラウザーは、このアドレスに赤い警告ページを表示します。このリンクを含むメッセージは脅威として扱われます。"
  fix:
    - "リンクを開かず、そのページに何も入力しないでください。"
    - "すでに入力してしまった場合は、直ちに該当するパスワードを、使用しているすべての場所で変更してください。カードを渡した場合は、銀行に連絡してカードを停止してください。"
    - "メッセージを Signal Spam（https://www.signal-spam.fr/）に報告してください。"
    - "サイトが自分のものである場合は、ハッキングされた可能性が高いです。該当するすべてのページをクリーンアップし、Google Search Console で「セキュリティの問題」レポートを開いて、「審査をリクエスト」をクリックしてください。"
phishing.virustotal:
  title: "VirusTotal の {value} 個のエンジンが、このリンクを悪意あるものとして報告しています"
  why: "複数の独立したセキュリティエンジンが {url} を危険と分類しています。1つのエンジンだけでは誤ることもありますが、複数が一致している場合は、誤りであることは稀です。"
  fix:
    - "リンクを開かないでください。"
    - "すでに開いて情報を入力した場合は、該当するパスワードを変更し、カードを渡した場合は銀行に連絡してください。"
    - "サイトが自分のものである場合は、VirusTotal の詳細ページで該当するエンジンを確認し、サイトをクリーンアップしてから、分析を再実行してください。"
    - "エンジンが誤っている場合は、VirusTotal の詳細ページのリンクを付けて、そのエンジンの開発元に連絡してください。VirusTotal 自身は判定を変更しません。"
phishing.virustotal_single:
  title: "VirusTotal のエンジン1つだけが、このリンクを報告しています"
  why: "単独のエンジンは誤ることがよくあります。この信号だけで {url} を判断することはできませんが、このレポートの他の手掛かりに加わります。"
  fix:
    - "VirusTotal の詳細ページを開き、どのエンジンがどの判定でリンクを報告しているか確認してください。"
    - "このレポートの他のチェックが良好で、サイトが古くから知られている場合は、通常は誤検知です。"
    - "サイトが自分のものである場合は、誤検知を該当するエンジンの開発元に、VirusTotal の詳細ページのリンクを付けて報告してください。"
phishing.urlhaus:
  title: "URLhaus がこのリンクを、マルウェアを配布するものとして記録しています"
  why: "abuse.ch と Spamhaus が運営する URLhaus は、マルウェアを配布しているアドレスを記録しています。{url} は記録されています（{value}）。そのデータベースは、アンチウイルスソフトやブロックリストの開発元と共有されています。"
  fix:
    - "リンクを開かず、何もダウンロードしないでください。"
    - "すでにファイルを開いてしまった場合は、そのマシンをネットワークから切断し、ウイルス対策の完全スキャンを実行してください。"
    - "サイトが自分のものである場合は、悪意あるファイルを削除し、どのように置かれたのか（脆弱な拡張機能、盗まれた FTP パスワードなど）を調べてから、https://contact.abuse.ch/ で abuse.ch に連絡してください。"
phishing.urlhaus_host:
  title: "サイト {domain} には、URLhaus に記録された他の悪意あるリンクがあります"
  why: "このリンクそのものは記録されていませんが、{domain} 上の他のアドレス {value} 件が、現在マルウェアを配布しています。これは、サイトがハッキングされているか、キャンペーン用に用意されたことを示しています。"
  fix:
    - "クリーンアップされるまでこのサイトを避け、そこから何もダウンロードしないでください。"
    - "サイトが自分のものである場合は、URLhaus に記録されたアドレスの一覧を確認し、ファイルを削除して脆弱性を修正してから、https://contact.abuse.ch/ で abuse.ch に連絡してください。"
phishing.openphish:
  title: "このリンクは OpenPhish のフィッシングリストに含まれています"
  why: "OpenPhish は、検出したフィッシングページを公開しています。{url} もそこに含まれています。このページは、認証情報や支払い情報を盗むことで知られたサービスを模倣しています。"
  fix:
    - "リンクを開かず、何も入力しないでください。"
    - "パスワードを入力した場合は、直ちに公式サイトで、使用しているすべての場所のパスワードを変更し、二要素認証を有効にしてください。"
    - "カードを渡した場合は、銀行に連絡してカードを停止してください。"
    - "ページを Phishing Initiative（https://phishing-initiative.fr/contrib/）に、メッセージを Signal Spam（https://www.signal-spam.fr/）に報告してください。"
phishing.openphish_host:
  title: "サイト {domain} の他のページが、OpenPhish のリストに含まれています"
  why: "このアドレスそのものはリストにありませんが、{domain} の他のページが含まれています。サイトがフィッシングキャンペーンの土台として使われている場合や、ハッキングされている場合に起こります。"
  fix:
    - "このサイトのうち、パスワード、コード、支払いを求めるページには注意してください。"
    - "サービスにログインするときは、公式アドレスをブラウザーに自分で入力してください。"
    - "サイトが自分のものである場合は、知らないうちに追加されたページ（隠しフォルダーや普段使わないサブフォルダーに置かれていることが多い）を探して削除し、ホスティングへのアクセスパスワードを変更してください。"
phishing.brand_lookalike:
  title: "ドメイン {url} は {value} のものに似せられています"
  why: "この名前は {value} のものに似ていますが、そのものではありません。アドレスをさっと読む人の注意に頼る、フィッシングで最も一般的な手口です。正規のサイトは {domain} です。"
  fix:
    - "このリンクは使わないでください。公式アドレス {domain} をブラウザーに自分で入力するか、アプリから利用してください。"
    - "このページにログイン情報やカード情報を入力した場合は、{domain} でパスワードを変更し、該当する組織と銀行に連絡してください。"
    - "アドレスを Phishing Initiative（https://phishing-initiative.fr/contrib/）に報告してください。"
phishing.deep_subdomains:
  title: "アドレス {url} にはサブドメインが {value} 階層重ねられています"
  why: "多数のサブドメインからなる名前は、よく知られた名前をアドレスの先頭、つまり人が最初に目にする場所に置くために使われることがよくあります。本当の所有者は末尾にあり、それは {domain} です。"
  fix:
    - "アドレスは右から左へ読んでください。本当の所有者は {domain} で、先頭に何と書かれていても関係ありません。"
    - "{domain} があなたの期待するサービスでない場合は、そのページに何も入力しないでください。"
phishing.js_redirect:
  title: "リンクはページのスクリプトによってリダイレクトされます"
  why: "ページ {url} は、通常のリダイレクトの代わりに JavaScript で訪問者を別の場所へ送ります。スクリプトを読まないフィルターは、本当の宛先を見ることができません。この手法は、フィッシングページを隠すためによく使われます。"
  fix:
    - "リンクを信頼する前に、このレポートに表示されたチェーンの最終的な宛先を確認してください。"
    - "サイトが自分のものである場合は、スクリプトによるリダイレクトを、サーバーで設定した HTTP 301 または 302 のリダイレクトに置き換えてください。"
phishing.credential_form:
  title: "別のサイトになりすましているページが {value} を求めています"
  why: "最終ページには {value} を求めるフォームがあり、そのサイトにはなりすましの兆候があります。これはフィッシングページそのものの形です。入力した内容は、ページの作成者のもとに送られます。"
  fix:
    - "このページには何も入力しないでください。"
    - "すでに入力してしまった場合は、公式サイトで、使用しているすべての場所のパスワードを変更し、二要素認証を有効にしてください。カードを渡した場合は、銀行に連絡してカードを停止してください。"
    - "ページを Phishing Initiative（https://phishing-initiative.fr/contrib/）に、メッセージを Signal Spam（https://www.signal-spam.fr/）に報告してください。"
phishing.form_on_page:
  title: "最終ページが {value} を求めています"
  why: "他のなりすましの兆候は見つかりませんでした。多くの正規サイトにも、ログインページや支払いページがあります。期待しているサービスかどうかを判断できるのは、アドレスだけです。ここでは {domain} です。"
  fix:
    - "何かを入力する前に、アドレスバーのドメイン名が期待しているサービスのものか確認してください。"
    - "迷ったら、リンクをたどるのではなく、サービスのアドレスを自分で入力して開いてください。"
phishing.title_brand_mismatch:
  title: "ページのタイトルは {value} に言及していますが、サイトは {domain} です"
  why: "ページのタイトルが、そのドメインに属さないブランドの名前を挙げています。記事や比較ページならこれは普通のことです。ただし、{value} のページを名乗るページであれば、なりすましの兆候です。"
  fix:
    - "ページが {value} のものを名乗っている場合は、何も入力せず、そのブランドの公式サイトを利用してください。"
    - "そのページがその後フォームへリダイレクトする場合は、その新しいアドレスで確認をやり直してください。"
