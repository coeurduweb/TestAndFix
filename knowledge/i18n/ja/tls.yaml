tls.inbound_plaintext:
  title: "メッセージがTLS暗号化なしで送信されました"
  why: "受信側が暗号化に対応していたのに、サーバーはメッセージを平文で送りました。Gmail はすべての送信者に TLS 接続を求めており、内容は経路上で読み取られるおそれがあります。"
  fix:
    - "送信サーバーの送信に対して、日和見暗号化（STARTTLS）を有効にしてください。"
    - "最新の TLS ライブラリがインストールされていること、また特定のドメインに対して TLS を無効にする設定になっていないことを確認してください。"
    - "テストをやり直してください。Received ヘッダーに with ESMTPS と表示されるはずです。"
  fix_by_provider:
    postfix: "main.cf で smtp_tls_security_level = may を設定し（追跡用に smtp_tls_loglevel = 1 も設定）、postfix reload を実行してください。"
    exim: "remote_smtp トランスポートで hosts_try_tls = *（既定値）のままにし、受信者を対象とする hosts_avoid_tls がないことを確認してください。"
    wordpress: "SMTP拡張機能で、TLS（ポート 587）または SSL（ポート 465）を選んでください。「なし」は選ばないでください。"
tls.inbound_old_version:
  title: "メッセージは {value} で送信されました。これは古いTLSバージョンです"
  why: "TLS 1.0 と 1.1 は RFC 8996 で廃止されています。受信サーバーはこれらをますます拒否するようになっています。そのためサーバーは、平文に戻るか、配信できなくなるおそれがあります。"
  fix:
    - "送信サーバーのシステムと TLS ライブラリ（OpenSSL、GnuTLS）を更新してください。"
    - "送信ソフトウェアの設定で、TLS 1.2 と TLS 1.3 を許可してください。"
    - "テストをやり直し、Received ヘッダーに表示されるバージョンを確認してください。"
  fix_by_provider:
    postfix: "main.cf で smtp_tls_protocols = >=TLSv1.2 を設定し（Postfix 3.6 以降。それ以前の場合は !SSLv2, !SSLv3, !TLSv1, !TLSv1.1）、postfix reload を実行してください。"
tls.inbound_weak_cipher:
  title: "TLS接続で弱い暗号スイート（{value}）が使われました"
  why: "サーバーが交渉した暗号は、破られているか、メッセージを守るには弱すぎます。また、古いソフトウェアであることも示しており、受信者はいずれそれを拒否するようになります。"
  fix:
    - "送信サーバーのTLSライブラリを更新してください。"
    - "設定から RC4、3DES、NULL、export、匿名の暗号スイートを削除してください。"
  fix_by_provider:
    postfix: "main.cf で smtp_tls_ciphers = medium、smtp_tls_exclude_ciphers = aNULL, eNULL, RC4, 3DES, MD5 を設定し、postfix reload を実行してください。"
tls.submission_without_tls:
  title: "送信用のパスワードが暗号化されずに送られました"
  why: "ソフトウェアが TLS なしで送信サーバーに認証しました。ネットワークを傍受している誰でも、ログイン情報を取得して、あなたの名前でスパムを送れるおそれがあります。その結果、{domain} のレピュテーションが損なわれます。"
  fix:
    - "メールソフトウェアやアプリで、SSL/TLS によるポート 465、または STARTTLS を必須にしたポート 587 を選んでください。"
    - "パスワードが傍受された可能性があるため、アカウントのパスワードを変更してください。"
    - "サーバー側では、TLS なしの認証を拒否してください。"
  fix_by_provider:
    postfix: "送信（submission）サーバー側で、main.cf に smtpd_tls_auth_only = yes を設定してください。"
    wordpress: "SMTP拡張機能で、SSL（465）または TLS（587）を選んでください。"
tls.mx_no_starttls:
  title: "{domain} の受信サーバーが暗号化に対応していません"
  why: "{domain} 宛てのメッセージは平文で流れます。TLS を要求する送信側（MTA-STS、社内ポリシー）は、あなたに配信できません。また、メッセージへの返信も経路上で読み取れてしまいます。"
  fix:
    - "受信サーバーに、MX で使われている名前の証明書をインストールしてください（Let's Encrypt で十分です）。"
    - "サーバーのポート 25 で STARTTLS を有効にしてください。"
    - "テストをやり直してください。EHLO の応答に STARTTLS が含まれているはずです。"
  fix_by_provider:
    postfix: "main.cf で smtpd_tls_cert_file と smtpd_tls_key_file を設定し、smtpd_tls_security_level = may を設定してから、postfix reload を実行してください。"
    exim: "メイン設定で tls_certificate と tls_privatekey を設定し、tls_advertise_hosts = * のままにしてください。"
tls.mx_starttls_broken:
  title: "{domain} の MX が通知する暗号化が失敗しています"
  why: "{domain} のサーバーは TLS に対応していると示していますが、ネゴシエーションが失敗します。送信側によっては、メッセージが遅延するか、平文で配信されるか、破棄されます。受信メールの一部を失うことになります。"
  fix:
    - "テストの時点で、受信サーバーのログを確認し、TLS のエラーを読んでください。"
    - "証明書と鍵のファイルが存在し、サービスから読み取れ、かつ互いに対応していることを確認してください。"
    - "TLS 1.2 と TLS 1.3 を有効にして、サービスを再起動してください。"
tls.mx_old_version_only:
  title: "{domain} の MX は、古いTLSバージョンしか受け付けません"
  why: "最新の送信側は TLS 1.0 と 1.1 を拒否します。このサーバーでは、送信側は平文で配信するか、まったく配信しなくなります。特に MTA-STS を適用している送信側がそうです。"
  fix:
    - "受信サーバーのシステムと TLS ライブラリを更新してください。"
    - "SMTP の設定で TLS 1.2 と TLS 1.3 を有効にしてください。"
  fix_by_provider:
    postfix: "main.cf で smtpd_tls_protocols = >=TLSv1.2 を設定し（Postfix 3.6 以降）、postfix reload を実行してください。"
tls.mx_cert_expired:
  title: "{domain} の MX のTLS証明書が期限切れです"
  why: "{domain} が MTA-STS ポリシーを公開しているため、証明書を検証する送信側は配信を拒否します。その他の送信側は、本人性の保証なしで配信します。"
  fix:
    - "受信サーバーの証明書を更新してください。"
    - "更新を自動化し（certbot renew など）、更新のたびに SMTP サービスを再読み込みしてください。"
tls.mx_cert_expiring:
  title: "{domain} の MX のTLS証明書がまもなく期限切れになります"
  why: "2週間以内に、証明書を検証する送信側は {domain} に配信できなくなります。"
  fix:
    - "自動更新が機能していることを確認してください（例：certbot renew --dry-run）。"
    - "SMTP サービスが、Web サーバーだけでなく新しい証明書を再読み込みしているか確認してください。"
tls.mx_cert_self_signed:
  title: "{domain} の MX が自己署名証明書を提示しています"
  why: "自己署名証明書は接続を暗号化しますが、サーバーの本人性は証明しません。MTA-STS を有効にすることはできず、それを要求する送信側はあなたに配信しません。"
  fix:
    - "MX の名前に対して、認められた認証局の証明書に置き換えてください（Let's Encrypt は無料です）。"
    - "DANE を使っている場合は、新しい証明書をインストールする前に、対応する TLSA を公開してください。"
tls.mx_cert_name_mismatch:
  title: "{domain} の MX の証明書が正しい名前を持っていません"
  why: "証明書は、あなたの MX の名前とは別の名前で発行されています。MTA-STS を適用する送信側を含め、サーバーの本人性を検証する送信側は配信を拒否します。"
  fix:
    - "MX の名前（例：mx1.{domain}）を正確に対象とする証明書を発行してください。"
    - "または、MX が現在の証明書で対象になっている名前を指すように変更してください。"
tls.mx_cert_chain_incomplete:
  title: "{domain} の MX が完全な証明書チェーンを送信していません"
  why: "中間証明書がありません。一部の送信側は証明書を検証できず、{domain} が MTA-STS を公開している場合は、その送信側からの配信がブロックされます。"
  fix:
    - "中間証明書を含むファイルでサーバーを設定してください（Let's Encrypt では fullchain.pem）。"
    - "SMTP サービスを再起動し、テストをやり直してください。"
  fix_by_provider:
    postfix: "smtpd_tls_cert_file を cert.pem ではなく fullchain.pem に向け、postfix reload を実行してください。"
tls.dane_tlsa_mismatch:
  title: "{domain} の MX の TLSA（DANE）レコードが、もはや証明書と一致しません"
  why: "DANE を検証する送信側は、TLSA が提示された証明書と一致しない限り、{domain} への配信を拒否します。配信を遅らせた後、エラーとして返します。"
  fix:
    - "現在の証明書の公開鍵のフィンガープリントを計算してください（使用法 3 1 1：DANE-EE、SPKI、SHA-256）。"
    - "この新しい TLSA を、古いものと並べて _25._tcp.<MX の名前> に公開してください。"
    - "次回の更新では、同じ鍵を再利用する（certbot --reuse-key）か、新しい鍵をインストールする前にその TLSA を公開してください。"
tls.dane_unsigned:
  title: "{domain} の MX は、署名されていないゾーンに TLSA を公開しています"
  why: "DNSSEC がないと、送信側はあなたの TLSA レコードを無視します。それらは何の保護もせず、誤った安心感を与えるだけです。"
  fix:
    - "MX の名前を含むゾーンで DNSSEC を有効にし、DS をレジストラに公開してください。"
    - "または、ゾーンが署名されるまで TLSA を削除してください。"
tls.dane_pkix_usage:
  title: "{domain} の MX の TLSA が、SMTP で非推奨の使用法を使っています"
  why: "使用法 0 と 1 は認証局に依存しますが、メールサーバー同士はその認証局について合意していません。DANE を使う送信側は、これらを使えないものとして扱うことがあります。"
  fix:
    - "これらのレコードを、証明書の公開鍵に基づく TLSA 3 1 1 に置き換えてください。"
    - "TTL の期間は新旧を並行して残し、その後で古いものを削除してください。"
tls.web_cert_expired:
  title: "{domain} のHTTPS証明書が期限切れです"
  why: "ブラウザーは {url} でセキュリティ警告を表示します。きちんと管理されたサイトは、証明書を期限切れにしません。サイトが放棄されているか、名乗っているサイトではない可能性があります。"
  fix:
    - "ブラウザーの警告を無視して、そのサイトに情報を入力しないでください。"
    - "サイトが自分のものである場合は、証明書を更新し（現在の発行者：{value}）、更新を自動化してください（例：スケジュールされたタスクでの certbot renew）。"
    - "その後、Web サーバーが再読み込みされ、新しい証明書を配信していることを確認してください。"
tls.web_cert_self_signed:
  title: "{domain} のHTTPS証明書は自己署名です"
  why: "この証明書を保証する認められた機関はありません。誰でも {domain} の名前で証明書を作れます。ブラウザーはセキュリティ警告を表示し、暗号化はサイトの本人性について何も証明しません。"
  fix:
    - "ブラウザーの警告を無視して、そのサイトに情報を入力しないでください。"
    - "サイトが自分のものである場合は、{domain} に対して認められた認証局の証明書に置き換えてください。Let's Encrypt は無料で発行しており、ほとんどのホスティング業者はパネルからインストールできます。"
tls.web_cert_name_mismatch:
  title: "提示された証明書は {domain} のものではありません"
  why: "サーバーは、{domain} とは別の名前で発行された証明書を提示しています。ブラウザーは警告を表示します。サイトの設定が誤っているか、そのアドレスが期待しているサービスに通じていないかのどちらかです。"
  fix:
    - "ブラウザーの警告を無視して、そのサイトに情報を入力しないでください。"
    - "サイトが自分のものである場合は、{domain} を正確に対象とする証明書を発行してください（www あり・なしの両方を使う場合は、その両方）。"
    - "共有ホスティングでは、ドメインがサイトに正しく紐づけられていること、またホスティングのパネルでそのドメインに対して証明書が要求されていることを確認してください。"
tls.web_cert_untrusted:
  title: "{domain} のHTTPS証明書が認識されていません"
  why: "{url} の証明書チェーンは、認められた認証局までさかのぼりません（発行者：{value}）。多くの場合、サーバーが中間証明書を送信していないことが原因です。一部のブラウザーやソフトウェアは警告を表示し、そうでないものもあります。"
  fix:
    - "このリンクを受け取った場合は、そのサイトでブラウザーの警告が出たら注意し、迷ったら何も入力しないでください。"
    - "サイトが自分のものである場合は、認証局から提供された完全なチェーンでサーバーを設定し（Let's Encrypt では fullchain.pem）、Web サーバーを再読み込みしてください。"
    - "認証局がまったく認識されない場合は、認められた認証局の証明書に置き換えてください。"
tls.web_cert_recent_free:
  title: "新しいドメインについて、{value} 前に無料の証明書が発行されました"
  why: "無料の証明書はそれ自体は正常で安全です。しかし、数週間前に登録されたドメインに数日前に発行された証明書は、フィッシングキャンペーン用に用意されたサイトの典型的な特徴です。ブラウザーの鍵マークは、サイトが誠実かどうかについて何も示しません。"
  fix:
    - "鍵マークを信用しないでください。ドメイン名 {domain} が、期待しているサービスのものか確認してください。"
    - "迷ったら、公式アドレスを自分で入力してサービスを開いてください。"
    - "サイトが自分のもので、公開されたばかりの場合、この表示はドメインの年齢とともに自然に消えます。"
