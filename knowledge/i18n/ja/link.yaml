link.shortener:
  title: "リンクが URL 短縮サービスを経由しています"
  why: "{url} は短縮されたアドレスで、リンク先について何も示していません。公開の短縮サービスは、フィッシングページを隠すためにも使われます。実際の宛先は、ツールが読んだリダイレクトチェーンに表示されています（{domain}）。"
  fix:
    - "短いアドレスではなく、チェーンに表示された最終的な宛先でリンクを判断してください。"
    - "自分でこのリンクを配布している場合は、代わりに {domain} 上のページの完全なアドレスを使ってください。"
link.nonstandard_port:
  title: "リンクが一般的でないポート（{value}）を指しています"
  why: "公開サイトは、ポート 80（http）と 443（https）で応答します。{url} はポート {value} を要求しています。これはテスト用サーバー、公開されている機器、急ごしらえのサーバーに典型的で、企業のサイトであることは稀です。"
  fix:
    - "何かを入力する前に、そのサーバーを本当に期待していたか確認してください。"
link.domain_listed:
  title: "ドメイン {domain} が {list_name} に登録されています"
  why: "{list_name} は、スパム、フィッシング、マルウェアに使われるドメインを一覧にしています。メールフィルターや複数のセキュリティツールがこれを参照するため、{domain} へのリンクは危険なものとして扱われます。"
  fix:
    - "このレポートがすでにページの内容を説明しているため、リンクを開かないでください。わざわざ見に行く必要はありません。"
    - "ドメインが自社のものである場合は、原因（サイトのハッキング、迷惑送信）を探して修正し、{delist_url} で削除を申請してください。"
link.domain_recent:
  title: "ドメイン {domain} は {value} 前に作成されました"
  why: "フィッシングキャンペーンは、数日から数週間しか使われないドメインを使い、見つかり次第すぐに放棄します。新しいドメインが悪意あるものとは限りませんが、信頼の根拠となる履歴がまだありません。"
  fix:
    - "リンクが、あなたが知っているサービスのもののように見えるなら、{domain} をそのサービスの公式ドメインと比べてください。"
    - "迷った場合は、公式のアドレスをブラウザーに自分で入力してください。"
link.unreachable:
  title: "最終ページを確認できませんでした（{value}）"
  why: "宛先 {url} がエラーを返すか、応答しません。フィッシングページが、ホスティング業者によってすでに削除されている場合にも、この結果になります。その場合、判定はレピュテーションの情報源、アドレス自体、およびエラーページの内容に基づきます。"
  fix:
    - "数分後に確認をやり直してください。一時的なサーバー障害でも同じ結果になります。"
    - "ページを表示せずに応答を確認するには、隔離された端末（仮想マシンやテスト用サーバー）から、アドレスの前に curl -I を付けて実行してください。このコマンドはレスポンスのヘッダーだけを読みます。"
    - "特定のページを期待していた場合は、そのアドレスを教えてくれた人に、別の手段で確認してください。"
link.redirect_chain:
  title: "リンクは {value} 回のリダイレクトを経由しています"
  why: "最終ページの前に、{url} は何度も別のアドレスへ転送します。広告のトラッキングリンクは1回か2回追加しますが、複数のドメインにまたがる長いチェーンは、フィルターから本当の宛先を隠すためにも使われます。"
  fix:
    - "チェーン内の最終ページのドメインに注目してください。判断の基準になるのはそのドメインです。"
link.punycode_lookalike:
  title: "リンクのドメインが、別の名前を模倣する文字で書かれています"
  why: "{url} には、他のアルファベット（キリル文字、ギリシャ文字）の文字や、ラテン文字に似た数字が含まれています。画面上では有名なドメインの名前に見えますが、実際は別の誰かのものです。"
  fix:
    - "このリンクは使わないでください。サービスのアドレスを、ブラウザーに自分で入力してください。"
    - "このページにログイン情報を入力した場合は、公式サイトでパスワードを変更してください。"
link.private_target:
  title: "リンクがプライベートネットワークのアドレスを指しています"
  why: "チェーンの一段が {domain} に向かっていますが、これは社内ネットワーク内にしか存在しないアドレスです。公開サイトがこれを行う理由はありません。ツールはこの段階をたどれませんでした。"
  fix:
    - "リンクが自社サイトから来ている場合は、設定が誤ったリダイレクトを探してください（本番環境に残されたテスト用アドレスなど）。"
