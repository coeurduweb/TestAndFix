html.invalid_structure:
  title: "HTML に構造の誤りがあります"
  why: "解析で {value} 件の構造の誤りが見つかりました。Google は、標準に準拠した HTML を求めています。壊れたコードは、クライアントごとに異なる表示になり、雑に作られたスパムのテンプレートに似て見えます。"
  fix:
    - "HTML を検証ツール（validator.w3.org の Validate by Direct Input タブ）に通し、閉じられていないタグを修正してください。"
    - "ワープロソフトから書き出した HTML を貼り付けている場合は、きれいなメールテンプレートからやり直してください。"
html.no_doctype:
  title: "HTML に doctype 宣言がありません"
  why: "doctype がないと、Web メールやアプリケーションはメールを互換モードで表示します。余白、文字サイズ、配置がクライアントごとに変わります。"
  fix:
    - "HTML の部分の 1 行目に <!DOCTYPE html> を追加してください。"
    - "コンテンツを html、head（meta charset 付き）、body で囲んでください。"
html.script_tag:
  title: "HTML に JavaScript が含まれています"
  why: "メールクライアントはスクリプトを実行しませんが、その存在は悪意のあるメールの強い兆候です。Microsoft は、こうしたメールを高い確信度でスパムに分類することを提案しています。"
  fix:
    - "メールから script タグをすべて削除してください。"
    - "インタラクション（カウンター、フォーム、カルーセル）は、{domain} のページへのリンクに置き換えてください。"
html.event_handlers:
  title: "HTML に JavaScript の属性（onclick、onload など）があります"
  why: "属性 {value} は JavaScript です。どのメールクライアントでも動作せず、フィルターはこれをスクリプトとして扱います。"
  fix:
    - "on で始まるすべての属性（onclick、onload、onmouseover など）を削除してください。"
    - "マウスオーバーの効果には、style ブロック内の CSS の疑似クラス :hover を使ってください。"
html.iframe:
  title: "HTML に iframe があります"
  why: "iframe は、ほとんどのクライアントで表示されず、外部のコンテンツを隠して読み込むために使われます。Microsoft は、こうしたメールを高い確信度でスパムに分類することを提案しています。"
  fix:
    - "iframe を削除してください。"
    - "動画や地図の場合は、埋め込まれているページ（{domain} のページ）へのリンクとなるクリック可能な画像を置いてください。"
html.form:
  title: "HTML にフォームがあります"
  why: "メール内のフォームは、ほとんどの場合、認証情報を盗むために使われます。Microsoft は、こうしたメールを高い確信度でスパムに分類することを提案しており、多くのクライアントはフォームを無効にします。"
  fix:
    - "メールからフォームを削除してください。"
    - "{domain} にある HTTPS のフォームへのリンクを持つボタンを置いてください。"
html.object_embed:
  title: "HTML に object タグまたは embed タグがあります"
  why: "これらのタグは、モジュールや文書をページに読み込むために使われます。メールクライアントでは動作せず、Microsoft はこうしたメールをスパムとして分類することを提案しています。"
  fix:
    - "object、embed、applet のタグを削除してください。"
    - "埋め込まれているコンテンツを、画像と {domain} へのリンクに置き換えてください。"
html.meta_refresh:
  title: "HTML に自動リダイレクト（meta refresh）があります"
  why: "meta refresh タグは、クリックなしで読者を別のページへ送ろうとします。これはフィッシングの手口です。フィルターはこれを罰し、クライアントは無視します。"
  fix:
    - "meta http-equiv='refresh' タグを削除してください。"
    - "HTML が Web ページ由来の場合は、メール用に作られたテンプレートからやり直してください。"
html.base_href:
  title: "HTML に base タグがあります"
  why: "base タグは、相対リンクすべての送り先を変えてしまいます。クライアントによって扱いが異なるため、リンクが別の場所を指すおそれがあり、フィルターもこれを警戒します。"
  fix:
    - "base タグを削除してください。"
    - "すべてのリンクと画像は完全なアドレスで書いてください（例：https://{domain}/page）。"
html.external_stylesheet:
  title: "書式が外部のスタイルシートに依存しています"
  why: "メッセージは、スタイルシートを {url} から読み込んでいます。ほとんどのクライアントはそれを読み込まないため、受信者にはスタイルのないメールが表示されます。"
  fix:
    - "必要な CSS のルールを、メールの head 内の style ブロックにコピーしてください。"
    - "重要なルール（色、サイズ、幅）は、要素の style 属性にも設定してください。"
    - "link rel='stylesheet' タグと @import を削除してください。"
html.external_fonts:
  title: "メールが外部のフォントを読み込んでいます"
  why: "外部のフォントは、すべてのクライアントで表示されるわけではなく、第三者のサーバーへの追加のリクエストも発生させます。代替フォントがない場合、テキストが予期しないフォントで表示されることがあります。"
  fix:
    - "常に代替フォントのリストを指定してください。例：font-family: 'Your Font', Arial, Helvetica, sans-serif。"
    - "代替フォントだけを使った状態で、メールの表示を確認してください。"
html.base64_inline_heavy:
  title: "HTML に base64 でエンコードされた画像があります"
  why: "base64 で埋め込まれた画像は、HTML の容量を {value} 増やしています。複数のクライアントはそれを表示せず、メールは Gmail に切り詰められるほど重くなります。"
  fix:
    - "画像を {domain} または送信ツールにホストし、各 src='data:...' を画像の https アドレスに置き換えてください。"
    - "どうしても必要なら、ごく小さなアイコンだけをインラインで残しても構いません。ただし、それも同様にホストするのが望ましいです。"
html.hidden_text_color:
  title: "文字が、その色によって隠されています（白い文字を白い背景に）"
  why: "テキストの一部が、背景と同じ色になっています。Google は、HTML と CSS で内容を隠すことを禁じています。これは既知のスパム手法で、罰せられます。"
  fix:
    - "見えないテキストを削除してください。"
    - "プレビューテキスト（preheader）の場合は、配信ツールが用意しているフィールドを使ってください。"
    - "背景画像のために意図的にそうしている場合は、同じ要素にフォールバックの背景色を追加してください。"
html.hidden_text_size:
  title: "文字が、サイズまたは display:none によって隠されています"
  why: "メールには {value} 語の見えない単語があります。Google は、HTML と CSS で内容を隠すことを禁じています。フィルターはこれを、分析を欺くための文字の詰め込みと見なします。"
  fix:
    - "見えないテキストのブロックを削除してください。"
    - "短いプレビューテキストだけを残し、それはツールが用意しているフィールドで設定してください。"
  fix_by_provider:
    mailchimp: "隠しブロックの代わりに、キャンペーンの Preview text フィールドにプレビューテキストを入力してください。"
    brevo: "プレビューテキストは、キャンペーンの「件名」のステップにある専用の項目に入力してください。"
html.obfuscated_entities:
  title: "一部の単語が、隠すために HTML のコードで書かれています"
  why: "通常の文字が、HTML の数値コードで書かれています。この手法は、フィルターから単語を隠すために使われます。フィルターはこれを検出して罰します。"
  fix:
    - "テンプレートには通常の文字で書いてください。"
    - "エディターがこれらのコードを生成する場合は、文字のエンコードオプションを無効にするか、エディターを変更してください。"
html.fixed_width_wide:
  title: "メールの固定幅が大きすぎます"
  why: "ブロックの幅は {value} ピクセルです。モバイルでは、メールを横にスクロールする必要が生じるか、非常に小さく表示されます。その結果、読まれずに削除されることが増えます。"
  fix:
    - "メインのコンテナに、読みやすい最大幅を設定してください。例：width='600' と style='max-width:600px;width:100%'。"
    - "@media (max-width: 600px) のルールを追加し、列の幅を 100% にしてください。"
html.style_head_only:
  title: "すべての書式が head の style ブロックにあります"
  why: "インラインの style を持つ要素が 1 つもありません。style ブロックを削除するクライアントでは、色もレイアウトもないメールとして表示されます。"
  fix:
    - "CSS のインライン化ツールを使って、重要なスタイルを各要素の style 属性に書いてください。"
    - "style ブロックは、@media のルールと :hover の状態のために残してください。"
html.conditional_comments:
  title: "HTML に、Outlook 向けの条件付きコメントがあります"
  why: "これらのコメントは、Windows 版 Outlook の表示を修正するために使われます。これは正常です。ほかで見えている内容と異なる内容を隠す場合にのみ、問題になります。"
  fix:
    - "[if mso] と [if !mso] のブロック内のテキストが、両方のバージョンで同じ内容を伝えているか確認してください。"
    - "重要な送信の前に、Windows 版 Outlook での表示をテストしてください。"
html.lang_missing:
  title: "メールの言語が宣言されていません"
  why: "lang 属性がないと、スクリーンリーダーはお客様のフランス語のテキストを英語の発音で読み上げることがあります。フィルターの判定は変わりませんが、一部の読者にとって不便です。"
  fix:
    - "html タグに lang='fr' を追加し、dir='ltr' も追加してください。"
