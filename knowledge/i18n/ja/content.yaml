content.no_text_part:
  title: "メッセージにテキスト版がありません"
  why: "メッセージはHTMLだけで構成されています。スパムフィルターはテキスト版がないことを手掛かりの一つとみなし、プレーンテキストを表示する受信者には、読める内容が何も見えません。"
  fix:
    - "multipart/alternative で送信してください。text/plain のパートを先に、text/html のパートをその後に置きます。"
    - "ツールでテキスト版の自動生成を有効にし、その後でテキストを確認してください。"
  fix_by_provider:
    mailchimp: "キャンペーンで「Plain-text email」を開き、自動生成を有効のままにするか、テキスト版を書いてください。"
    sendgrid: "API v3 の /mail/send 呼び出しで、content に2つのエントリを指定してください。1つは type が text/plain、もう1つは text/html です。"
    wordpress: "PHPMailer を使う場合は、phpmailer_init フィルターで $phpmailer->AltBody を設定するか、テキスト版を生成するSMTP拡張機能を使ってください。"
content.text_part_empty:
  title: "テキスト版が空です"
  why: "HTML版には内容があるのにテキスト版が空なのは、テキストを読むフィルターを欺く既知の手口です。このため減点され、テキストモードの受信者には何も表示されません。"
  fix:
    - "テキスト版に、HTML版と同じ内容を入れてください。"
    - "ツールが自動生成している場合は、空の変数を受け取っていないか確認してください。"
content.text_html_mismatch:
  title: "テキスト版とHTML版の内容が一致していません"
  why: "2つの版の類似度は {value} にすぎません。テキストとHTMLが食い違うメッセージは、フィルターに知られた隠蔽の手口であり、多くの場合は忘れられた古いテンプレートです。"
  fix:
    - "現在のHTMLから、テキスト版を再生成してください。"
    - "手作業で書いている場合は、HTMLを変更するたびに、テキスト版も更新してください。"
  fix_by_provider:
    mailchimp: "Plain-text email で、内容を変更するたびに「Regenerate from HTML」をクリックしてください。"
content.text_too_short:
  title: "メッセージの本文がとても短いです"
  why: "本文は {value} 語しかありません。これだけ短いと、フィルターにはメッセージを判断する材料が足りず、リンクやレピュテーションに頼りがちです。その結果、多くの場合あなたが不利になります。"
  fix:
    - "受信者がなぜこのメッセージを受け取っているのか、そしてどんな提案をしているのかを説明する文を、数文追加してください。"
    - "会社名と連絡先を記載した署名を追加してください。"
content.url_only_body:
  title: "メッセージがリンク1つだけで構成されています"
  why: "Webアドレスだけを含むメッセージは、フィッシングやリンクスパムの典型的な形式です。ほぼ必ずフィルターで除外されます。"
  fix:
    - "少なくとも数文を書いてください。あなたが誰か、なぜ連絡しているのか、リンク先に何があるのかを書きます。"
    - "アドレスをそのまま貼り付けるのではなく、内容が分かる文字にリンクを設定してください。"
content.trigger_words:
  title: "本文に過度に押しの強い販促表現が多く含まれています"
  why: "メッセージには、スパムに典型的な表現が {value} 個含まれています。個々の影響は小さいですが、積み重なると、他の否定的なシグナルを強めます。"
  fix:
    - "定型的な言い回しを、商品、価格、終了日など、提供内容の具体的な説明に置き換えてください。"
    - "「ここをクリック」は、リンク先が分かるリンクテキストに置き換えてください。"
content.excessive_caps:
  title: "本文にアルファベットの大文字が多く含まれています"
  why: "本文の大きな割合が大文字で書かれています。攻撃的な印象を与え、コンテンツフィルターの判断基準の一つにもなります。"
  fix:
    - "大文字で書かれた部分を、通常の書き方（大文字と小文字）に書き直してください。"
    - "強調したい場合は、大文字ではなく太字またはHTMLの見出しを使ってください。"
content.excessive_punctuation:
  title: "感嘆符や記号が連続しているメッセージです"
  why: "「!!!」や「€€€」のような連続は、フィルターと受信者の双方によく知られたスパムの特徴です。"
  fix:
    - "感嘆符は1文につき多くても1つにしてください。"
    - "金額は数字と通貨単位で書き、記号を繰り返さないでください。"
content.invisible_characters:
  title: "本文に不可視文字が含まれています"
  why: "メッセージには不可視文字が {value} 個あります。単語の中に挿入すると、フィルターを回避する手段になります。フィルターはこれを検出し、隠蔽の試みとしてメッセージを罰します。"
  fix:
    - "テキストを、不可視文字が表示されるエディターに貼り付け、それらを削除してください。"
    - "ワープロやWebページから直接コピーしないでください。プレーンテキストとして貼り付けてから、書式を付け直してください。"
content.homoglyphs:
  title: "一部の単語が複数のアルファベットを混ぜています"
  why: "単語 {value} に、ラテン文字に似た別のアルファベットの文字が含まれています。この手口はブランドのなりすましやフィルターの回避に使われるため、強く減点されます。"
  fix:
    - "指摘された単語は、コピーせずにキーボードで打ち直してください。"
    - "本文を自動翻訳した場合は、ギリシャ文字やキリル文字を含む単語を見直してください。"
content.image_only:
  title: "ほぼ文字がなく、画像だけで構成されたメッセージです"
  why: "画像を除くと、メッセージにはほとんど文字がありません：{value}。フィルターは画像内の文字を読めず、スパムでよく使われるこの形式を警戒します。画像がブロックされた受信者には、ほぼ空のメッセージが見えます。"
  fix:
    - "タイトル、オファー、アクションボタンをHTMLのテキストで書き、画像は装飾だけに使ってください。"
    - "画像のボタンを、HTMLとCSSによるボタンに置き換えてください。"
    - "残っている各画像に、内容を説明する alt 属性を付けてください。"
  fix_by_provider:
    mailchimp: "Image ブロックを、タイトルとオファー用の Text ブロックに置き換え、アクションには Button ブロックを使ってください。"
    brevo: "ドラッグ＆ドロップエディターでは、1枚の画像の代わりに「タイトル」「テキスト」「ボタン」ブロックを使ってください。"
content.html_clipped_gmail:
  title: "HTMLが重く、Gmailによって切り詰められる可能性があります"
  why: "HTMLのサイズは {value} です。Mailchimp によると、Gmail は約 102 KB を超えるメッセージを切り詰め、「メッセージが省略されています」と表示します。その場合、末尾にある配信停止リンクと開封計測ピクセルが表示されなくなります。"
  fix:
    - "重複したCSSスタイルとコメントを、HTMLから削除してください。"
    - "メッセージを短くするか、複数回の送信に分割してください。"
    - "HTML内の base64 画像を、ホスティングされた画像に置き換えてください。"
    - "配信停止リンクはフッターの十分に上に置き、切り詰められた場合でも見えるようにしてください。"
  fix_by_provider:
    mailchimp: "他のツールから書き出したHTMLを Code ブロックに貼り付けないでください。重複したスタイルが含まれていることがよくあります。"
content.mojibake:
  title: "アクセントが文字化けして表示されています"
  why: "テキストに {value} のような並びがあります。UTF-8が一度余分に変換されています。読み手にはメッセージが雑に見えるうえ、フィルターは崩れた単語を読み取ります。"
  fix:
    - "テンプレートがUTF-8で保存され、charset=UTF-8 と宣言されているか確認してください。"
    - "テキストを二重に変換している工程を探してください。データベースのエクスポート、PHP の utf8_encode()、誤って保存されたファイルからのコピー＆ペーストなどです。"
    - "MySQL では、接続とテーブルに utf8mb4 文字セットを使ってください。"
content.replacement_characters:
  title: "本文に置換文字（�）が含まれています"
  why: "文字エンコードの変換中に文字が失われ、疑問符付きのひし形に置き換えられています。その部分のテキストは完全に壊れています。"
  fix:
    - "影響を受けている単語を特定し、元のテンプレートで打ち直してください。"
    - "処理の流れを修正してください。テキストは、どの工程でもUTF-8として読み書きされる必要があります。"
content.mixed_languages:
  title: "メッセージが複数の言語で書かれています"
  why: "メッセージの大きな部分が {value} で書かれています。言語の混在は、翻訳が不十分なテンプレートや、消し忘れた既定のテンプレートであることが多く、受信者を混乱させます。"
  fix:
    - "元のテンプレートの言語のまま残っているブロックを翻訳してください。多くの場合はフッターとボタンです。"
    - "複数の読者層に送る場合は、言語ごとに別の版を送ってください。"
  fix_by_provider:
    mailchimp: "フッターと配信停止ページの文言は、Audience > Settings > Audience name and defaults の言語欄で翻訳できます。"
content.unreplaced_merge_tags:
  title: "パーソナライズタグが置き換えられていません"
  why: "受信者には、内容の代わりにタグ {value} が表示されます。メッセージが自動生成されて雑に見えるため、スパムとして報告される件数が増えます。"
  fix:
    - "送信ツールのドキュメントで、タグの正確な綴りを確認してください。"
    - "リストのすべての連絡先について該当項目を入力するか、既定値を設定してください。"
    - "空のテスト用アドレスではなく、リスト内の実在の連絡先にテスト送信してください。"
  fix_by_provider:
    mailchimp: "Audience > Settings > Audience fields and *|MERGE|* tags でタグを確認し、その項目に既定値を設定してください。"
content.placeholder_text:
  title: "メッセージにダミーテキストが含まれています"
  why: "メッセージに「{value}」という文言があります。テンプレートのブロックが書かれないまま残っています。メッセージが校正されていないように見え、このテキストはフィルターに知られています。"
  fix:
    - "ダミーテキストのブロックを置き換えるか、削除してください。"
    - "送信前に、スマートフォンでの表示を含め、全体のプレビューを確認してください。"
content.sender_identity_missing:
  title: "誰がメッセージを送っているのか明記されていません"
  why: "この販促メッセージには、会社名もアドレスも記載されていません。フランスでは、販促メッセージから広告主を特定できなければなりません。送信者が匿名のメッセージは、スパムとして報告されやすくなります。"
  fix:
    - "フッターに、会社名、郵送先住所、{domain} 上のサイトへのリンクを記載してください。"
    - "受信者がなぜこのメッセージを受け取っているのか（登録、購入、顧客アカウント）を、1文で伝えてください。"
  fix_by_provider:
    mailchimp: "住所はフッターの *|LIST:ADDRESS|* タグから取得されます。Audience > Settings > Audience name and defaults で設定してください。"
    brevo: "アカウント設定で会社の住所を入力してください。エディターのフッターブロックが、その住所を使用します。"
content.text_part_base64:
  title: "テキストパートが不要な base64 でエンコードされています"
  why: "テキストはほぼすべて ASCII ですが、base64 でエンコードされています。この不要な処理はスパムでよく見られ、単純なフィルターから内容を隠す目的で使われます。そのため、一部のフィルターが減点します。"
  fix:
    - "テキストパートを quoted-printable でエンコードしてください。アクセントは読めるままで、テキストも見えるままになります。"
    - "PHPMailer を使う場合は、$mail->Encoding = 'quoted-printable' を設定してください。"
content.empty_message:
  title: "メッセージが完全に空です"
  why: "件名も本文も添付ファイルもありません。Microsoft のフィルターは、このオプションが有効な場合、この種のメッセージを高い確度で迷惑メールに分類します。他の場所で読まれる見込みもありません。"
  fix:
    - "アプリケーションが、送信時にテンプレートの内容を確実に渡しているか確認してください。"
    - "キャンペーンを再開する前に、内容の入ったメッセージでテスト送信してください。"
