sa.rcvd_in_dnswl_hi:
  title: "送信IPはDNSWLのホワイトリストに登録（信頼度：高）"
  why: "IP {ip} は、DNSWL に最高レベルの信頼度で登録されています。これは SpamAssassin の最大級の加点の一つで、スパムをほとんど送らないサーバーにのみ与えられます。"
  fix:
    - "対応不要です。最も重要な送信には、このIPを使い続けてください。"
sa.rcvd_in_dnswl_med:
  title: "送信IPはDNSWLのホワイトリストに登録（信頼度：中）"
  why: "IP {ip} は、スパムをまれにしか通さない正規のサーバーとして DNSWL に知られています。スコアに対する純粋な加点です。"
  fix:
    - "対応不要です。"
sa.rcvd_in_dnswl_low:
  title: "送信IPはDNSWLのホワイトリストに登録（信頼度：低）"
  why: "IP {ip} は DNSWL により正規のサーバーとして識別されていますが、共有されているか、過去にスパムを送ったことがあります（大手ホスティング、共有ルーターなど）。加点は小さいです。"
  fix:
    - "対応不要です。より高いレベルを得るには、送信専用の自社IPが必要です。"
sa.rcvd_in_dnswl_none:
  title: "送信IPはDNSWLに登録されていますが、信頼度はありません"
  why: "DNSWL は IP {ip} とその所有者を把握していますが、特別な信頼は与えていません。多くの顧客が共有していることが原因の場合が多いです。スコアへの影響はありません。"
  fix:
    - "対応不要です。"
sa.rcvd_in_dnswl_blocked:
  title: "テストサーバーからのDNSWLの問い合わせが拒否されました"
  why: "管理上の注意：DNSWL は、メッセージを分析するサーバーからの問い合わせを拒否しました（問い合わせが多すぎる、または公開リゾルバー経由）。あなたの送信が原因ではありません。"
  fix:
    - "あなた側での対応は不要です。DNSWL による加点があったとしても、計算できなかっただけです。"
sa.rcvd_in_mspike_h2:
  title: "送信IPのMailspikeレピュテーションは中程度（+2）"
  why: "Mailspike は IP {ip} を +2 のレベルに分類しています。中程度ですが肯定的なレピュテーションです。SpamAssassin はこれによる加点をしません。主に参考情報です。"
  fix:
    - "対応不要です。送信量を一定に保ち、リストを清潔に保って、このレベルを維持してください。"
sa.rcvd_in_mspike_h3:
  title: "送信IPのMailspikeレピュテーションは良好（+3）"
  why: "Mailspike は IP {ip} を +3 のレベルに分類しています。好ましいシグナルですが、既定の SpamAssassin スコアには影響しません。"
  fix:
    - "対応不要です。送信量を一定に保ち、リストを清潔に保って、このレベルを維持してください。"
sa.rcvd_in_mspike_h4:
  title: "送信IPのMailspikeレピュテーションは非常に良好（+4）"
  why: "Mailspike は IP {ip} を +4 のレベルに分類しています。非常に好ましいシグナルです。"
  fix:
    - "対応不要です。送信量を一定に保ち、リストを清潔に保って、このレベルを維持してください。"
sa.rcvd_in_mspike_h5:
  title: "送信IPのMailspikeレピュテーションは優秀（+5）"
  why: "Mailspike は IP {ip} を最高のレピュテーションレベルに分類しています。"
  fix:
    - "対応不要です。送信量を一定に保ち、リストを清潔に保って、このレベルを維持してください。"
sa.rcvd_in_mspike_wl:
  title: "送信IPはMailspikeの良い送信者リストに含まれています"
  why: "IP {ip} の Mailspike レピュテーションは +3 以上です。好ましい指標です。"
  fix:
    - "対応不要です。"
sa.rcvd_in_mspike_l2:
  title: "送信IPのMailspikeレピュテーションは疑わしい（-2）"
  why: "Mailspike は IP {ip} を疑わしいと判断しています。SpamAssassin はほとんど減点しませんが、他のフィルターがこのリストを利用します。典型的な原因は、履歴のないIPから、突然大量に送信したことです。"
  fix:
    - "新しいIPでは、リスト全体を一度に送るのではなく、送信量を段階的に増やしてください。"
    - "バウンスした、または長く開封されていないアドレスを、リストから削除してください。"
sa.rcvd_in_mspike_l3:
  title: "送信IPのMailspikeレピュテーションは悪い（-3）"
  why: "Mailspike は IP {ip} に低いレピュテーションを割り当てています。スパムやスパムトラップで確認されたためです。このリストを利用するフィルターは、あなたを減点します。"
  fix:
    - "求められていない、または古いアドレスへの送信を止め、リストを整理してください。"
    - "IPが共有プロバイダーのものである場合は、別のIP、またはより適切に管理されたプールを依頼してください。"
sa.rcvd_in_mspike_l4:
  title: "送信IPのMailspikeレピュテーションは非常に悪い（-4）"
  why: "IP {ip} の Mailspike レピュテーションは大きく低下しています。そこから送られるメッセージは、SpamAssassin を超えて、他のフィルターでも遮断される可能性が高いです。"
  fix:
    - "原因を探してください。スパムを送っているハッキングされたアカウントやフォーム、購入したリスト、無効なアドレスへのキャンペーンなどです。"
    - "原因を修正してから送信を再開し、レピュテーションが戻るのを待ってください。"
sa.rcvd_in_mspike_l5:
  title: "送信IPのMailspikeレピュテーションが最低（-5）"
  why: "IP {ip} は Mailspike の最低レピュテーションレベルにあります。原因が対処されるまで、このIPは使用不能とみなしてください。"
  fix:
    - "{ip} からの送信を停止し、侵害されたスクリプトやアカウントが、あなたの知らないうちに送信していないか確認してください。"
    - "浄化の間は、評判の良い送信サービスを一時的に経由してください。"
sa.rcvd_in_mspike_bl:
  title: "送信IPはMailspikeのブラックリストに登録されています"
  why: "IP {ip} は Mailspike のブラックリストに登録されているか、レピュテーションが -3 以下です。SpamAssassin のスコアは象徴的ですが、他のフィルターはこの情報を基にブロックします。"
  fix:
    - "{ip} からの望まない送信の原因に対処してから、{delist_url} で削除を申請してください。"
sa.rcvd_in_mspike_zbi:
  title: "送信IPはMailspikeのブラックリストに登録されています（ブロックゾーン）"
  why: "IP {ip} は、詳細なレピュテーションなしに Mailspike のブラックリストに含まれています。ブラックリストへの登録と同じ扱いです。"
  fix:
    - "{ip} から出ている不正な送信元を探して修正してから、{delist_url} で削除を申請してください。"
sa.rcvd_in_pbl:
  title: "送信IPはSpamhaus PBLに含まれています（直接送信を想定しない範囲）"
  why: "IP {ip} は、プロバイダーが直接のメール送信を想定していないと宣言している範囲に属しています。光回線や ADSL の接続、動的IPなどです。PBL は制裁ではありませんが、これらのIPから送るサーバーは、感染したコンピューターとして扱われます。"
  fix:
    - "このIPから直接配信しないでください。認証付きで、メールサービスの SMTP サーバーまたは送信サービスを経由してください。"
    - "{ip} があなたが管理するサーバーの固定IPである場合は、逆引きDNSを設定してから、{delist_url} で削除を申請してください。"
sa.rcvd_in_sbl:
  title: "送信IPはSpamhaus SBLに登録されています"
  why: "IP {ip} は SBL に登録されています。SBL は、Spamhaus が検証したスパム送信元のリストです。SpamAssassin のスコアはわずかですが、多くのサーバーは接続の時点でこれらのメッセージを拒否します。"
  fix:
    - "{delist_url} から SBL の詳細ページを確認してください。登録理由と、削除を申請できる人が記載されています。"
    - "IPがホスティング業者のものである場合は、業者にチケットを送ってください。多くの場合、対応できるのは業者だけです。"
sa.rcvd_in_sbl_css:
  title: "送信IPはSpamhaus CSSに含まれています（スパム送信を検出）"
  why: "CSS は、最近スパムを送った IP を自動的に一覧にします。多くの場合、侵害されたサイトやメールボックス、または誤って設定されたサーバー（誤った HELO、逆引きDNS の欠如）が原因です。"
  fix:
    - "サーバー {ip} で何が送信しているかを探してください。保護されていないフォーム、悪意あるPHPスクリプト、ハッキングされたメールアカウントなどです。"
    - "HELO 名と逆引きDNS（{ptr}）が一貫していることを確認してください。"
    - "原因を取り除いたら、{delist_url} で削除を申請してください。"
sa.rcvd_in_xbl:
  title: "送信IPはSpamhaus XBLに含まれています（侵害されたマシン）"
  why: "Spamhaus は、IP {ip} が感染したマシンのように振る舞うのを確認しました（ボットネット、オープンプロキシ）。ZEN を使うサーバーは、これらのメッセージをしばしば拒否します。"
  fix:
    - "{ip} から出ているマシンやサーバー（ウイルス対策、更新、パスワード）を分析してください。"
    - "クリーンアップ後に、{delist_url} で削除を申請してください。"
sa.rcvd_in_zen_blocked:
  title: "テストサーバーからのSpamhausの問い合わせが拒否されました"
  why: "管理上の注意：Spamhaus は、無料で使える量を超えたため、分析サーバーに応答しませんでした。あなたのIPについては何も示すものではありません。"
  fix:
    - "あなた側での対応は不要です。このテストでは Spamhaus のリストは参照されていません。"
sa.rcvd_in_zen_blocked_opendns:
  title: "Spamhausの問い合わせが拒否されました：公開リゾルバー"
  why: "管理上の注意：分析サーバーは公開リゾルバー経由で Spamhaus に問い合わせていますが、Spamhaus はそれを拒否しています。あなたの送信は関係ありません。"
  fix:
    - "あなた側での対応は不要です。"
sa.rcvd_in_psbl:
  title: "送信IPはPSBLのリストに含まれています"
  why: "IP {ip} は、PSBL のスパムトラップのアドレスにメッセージを送りました。共有サーバーや、古いリストに送られたキャンペーンでよく見られます。"
  fix:
    - "一度も確認されていない、または長く非アクティブなアドレスを、リストから削除してください。"
    - "{delist_url} で削除を申請してください。セルフサービスで可能ですが、トラップへの送信が続けば再び登録されます。"
sa.rcvd_in_bl_spamcop_net:
  title: "送信IPはSpamCopのリストに含まれています"
  why: "受信者が、{ip} から送られたメッセージを SpamCop に報告したか、IP が SpamCop のトラップに届きました。報告が止まれば、登録は自然に期限切れになります。"
  fix:
    - "受信者それぞれが、メッセージの受信を希望したこと、配信停止リンクが見えることを確認してください。"
    - "IPが共有プロバイダーのものである場合は、その業者に登録を伝えてください。"
sa.rcvd_in_iadb_vouched:
  title: "ISIPP IADBにより認定された送信者"
  why: "IP {ip} は、ISIPP の認定プログラムによって保証されています。SpamAssassin による大きな加点です。"
  fix:
    - "対応不要です。"
sa.rcvd_in_iadb_listed:
  title: "ISIPP IADBに登録された送信者"
  why: "IP {ip} は IADB の認定システムに参加しています。情報としてのみで、顕著な影響はありません。"
  fix:
    - "対応不要です。"
sa.rcvd_in_iadb_optin:
  title: "IADB：オプトインのメーリングリスト"
  why: "送信者は IADB に対して、すべてのリストが自発的な登録（オプトイン）であると申告しています。加点です。"
  fix:
    - "対応不要です。"
sa.rcvd_in_iadb_doptin:
  title: "IADB：ダブルオプトインのメーリングリスト"
  why: "送信者は IADB に対して、すべてのリストがダブルオプトインで確認されていると申告しています。大きな加点です。"
  fix:
    - "対応不要です。"
sa.rcvd_in_iadb_ml_doptin:
  title: "IADB：ダブルオプトインのリストのみ"
  why: "IADB によると、このIPはダブルオプトインで確認されたメーリングリストだけを送信しています。SpamAssassin の最も大きな加点の一つです。"
  fix:
    - "対応不要です。"
sa.razor2_check:
  title: "Razorによって、このコンテンツはすでにスパムとして報告されています"
  why: "Razor のユーザーが、同一または非常に近い内容のメッセージを報告しています。ニュースレターの場合、購読者が配信停止せず、スパムとして報告すると起こります。"
  fix:
    - "配信停止リンクをメッセージの上部または下部に見えるように置き、List-Unsubscribe ヘッダーを追加してください。"
    - "最近登録した、または活発な受信者だけに送り、なぜその人がこのメッセージを受け取るのかを改めて伝えてください。"
sa.razor2_cf_range_51_100:
  title: "Razorは、このコンテンツを50%を超える確度でスパムと判定しています"
  why: "このコンテンツは Razor で広く報告されています。同じ文章を他の人が送った場合も、同様に減点されます。コピーされたテンプレートや、共有された販促文が該当します。"
  fix:
    - "配布されているテンプレートをそのまま使うのではなく、メッセージを書き直してください。"
    - "受信者が大量に報告していないか確認してください（送信ツールの苦情率）。"
sa.pyzor_check:
  title: "Pyzorによって、このコンテンツはすでにスパムとして報告されています"
  why: "メッセージの本文が、Pyzor のユーザーによって報告されたフィンガープリントに一致します。送信のたびに変わらない、非常に短く同一のニュースレターのテンプレートは、この影響を受けやすいです。"
  fix:
    - "コンテンツをさらにパーソナライズし、すべての送信に共通する文章の割合を減らしてください。"
    - "苦情を監視し、もう読まない受信者を削除してください。"
sa.dcc_check:
  title: "DCCにより、大量送信として検出されたメッセージ"
  why: "DCC は、同じメッセージが何度流通したかを数えます。ここでは大量送信として報告されています。ニュースレターでは普通のことですが、求められた送信と認識されない場合、SpamAssassin は加点します。"
  fix:
    - "List-Unsubscribe と List-Unsubscribe-Post のヘッダー、および見えやすい配信停止リンクを追加してください。"
    - "送信を認証してください（SPF、DKIM、DMARC のアラインメント）。これで加点を相殺できます。"
sa.dcc_reput_00_12:
  title: "DCCによる良好なレピュテーション（スパム 0～12%）"
  why: "DCC によると、IP {ip} は主に正当なメッセージを送っています。小さな加点です。"
  fix:
    - "対応不要です。"
sa.dcc_reput_95_98:
  title: "DCCによる悪いレピュテーション（スパム 95～98%）"
  why: "DCC によると、IP {ip} はほぼ求められていないバルクメッセージだけを送っています。"
  fix:
    - "IP {ip} が共有されている場合は、同じ IP から誰が送っているかを確認し、プロバイダーにより適切に管理された IP を依頼してください。"
    - "リストを整理し、送信をアクティブな登録者に限定してください。"
sa.dcc_reput_99_100:
  title: "DCCによるスパム送信者のレピュテーション（99%以上）"
  why: "DCC は IP {ip} をスパムの送信元とみなしています。この加点は、他のブラックリストへの登録に加わります。"
  fix:
    - "原因（ハッキングされたアカウント、購入したリスト）が特定されるまで、{ip} からの送信を止めてください。"
sa.digest_multiple:
  title: "複数の共同ネットワークによって報告されたコンテンツ"
  why: "Razor、Pyzor、DCC のうち少なくとも2つのネットワークが、このコンテンツを認識しています。それぞれのネットワークの加点が合算されます。"
  fix:
    - "共通の原因に対処してください。受信者の苦情、またはスパム送信者に再利用されたメッセージテンプレートです。"
sa.from_fmbla_newdom:
  title: "送信者のドメインは登録から7日未満です"
  why: "{domain} は1週間以内に登録されました。スパム送信者は使い捨てのドメインを使うため、新しいドメインは、正規の企業であっても既定で疑わしく扱われます。"
  fix:
    - "{domain} から大量に送信する前に、数週間待ってください。"
    - "あなたを知っている受信者に、個別のメッセージや少量の送信から始めてください。"
    - "今すぐ SPF、DKIM、DMARC を公開し、認証されたドメインの上にレピュテーションを築けるようにしてください。"
sa.from_fmbla_newdom14:
  title: "送信者のドメインは登録から7～14日です"
  why: "{domain} は2週間未満です。減点は、ドメインの年齢とともに小さくなります。"
  fix:
    - "最初の数週間は、少量で一定の送信を続けてください。"
    - "SPF、DKIM、DMARC が設定されていることを確認してください。"
sa.from_fmbla_newdom28:
  title: "送信者のドメインは登録から14～28日です"
  why: "{domain} は1か月未満です。減点は小さく、28日を過ぎると消えます。"
  fix:
    - "大量送信は待ってください。技術的な変更でこの減点を取り除くことはできません。"
sa.from_fmbla_ndblocked:
  title: "テストサーバーからのfresh.fmb.laの問い合わせが拒否されました"
  why: "管理上の注意：ドメインの年齢を判定するサービスが、分析サーバーに応答しませんでした。あなたの送信とは関係ありません。"
  fix:
    - "あなた側での対応は不要です。"
sa.bayes_00:
  title: "ベイズフィルター：スパム確率 0～1%"
  why: "メッセージの語彙と構造は、サーバーがすでに学習した正当なメッセージに似ています。純粋な加点です。"
  fix:
    - "対応不要です。"
sa.bayes_05:
  title: "ベイズフィルター：スパム確率 1～5%"
  why: "内容は、正当なメッセージにはっきり似ています。小さな加点です。"
  fix:
    - "対応不要です。"
sa.bayes_20:
  title: "ベイズフィルター：スパム確率 5～20%"
  why: "内容は正当な側に傾いています。スコアへの影響はありません。"
  fix:
    - "対応不要です。"
sa.bayes_40:
  title: "ベイズフィルター：スパム確率 20～40%"
  why: "内容はどちらかといえば中立です。スコアへの影響はありません。"
  fix:
    - "対応不要です。"
sa.bayes_50:
  title: "ベイズフィルター：スパム確率 40～60%"
  why: "フィルターは判断できません。テストサーバーがあなたのメッセージを一度も見たことがない場合の、通常の結果です。1点弱が加算されます。"
  fix:
    - "的を絞った修正はできません。読み手のために書かれた分かりやすい文章で、販売文句を並べないようにすれば、結果は下がります。"
sa.bayes_60:
  title: "ベイズフィルター：スパム確率 60～80%"
  why: "メッセージの語彙は、正当なメッセージよりも、学習されたスパムに似ています。非常に商業的な口調（割引、緊急性、価格）や、画像に埋もれた短いテキストが原因であることが多いです。"
  fix:
    - "繰り返される販売文句（「期間限定の特別オファー」「ラストチャンス」など）を減らしてください。"
    - "実際に役立つ文章を加え、画像の割合を減らしてください。"
sa.bayes_80:
  title: "ベイズフィルター：スパム確率 80～95%"
  why: "内容は、学習済みのスパムに強く似ています。この1点だけで、他の2つか3つのルールと合わさって、メッセージを迷惑メールに振り分けることがあります。"
  fix:
    - "件名と導入部を、より情報重視のスタイルで書き直してください。"
    - "短縮リンクと、不明なサードパーティのドメインを削除し、一貫性のあるテキスト版を追加してください。"
sa.bayes_95:
  title: "ベイズフィルター：スパム確率 95～99%"
  why: "フィルターはほぼ確実にスパムだと判断しています。このメッセージは、語彙、リンク、HTML構造など、既知のスパムと多くの要素を共有しています。"
  fix:
    - "より単純なメッセージ（テキストと、ドメインへの1つのリンク）と比べて、何が規則を発動させているかを切り分けてください。"
    - "購入した、または広く出回っているレイアウトテンプレートや、サードパーティのドメインへのリンクは避けてください。"
sa.bayes_99:
  title: "ベイズフィルター：スパム確率 99～100%"
  why: "フィルターは、このコンテンツをほぼ確実にスパムと分類しています。最も重いルールの一つです。既定でメッセージをスパムと分類するには5点が必要で、このルールだけで3.5点を占めます。"
  fix:
    - "件名、本文、リンクを変えて、新しいコンテンツから始め直してください。"
    - "最小限のメッセージで再テストし、インフラ（ドメイン、IP）自体が原因ではないことを確認してください。"
sa.bayes_999:
  title: "ベイズフィルター：スパム確率 99.9%超"
  why: "さらに確信度が高い場合、BAYES_99 に加算されます。"
  fix:
    - "BAYES_99 を参照してください。コンテンツ全体を見直す必要があります。"
sa.awl:
  title: "送信者の履歴（AWL）によってスコアが調整されました"
  why: "テストサーバーは、以前のメッセージのスコアを記憶しており、今回のスコアを平均に近づけます。そのため、連続して失敗したテストは次のメッセージのスコアを押し上げます。"
  fix:
    - "他のルールを修正してください。この調整は送信内容の傾向に従います。"
    - "正確な測定のためには、新しいアドレスから行ったテストと比較してください。"
sa.txrep:
  title: "送信者のレピュテーション（TxRep）によってスコアが調整されました"
  why: "サーバーは、受信済みのメッセージに基づいて、あなたのアドレス、ドメイン、IP のレピュテーションを保持しています。これがスコアを上下のどちらかに調整します。"
  fix:
    - "他のルールを修正し、定期的に送信してください。レピュテーションは時間とともに再構築されます。"
sa.all_trusted:
  title: "メッセージは信頼できるサーバーのみを経由しています"
  why: "メッセージは、分析ツールが内部とみなすサーバーだけを通過しました。テストサーバーと同じネットワークからの送信の場合です。"
  fix:
    - "対応不要です。この加点は、外部の受信者にはありません。"
sa.no_relays:
  title: "メッセージはSMTPで中継されていません"
  why: "情報：メッセージには SMTP 転送の痕跡がありません。たとえば、受信箱に直接置かれた場合です。"
  fix:
    - "対応不要です。代表的なテストのためには、通常の経路でメッセージを送信してください。"
sa.no_received:
  title: "メッセージにReceivedヘッダーがありません"
  why: "情報：Received ヘッダーがありません。実際に送信されたメッセージとしては稀です。"
  fix:
    - "対応不要です。インポートするのではなく、実際の送信サーバーからテストを送信してください。"
sa.unparseable_relay:
  title: "Receivedヘッダーが読めません"
  why: "Received の行が、SpamAssassin の理解できない形式です。そのため、元のIPを誤認し、ブラックリストを誤って適用するおそれがあります。"
  fix:
    - "行がサーバー（Postfix、Exim）由来であれば、カスタム形式ではなく、ソフトウェアの既定の Received 形式のままにしてください。"
