sa.uppercase_50_75:
  title: "メッセージ本文の 50～75% が大文字です"
  why: "本文の文字の半分以上が大文字です。現在のスコアは象徴的ですが、メッセージは叫んでいるように見え、読者は報告しやすくなります。"
  fix:
    - "通常の大文字小文字で書き直してください。大文字は頭字語にのみ使ってください。"
sa.uppercase_75_100:
  title: "メッセージ本文のほぼ全体が大文字です"
  why: "文字の4分の3以上が大文字です。スコアは象徴的です。"
  fix:
    - "通常の大文字小文字で書き直してください。"
sa.lots_of_money:
  title: "メッセージに高額の金額が含まれています"
  why: "本文に高額（10,000ユーロ、「millions」）が記載されています。スコアは象徴的ですが、このルールは複数の詐欺判定ルールの組み合わせに含まれます。"
  fix:
    - "必須の対応はありません。件名と冒頭の段落に高額の金額を並べないでください。"
sa.money_back:
  title: "「money back guarantee」という表示"
  why: "本文に英語の表現「money back guarantee」が含まれています。1ポイント。"
  fix:
    - "書き直す（例：「30日以内の返金」）か、フッターの英語の表現を削除してください。"
sa.risk_free:
  title: "「リスクなし」という約束"
  why: "本文は、配信リストの兆候がないまま、リスクのなさ（「risk free」「100% safe」）を約束しています。約3ポイント。この表現は詐欺に典型的です。"
  fix:
    - "その表現を削除するか、実際の配信停止リンクと List-Unsubscribe ヘッダーを追加してください。その場合、このルールは適用されなくなります。"
sa.guaranteed_100_percent:
  title: "「100% guaranteed」という表示"
  why: "本文に「100% guaranteed」が含まれています。この表現だけで約3ポイント。"
  fix:
    - "表現を削除するか、保証を具体的に（期間、条件）書いてください。"
sa.bang_guar:
  title: "感嘆符付きの「Guaranteed!」"
  why: "本文に「guarantee!」または「guaranteed!」が含まれています。1ポイント。"
  fix:
    - "感嘆符または表現を削除してください。"
sa.free_quote_instant:
  title: "無料で即時の見積もりの提案"
  why: "本文は「free instant quote」または「free no-obligation quote」を提案しています。英語の営業メールの定型句です。1ポイント超。"
  fix:
    - "「quote」に「free」や「instant」を付けない形で、行動を促す文を書き直してください。"
sa.low_price:
  title: "「lowest price」という表示"
  why: "本文に「Low Price」または「Lowest Price」が含まれています。減点は小さいです。"
  fix:
    - "必須の対応はありません。件名ではこの定型句を避けてください。"
sa.act_now_caps:
  title: "大文字の「Act Now」"
  why: "本文に大文字の「Act Now」が含まれています。減点は小さいです。"
  fix:
    - "具体的な行動の呼びかけに置き換えてください（例：「お席をご予約ください」）。"
sa.this_ad:
  title: "本文が「this ad」または「this promotion」に言及しています"
  why: "本文に「this ad」「this advertisement」「this promotion」が含まれています。多くはフッターの英語の法的表示です。約3ポイント。"
  fix:
    - "フッターの英語の表示を削除するか、翻訳してください。"
sa.admits_spam:
  title: "本文が広告であることを名乗っています"
  why: "メッセージに「This is an advertisement」が含まれています。一部の法律ではこの表示が義務付けられていますが、フィルターはこれを自白とみなします。2ポイント。"
  fix:
    - "読者に対して表示が義務付けられていなければ、削除してください。"
    - "そうでなければ、キャンペーン用ヘッダーを追加する送信ツールを使ってください（X-Campaignid がある場合、このルールは適用されません）。"
sa.ad_prefs:
  title: "「advertising preferences」というリンクまたは表示"
  why: "本文に「marketing preferences」または「ad settings」が含まれています。減点は小さく、多くは英語の設定管理リンクが原因です。"
  fix:
    - "設定リンクのラベルを日本語にしてください（例：「配信設定を管理」）。"
sa.excuse_remove:
  title: "「to be removed from our mailings」という定型句"
  why: "本文に「to be removed from ... mailings」または「... offers」が含まれています。古い英語のスパムの定型句で、3ポイント超減点されます。"
  fix:
    - "その文を、直接の配信停止リンクに置き換えてください：「配信停止」"
sa.excuse_4:
  title: "「To Be Removed, Please」という定型句"
  why: "本文に「To be removed, please...」が含まれています。1ポイント超。"
  fix:
    - "ワンクリックでの配信停止リンクに置き換えてください。"
sa.end_future_emails:
  title: "スパムに典型的な配信停止の定型句"
  why: "配信停止の文面に、スパム送信者が多用する英語の定型句が使われており、メッセージは DKIM で署名されていません。減点は小さいです。"
  fix:
    - "メッセージを DKIM で署名してください。署名されたメッセージにはこのルールは適用されません。"
sa.remove_before_link:
  title: "http リンクの直前にある「No thanks」または「unsubscribe here」"
  why: "拒否の定型句の後に、暗号化されていない http:// のリンクが続いています。減点は小さいです。"
  fix:
    - "https:// のリンクを使い、アドレスをそのまま表示するのではなく、クリックできるラベルにしてください。"
sa.obfu_unsub_ul:
  title: "空白の代わりにアンダースコアを使った配信停止の文面"
  why: "本文に「click_here」や「to_unsubscribe」のような表現があり、フィルターを回避するためにアンダースコアで書かれています。見えたままのファイル名や変数名でも、このルールが発動することがあります。"
  fix:
    - "通常どおり、空白を使って文を書いてください。"
    - "テンプレートのタグ（to_unsubscribe、click_here）が置換されずに残っていないか確認してください。"
sa.marketing_partners:
  title: "マーケティングパートナーへの言及"
  why: "本文が「marketing partner」または「partner site」に言及しています。レンタルリストで使われる定型句です。スコアは象徴的です。"
  fix:
    - "必須の対応はありません。自社に登録した連絡先にのみ送信してください。"
sa.cant_see_ad:
  title: "「can't see the images below」という定型句"
  why: "メッセージに英語の定型句「If you can't see this newsletter...」が含まれ、List-Unsubscribe ヘッダーがありません。1ポイント。"
  fix:
    - "List-Unsubscribe ヘッダーを追加する（そうすれば、このルールは適用されなくなります）か、「オンライン版」のリンクの文を翻訳してください。"
sa.not_spam:
  title: "メッセージがスパムではないと主張している"
  why: "本文は「This email is not spam」（英語、スペイン語、ドイツ語）と主張しています。正当なメッセージはこれを述べる必要がありません。1ポイント。"
  fix:
    - "その文を削除してください。代わりに、受信者がなぜそのメッセージを受け取っているのか（登録、顧客であること）を説明してください。"
sa.urg_biz:
  title: "本文が緊急の用件に言及しています"
  why: "本文に「urgent reply」「urgent business」「urgent request」が含まれています。英語の詐欺で使われる定型句です。減点は中程度です。"
  fix:
    - "緊急を示す表現を削除してください。必要であれば、具体的な日付を示してください。"
sa.dear_something:
  title: "「Dear Sir」「Dear Madam」などの汎用的な呼びかけ"
  why: "メッセージは「Dear Sir」「Dear Madam」「Dear Candidate」などで始まっています。個別のメッセージは名前を使います。約2ポイント。"
  fix:
    - "受信者の名前で呼びかけを個人化するか、削除してください。"
sa.dear_friend:
  title: "呼びかけ「Dear Friend」"
  why: "メッセージは「Dear Friend」で始まっています。詐欺を象徴する定型句で、2.5ポイント超です。"
  fix:
    - "呼びかけを個人化するか、削除してください。"
sa.one_time:
  title: "「one time offer」という表示"
  why: "本文に「one-time offer」または「one time charge」が含まれています。減点は中程度です。"
  fix:
    - "英語の表現を使わずに、オファーの文を書き直してください。"
sa.prices_are_affordable:
  title: "「affordable prices」という表示"
  why: "本文に「affordable prices」が含まれています。減点は中程度です。"
  fix:
    - "定型句の代わりに、具体的な価格またはメリットを示してください。"
sa.new_products:
  title: "スパムのような文体の新製品告知"
  why: "英語の一斉営業の定型句（「We are pleased to introduce our...」）で新製品を紹介しています。1ポイント。"
  fix:
    - "導入の定型句を使わず、製品名と魅力を直接紹介してください。"
sa.ready_to_ship:
  title: "「ready to ship from our warehouse」という定型句"
  why: "本文は倉庫から発送可能な在庫を宣伝しています。工業製品の売り込みスパムの定型句です。1ポイント超。"
  fix:
    - "決まり文句の代わりに、具体的な情報（納期、型番、条件）で書き直してください。"
sa.investment_advice:
  title: "「investment advice」という表示"
  why: "本文に「investment advice」が含まれています。多くは法的な注意書きです。減点は小さいです。"
  fix:
    - "表示が義務付けられている場合は、必須の対応はありません。"
sa.fin_free:
  title: "経済的自由の約束"
  why: "本文は「financial freedom」または「financially independent」を約束しています。減点は小さいです。"
  fix:
    - "利益の約束を含まないように書き直してください。"
sa.compensation:
  title: "「compensation」（金銭的な報酬）への言及"
  why: "本文は、リストや認証の兆候がないまま「compensation」に言及しています。スコアは象徴的です。"
  fix:
    - "必須の対応はありません。メッセージを認証してください（SPF、DKIM）。"
sa.fill_this_form:
  title: "個人情報を記入するフォームへの入力依頼"
  why: "メッセージは、氏名、住所、電話番号、職業などを書いて返信するよう求めています。英語の詐欺の典型的な形です。スコアは象徴的ですが、組み合わせルールのベースはより重くなります。"
  fix:
    - "メールへの返信で情報を求める代わりに、自社サイトのフォームへ誘導してください。"
sa.fsl_bulk_sig:
  title: "配信停止リンクのない大量送信が検出されました"
  why: "共同の報告ネットワークで、このメッセージが大量に確認されています。配信停止の手段が含まれていません。スコアは象徴的ですが、これは実際の欠陥です。Gmail と Yahoo は、大量送信にワンクリックでの配信停止を要求しています。"
  fix:
    - "目に見える配信停止リンクと、List-Unsubscribe および List-Unsubscribe-Post ヘッダーを追加してください。"
sa.english_uce_subject:
  title: "「ADV」で始まる件名"
  why: "件名が「ADV」または「ADVERT」で始まっています。一部の米国法で義務付けられた広告のラベルであり、フィルターも探します。約3ポイント。"
  fix:
    - "読者に対する法的義務がない限り、件名から ADV の接頭辞を削除してください。"
sa.subj_as_seen:
  title: "件名に「As Seen」が含まれています"
  why: "件名に「As Seen」（「as seen on TV」）が含まれています。約1.5ポイント。"
  fix:
    - "件名を書き直してください。"
sa.unicode_obfu_zw:
  title: "単語の中に挿入された不可視文字"
  why: "単語の中に不可視文字（幅ゼロのスペース）が挿入されています。難読化の手法です。プリヘッダーのテンプレートにも、これらを追加するものがあります。スコアは象徴的です。"
  fix:
    - "見える本文から幅ゼロの文字を削除し、メッセージを DKIM で署名してください。"
sa.unicode_obfu_zw_many:
  title: "単語の中に挿入された多数の不可視文字"
  why: "本文に幅ゼロの文字が大量に含まれています。メッセージの冒頭を隠すために &zwnj; や &#8203; を連ねるプリヘッダーが、これを大量に生みます。3ポイント。"
  fix:
    - "プリヘッダーの埋め草を減らしてください。&nbsp; を数個使えば十分で、まったく使わなくても構いません。"
    - "見えるテキストに付いている幅ゼロの文字を削除してください。"
sa.unicode_obfu_asc:
  title: "ラテン語の単語に混ざったキリル文字"
  why: "ラテン文字に似たキリル文字が本文に混ぜられています。単語フィルターを回避する手法です。文字化けした文書からのコピー＆ペーストでも混入することがあります。2.5ポイント。"
  fix:
    - "該当する単語をキーボードで入力し直すか、ラテン文字以外の文字を検出するツールにテキストを通してください。"
sa.percent_random:
  title: "置換されなかったマクロ %RND または %RANDOM"
  why: "メッセージに、置換されないまま残ったマクロ %RND または %RANDOM が含まれています。一斉送信ソフトウェアがランダムな変数を置き換えていません。約2ポイント。"
  fix:
    - "件名、ヘッダー、または HTML でマクロを見つけ、テンプレートから削除してください。"
sa.longwords:
  title: "長い単語が連続しています"
  why: "本文に、小文字の長い単語が長く連続しています。フィルターを欺くためにスパム送信者が加える、ランダムな文章のようなものです。1ポイント。"
  fix:
    - "メッセージに埋め草のテキストや連続したキーワードが残っていないか確認してください（alt 属性、隠しテキスト、キーワードの一覧）。"
sa.unwanted_language_body:
  title: "許可されていない言語で書かれたメッセージ"
  why: "テストサーバーは一部の言語しか受け付けず、メッセージは別の言語で書かれています。ok_languages が制限されている場合にのみ発生します。2.8ポイント。"
  fix:
    - "言語が意図したものであれば、メッセージ側の修正は不要です。テストサーバーが言語をフィルターしていることを報告してください。"
sa.nice_reply_a:
  title: "メッセージが本物の返信のように見えます"
  why: "メッセージは、スレッドにおける本物の返信のヘッダーを持っています。大きな加点（約3ポイント）。"
  fix:
    - "修正は不要です。キャンペーンで偽の Re: を付けないでください。この操作ではこのルールは発動せず、読者の不快感を招きます。"
sa.gtube:
  title: "アンチスパムのテストメッセージ GTUBE"
  why: "メッセージに GTUBE の文字列が含まれています。すべてのフィルターにスパムとして認識されるよう作られたものです。1,000ポイント。"
  fix:
    - "GTUBE の文字列を削除してください。フィルターが動作することを確認するためだけのものです。"
spamassassin.over_threshold:
  title: "SpamAssassin がこのメッセージをスパムと判定しています（{value} ポイント、閾値 {rule_score}）"
  why: "この閾値を超えると、既定の設定の SpamAssassin でフィルターするサーバーは、メッセージを迷惑メールに振り分けるか、拒否します。ポイントは「迷惑メールのリスク」に一覧されたルールから来ています。"
  fix:
    - "まず、最も多くのポイントを失っている SpamAssassin のルールを修正してください。"
    - "次にテストメッセージを再送してください。{rule_score} ポイントを下回る必要があります。"
