links.shortener:
  title: "メールが URL 短縮サービスを使っています"
  why: "リンク {url} は、公開の短縮サービスを経由しています。これらのドメインはスパム送信者と共有されており、その評判がお客様のメールにも及びます。また、受信者にはどこへ行くのかが分かりません。"
  fix:
    - "短縮リンクを、{domain} 上のページの完全なアドレスに置き換えてください。"
    - "アドレスが長すぎる場合は、お客様自身のドメインに短いリダイレクトを作成してください（例：https://{domain}/promo）。"
    - "クリックの追跡が必要な場合は、カスタムの追跡ドメインを持つ配信ツールの機能を使ってください。"
links.text_url_mismatch:
  title: "リンクが、ある宛先を表示しながら別の宛先へ飛びます"
  why: "リンクのテキストにはアドレスが表示されていますが、クリックすると {url} に飛びます。これはフィッシングの典型的な特徴です。フィッシング対策のフィルターは、このずれを強く罰します。"
  fix:
    - "リンクのテキストがアドレスである場合は、そのアドレスを正確にリンク先にしてください。"
    - "そうでない場合は、アドレスの代わりに「注文内容を見る」などの説明的なリンクテキストを書いてください。"
    - "ずれがクリックの追跡によるものである場合は、{domain} のサブドメイン上に追跡ドメインを設定してください。"
links.http_not_https:
  title: "一部のリンクが https ではなく http を使っています"
  why: "リンク {url} は暗号化されていません。ブラウザーはこれを安全でないと表示します。また、平文のリンクは、リンクの品質を評価するフィルターにとって不利な信号です。"
  fix:
    - "テンプレートのすべてのリンクで、http:// を https:// に置き換えてください。"
    - "サイトが HTTPS で応答しない場合は、サイトに証明書をインストールしてください（Let's Encrypt は、多くのホスティング事業者で無料です）。"
  fix_by_provider:
    sendgrid: "http がクリックの追跡から来ている場合は、追跡ドメインで SSL を有効にしてください：Settings > Sender Authentication > Link Branding。その後、SendGrid の SSL click tracking の手順に従ってください。"
links.ip_literal:
  title: "リンクがドメイン名ではなく IP アドレスを指しています"
  why: "リンク {url} は IP アドレスを使っています。正規のサイトにはドメイン名があります。Microsoft のフィルターを含め、フィルターはこうしたリンクを疑わしいものとして扱います。"
  fix:
    - "IP アドレスを、サイトのドメイン名に置き換えてください（例：https://{domain}/）。"
    - "サービスに名前がない場合は、{domain} のサブドメインを作成してその IP を指すようにし、証明書をインストールしてください。"
links.nonstandard_port:
  title: "リンクが一般的でないポートを指しています"
  why: "リンク {url} は、一般的な Web のポート以外を指しています。Microsoft は、こうしたメールのスパムスコアを上げることを提案しており、一部の企業ネットワークはこれらのポートをブロックします。"
  fix:
    - "ページをポート 443（標準の HTTPS）で提供し、リンクからポート番号を削除してください。"
    - "アプリケーションが別のポートで動いている場合は、{domain} のサブドメイン上でリバースプロキシの背後に置いてください。"
links.uribl_listed:
  title: "メール内のリンクが、ブラックリストに登録されたドメインを指しています"
  why: "リンク {url} のドメインは、{list_name} に登録されています。フィルターはリンクごとにこれらのリストを参照します。登録された 1 つのドメインだけで、メールが迷惑メールフォルダーに入ることがよくあります。"
  fix:
    - "ドメインがお客様のものでない場合は、このリンクをメールから削除するか、別の情報源に置き換えてください。"
    - "お客様のドメインまたは追跡ドメインである場合は、ブラックリストの系統の診断を確認し、原因を修正してから、{delist_url} で削除を依頼してください。"
    - "リンクが、短縮サービスや共有の追跡ドメインを経由していないか確認してください。"
links.domain_recent:
  title: "リンクが、ごく最近作られたドメインを指しています"
  why: "リンク {url} のドメインは、{value} 前に登録されています。新しいドメインは大量にフィッシングに使われるため、フィルターはこれらにほとんど信頼を与えません。"
  fix:
    - "可能であれば、リンクを、より古いお客様のメインドメイン {domain} のページに向けてください。"
    - "新しいドメインを維持する場合は、実際のサイトを公開し、そのドメインを含むメールの送信量を徐々に増やしてください。"
links.broken:
  title: "メール内のリンクが壊れています"
  why: "リンク {url} は、{value} のエラーを返します。読者はエラーページに行き着き、リンク切れは、リンクをたどるフィルターにとって、メールが雑に作られた兆候です。"
  fix:
    - "ブラウザーでリンクを開き、エラーを確認してください。"
    - "テンプレートのアドレスを修正するか、サイト上のページを復元してください。"
    - "ページが移動した場合は、古いアドレスから新しいアドレスへの 301 リダイレクトを追加してください。"
links.redirect_chain:
  title: "リンクが複数のリダイレクトを経由しています"
  why: "リンク {url} は、到着するまでに {value} 回のリダイレクトを経由します。各段階でページの表示が遅くなり、評判の悪いドメインを経由することもあります。長いリダイレクトの連鎖は、スパムに典型的です。"
  fix:
    - "リダイレクトを経た後の、ページの最終的なアドレスをメールに書いてください。"
    - "リダイレクトは最大 1 回にしてください。配信ツールのクリック追跡によるものだけにしてください。"
links.open_redirect:
  title: "リンクが、第三者サイトのオープンリダイレクトを経由しています"
  why: "リンク {url} は、実際の送り先を隠すために、別のサイトのリダイレクトを使っています。この手法はフィルターを回避するために使われ、フィルターはそれを認識します。"
  fix:
    - "このリンクを、送り先ページの直接のアドレスに置き換えてください。"
    - "検索エンジンや SNS からリンクをコピーした場合は、ページを開き、ブラウザーのアドレスバーに表示されているアドレスをコピーしてください。"
links.tracking_domain_unbranded:
  title: "追跡リンクが、配信ツールの共有ドメインを使っています"
  why: "クリックは {provider} のドメインを経由します。このドメインは、すべての顧客と共有されています。その中の 1 社がスパムを送ると、このドメインが罰せられ、お客様のリンクも一緒に罰せられるおそれがあります。"
  fix:
    - "サブドメイン（例：track.{domain}）上にカスタムの追跡ドメインを設定してください。"
    - "送信ツールが示す CNAME レコードを公開し、そのあと同ツールの設定でそのドメインを有効にしてください。"
  fix_by_provider:
    sendgrid: "Settings > Sender Authentication > Link Branding > Brand your links：{domain} のサブドメインを選び、表示された CNAME を公開してください。"
    mailgun: "送信ドメインの Tracking の項目で、{domain} 上に追跡ドメインを入力し、表示された CNAME を公開してください。"
    amazon_ses: "Configuration set を作成し、クリックの追跡用にカスタムのリダイレクトドメイン（custom redirect domain）を設定してから、お使いのリージョンの追跡エンドポイントへの CNAME を公開してください。"
links.executable_target:
  title: "リンクが実行ファイルをダウンロードします"
  why: "リンク {url} は、{value} 形式のファイルを直接ダウンロードさせます。Gmail は、この種類のファイルを添付ファイルとして拒否します。フィルターも、実行ファイルへのリンクを同じように扱います。"
  fix:
    - "直接のリンクを、ファイルを説明する {domain} のダウンロードページへのリンクに置き換えてください。"
    - "ソフトウェアの場合は、アプリストアまたは署名付きのダウンロードページから配布してください。"
links.unsafe_scheme:
  title: "リンクが危険なプロトコル（javascript:、data:、file:）を使っています"
  why: "リンク {url} は Web のアドレスではありません。クライアントはこれを無効にし、フィルターはコードを実行するか、ローカルファイルを開こうとする試みと見なします。"
  fix:
    - "この種のリンクはすべて、{domain} のページへの https アドレスに置き換えてください。"
    - "配信ツールのエディターが javascript:void(0) のリンクを作った場合は、そのリンクを削除するか、実際の送り先を設定してください。"
links.userinfo_in_url:
  title: "リンクに、実際の送り先を隠す @ が含まれています"
  why: "{url} では、@ より前の部分はブラウザーに無視されます。リンクはあるサイトへ行くように見えて、実際には別のサイトへ行きます。これは知られたフィッシングの手口で、罰せられます。"
  fix:
    - "リンクから ユーザー名:パスワード@ の部分を削除してください。"
    - "リンクが識別子を渡す必要がある場合は、? の後のクエリパラメーターとして渡してください。"
links.punycode_lookalike:
  title: "リンクが、既知のドメインに似せたアクセント付きのドメインを使っています"
  why: "リンク {url} は、既知のドメインに似た文字で書かれたドメイン名を使っています。これはなりすましの手口で、フィルターとブラウザーが監視しています。"
  fix:
    - "このドメインがお客様のものでない場合は、リンクを削除してください。"
    - "お客様のアクセント付きのドメインである場合は、メールでは {domain} 上のアクセントなしのバージョンを優先してください。"
links.free_hosting_or_dyndns:
  title: "リンクが、無料のホスティングまたは動的 DNS を指しています"
  why: "リンク {url} は、誰でも無料でページを作れるサービス上でホストされています。これらのサービスはフィッシングに大量に使われており、評判が低くなっています。"
  fix:
    - "ページをお客様自身のドメイン {domain} でホストしてください。"
    - "ページビルダーを使っている場合は、{domain} のサブドメインを接続してください。"
links.cloud_share:
  title: "メールが、説明の少ないファイル共有へのリンクを送っています"
  why: "短いメールが共有ファイルへのリンクを送っている形は、偽の請求書の送信によく似ています。フィルターも受信者もこれを警戒します。"
  fix:
    - "ファイルの内容と、それを送る理由を数文で説明してください。"
    - "請求書や見積書など、予期されている文書の場合は、PDF を添付するか、{domain} の顧客スペースに置いてください。"
links.no_link_to_sender_domain:
  title: "送信者のサイトへのリンクがありません"
  why: "メールは {domain} から送られていますが、このドメインへのリンクがありません。フィルターは送信ドメインとリンクを突き合わせます。完全な不一致は、第三者のために送られたメールを思わせます。"
  fix:
    - "少なくとも 1 つ、{domain} のサイトへのリンクを追加してください（ロゴやフッターなど）。"
    - "マーケットプレイスで販売している場合は、お客様自身のサイトへのリンクも追加してください。"
links.localhost_or_staging:
  title: "リンクがテスト環境またはプライベートネットワークを指しています"
  why: "リンク {url} は、お客様のネットワークまたはテストサーバーでしか動作しません。受信者はエラーに行き着き、メールが校閲されていないように見えます。"
  fix:
    - "テストのアドレスを、{domain} 上の公開アドレスに置き換えてください。"
    - "アプリケーションで、サイトの基本アドレス（APP_URL や siteurl など）を本番の値に設定してください。"
  fix_by_provider:
    wordpress: "設定 > 一般 > サイトアドレス (URL) を確認してください。古いアドレスがデータベースに残っていないか、WP-CLI で探してください：wp search-replace 'https://preprod.{domain}' 'https://{domain}' --dry-run。"
links.too_many:
  title: "メールに、テキストの割にリンクが多すぎます"
  why: "メールには {value} 個のリンクがあります。テキストに対してリンクの密度が高いのはスパムの典型的な特徴で、評判の悪いドメインに当たる危険も増えます。"
  fix:
    - "主要な行動喚起（CTA）と、少数の副次的なリンクだけを残してください。"
    - "同じページに向かう重複したリンクを削除してください。"
links.empty_href:
  title: "リンクに送り先がありません"
  why: "一部のボタンやリンクは、どこにも行きません。読者はクリックしても何も起きず、メールが書きかけに見えます。"
  fix:
    - "各リンクに https のアドレスを与えるか、テキストの周りの a タグを削除してください。"
    - "特にフッターの SNS アイコンを確認してください。"
links.mailto_only:
  title: "メールが mailto のリンクしか含んでいません"
  why: "すべてのリンクが、新しいメールの作成画面を開きます。これは不利ではありませんが、読者がサイト上でお客様が誰かを確認する手段がありません。"
  fix:
    - "署名などに、{domain} のサイトへのリンクを追加してください。"
