ip.not_public:
  title: "IP アドレス {ip} はパブリックアドレスではありません"
  why: "{ip} は次の分類に該当します：{value}。これはインターネット上の送信用アドレスではありません。ブラックリストも評価サービスも把握しておらず、メッセージの受信者が見るアドレスでもありません。"
  fix:
    - "メッセージが送信されるパブリックアドレスを探してください。受信したメッセージのヘッダーで、社外の最初のサーバーが追加した Received ヘッダーを見つけます。from の後の角括弧内の IP が送信元アドレスです。"
    - "または、ホスティング会社や送信サービスに、メッセージの送信元 IP アドレスを確認してください。"
    - "このパブリックアドレスで検証をやり直してください。"
ip.virustotal_flagged:
  title: "VirusTotal の {value} 個のエンジンが IP {ip} を悪意あるものと判定しています"
  why: "VirusTotal は数十のセキュリティリストを集約しています。単独のエンジンは誤判定することが多く、複数のエンジンが一致して検出する場合は、通常このアドレスにホストされた悪意あるコンテンツや、侵害されたマシンを示します。"
  fix:
    - "{url} を開いてください。Detection タブに、どのエンジンがこのアドレスを検出し、どの判定かが表示されます。"
    - "そのアドレスがご自身のものであれば、改ざんされたサイトや悪意あるファイルを探して削除し、VirusTotal で再スキャンしてください。"
    - "誤判定しているエンジンについては、VirusTotal の詳細ページのリンクを添えて、そのエンジンの提供元に連絡してください。VirusTotal 自身は結果を変更できないと案内しています。"
ip.otx_pulses:
  title: "IP {ip} は {value} 件の OTX 指標コレクションに含まれています"
  why: "OTX AlienVault のコレクション（pulses）は、コミュニティのメンバーが公開しています。含まれていることは判断材料であり、判定ではありません。共有されたアドレスや再割り当てされたアドレスは、現在の用途と無関係なコレクションに含まれることがよくあります。"
  fix:
    - "{url} を開き、各コレクションの日付と内容を確認してください。"
    - "スパム、フィッシング、マルウェアに関する最近のコレクションのみを対象にしてください。そのアドレスがご自身のものであれば、悪用通報の場合と同様に原因を調べてください。"
ip.prefix_not_announced:
  title: "インターネット上でどのネットワークも {ip} の経路を広報していません"
  why: "RIPEstat が観測したルーティングテーブルに {ip} への経路はありません。広報されていないアドレスは、インターネット上でメールを送受信できません。入力ミスであるか、以前の保有者が返却したアドレスであることがよくあります。"
  fix:
    - "入力したアドレスを確認してください。ホスティング会社が示すアドレス、または受信メッセージで社外の最初のサーバーが追加した Received ヘッダーのアドレスと比べてください。"
    - "そのアドレスがご自身のもので、最近割り当てられたばかりの場合は、ホスティング会社にプレフィックスが広報されているか確認し、後で検証をやり直してください。"
ip.abuseipdb_reported:
  title: "IP {ip} は AbuseIPDB で通報されています（スコア {value} %）"
  why: "管理者が {ip} をスパム、攻撃、ポートスキャンなどの悪用で報告しています。共有 IP では古い通報が数件残っていることはよくあります。スコアが高い場合は、最近も繰り返し悪用されていることを示します。"
  fix:
    - "{url} を開き、通報のカテゴリ、コメント、日付を確認してください。"
    - "そのアドレスがご自身のものであれば、侵害されたマシンやアカウント（盗まれたパスワード、改ざんされたサイト、開放された SMTP サーバー）を探し、原因を修正してください。"
    - "削除依頼を待たないでください。AbuseIPDB には、アドレスの保有者向けの削除手続きが文書化されていません。通報の影響は時間とともに減り、悪用が止まればスコアも下がります。"
    - "そのアドレスがホスティング会社または送信サービスのものであれば、{url} のリンクを伝えてください。"
ip.domain_not_found:
  title: "ドメイン {domain} は存在しません"
  why: "権威 DNS サーバーが、{domain} は存在しない（NXDOMAIN）と応答しています。存在しない名前はメールを受信も送信もできず、どのソースもその評判を評価できません。"
  fix:
    - "入力した名前のスペルを確認してください。"
    - "ご自身のドメインであれば、レジストラでドメインが登録されているか、期限切れになっていないか、DNS サーバーが設定されているかを確認してください。"
ip.domain_ip_listed:
  title: "{value} {host} の IP {ip} が {list_name} に登録されています"
  why: "このアドレスは {domain} で使われています。メールサーバーの IP が {list_name} に登録されていると、そのリストを参照するサーバーはメッセージを拒否するか、迷惑メールに振り分けます。Web サイトの IP が登録されている場合は、通常、悪質なサイトとの共有ホスティングか、侵害されたサイトであることを示します。"
  fix:
    - "{ip} の行に記載されている理由と削除手続きを、このページの下のほうで確認してください。"
    - "そのアドレスがホスティング会社またはメールサービスのものであれば、登録されたことを伝えてください。削除を依頼するのは、そのサービス側の役目です。"
    - "ご自身のサーバーであれば、原因（侵害されたアカウントやサイト、望まない送信）を修正してから、{delist_url} で削除を依頼してください。"
ip.domain_recent:
  title: "ドメイン {domain} は {value} 前に作成されました"
  why: "作成から 30 日未満のドメインには、まだ履歴がありません。メールフィルターはそのドメインをほとんど信頼せず、フィッシングのキャンペーンはまさに新しいドメインを使うためです。"
  fix:
    - "ご自身のドメインであれば、送信量を少しずつ増やし、最初から SPF、DKIM、DMARC を公開してください。"
    - "ドメインが既知のサービスを名乗っている場合は、そのサービスの公式ドメインと比較してください。"
ip.domain_safe_browsing:
  title: "Google Safe Browsing が {domain} を危険として分類しています（{value}）"
  why: "Google は {domain} のトップページを危険なサイトのリストに登録しました。Chrome を含む Safe Browsing を使うブラウザは、このアドレスで赤い警告ページを表示します。"
  fix:
    - "ご自身のドメインであれば、サイトが改ざんされた可能性が高いため、クリーンアップしてから、Google Search Console の「セキュリティの問題」レポートで再審査を依頼してください。"
    - "それ以外の場合は、このサイトに一切情報を入力しないでください。"
ip.domain_virustotal:
  title: "VirusTotal の {value} 個のエンジンが、ドメイン {domain} を悪意あるものと判定しています"
  why: "VirusTotal は数十のセキュリティリストを集約しています。単独のエンジンは誤判定することが多く、複数のエンジンが一致する場合は、通常、悪意あるコンテンツをホストしている（またはホストしていた）サイトを示します。"
  fix:
    - "VirusTotal の詳細ページ {url} を開いてください。Detection タブに、どのエンジンがこのドメインを検出し、どの判定かが表示されます。"
    - "ご自身のドメインであれば、改ざんされたサイトや悪意あるファイルを探して削除し、VirusTotal で再スキャンしてください。"
    - "誤判定しているエンジンについては、VirusTotal の詳細ページのリンクを添えて、そのエンジンの提供元に連絡してください。"
ip.domain_urlhaus:
  title: "URLhaus は {domain} 上の悪意あるアドレスを {value} 件記録しています"
  why: "abuse.ch が運営する URLhaus は、マルウェアを配布しているアドレスを記録しています。{domain} のファイルが記録されています。つまり、そのサイトはマルウェアをホストしている（またはホストしていた）ことになります。"
  fix:
    - "ご自身のサイトであれば、URLhaus の詳細ページ {url} で該当アドレスを確認し、ファイルを削除したうえで、そのファイルを置けてしまった脆弱性を修正してください。"
    - "サイトへのアクセス用パスワード（FTP、管理画面、データベース）を変更し、拡張機能を更新してください。"
