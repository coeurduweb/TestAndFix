subdomains.takeover_risk:
  title: "{subdomain} は {service} 上で、第三者に乗っ取られるおそれがあります"
  why: "{subdomain} は {target} を指していますが、これは既に存在しない {service} のリソースです。誰でも {service} にアカウントを開き、このリソースをこの名前で再作成して、{subdomain} に好きな内容を公開できます。たとえば、お客様の名義のフィッシングページ、{domain} に設定された Cookie の窃取、本人の知らないうちに取得された証明書などです。"
  fix:
    - "{subdomain} が使われなくなった場合は、{domain} の DNS ゾーンで CNAME レコードを削除してください。これが最も安全な対処です。"
    - "使い続ける場合は、直ちに {service} の中で、{target} という名前でリソースを再作成し、お客様のアカウントに {subdomain} を接続してください。"
    - "測定をやり直してください。{subdomain} が「名前解決できない」または「有効」になり、警告が出ないはずです。"
    - "今後のために、サービス側のリソースを削除する前に CNAME を削除してください。後ではなく、必ず先に削除します。"
subdomains.takeover_possible:
  title: "{subdomain} が、既に存在しない {service} のリソースを指しています"
  why: "{subdomain} は {target} を指していますが、{service} は、この名前に紐付くサイトがないと応答しています。サービスの設定によっては、別の顧客が {subdomain} の所有を主張し、そこに自分のコンテンツを公開できます。乗っ取られなくても、訪問者は {service} のエラーページに行き着きます。"
  fix:
    - "{subdomain} が使われなくなった場合は、{domain} の DNS ゾーンで CNAME レコードを削除してください。"
    - "使い続ける場合は、{service} で {subdomain} を、お客様のサイトまたはアプリケーションに再接続してください。"
    - "GitHub Pages の場合は、お客様のアカウントまたは組織の Pages の設定で {domain} を確認してください。そうすれば、ほかの誰もそれを使えなくなります。"
    - "測定をやり直し、警告が消えたことを確認してください。"
subdomains.cname_dangling:
  title: "存在しない宛先を指す CNAME：{value}"
  why: "{subdomain} は {target} を指していますが、これは存在しない名前です（NXDOMAIN）。このサブドメインはもう役に立ちません。さらに、宛先のドメインが期限切れになるか、空き状態になると、それを購入した人がお客様のサブドメインも支配することになります。"
  fix:
    - "リストされた名前ごとに、{domain} の DNS ゾーンを開き、使われていない CNAME レコードを削除してください。"
    - "その名前を使い続ける場合は、宛先を、サービスの現在のアドレスに置き換えてください。"
    - "各宛先のドメインが、まだお客様のものであるか、期待どおりのサービスのものであるかを確認してください。"
subdomains.cert_expiring:
  title: "配信中の証明書の期限が近いサブドメイン：{value}"
  why: "{subdomain} が現在提示している証明書が、期限切れに近づいています。本来はすでに更新されているべき時期です。自動更新が止まっている可能性が高いです。期限が来ると、ブラウザーはセキュリティの警告を表示し、サイトをブロックします。"
  fix:
    - "{subdomain} を配信しているサーバーで、更新を手動で実行してください（例：certbot renew）。そしてエラーを読んでください。"
    - "よくある原因は、DNS レコードの変更、リダイレクトやファイアウォールでブロックされた HTTP チャレンジ、停止したスケジュールタスクです。"
    - "{subdomain} が CDN またはホスティングの背後にある場合は、そこで証明書が有効になっていることを確認してください。"
    - "測定をやり直してください。表示される有効期限が後ろに延びているはずです。"
subdomains.cert_expired_active:
  title: "期限切れの証明書を配信しているサブドメイン：{value}"
  why: "{subdomain} は現在、期限切れの証明書を提示しています。ブラウザーはセキュリティの警告を表示し、ほとんどの訪問者はそこで立ち止まります。アプリケーションと API は接続を拒否します。"
  fix:
    - "{subdomain} を配信しているサーバーで、証明書を更新し（例：certbot renew）、Web サーバーを再読み込みしてください。"
    - "{subdomain} が使われなくなった場合は、{domain} の DNS ゾーンでそのレコードを削除してください。"
    - "測定をやり直し、新しい有効期限を確認してください。"
subdomains.internal_names:
  title: "全員に見える内部名：{value}"
  why: "すべての証明書は、誰でも読める公開のログに記録されています。{subdomain} のような名前は、攻撃者にテスト環境や管理ツールの場所を教えます。それらは、メインサイトより保護が弱いことが多いです。"
  fix:
    - "リストにある使用中の名前ごとに、認証が必要であるか、お客様のネットワーク（許可された IP アドレスのリスト、VPN）からのみ到達可能であることを確認してください。"
    - "テスト環境には、ワイルドカード証明書（*.{domain}）を使うことをお勧めします。これでは、各サブドメインの正確な名前は分かりません。"
    - "DNS ゾーンから、使われていない名前を削除してください。ただし、ログには履歴が永久に残ります。"
subdomains.dead_names:
  title: "もう解決されないサブドメイン：{value}"
  why: "これらの名前には証明書が発行されたことがありますが、今は住所がありません。公開のログには永久に残ります。これは正常であり、削除されたサービスを指す CNAME が残っていない限り、危険はありません。"
  fix:
    - "これらの名前が使われていなければ、何もする必要はありません。"
    - "そのうちの 1 つが今も使われる必要がある場合は、{domain} の DNS ゾーンでそのレコードを作り直してください。"
subdomains.wildcard_dns:
  title: "{domain} のゾーンが、どんな名前にも応答します"
  why: "{domain} 配下に作った架空の名前は、アドレス {value} を受け取ります。このアドレスを受け取る同じサブドメインには「DNS ワイルドカード経由」と表示されます。これらは、もはや実在のものとしては存在しないかもしれません。"
  fix:
    - "ワイルドカードが意図したものでない場合は、DNS ゾーンから *.{domain} のレコードを削除してください。"
    - "意図したものである場合は、「DNS ワイルドカード経由」と表示された名前を確認してください。使われていないものには、対応は不要です。"
subdomains.resolution_capped:
  title: "DNS の名前解決なしで一覧されたサブドメイン：{value}"
  why: "ログには、{domain} について 500 を超える名前があります。最近確認された 500 件は名前解決されています。残りの {value} 件は、DNS の状態なしで一覧されており、スコアには含まれません。"
  fix:
    - "すべての名前を解決するため、より具体的なサブドメインを測定してください（例：dev.{domain}）。"
subdomains.none_found:
  title: "{domain} に対して公開されている証明書はありません"
  why: "Certificate Transparency のログに、この名前の証明書はありません。{domain} は https のサイトを配信していないか、その証明書が別の名前を対象にしているかのどちらかです。"
  fix:
    - "ドメインのつづりを確認してください。サブドメインを入力していた場合は、メインドメインを測定してください。"
