ip.not_public:
  title: "Die Adresse {ip} ist keine öffentliche Adresse"
  why: "{ip} gehört zu dieser Kategorie: {value}. Das ist keine Versandadresse im Internet: Keine Blockliste und kein Reputationsdienst kennt sie, und es ist nicht die Adresse, die die Empfänger Ihrer Nachrichten sehen."
  fix:
    - "Suchen Sie die öffentliche Adresse, über die Ihre Nachrichten hinausgehen: Suchen Sie im Header einer empfangenen Nachricht den Header Received, den der erste Server außerhalb Ihres Netzes hinzugefügt hat; die IP in eckigen Klammern hinter from ist Ihre Ausgangsadresse."
    - "Oder fragen Sie Ihren Hoster oder Ihren Versanddienst nach der IP-Adresse, über die Ihre Nachrichten ausgehen."
    - "Starten Sie die Prüfung mit dieser öffentlichen Adresse erneut."
ip.virustotal_flagged:
  title: "{value} Engines von VirusTotal stufen die IP {ip} als bösartig ein"
  why: "VirusTotal aggregiert Dutzende von Sicherheitslisten. Eine einzelne Engine irrt sich oft; mehrere übereinstimmende Engines weisen in der Regel auf schädlichen Inhalt auf dieser Adresse oder auf einen kompromittierten Rechner hin."
  fix:
    - "Öffnen Sie {url}: Der Reiter Detection zeigt, welche Engines die Adresse melden und mit welchem Urteil."
    - "Gehört die Adresse Ihnen, suchen Sie nach einer gehackten Website oder einer gehosteten Schaddatei, entfernen Sie sie und starten Sie die Analyse auf VirusTotal erneut."
    - "Bei einer Engine, die sich irrt, schreiben Sie an deren Anbieter mit dem Link zum VirusTotal-Eintrag: VirusTotal erklärt, die Ergebnisse nicht selbst ändern zu können."
ip.otx_pulses:
  title: "Die IP {ip} ist in {value} Sammlung(en) von OTX-Indikatoren enthalten"
  why: "Die Sammlungen (Pulses) von OTX AlienVault werden von Community-Mitgliedern veröffentlicht. Eine Aufnahme ist ein Hinweis, den man lesen muss, kein Urteil: Eine geteilte oder neu vergebene Adresse taucht oft in Sammlungen auf, die mit ihrer heutigen Nutzung nichts zu tun haben."
  fix:
    - "Öffnen Sie {url} und sehen Sie sich Datum und Thema jeder Sammlung an."
    - "Berücksichtigen Sie nur aktuelle Sammlungen zu Spam, Phishing oder Schadsoftware. Gehört die Adresse Ihnen, suchen Sie die Ursache wie bei einer Missbrauchsmeldung."
ip.prefix_not_announced:
  title: "Kein Netz kündigt die Adresse {ip} im Internet an"
  why: "Die von RIPEstat beobachteten Routing-Tabellen enthalten keine Route zu {ip}. Eine nicht angekündigte Adresse kann im Internet weder senden noch empfangen: Oft ist es ein Tippfehler oder eine Adresse, die ihr früherer Inhaber zurückgegeben hat."
  fix:
    - "Prüfen Sie die eingegebene Adresse: Vergleichen Sie sie mit der Angabe Ihres Hosters oder mit dem Header Received, den der erste Server außerhalb Ihres Netzes in einer empfangenen Nachricht hinzugefügt hat."
    - "Gehört die Adresse tatsächlich Ihnen und wurde sie gerade zugewiesen, fragen Sie Ihren Hoster, ob das Präfix angekündigt ist, und starten Sie die Prüfung später erneut."
ip.abuseipdb_reported:
  title: "Die IP {ip} ist auf AbuseIPDB gemeldet (Score {value} %)"
  why: "Administratoren haben {ip} wegen Missbrauchs gemeldet: Spam, Angriffe, Port-Scans. Einige ältere Meldungen zu einer geteilten IP sind häufig; ein hoher Score zeigt wiederholte, aktuelle Aktivität."
  fix:
    - "Öffnen Sie {url} und lesen Sie die Kategorien und Kommentare der Meldungen mit ihren Daten."
    - "Gehört die Adresse Ihnen, suchen Sie den kompromittierten Rechner oder das kompromittierte Konto (gestohlenes Passwort, gehackte Website, offener SMTP-Server) und beheben Sie die Ursache."
    - "Warten Sie nicht auf eine Entfernung auf Antrag: AbuseIPDB dokumentiert kein Verfahren, mit dem der Inhaber der Adresse eine Entfernung erwirken kann. Das Gewicht der Meldungen nimmt mit der Zeit ab, und der Score sinkt, sobald der Missbrauch aufhört."
    - "Gehört die Adresse Ihrem Hoster oder Ihrem Versanddienst, leiten Sie ihm den Link {url} weiter."
ip.domain_not_found:
  title: "Die Domain {domain} existiert nicht"
  why: "Die autoritativen DNS-Server melden, dass {domain} nicht existiert (NXDOMAIN). Ein nicht existierender Name kann weder E-Mails empfangen noch senden, und keine Quelle kann seinen Ruf bewerten."
  fix:
    - "Prüfen Sie die Schreibweise des eingegebenen Namens."
    - "Gehört die Domain Ihnen, prüfen Sie bei Ihrem Registrar, dass sie registriert ist, nicht abgelaufen ist und dass ihre DNS-Server hinterlegt sind."
ip.domain_ip_listed:
  title: "{value} {host} mit der IP {ip} ist auf {list_name} eingetragen"
  why: "Diese Adresse dient {domain}. Die IP eines Mailservers, die auf {list_name} steht, führt dazu, dass seine Nachrichten von allen Servern abgelehnt oder als Spam einsortiert werden, die diese Liste abfragen. Die eingetragene IP einer Website weist in der Regel auf ein Hosting zusammen mit missbräuchlichen Websites oder auf eine kompromittierte Website hin."
  fix:
    - "Lesen Sie Grund und Entfernungsverfahren in der Zeile der Adresse {ip}, weiter unten auf dieser Seite."
    - "Gehört die Adresse Ihrem Hoster oder Ihrem Mail-Dienst, leiten Sie ihm den Eintrag weiter: Er muss die Entfernung beantragen."
    - "Gehört der Server Ihnen, beheben Sie die Ursache (kompromittiertes Konto oder Website, unerwünschte Versände), bevor Sie die Entfernung auf {delist_url} beantragen."
ip.domain_recent:
  title: "Die Domain {domain} wurde vor {value} erstellt"
  why: "Eine Domain, die jünger als 30 Tage ist, hat noch keine Historie: Mail-Filter schenken ihr wenig Vertrauen, und Phishing-Kampagnen nutzen gerade neue Domains."
  fix:
    - "Gehört die Domain Ihnen, erhöhen Sie Ihr Versandvolumen schrittweise und veröffentlichen Sie SPF, DKIM und DMARC von Anfang an."
    - "Gibt sich die Domain als die eines bekannten Dienstes aus, vergleichen Sie sie mit der offiziellen Domain dieses Dienstes."
ip.domain_safe_browsing:
  title: "Google Safe Browsing stuft die Domain {domain} als gefährlich ein ({value})"
  why: "Google hat die Startseite von {domain} in seine Listen gefährlicher Websites aufgenommen. Browser, die Safe Browsing nutzen, darunter Chrome, zeigen für diese Adresse eine rote Warnseite an."
  fix:
    - "Gehört die Domain Ihnen, wurde die Website wahrscheinlich gehackt: Bereinigen Sie sie und beantragen Sie in der Google Search Console im Bericht Sicherheitsprobleme eine erneute Prüfung."
    - "Andernfalls geben Sie auf dieser Website keinerlei Daten ein."
ip.domain_virustotal:
  title: "{value} Engines von VirusTotal stufen die Domain {domain} als schädlich ein"
  why: "VirusTotal aggregiert Dutzende von Sicherheitslisten. Eine einzelne Engine irrt sich oft; mehrere übereinstimmende Engines weisen in der Regel auf eine Website hin, die schädlichen Inhalt hostet oder gehostet hat."
  fix:
    - "Öffnen Sie den VirusTotal-Eintrag {url}: Der Reiter Detection zeigt, welche Engines die Domain melden und mit welchem Urteil."
    - "Gehört die Domain Ihnen, suchen Sie nach einer gehackten Website oder einer gehosteten Schaddatei, entfernen Sie sie und starten Sie die Analyse auf VirusTotal erneut."
    - "Bei einer Engine, die sich irrt, schreiben Sie an deren Anbieter mit dem Link zum VirusTotal-Eintrag."
ip.domain_urlhaus:
  title: "URLhaus verzeichnet {value} schädliche Adresse(n) auf {domain}"
  why: "URLhaus, betrieben von abuse.ch, verzeichnet Adressen, die Schadsoftware verteilen. Dateien von {domain} stehen dort: Die Website hostet oder hostete Schadsoftware."
  fix:
    - "Gehört die Website Ihnen, öffnen Sie den URLhaus-Eintrag {url}, um die betroffenen Adressen zu sehen, löschen Sie diese Dateien und beheben Sie die Lücke, durch die sie abgelegt werden konnten."
    - "Ändern Sie die Passwörter für den Zugang zur Website (FTP, Administration, Datenbank) und aktualisieren Sie die Erweiterungen."
