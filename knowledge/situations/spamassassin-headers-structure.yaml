  fix:
  - 'Formatez la date en RFC 5322 : jour et mois abrégés en anglais, heure, décalage horaire numérique.'
  - En PHP, utilisez date(DATE_RFC2822) ou laissez PHPMailer la générer.
  example_bad: 'Date: mardi 10 novembre 2026 14:05'
  example_good: 'Date: Tue, 10 Nov 2026 14:05:00 +0100'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_head_tests.cf
  - https://www.rfc-editor.org/rfc/rfc5322#section-3.3
- id: sa.invalid_date_tz_absurd
