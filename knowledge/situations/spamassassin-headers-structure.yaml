    logiciels affichent alors des caractères illisibles.
  fix:
  - Déclarez l'objet en UTF-8 et laissez la bibliothèque l'encoder (=?UTF-8?Q?...?=).
  - En PHP avec mail(), encodez l'objet avec mb_encode_mimeheader().
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/felicity/70_other.cf
  - https://www.rfc-editor.org/rfc/rfc2047
