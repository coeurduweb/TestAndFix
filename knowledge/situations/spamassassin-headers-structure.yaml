  why: L'en-tête X-PHP-Script indique un envoi par la fonction mail() de PHP sur un hébergement mutualisé.
    Les sites piratés envoient du spam par ce chemin.
  fix:
  - Envoyez les e-mails du site par SMTP authentifié vers votre messagerie au lieu de mail().
  fix_by_provider:
    wordpress: Installez une extension SMTP (WP Mail SMTP, FluentSMTP, Post SMTP) et configurez le serveur
      de votre messagerie.
    cpanel: Créez une adresse e-mail dans cPanel et utilisez son serveur SMTP avec authentification dans
      l'application.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.php_script_mua
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(PHP_SCRIPT_MUA)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta exists:X-PHP-Script
      && X-Mailer =~ /^PHP$/.'
  sa_rules:
  - PHP_SCRIPT_MUA
  title: Message envoyé par un script PHP sans version
  why: 'Le message vient de mail() en PHP et déclare « X-Mailer: PHP » sans version. Signature d''un script
    écrit rapidement.'
  fix:
  - Passez par une bibliothèque (PHPMailer, Symfony Mailer) en SMTP authentifié.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.php_nover_mua
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(PHP_NOVER_MUA)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta X-Mailer =~ /^PHP$/,
      sans DKIM fiable ni autres exceptions.'
  sa_rules:
  - PHP_NOVER_MUA
  title: Logiciel d'envoi déclaré « PHP » sans version
  why: L'en-tête X-Mailer vaut simplement « PHP ». Les vrais logiciels de messagerie indiquent leur nom
    et leur version.
  fix:
  - Retirez l'en-tête X-Mailer du script ou utilisez une bibliothèque d'envoi.
  - 'Signez le message en DKIM : la règle ne s''applique plus.'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_xmailer.cf
- id: sa.php_orig_script
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(PHP_ORIG_SCRIPT)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta exists:X-PHP-Originating-Script
      && (ratio d''espaces anormal, objet d''un seul mot ou commentaires HTML qui coupent les mots), hors
      texte d''abonnement.'
  sa_rules:
  - PHP_ORIG_SCRIPT
  title: Script PHP d'origine indiqué et autres signes de robot
  why: L'en-tête X-PHP-Originating-Script nomme le script PHP qui a envoyé le message, et le contenu a
    des traits de spam automatique. Sur un site, cela peut signaler un formulaire détourné.
  fix:
  - Vérifiez dans l'en-tête quel fichier PHP a envoyé le message ; s'il vous est inconnu, le site est
    probablement compromis.
  - Faites passer les envois légitimes par SMTP authentifié.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.xm_phpmailer_forged
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(XM_PHPMAILER_FORGED)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta X-Mailer =~ /PHPMailer\s.*version\D+$/
      : mention « version » sans numéro. Pas de ligne score : valeur par défaut de SpamAssassin.'
  sa_rules:
  - XM_PHPMAILER_FORGED
  title: En-tête X-Mailer PHPMailer incomplet
  why: 'L''en-tête X-Mailer cite PHPMailer avec le mot « version » mais sans numéro. Les vrais en-têtes
    de PHPMailer indiquent la version : celui-ci est fabriqué ou modifié.'
  fix:
  - Laissez PHPMailer écrire son X-Mailer par défaut, ou réglez sa propriété XMailer sur un espace pour
    ne pas envoyer cet en-tête.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_xmailer.cf
- id: sa.mailing_list_multi
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(MAILING_LIST_MULTI)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : plus de 2 indices
      parmi X-Loop, X-Mailing-List, X-Mailman-Version, X-BeenThere, List-Unsubscribe, Precedence list/bulk,
      List-Id, List-Post, Mailing-List, Return-Path -request/-bounces. Pas de ligne score : valeur par
      défaut de SpamAssassin.'
  sa_rules:
  - MAILING_LIST_MULTI
  title: En-têtes d'un gestionnaire de liste de diffusion
  why: Le message porte plusieurs en-têtes de liste de diffusion. SpamAssassin le reconnaît comme un envoi
    de liste et assouplit d'autres règles. Score positif d'un point malgré tout.
  fix:
  - 'Rien à corriger : ces en-têtes sont utiles. Gardez List-Unsubscribe et List-Id.'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_ratware.cf
- id: sa.list_prtl_same_user
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(LIST_PRTL_SAME_USER)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : List-Unsubscribe
      sans List-Id, et même identifiant avant @ en From et To, sans DKIM.'
  sa_rules:
  - LIST_PRTL_SAME_USER
  title: En-têtes de liste incomplets et expéditeur égal au destinataire
  why: Le message a un List-Unsubscribe mais pas de List-Id, et l'expéditeur porte le même identifiant
    que le destinataire. Combinaison de faux envoi de liste.
  fix:
  - Ajoutez un en-tête List-Id cohérent si vous envoyez une liste de diffusion.
  - Utilisez une adresse d'expédition distincte et signez en DKIM.
  example_good: 'List-Id: Lettre d''information <lettre.exemple.fr>'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
  - https://www.rfc-editor.org/rfc/rfc2919
- id: sa.header_spam
  family: spamassassin
  severity: low
  penalty: 0.3
  detect:
    signal: spamassassin.hit(HEADER_SPAM)
    notes: 'score SA 4.0.x : 0.585 (sa-update r1939780, jeu réseau + Bayes). Teste : header ALL =~ en-têtes
      Alternate-Recipient, Antivirus, Approved, Delivery-Notification, Language, Location, Newsletter-ID,
      PID, UID, X-Company-*, X-E, X-Encoding, X-SP-Track-ID, X-bounce-to...'
  sa_rules:
  - HEADER_SPAM
  title: En-tête typique des logiciels d'envoi de spam
  why: Le message contient un en-tête qu'on ne trouve presque que dans des logiciels de spam (Newsletter-ID,
    UID, X-Company-Address, Antivirus...). Certains outils maison les ajoutent sans raison.
  fix:
  - Repérez l'en-tête en cause dans le message brut et retirez-le de votre outil ou script.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_ratware.cf
- id: sa.ratware_zero_tz
  family: spamassassin
  severity: medium
  penalty: 0.9
  detect:
    signal: spamassassin.hit(RATWARE_ZERO_TZ)
    notes: 'score SA 4.0.x : 1.781 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : Date terminée
      par +0000, Content-Type text/html et From du type "Prénom Nom" <pnom..@>.'
  sa_rules:
  - RATWARE_ZERO_TZ
  title: Date en +0000 et expéditeur au format de logiciel de spam
  why: La date est en temps universel, le message est en HTML et l'adresse est dérivée du nom selon un
    motif repéré dans un logiciel de spam.
  fix:
  - Générez la Date avec votre fuseau réel et ajoutez une partie texte au message.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_ratware.cf
- id: sa.forged_mua_outlook
  family: spamassassin
  severity: high
  penalty: 1.0
  detect:
    signal: spamassassin.hit(FORGED_MUA_OUTLOOK)
    notes: 'score SA 4.0.x : 1.927 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : X-Mailer Outlook
      ou Outlook Express sans Message-ID au format correspondant, ou X-Mailer « Outlook » seul.'
  sa_rules:
  - FORGED_MUA_OUTLOOK
  title: Le message se dit envoyé par Outlook mais n'en a pas les caractéristiques
  why: L'en-tête X-Mailer annonce Outlook, mais le Message-ID ne correspond pas à ce qu'Outlook génère.
    Un script qui imite Outlook pour paraître légitime obtient l'effet inverse.
  fix:
  - Retirez l'en-tête X-Mailer qui imite Outlook dans votre script ou outil.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_ratware.cf
- id: sa.forged_outlook_html
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(FORGED_OUTLOOK_HTML)
    notes: 'score SA 4.0.x : 0.021 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : X-Mailer Outlook
      && MIME_HTML_ONLY.'
  sa_rules:
  - FORGED_OUTLOOK_HTML
  title: Message « Outlook » sans partie texte
  why: Outlook envoie toujours une version texte avec le HTML. Un message qui se dit d'Outlook mais n'a
    que du HTML est imité. Score faible.
  fix:
  - Ajoutez une partie texte, et retirez le X-Mailer Outlook si vous n'envoyez pas depuis Outlook.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_ratware.cf
- id: sa.forged_outlook_tags
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(FORGED_OUTLOOK_TAGS)
    notes: 'score SA 4.0.x : 0.052 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : X-Mailer Outlook,
      HTML présent, mais pas toutes les balises html, head, meta et body.'
  sa_rules:
  - FORGED_OUTLOOK_TAGS
  title: HTML « Outlook » sans la structure qu'Outlook produit
  why: Outlook produit toujours un HTML complet. Un message « Outlook » sans ces balises a été fabriqué
    ailleurs. Score faible.
  fix:
  - Générez un document HTML complet (html, head, meta charset, body) et n'imitez pas le X-Mailer d'Outlook.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_ratware.cf
- id: sa.dos_outlook_to_mx
  family: spamassassin
  severity: high
  penalty: 1.4
  detect:
    signal: spamassassin.hit(DOS_OUTLOOK_TO_MX)
    notes: 'score SA 4.0.x : 2.845 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : X-Mailer Outlook
      (hors Outlook Express), un seul relais externe et pas d''en-têtes de liste.'
  sa_rules:
  - DOS_OUTLOOK_TO_MX
  title: Message « Outlook » remis directement au serveur du destinataire
  why: 'Le message se dit envoyé par Outlook mais il a été remis directement au serveur de réception,
    sans passer par un serveur d''envoi. Outlook passe toujours par un serveur : c''est la marque d''un
    robot. Près de 3 points.'
  fix:
  - Envoyez via le serveur SMTP de votre messagerie et retirez l'en-tête X-Mailer imitant Outlook.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/dos/70_other.cf
- id: sa.mimeole_direct_to_mx
  family: spamassassin
  severity: high
  penalty: 1.0
  detect:
    signal: spamassassin.hit(MIMEOLE_DIRECT_TO_MX)
    notes: 'score SA 4.0.x : 2 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : exists:X-MimeOLE
      et remise directe au MX, sans image jointe ni DKIM.'
  sa_rules:
  - MIMEOLE_DIRECT_TO_MX
  title: En-tête X-MimeOLE et remise directe au serveur
  why: Le message porte l'en-tête X-MimeOLE des logiciels Microsoft et arrive directement au serveur de
    réception. Combinaison typique des machines infectées.
  fix:
  - Passez par le serveur SMTP de votre messagerie, ou signez les messages en DKIM.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.dos_body_high_no_mid
  family: spamassassin
  severity: high
  penalty: 2.0
  detect:
    signal: spamassassin.hit(DOS_BODY_HIGH_NO_MID)
    notes: 'score SA 4.0.x : 3.999 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : corps contenant
      au moins 4 caractères 8 bits && MISSING_MID.'
  sa_rules:
  - DOS_BODY_HIGH_NO_MID
  title: Corps avec caractères 8 bits et aucun Message-ID
  why: Le message n'a pas de Message-ID et son texte contient des caractères accentués. Pour un message
    en français envoyé par un script sans Message-ID, cela coûte près de 4 points.
  fix:
  - 'Ajoutez un Message-ID (voir MISSING_MID) : cela suffit à supprimer cette règle.'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/dos/70_other.cf
- id: sa.cte_8bit_mismatch
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(CTE_8BIT_MISMATCH)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : Content-Type text/plain,
      Content-Transfer-Encoding absent ou 7bit, et corps avec octets 8 bits.'
  sa_rules:
  - CTE_8BIT_MISMATCH
  title: Texte déclaré 7 bits mais contenant des accents
  why: La partie texte se déclare en 7 bits (ASCII pur) alors qu'elle contient des caractères accentués.
    Le texte peut s'afficher corrompu chez le destinataire.
  fix:
  - 'Déclarez Content-Transfer-Encoding: quoted-printable (ou 8bit) et charset=UTF-8 pour la partie texte.'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/davej/20_non_ascii.cf
  - https://www.rfc-editor.org/rfc/rfc2045#section-6
- id: sa.has_x_outgoing_spam_stat
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(HAS_X_OUTGOING_SPAM_STAT)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta exists:X-OutGoing-Spam-Status,
      hors listes de diffusion, réponses automatiques, PDF et documents joints.'
  sa_rules:
  - HAS_X_OUTGOING_SPAM_STAT
  title: En-tête X-OutGoing-Spam-Status présent
  why: Le serveur d'envoi a ajouté l'en-tête X-OutGoing-Spam-Status (cPanel le fait avec son filtre sortant).
    SpamAssassin juge qu'on ne peut pas se fier à un tel en-tête et ajoute un point.
  fix:
  - Si vous gérez le serveur cPanel, désactivez l'ajout de cet en-tête sur les messages sortants, ou envoyez
    par un relais qui ne l'ajoute pas.
  fix_by_provider:
    cpanel: L'en-tête vient du filtrage sortant d'Exim sous cPanel ; seul l'administrateur du serveur
      (WHM) peut le désactiver.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.rand_mktg_header
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(RAND_MKTG_HEADER)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : en-tête X-ab-EBS,
      X-ab-Tracking-Id, X-ab-Campaign-Id... (préfixe de 2 ou 4 lettres), hors bounces, Thread-Index, X-Mailing-List.'
  sa_rules:
  - RAND_MKTG_HEADER
  title: En-tête de suivi marketing au nom partiellement aléatoire
  why: Le message contient un en-tête de suivi de campagne dont le nom change d'un envoi à l'autre, motif
    repéré dans des logiciels de spam.
  fix:
  - Utilisez des noms d'en-têtes de suivi fixes, ou supprimez-les.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.jh_spammy_headers
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(JH_SPAMMY_HEADERS)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : exists Complaint-To,
      Tracking-Code, logid, X-Letter, X-EBSERVER ou List-Open.'
  sa_rules:
  - JH_SPAMMY_HEADERS
  title: En-tête rare vu surtout dans le spam
  why: Le message contient un en-tête comme Complaint-To, Tracking-Code ou List-Open, que l'on rencontre
    presque uniquement dans du spam.
  fix:
  - Retirez cet en-tête de votre logiciel d'envoi.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.no_dns_for_from
  family: spamassassin
  severity: high
  penalty: 0.0
  detect:
    signal: spamassassin.hit(NO_DNS_FOR_FROM)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : check_dns_sender()
      : le domaine du MAIL FROM n''a ni enregistrement MX ni A. Gravité fixée à la main, indépendamment
      du score SA, qui sous-estime ici l''effet réel de ce défaut chez les destinataires.'
  sa_rules:
  - NO_DNS_FOR_FROM
  title: Le domaine d'enveloppe n'a ni MX ni adresse IP
  why: '{envelope_domain}, le domaine qui reçoit les retours, n''existe pas en DNS ou n''a ni MX ni A.
    Les retours d''erreur sont perdus et beaucoup de serveurs refusent un expéditeur injoignable.'
  fix:
  - Utilisez un Return-Path sous un domaine qui reçoit du courrier (enregistrement MX).
  - Si {envelope_domain} est un sous-domaine technique de l'outil d'envoi, publiez le MX ou l'enregistrement
    demandé par l'outil.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_net_tests.cf
