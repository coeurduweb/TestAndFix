# Famille spamassassin, groupe headers-structure. Généré par research/scripts/sa_build.py
# depuis research/work/sa/src/headers-structure.yaml et les règles sa-update r1939780 (SpamAssassin 4.0.x).
# Ne pas éditer à la main : modifier la source puis régénérer.
- id: sa.missing_date
  family: spamassassin
  severity: medium
  penalty: 0.7
  detect:
    signal: spamassassin.hit(MISSING_DATE)
    notes: 'score SA 4.0.x : 1.36 (sa-update r1939780, jeu réseau + Bayes). Teste : meta !exists:Date.'
  sa_rules:
  - MISSING_DATE
  title: En-tête Date absent
  why: Le message n'a pas d'en-tête Date, pourtant obligatoire. Les scripts qui construisent les en-têtes
    à la main l'oublient souvent, et plusieurs fournisseurs refusent les messages qui ne respectent pas
    la RFC 5322.
  fix:
  - Ajoutez un en-tête Date au format RFC 5322, ou laissez la bibliothèque d'envoi le générer (PHPMailer,
    Symfony Mailer et Nodemailer le font).
  example_good: 'Date: Tue, 10 Nov 2026 14:05:00 +0100'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_head_tests.cf
  - https://www.rfc-editor.org/rfc/rfc5322#section-3.6.1
- id: sa.missing_from
  family: spamassassin
  severity: high
  penalty: 0.5
  detect:
    signal: spamassassin.hit(MISSING_FROM)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta !exists:From. Gravité
      fixée à la main, indépendamment du score SA, qui sous-estime ici l''effet réel de ce défaut chez
      les destinataires. Pas de ligne score : valeur par défaut de SpamAssassin.'
  sa_rules:
  - MISSING_FROM
  title: En-tête From absent
  why: Le message n'indique aucun expéditeur. L'en-tête From est obligatoire selon la RFC 5322, que Gmail
    demande de respecter, et DMARC repose entièrement sur lui.
  fix:
  - Ajoutez un en-tête From avec une adresse de votre domaine.
  example_good: 'From: "Atelier Martin" <contact@exemple.fr>'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_head_tests.cf
  - https://www.rfc-editor.org/rfc/rfc5322#section-3.6.2
  - https://support.google.com/a/answer/81126
- id: sa.missing_headers
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(MISSING_HEADERS)
    notes: 'score SA 4.0.x : 1.021 (sa-update r1939780, jeu réseau + Bayes). Teste : check_for_missing_to_header()
      : ni To ni Apparently-To.'
  sa_rules:
  - MISSING_HEADERS
  title: En-tête To absent
  why: Le message n'a pas d'en-tête To. C'est le cas quand tous les destinataires sont en copie cachée,
    pratique associée aux envois en nombre non sollicités.
  fix:
  - Ajoutez un en-tête To avec l'adresse du destinataire, ou votre propre adresse si vous envoyez en Cci.
  - Pour un envoi en nombre, utilisez un outil qui envoie un message par destinataire.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_head_tests.cf
- id: sa.missing_mid
  family: spamassassin
  severity: low
  penalty: 0.2
  detect:
    signal: spamassassin.hit(MISSING_MID)
    notes: 'score SA 4.0.x : 0.497 (sa-update r1939780, jeu réseau + Bayes). Teste : meta !exists:Message-Id.'
  sa_rules:
  - MISSING_MID
  title: En-tête Message-ID absent
  why: Le message n'a pas d'identifiant unique. La plupart des serveurs en ajoutent un à l'envoi ; son
    absence indique un script qui remet le message directement. Gmail peut refuser un message sans Message-ID
    valide.
  fix:
  - Générez un Message-ID unique de la forme <identifiant@{domain}>, ou laissez la bibliothèque d'envoi
    le faire.
  - Vérifiez que votre serveur SMTP sortant ajoute un Message-ID quand il manque.
  fix_by_provider:
    postfix: Réglez always_add_missing_headers = yes dans main.cf pour que Postfix complète Date, Message-ID
      et From manquants.
  example_good: 'Message-ID: <20261110140500.5f3a9c@exemple.fr>'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_head_tests.cf
  - https://www.rfc-editor.org/rfc/rfc5322#section-3.6.4
- id: sa.missing_subject
  family: spamassassin
  severity: medium
  penalty: 0.9
  detect:
    signal: spamassassin.hit(MISSING_SUBJECT)
    notes: 'score SA 4.0.x : 1.799 (sa-update r1939780, jeu réseau + Bayes). Teste : meta !exists:Subject.'
  sa_rules:
  - MISSING_SUBJECT
  title: En-tête Subject absent
  why: 'Le message n''a pas d''objet du tout (l''en-tête est absent, pas seulement vide). Près de 2 points
    : c''est un défaut fréquent des scripts d''envoi.'
  fix:
  - Ajoutez un objet clair et descriptif.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_head_tests.cf
- id: sa.missing_mimeole
  family: spamassassin
  severity: medium
  penalty: 0.9
  detect:
    signal: spamassassin.hit(MISSING_MIMEOLE)
    notes: 'score SA 4.0.x : 1.899 (sa-update r1939780, jeu réseau + Bayes). Teste : meta exists:X-MSMail-Priority
      && !exists:X-MimeOLE, hors SquirrelMail, Outlook 12 à 16, CommuniGate, T-Online, corps base64 et
      DKIM.'
  sa_rules:
  - MISSING_MIMEOLE
  title: En-tête X-MSMail-Priority sans X-MimeOLE
  why: Le message porte un en-tête de priorité propre à Outlook Express sans l'en-tête qui l'accompagne
    toujours. Des bibliothèques PHP ajoutent X-MSMail-Priority par imitation, ce que SpamAssassin repère.
  fix:
  - 'Supprimez les en-têtes X-MSMail-Priority et X-Priority ajoutés par le script : ils n''apportent rien.'
  - 'Si vous les gardez, signez le message en DKIM : la règle ne s''applique plus.'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_head_tests.cf
- id: sa.missing_mime_hb_sep
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(MISSING_MIME_HB_SEP)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : check_msg_parse_flags(''missing_mime_head_body_separator'').'
  sa_rules:
  - MISSING_MIME_HB_SEP
  title: Ligne vide manquante entre en-têtes MIME et contenu
  why: Une partie MIME n'a pas de ligne vide entre ses en-têtes et son contenu. Le message est mal formé
    et peut s'afficher mal. Score symbolique.
  fix:
  - Utilisez une bibliothèque d'envoi pour construire le MIME plutôt que de le concaténer à la main.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_body_tests.cf
  - https://www.rfc-editor.org/rfc/rfc2045
- id: sa.no_headers_message
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(NO_HEADERS_MESSAGE)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : meta MISSING_DATE
      && MISSING_HEADERS && NO_RECEIVED && NO_RELAYS && MISSING_MID.'
  sa_rules:
  - NO_HEADERS_MESSAGE
  title: Message presque sans en-têtes
  why: 'Date, To, Message-ID et Received manquent tous : le message a été injecté sans passer par un circuit
    d''envoi normal.'
  fix:
  - Envoyez le test par votre vrai serveur d'envoi, avec une bibliothèque qui génère les en-têtes obligatoires.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_meta_tests.cf
- id: sa.date_in_future_03_06
  family: spamassassin
  severity: high
  penalty: 1.5
  detect:
    signal: spamassassin.hit(DATE_IN_FUTURE_03_06)
    notes: 'score SA 4.0.x : 3.027 (sa-update r1939780, jeu réseau + Bayes). Teste : check_for_shifted_date(''3'',
      ''6'') : la Date du message est postérieure à la date du premier Received fiable, dans l''intervalle
      en heures indiqué.'
  sa_rules:
  - DATE_IN_FUTURE_03_06
  title: La date du message est 3 à 6 heures dans le futur
  why: 'L''en-tête Date indique une heure postérieure de 3 à 6 heures à l''arrivée sur le serveur. Cause
    habituelle : fuseau horaire déclaré faux (heure de Paris écrite avec +0000 ou l''inverse). Plus de
    3 points.'
  fix:
  - Vérifiez l'heure et le fuseau du serveur ou du poste qui génère le message (NTP activé, fuseau Europe/Paris).
  - Dans un script, générez la Date au moment de l'envoi avec le décalage horaire, pas une heure locale
    suivie de +0000.
  - Pour un envoi programmé, la Date doit être celle de l'envoi réel, pas celle de création de la campagne.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_head_tests.cf
  - https://www.rfc-editor.org/rfc/rfc5322#section-3.3
