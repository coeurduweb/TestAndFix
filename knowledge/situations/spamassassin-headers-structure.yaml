  - https://github.com/apache/spamassassin/blob/trunk/rules/20_head_tests.cf
- id: sa.subject_needs_encoding
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(SUBJECT_NEEDS_ENCODING)
