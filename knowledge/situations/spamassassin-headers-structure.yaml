  why: L'objet contient plusieurs caractères 8 bits non encodés. Un objet en français avec des accents
    envoyé par un script sans encodage déclenche cette règle à 1,5 point.
  fix:
  - Encodez l'objet en RFC 2047 (UTF-8, quoted-printable ou base64).
  fix_by_provider:
    wordpress: 'Utilisez wp_mail() plutôt que mail() : WordPress encode l''objet correctement.'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_head_tests.cf
  - https://www.rfc-editor.org/rfc/rfc2047
