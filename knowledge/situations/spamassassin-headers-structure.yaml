  why: Le message est daté de plus de quatre jours avant son arrivée. Les spams réexpédiés ou les vieux
    modèles réutilisés tels quels ont ce profil. Près de 3,5 points.
  fix:
  - Générez l'en-tête Date au moment de l'envoi réel, surtout pour les envois différés, mis en file d'attente
    ou renvoyés.
  - Vérifiez l'horloge et le fuseau du serveur qui crée le message.
  - Si le message a séjourné dans une file d'attente, cherchez pourquoi il n'est pas parti tout de suite
    (serveur relais saturé, cron WordPress en retard).
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_head_tests.cf
  - https://www.rfc-editor.org/rfc/rfc5322#section-3.3
- id: sa.invalid_date
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
