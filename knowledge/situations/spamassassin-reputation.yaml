  fix:
  - Analysez les machines et serveurs qui sortent par {ip} (antivirus, mises à jour, mots de passe).
  - Après nettoyage, demandez le retrait sur {delist_url}.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_dnsbl_tests.cf
  - https://www.spamhaus.org/xbl/
