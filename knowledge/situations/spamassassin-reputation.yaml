# Famille spamassassin, groupe reputation. Généré par research/scripts/sa_build.py
# depuis research/work/sa/src/reputation.yaml et les règles sa-update r1939780 (SpamAssassin 4.0.x).
# Ne pas éditer à la main : modifier la source puis régénérer.
- id: sa.rcvd_in_dnswl_hi
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(RCVD_IN_DNSWL_HI)
    notes: 'score SA 4.0.x : -5 (sa-update r1939780, jeu réseau + Bayes). Teste : check_rbl_sub(''dnswl-firsttrusted'',
      ''^127\.0\.\d+\.3$'') : premier relais de confiance listé sur list.dnswl.org avec le niveau hi.'
  sa_rules:
  - RCVD_IN_DNSWL_HI
  title: IP d'envoi en liste blanche DNSWL, confiance haute
  why: L'IP {ip} est inscrite chez DNSWL au niveau de confiance le plus élevé. C'est l'un des plus gros
    bonus de SpamAssassin, réservé aux serveurs qui n'émettent quasiment jamais de spam.
  fix:
  - Rien à corriger. Gardez cette IP pour vos envois les plus importants.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/25_dnswl.cf
  - https://www.dnswl.org/
