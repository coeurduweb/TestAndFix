    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : meta check_relays_unparseable()
      >= 1 : au moins une ligne Received que SpamAssassin ne sait pas analyser.'
  sa_rules:
  - UNPARSEABLE_RELAY
  title: En-tête Received illisible
  why: Une ligne Received a un format que SpamAssassin ne comprend pas. Il peut alors se tromper sur l'IP
    d'origine et mal appliquer les listes noires.
