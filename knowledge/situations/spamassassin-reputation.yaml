    newsletter, cela arrive quand des abonnés la déclarent comme spam au lieu de se désinscrire.
  fix:
  - Rendez le lien de désinscription visible en haut ou en bas du message, et ajoutez l'en-tête List-Unsubscribe.
  - N'envoyez qu'aux personnes inscrites récemment ou actives, et rappelez pourquoi elles reçoivent le
    message.
