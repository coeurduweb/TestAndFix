  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(RCVD_IN_DNSWL_BLOCKED)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : check_rbl_sub(''dnswl-firsttrusted'',
      ''^127\.0\.\d+\.255$'') : DNSWL signale un usage bloqué.'
  sa_rules:
  - RCVD_IN_DNSWL_BLOCKED
  title: Requête DNSWL refusée au serveur de test
  why: 'Avis d''administration : DNSWL a refusé la requête du serveur qui analyse le message (trop de
    requêtes ou résolveur public). Votre envoi n''est pas en cause.'
  fix:
  - Aucune action de votre part. Le bonus DNSWL éventuel n'a simplement pas pu être calculé.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/25_dnswl.cf
  - https://www.dnswl.org/
