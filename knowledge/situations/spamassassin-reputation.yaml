- id: sa.awl
  family: spamassassin
  severity: low
  penalty: 0.5
  detect:
    signal: spamassassin.hit(AWL)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : check_from_in_auto_welcomelist()
      : ajustement calculé à partir de la moyenne des scores passés de ce couple adresse + réseau. Le
      score affiché (1) est nominal, le score réel est variable et peut être négatif. Dépend du plugin
      AWL, non chargé par défaut dans SpamAssassin 4.0 : la règle n''apparaît que si le serveur de test
      l''active. Gravité abaissée à la main : le score SA affiché est nominal, la valeur réelle est recalculée
      à chaque message. Pas de ligne score : valeur par défaut de SpamAssassin.'
  sa_rules:
  - AWL
  title: Score ajusté par l'historique de l'expéditeur (AWL)
  why: Le serveur de test se souvient des scores de vos messages précédents et rapproche celui-ci de la
    moyenne. Plusieurs tests ratés d'affilée remontent donc le score du suivant.
  fix:
  - 'Corrigez les autres règles : l''ajustement suit la tendance de vos envois.'
  - Pour une mesure propre, comparez des tests faits depuis une adresse neuve.
  references:
