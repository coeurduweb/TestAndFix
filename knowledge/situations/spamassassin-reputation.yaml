  fix:
  - 'Cherchez la cause : compte ou formulaire piraté qui envoie du spam, liste achetée, campagne vers
    des adresses invalides.'
  - Corrigez la cause avant de reprendre les envois, puis laissez la réputation remonter.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_mailspike.cf
  - https://mailspike.org/
