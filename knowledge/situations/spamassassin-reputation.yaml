    notes: 'score SA 4.0.x : 3.335 (sa-update r1939780, jeu réseau + Bayes). Teste : check_rbl_sub(''zen'',
      ''127.0.0.3'') : relais listé dans la Spamhaus CSS, la partie automatique de la SBL.'
  sa_rules:
  - RCVD_IN_SBL_CSS
  title: IP d'envoi dans la Spamhaus CSS (envoi de spam détecté)
  why: La CSS liste automatiquement des IP qui ont envoyé du spam récemment, souvent un site ou une boîte
    compromise, ou un serveur mal configuré (HELO incorrect, absence de reverse DNS).
  fix:
  - 'Cherchez sur le serveur {ip} ce qui envoie : formulaire sans protection, script PHP malveillant,
    compte de messagerie piraté.'
  - Vérifiez que le nom HELO et le reverse DNS ({ptr}) sont cohérents.
  - Une fois la cause supprimée, demandez le retrait sur {delist_url}.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_dnsbl_tests.cf
  - https://www.spamhaus.org/css/
