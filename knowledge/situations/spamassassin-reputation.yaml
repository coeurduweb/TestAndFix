  sa_rules:
  - RCVD_IN_DNSWL_NONE
  title: IP d'envoi connue de DNSWL, sans niveau de confiance
  why: DNSWL connaît l'IP {ip} et son propriétaire, mais ne lui accorde aucune confiance particulière,
    souvent parce qu'elle est partagée par de nombreux clients. Effet nul sur le score.
  fix:
  - Rien à corriger.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/25_dnswl.cf
  - https://www.dnswl.org/
- id: sa.rcvd_in_dnswl_blocked
