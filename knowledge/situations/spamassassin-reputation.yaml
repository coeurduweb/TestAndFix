      ''^127\.0\.\d+\.2$'') : niveau med sur list.dnswl.org.'
  sa_rules:
  - RCVD_IN_DNSWL_MED
  title: IP d'envoi en liste blanche DNSWL, confiance moyenne
  why: L'IP {ip} est connue de DNSWL comme serveur légitime qui laisse passer du spam rarement. Bonus
