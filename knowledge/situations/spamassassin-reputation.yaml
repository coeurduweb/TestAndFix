- id: sa.rcvd_in_pbl
  family: spamassassin
  severity: high
  penalty: 1.7
  detect:
    signal: spamassassin.hit(RCVD_IN_PBL)
    notes: 'score SA 4.0.x : 3.335 (sa-update r1939780, jeu réseau + Bayes). Teste : check_rbl(''zen-lastexternal'',
      ''zen.spamhaus.org.'', ''^127\.0\.0\.1[01]$'') : dernier relais externe dans la Policy Block List.'
  sa_rules:
  - RCVD_IN_PBL
  title: IP d'envoi dans la Spamhaus PBL (plage non destinée à l'envoi direct)
  why: 'L''IP {ip} appartient à une plage que son fournisseur déclare non prévue pour envoyer des e-mails
    directement : connexion fibre ou ADSL, IP dynamique. La PBL n''est pas une sanction, mais un serveur
    qui envoie depuis ces IP est traité comme un ordinateur infecté.'
  fix:
  - 'Ne livrez pas directement depuis cette IP : passez par le serveur SMTP de votre messagerie ou d''un
    service d''envoi, avec authentification.'
  - Si {ip} est une IP fixe de serveur que vous contrôlez, demandez le retrait sur {delist_url} après
    avoir configuré son reverse DNS.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_dnsbl_tests.cf
  - https://www.spamhaus.org/pbl/
- id: sa.rcvd_in_sbl
  family: spamassassin
  severity: high
  penalty: 0.1
  detect:
    signal: spamassassin.hit(RCVD_IN_SBL)
    notes: 'score SA 4.0.x : 0.141 (sa-update r1939780, jeu réseau + Bayes). Teste : check_rbl_sub(''zen'',
      ''127.0.0.2'') : un relais du message est dans la Spamhaus Block List. Gravité fixée à la main,
      indépendamment du score SA, qui sous-estime ici l''effet réel de ce défaut chez les destinataires.'
  sa_rules:
  - RCVD_IN_SBL
  title: IP d'envoi dans la Spamhaus SBL
  why: L'IP {ip} est inscrite dans la SBL, la liste des sources de spam vérifiées par Spamhaus. Le score
    SpamAssassin est modeste, mais de nombreux serveurs refusent ces messages dès la connexion.
  fix:
  - 'Consultez la fiche SBL depuis {delist_url} : elle indique la raison et qui peut demander le retrait.'
  - 'Si l''IP est chez un hébergeur, ouvrez un ticket chez lui : c''est souvent lui seul qui peut agir.'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_dnsbl_tests.cf
  - https://www.spamhaus.org/sbl/
- id: sa.rcvd_in_sbl_css
