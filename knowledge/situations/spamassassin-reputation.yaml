  title: IP d'envoi en liste blanche DNSWL, confiance basse
  why: L'IP {ip} est identifiée par DNSWL comme un serveur légitime, mais partagé ou ayant déjà émis du
    spam (gros hébergeurs, routeurs partagés). Petit bonus.
  fix:
  - Rien à corriger. Pour un meilleur niveau, il faut une IP dédiée à vos seuls envois.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/25_dnswl.cf
  - https://www.dnswl.org/
