  severity: low
  penalty: 0.0
  detect:
    signal: spamassassin.hit(RCVD_IN_MSPIKE_L3)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : check_rbl_sub(''mspikeb-lastexternal'',
      ''127.0.0.12'') : réputation négative Mailspike du dernier relais externe. Gravité fixée à la main,
      indépendamment du score SA, qui sous-estime ici l''effet réel de ce défaut chez les destinataires.'
  sa_rules:
  - RCVD_IN_MSPIKE_L3
  title: Mauvaise réputation Mailspike (-3) pour l'IP d'envoi
  why: 'Mailspike attribue une réputation faible à l''IP {ip} : elle a été vue dans du spam ou dans des
    pièges à spam. Les filtres qui suivent cette liste vont vous pénaliser.'
  fix:
  - Arrêtez les envois vers des adresses non sollicitées ou anciennes et nettoyez la liste.
  - Si l'IP est celle d'un prestataire partagé, demandez-lui une autre IP ou un pool mieux tenu.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_mailspike.cf
  - https://mailspike.org/
