    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : check_rbl_sub(''mspikeb-lastexternal'',
      ''127.0.0.13'') : réputation négative Mailspike du dernier relais externe.'
  sa_rules:
  - RCVD_IN_MSPIKE_L2
  title: Réputation Mailspike suspecte (-2) pour l'IP d'envoi
  why: 'Mailspike juge l''IP {ip} suspecte. SpamAssassin ne la pénalise presque pas, mais d''autres filtres
    utilisent cette liste. Cause habituelle : envoi soudain en volume depuis une IP sans historique.'
  fix:
  - Montez les volumes progressivement sur une IP neuve plutôt que d'envoyer toute la base d'un coup.
  - Retirez de vos listes les adresses qui rebondissent ou n'ouvrent plus depuis longtemps.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_mailspike.cf
  - https://mailspike.org/
- id: sa.rcvd_in_mspike_l3
