# Famille spamassassin, groupe uri. Généré par research/scripts/sa_build.py
# depuis research/work/sa/src/uri.yaml et les règles sa-update r1939780 (SpamAssassin 4.0.x).
# Ne pas éditer à la main : modifier la source puis régénérer.
- id: sa.uri_try_3ld
  family: spamassassin
  severity: medium
  penalty: 0.4
  detect:
    signal: spamassassin.hit(URI_TRY_3LD)
    notes: 'score SA 4.0.x : 0.742 (sa-update r1939780, jeu réseau + Bayes). Teste : meta uri : hôte commençant
      par try, start, get, save, check, act, compare, join, learn, request, visit ou my suivi d''un sous-domaine
      en .com ou .net (avec exceptions : list-manage, adobe, slack...), hors Errors-To, Alibaba, Apple,
      .edu, References.'
  sa_rules:
  - URI_TRY_3LD
  title: Lien vers un sous-domaine d'appel à l'action (try., get., check., join., my.…)
  why: Un lien pointe vers un hôte en .com ou .net dont le nom commence par try, start, get, save, check,
    act, compare, join, learn, request, visit ou my (get.offre-exemple.com, check.monservice.com). Les
    spammeurs créent ces sous-domaines d'appel à l'action ; un service légitime qui en utilise un est
    pénalisé aussi.
  fix:
  - Faites pointer les liens vers votre domaine principal (www.{domain}) ou un chemin (/essai) plutôt
    que vers un sous-domaine qui commence par l'un de ces mots.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.uri_try_usme
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(URI_TRY_USME)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta uri : hôte try/start/get/save/check/act/compare/join/learn/request/visit/my...
      en .us, .me, .mobi ou .club, sans DKIM.'
  sa_rules:
  - URI_TRY_USME
  title: Lien « try » ou « get » vers une extension .us, .me, .mobi ou .club
  why: Un lien d'appel à l'action pointe vers un domaine en .us, .me, .mobi ou .club, extensions souvent
    utilisées par les spammeurs.
  fix:
  - Utilisez des liens vers votre domaine principal et signez le message en DKIM (la règle ne s'applique
    pas aux messages signés).
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.uri_optout_3ld
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(URI_OPTOUT_3LD)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : uri m,^https?://(?:quit|bye|remove|exit|leave|disallow|halt|stop|end|herego|out|discontinue)\d*\.[^/]+\.(?:com|net)\b,i.'
  sa_rules:
  - URI_OPTOUT_3LD
  title: Lien de désinscription sur un sous-domaine du type « remove » ou « stop »
  why: Le lien de désinscription pointe vers un hôte du type remove.exemple.com ou stop.exemple.net. Motif
    repéré chez les spammeurs qui changent de domaine à chaque campagne.
  fix:
  - Hébergez la page de désinscription sur votre domaine ou celui de votre outil d'envoi, avec un chemin
    (/desinscription).
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.uri_optout_usme
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(URI_OPTOUT_USME)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : uri m,^https?://(?:quit|bye|remove|exit|leave|...)\d*\.[^/]+\.(?:us|me|mobi|club)\b,i.
      Pas de ligne score : valeur par défaut de SpamAssassin.'
  sa_rules:
  - URI_OPTOUT_USME
  title: Lien de désinscription « remove » ou « stop » en .us, .me, .mobi ou .club
  why: Le lien de désinscription pointe vers un sous-domaine d'arrêt dans une extension souvent abusée.
  fix:
  - Utilisez le lien de désinscription natif de votre outil d'envoi.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.uri_novowel
  family: spamassassin
  severity: low
  penalty: 0.3
  detect:
    signal: spamassassin.hit(URI_NOVOWEL)
    notes: 'score SA 4.0.x : 0.5 (sa-update r1939780, jeu réseau + Bayes). Teste : uri m%^https?://[^/?&#]*[bcdfgjklmnpqrstvwxz]{7}(?!.{8,32}awstrack\.me).{8,32}%i
      : 7 consonnes consécutives dans le nom d''hôte.'
  sa_rules:
  - URI_NOVOWEL
  title: Lien vers un nom d'hôte avec une longue suite de consonnes
  why: Un lien pointe vers un hôte qui contient sept consonnes d'affilée, comme les domaines générés au
    hasard. Les domaines de suivi des outils d'envoi (identifiants codés) le déclenchent parfois.
  fix:
  - Configurez un domaine de suivi personnalisé lisible (clic.{domain}) dans votre outil d'envoi.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_uri_tests.cf
- id: sa.uri_hex
  family: spamassassin
  severity: low
  penalty: 0.1
  detect:
    signal: spamassassin.hit(URI_HEX)
    notes: 'score SA 4.0.x : 0.1 (sa-update r1939780, jeu réseau + Bayes). Teste : uri m%^https?://[^/?&#]*\b(?![0-9a-f]{0,12}[a-f]{3})[0-9a-f]{6,}\b%i.'
  sa_rules:
  - URI_HEX
  title: Lien vers un nom d'hôte avec une longue suite hexadécimale
  why: Le nom d'hôte d'un lien contient au moins six caractères hexadécimaux (a1b2c3), typique des sous-domaines
    générés. Pénalité faible.
  fix:
  - Utilisez des noms d'hôte lisibles dans les liens, notamment pour le suivi des clics.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_uri_tests.cf
- id: sa.numeric_http_addr
  family: spamassassin
  severity: medium
  penalty: 0.6
  detect:
    signal: spamassassin.hit(NUMERIC_HTTP_ADDR)
    notes: 'score SA 4.0.x : 1.242 (sa-update r1939780, jeu réseau + Bayes). Teste : uri m{^https?://[\d.]+(?:[:/?#]|$)}i.'
  sa_rules:
  - NUMERIC_HTTP_ADDR
  title: Lien vers une adresse IP au lieu d'un nom de domaine
  why: Un lien pointe vers une adresse IP (http://203.0.113.10/...). Aucun site sérieux ne fait cela dans
    un e-mail, et les filtres de liens ne peuvent rien vérifier. Plus d'un point.
  fix:
  - Remplacez l'IP par le nom de domaine du site.
  - Pour un lien de test ou de recette laissé dans un modèle, remplacez-le par l'adresse de production.
  example_bad: http://203.0.113.10/promo
  example_good: https://www.exemple.fr/promo
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_uri_tests.cf
- id: sa.normal_http_to_ip
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(NORMAL_HTTP_TO_IP)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : uri m{^https?://(?!10\.|127\.|169\.254\.|172\.(?:1[6-9]|2\d|3[01])\.|192\.168\.)\d+\.\d+\.\d+\.\d+\b}i.'
  sa_rules:
  - NORMAL_HTTP_TO_IP
  title: Lien vers une adresse IPv4 publique
  why: Un lien pointe vers une adresse IP publique. Score symbolique, mais NUMERIC_HTTP_ADDR se déclenche
    en général en même temps.
  fix:
  - Utilisez un nom de domaine dans les liens.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_uri_tests.cf
- id: sa.https_http_mismatch
  family: spamassassin
  severity: low
  penalty: 0.1
  detect:
    signal: spamassassin.hit(HTTPS_HTTP_MISMATCH)
    notes: 'score SA 4.0.x : 0.1 (sa-update r1939780, jeu réseau + Bayes). Teste : check_https_http_mismatch(''1'',
      ''10'') : de 1 à 9 liens, dont au moins un a un texte visible https://domaineA alors que href pointe
      vers un domaine B différent.'
  sa_rules:
  - HTTPS_HTTP_MISMATCH
  title: Le texte d'un lien affiche un autre domaine que sa destination
  why: Un lien affiche https://www.exemple.fr mais mène en réalité vers un autre domaine. C'est la technique
    de base de l'hameçonnage ; une newsletter dont les liens passent par un domaine de suivi tout en affichant
    l'adresse finale en clair la déclenche aussi.
  fix:
  - 'N''écrivez pas une adresse https:// comme texte de lien : mettez un libellé (« Voir la boutique »).'
  - Ou configurez le suivi des clics sur un sous-domaine de {domain} pour que le domaine affiché et le
    domaine réel concordent.
  example_bad: <a href="https://trk.outil-envoi.com/c/123">https://www.exemple.fr</a>
  example_good: <a href="https://trk.outil-envoi.com/c/123">Voir la boutique</a>
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/felicity/70_phishing.cf
- id: sa.http_escaped_host
  family: spamassassin
  severity: low
  penalty: 0.1
  detect:
    signal: spamassassin.hit(HTTP_ESCAPED_HOST)
    notes: 'score SA 4.0.x : 0.1 (sa-update r1939780, jeu réseau + Bayes). Teste : uri /^https?:\/\/[^\/\s\?\&\#\'']*%[0-9a-fA-F][0-9a-fA-F]/
      hors %20 et %3C/%3E suivis d''une URL.'
  sa_rules:
  - HTTP_ESCAPED_HOST
  title: Nom d'hôte d'un lien encodé en %
  why: Le nom d'hôte d'un lien contient des caractères encodés (%2E au lieu d'un point), procédé pour
    masquer la vraie destination. Pénalité faible.
  fix:
  - Écrivez le nom d'hôte en clair ; seuls les paramètres après ? peuvent être encodés.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_uri_tests.cf
- id: sa.http_excessive_escapes
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(HTTP_EXCESSIVE_ESCAPES)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : uri /^https?:\/\/\S*%(?:3\d|[46][1-9a-f]|[57][\da])/i
      : lettres ou chiffres encodés en %.'
  sa_rules:
  - HTTP_EXCESSIVE_ESCAPES
  title: Lien avec des encodages % inutiles
  why: Un lien encode des lettres ou des chiffres ordinaires (%61 pour a). Score symbolique.
  fix:
  - N'encodez dans les liens que les caractères qui l'exigent (espaces, accents, &).
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_uri_tests.cf
- id: sa.weird_port
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(WEIRD_PORT)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : uri m{https?://[^/?\s]+?:\d+(?<!:80)(?<!:443)(?<!:8080)(?:/|\s|$)}
      : port autre que 80, 443 ou 8080.'
  sa_rules:
  - WEIRD_PORT
  title: Lien avec un port inhabituel
  why: Un lien précise un port réseau inhabituel (https://exemple.fr:8443/). Souvent un lien de préproduction
    ou d'administration oublié. Score symbolique.
  fix:
  - Utilisez l'adresse publique du site sans numéro de port.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_uri_tests.cf
- id: sa.uri_truncated
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(URI_TRUNCATED)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : check_uri_truncated()
      : une URL dépasse 8 192 caractères, ou le nombre d''URL dépasse les limites d''analyse.'
  sa_rules:
  - URI_TRUNCATED
  title: Un lien a été tronqué pendant l'analyse
  why: 'Un lien dépasse 8 192 caractères ou le message contient trop de liens : SpamAssassin n''a pas
    tout analysé. Score symbolique, mais un lien de cette taille est anormal.'
  fix:
  - Raccourcissez les liens trop longs (paramètres de suivi en excès) et limitez le nombre de liens.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_body_tests.cf
- id: sa.uri_data
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(URI_DATA)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta uri /^data:(?!image\/)[a-z]/i,
      hors réseau de confiance, liste, List-Unsubscribe et enveloppe égale au From.'
  sa_rules:
  - URI_DATA
  title: 'Lien en data: (contenu embarqué dans l''adresse)'
  why: 'Un lien utilise le schéma data: pour embarquer un document (souvent du HTML) dans l''adresse elle-même.
    C''est une technique d''hameçonnage pour afficher une fausse page sans serveur.'
  fix:
  - Remplacez ce lien par un lien vers une page hébergée sur votre site.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.uri_wpadmin
  family: spamassassin
  severity: medium
  penalty: 0.7
  detect:
    signal: spamassassin.hit(URI_WPADMIN)
    notes: 'score SA 4.0.x : 1.373 (sa-update r1939780, jeu réseau + Bayes). Teste : meta uri m,/wp-admin/\w+/,i.'
  sa_rules:
  - URI_WPADMIN
  title: Lien vers l'administration d'un WordPress
  why: Un lien pointe dans /wp-admin/ d'un site WordPress. Les hameçonnages hébergent leurs fausses pages
    dans des WordPress piratés ; un lien d'administration dans une newsletter est aussi une erreur.
  fix:
  - Remplacez le lien par l'adresse publique de la page (sans /wp-admin/).
  fix_by_provider:
    wordpress: Copiez le lien depuis le bouton « Voir » de l'article et non depuis l'écran d'édition.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.uri_wp_hacked
  family: spamassassin
  severity: high
  penalty: 1.3
  detect:
    signal: spamassassin.hit(URI_WP_HACKED)
    notes: 'score SA 4.0.x : 2.627 (sa-update r1939780, jeu réseau + Bayes). Teste : meta uri /wp-content/...\.(php|html?)
      ou /wp-includes/...\.(php|html?), hors liste, Errors-To, relais smtp, fil de discussion et message
      authentifié.'
  sa_rules:
  - URI_WP_HACKED
  title: Lien vers un fichier PHP ou HTML dans wp-content ou wp-includes
  why: 'Un lien pointe vers un fichier .php ou .html dans wp-content ou wp-includes. Ces répertoires ne
    contiennent normalement que des images et des scripts internes : c''est le chemin type d''une page
    déposée par un pirate. Plus de 2,5 points.'
  fix:
  - 'Si le lien vous appartient, vérifiez ce fichier : s''il n''a rien à faire là, le site est compromis.'
  - Pour un lien légitime vers un document, utilisez l'adresse de la page publique ou d'un PDF dans uploads.
  - 'Authentifiez le message (SPF ou DKIM) : la règle ne s''applique pas aux messages authentifiés.'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.uri_wp_hacked_2
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(URI_WP_HACKED_2)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : uri __PS_TEST_LOC_WP
      (chemins /wp-content/plugins, /wp-content/themes, /wp-includes et quelques chemins de modules souvent
      piratés), hors URI_WP_HACKED, List-Id, fil de discussion et VERP. Les adresses d''images comptent
      aussi.'
  sa_rules:
  - URI_WP_HACKED_2
  title: Une adresse du message pointe dans wp-content/plugins, wp-content/themes ou wp-includes
  why: 'Une adresse du message, lien ou image, pointe dans un dossier technique de WordPress. Les sites
    piratés y cachent des pages et des fichiers malveillants, d''où la règle. Une image légitime peut
    y mener aussi : logo servi par le thème, image de remplacement d''une extension. L''adresse en cause
    est donnée dans la preuve.'
  fix:
  - Servez les images du message depuis la médiathèque (/wp-content/uploads/), pas depuis le dossier d'un
    thème ou d'une extension.
  - 'Avec WooCommerce, l''image placeholder.webp de l''extension remplace la photo d''un produit qui n''en
    a pas : donnez une image au produit, ou faites le test avec un produit qui en a une.'
  - 'Si l''adresse ne correspond à rien que vous ayez mis en place, vérifiez le site : il peut être compromis.'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.uri_php_redir
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(URI_PHP_REDIR)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta uri m;/redirect\.php\?;i,
      sans Return-Path VERP ni relais mta.'
  sa_rules:
  - URI_PHP_REDIR
  title: Lien qui passe par redirect.php
  why: Un lien passe par un script redirect.php qui renvoie vers une autre adresse. Les redirections ouvertes
    de sites tiers servent à masquer des destinations malveillantes.
  fix:
  - Mettez l'adresse de destination directement dans le lien.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.url_shortener_disabled
  family: spamassassin
  severity: high
  penalty: 1.0
  detect:
    signal: spamassassin.hit(URL_SHORTENER_DISABLED)
    notes: 'score SA 4.0.x : 2 (sa-update r1939780, jeu réseau + Bayes). Teste : uri m,^https://(?:bitly\.com/a/blocked|tinyurl\.com/app/nospam),
      : le lien raccourci, une fois déplié, mène à la page de blocage de Bitly ou TinyURL. Dépend du plugin
      DecodeShortURLs, non chargé par défaut dans SpamAssassin 4.0 : la règle n''apparaît que si le serveur
      de test l''active.'
  sa_rules:
  - URL_SHORTENER_DISABLED
  title: Lien raccourci désactivé pour abus
  why: Un lien raccourci a été suspendu par le service de raccourcissement pour abus. Le lecteur arrivera
    sur une page d'avertissement, et SpamAssassin ajoute 2 points.
  fix:
  - Remplacez le lien raccourci par l'adresse complète de la page.
  - 'N''utilisez pas de raccourcisseur public dans un e-mail : il est partagé avec des spammeurs.'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/25_url_shortener.cf
- id: sa.url_shortener_chained
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(URL_SHORTENER_CHAINED)
    notes: 'score SA 4.0.x : 0.01 (sa-update r1939780, jeu réseau + Bayes). Teste : short_url_chained()
      : un lien raccourci se déplie vers un autre lien raccourci. Dépend du plugin DecodeShortURLs, non
      chargé par défaut dans SpamAssassin 4.0 : la règle n''apparaît que si le serveur de test l''active.'
  sa_rules:
  - URL_SHORTENER_CHAINED
  title: Lien raccourci qui renvoie vers un autre raccourcisseur
  why: Un lien raccourci mène à un autre lien raccourci. L'enchaînement sert à masquer la destination
    finale. Score symbolique, mais les filtres de liens le notent.
  fix:
  - Utilisez l'adresse finale directement, sans raccourcisseur.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/25_url_shortener.cf
- id: sa.t_short_shortner
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(T_SHORT_SHORTNER)
    notes: 'score SA 4.0.x : 0.01 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : corps ou HTML
      de moins de 512 octets && __URL_SHORTENER (plugin DecodeShortURLs ou, à défaut, expression régulière
      sur la même liste : bit.ly, tinyurl.com, t.co, goo.gl, youtu.be, amzn.to, eepurl.com, wp.me, lnkd.in...).
      Règle de test T_. Pas de ligne score : valeur par défaut de SpamAssassin.'
  sa_rules:
  - T_SHORT_SHORTNER
  title: Message court contenant surtout un lien raccourci
  why: Le message tient en quelques mots et un lien raccourci. La liste de SpamAssassin compte aussi youtu.be,
    amzn.to, wp.me ou eepurl.com (Mailchimp). Profil type d'un spam ou d'un message de compte piraté.
    Règle de test sans poids.
  fix:
  - Ajoutez du contexte au message et utilisez l'adresse complète de la page.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/pds/20_urlshort.cf
- id: sa.redir_url_chained
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(REDIR_URL_CHAINED)
    notes: 'score SA 4.0.x : 0.01 (sa-update r1939780, jeu réseau + Bayes). Teste : redir_url_chained()
      (plugin Redirectors) : une URL de redirection mène à un autre redirecteur. Dépend du plugin Redirectors,
      non chargé par défaut dans SpamAssassin 4.0 : la règle n''apparaît que si le serveur de test l''active.'
  sa_rules:
  - REDIR_URL_CHAINED
  title: Lien redirigé vers d'autres redirecteurs
  why: Un lien passe par plusieurs services de redirection successifs. Score symbolique, mais c'est un
    moyen classique de cacher une destination.
  fix:
  - Limitez la chaîne à un seul passage (le suivi de votre outil d'envoi) puis l'adresse finale.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/25_url_redirectors.cf
- id: sa.redir_url_loop
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(REDIR_URL_LOOP)
    notes: 'score SA 4.0.x : 0.01 (sa-update r1939780, jeu réseau + Bayes). Teste : redir_url_loop() (plugin
