  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/25_url_redirectors.cf
- id: sa.gb_google_obfur
  family: spamassassin
  severity: medium
  penalty: 0.4
  detect:
    signal: spamassassin.hit(GB_GOOGLE_OBFUR)
    notes: 'score SA 4.0.x : 0.75 (sa-update r1939780, jeu réseau + Bayes). Teste : uri /^https:\/\/www\.google\.[a-z]{2,3}\/url\?sa=t&rct=j&q=&esrc=s&source=web&cd=...&url=https?:\/\/.../
      : lien copié depuis une page de résultats Google.'
  sa_rules:
  - GB_GOOGLE_OBFUR
  title: Lien masqué derrière une redirection Google
  why: Le lien est une adresse google.com/url?...&url=... copiée depuis une page de résultats Google.
    Elle cache la vraie destination et les spammeurs l'utilisent pour contourner les listes noires.
  fix:
  - Ouvrez le lien, puis copiez l'adresse réelle de la page dans la barre du navigateur.
  example_bad: https://www.google.com/url?sa=t&rct=j&q=&esrc=s&source=web&cd=1&url=https://www.exemple.fr/
  example_good: https://www.exemple.fr/
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/gbechis/20_misc.cf
- id: sa.uri_google_proxy
