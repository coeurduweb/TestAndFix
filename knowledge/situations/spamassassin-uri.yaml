  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(URI_GOOGLE_PROXY)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta uri m;^https?://(?:[^/]+\.)?googleusercontent\.com/proxy/;i,
      hors relais Google, Message-ID hexadécimal et X-Campaignid. Pas de ligne score : valeur par défaut
      de SpamAssassin.'
  sa_rules:
  - URI_GOOGLE_PROXY
  title: Lien qui passe par le proxy d'images de Google
  why: Un lien ou une image passe par googleusercontent.com/proxy/, l'adresse que Gmail donne aux images
    qu'il met en cache. Elle apparaît quand on copie une image depuis un message reçu dans Gmail.
  fix:
  - Réinsérez les images depuis leur fichier d'origine ou leur adresse sur votre site.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
