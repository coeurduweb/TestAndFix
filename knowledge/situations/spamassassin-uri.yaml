  why: Un lien contient un identifiant hexadécimal de 128 caractères. Les liens de suivi personnalisés
    par destinataire en génèrent parfois. 1 point.
  fix:
  - Si c'est le lien de suivi de votre outil, utilisez un identifiant plus court ou un domaine de suivi
    personnalisé.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
