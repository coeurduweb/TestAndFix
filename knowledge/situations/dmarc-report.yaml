# Famille dmarc-report : sources d'envoi lues dans les rapports agrégés DMARC déposés par
# l'utilisateur (RFC 9990). Chaque fiche décrit une source (une IP) classée par l'analyseur :
# envoi légitime non aligné, transfert, usurpation probable. Variables : {domain} (domaine
# des rapports), {ip}, {ptr} (« aucun » quand l'IP n'a pas de nom inverse), {provider} (nom
# lisible du service reconnu, ou « l'outil qui envoie depuis cette adresse »), {value}
# (nombre de messages de la source, ou de sources masquées pour more_sources).
# Procédures des fournisseurs reprises des fiches dkim.missing et alignment.none_aligned,
# relevées sur leur documentation officielle le 2026-11-10.

- id: dmarc-report.forwarding
  family: dmarc-report
  severity: info
  penalty: 0
  detect:
    signal: "report.source(ip).verdict == forwarding"
    notes: "Source reconnue comme un relais de transfert (nom inverse d'un service de redirection ou de liste) : le SPF échoue parce que le relais réexpédie avec sa propre IP, tandis que la signature DKIM d'origine reste valide."
  sa_rules: []
  title: "Transfert probable par {ip} (nom inverse : {ptr})"
  why: >
    {value} message(s) de {domain} arrivent par un serveur qui relaie le courrier (redirection
    d'adresse, liste de diffusion). Le SPF échoue alors par construction : c'est normal, et
    seul le DKIM garde ces messages authentifiés.
  fix:
    - "N'ajoutez pas {ip} à votre SPF : vous autoriseriez un serveur que vous ne maîtrisez pas à envoyer au nom de {domain}."
    - "Vérifiez que tous vos envois sont signés en DKIM avec d={domain} : c'est la seule authentification qui survit au transfert."
    - "Rien d'autre à faire. Avant de passer à p=reject, sachez qu'un message transféré dont la signature DKIM a été cassée en chemin (liste qui modifie le sujet ou le corps) échoue à DMARC et risque d'être refusé."
  references:
    - https://www.rfc-editor.org/rfc/rfc9989#section-7.4
    - https://www.rfc-editor.org/rfc/rfc7960

- id: dmarc-report.more_sources
  family: dmarc-report
  severity: info
  penalty: 0
  detect:
    signal: "sum(max(0, count(verdict) - 10) for verdict in [legit_unaligned, forwarding, spoofing]) > 0"
    notes: "Au-delà de dix sources par catégorie, l'analyseur ne détaille pas les suivantes : {value} est le nombre de sources masquées."
  sa_rules: []
  title: "{value} autre(s) source(s) non alignée(s) ne sont pas détaillées"
  why: >
    Seules les dix sources les plus volumineuses de chaque catégorie ont une fiche. Les
    autres figurent dans le tableau des sources, avec leur volume et leur alignement.
  fix:
    - "Ouvrez le tableau des sources et triez-le par nombre de messages."
    - "Traitez d'abord les sources détaillées ici : corriger un service d'envoi règle souvent plusieurs IP à la fois."
  references:
    - https://www.rfc-editor.org/rfc/rfc9990

- id: dmarc-report.low_volume
  family: dmarc-report
  severity: info
  penalty: 0
  detect:
    signal: "0 < report.messages < 100"
    notes: "Seuil interne de l'outil : en dessous de 100 messages (ou de 7 jours de rapports), la recommandation de politique reste prudente."
  sa_rules: []
  title: "Volume de rapports encore faible ({value} messages)"
  why: >
    Les rapports déposés ne couvrent que {value} message(s) : un envoi mensuel ou un outil
    peu utilisé peut ne pas encore y figurer. Les taux d'alignement ne sont pas encore
    représentatifs.
  fix:
    - "Déposez les rapports des prochaines semaines, de tous les destinataires qui vous en envoient."
    - "Ne durcissez pas votre politique DMARC sur la seule base de ces rapports."
  references:
    - https://www.rfc-editor.org/rfc/rfc9989#section-5.1.5

# Fiches PRÊTES MAIS DÉSACTIVÉES (2026-11-10) : dmarc-report.legit_unaligned et
