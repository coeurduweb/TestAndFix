# tools/dmarc-reports/analyze.ts, et explain() ne sait pas garder ce calcul :
# - legit_unaligned : le code construit une correction propre à chaque source (DKIM ou SPF
#   manquant, include du fournisseur) ; la fiche la remplacerait par un texte générique, et
#   le test dmarc-reports.test.ts (« include:spf.brevo.com » attendu dans fix) échoue ;
# - spoofing : le code choisit la gravité selon la politique (medium 0,5 si p=none, low 0
#   sinon) mais ne la passe qu'au texte de repli ; une fiche imposerait une valeur unique.
# À activer (retirer les dièses) une fois que le code passe severity et penalty hors du
