  fix:
  - 'Réduisez le nombre de blocs masqués : un seul preheader et des variantes mobiles limitées.'
  - Corrigez l'autre défaut qui accompagne la règle (souvent l'absence de reverse DNS).
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.html_nonelement_30_40
