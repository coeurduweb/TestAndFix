# Famille spamassassin, groupe html. Généré par research/scripts/sa_build.py
# depuis research/work/sa/src/html.yaml et les règles sa-update r1939780 (SpamAssassin 4.0.x).
# Ne pas éditer à la main : modifier la source puis régénérer.
- id: sa.html_message
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(HTML_MESSAGE)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : html_test(''html'')
      : une partie HTML a été analysée.'
  sa_rules:
  - HTML_MESSAGE
  title: Le message contient du HTML
  why: 'Information : le message comporte une partie HTML. Score nul, c''est la norme pour une newsletter.'
  fix:
  - Rien à corriger. Joignez toujours une version texte (multipart/alternative) à côté du HTML.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_html_tests.cf
- id: sa.html_mime_no_html_tag
  family: spamassassin
  severity: low
  penalty: 0.2
  detect:
    signal: spamassassin.hit(HTML_MIME_NO_HTML_TAG)
    notes: 'score SA 4.0.x : 0.377 (sa-update r1939780, jeu réseau + Bayes). Teste : meta MIME_HTML_ONLY
      && !html_tag_exists(''html'').'
  sa_rules:
  - HTML_MIME_NO_HTML_TAG
  title: Message HTML sans balise html
  why: Le message ne contient que du HTML et ce HTML n'a même pas de balise <html>. C'est un fragment
    collé tel quel, ce que produisent des scripts et certains éditeurs.
  fix:
  - 'Envoyez un document complet : <!DOCTYPE html>, <html>, <head> avec meta charset, <body>.'
  - Ajoutez une partie texte.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_html_tests.cf
- id: sa.html_image_only_04
  family: spamassassin
  severity: medium
  penalty: 0.6
  detect:
    signal: spamassassin.hit(HTML_IMAGE_ONLY_04)
    notes: 'score SA 4.0.x : 1.172 (sa-update r1939780, jeu réseau + Bayes). Teste : html_image_only(''0000'',
      ''0400'') : le HTML contient une image et sa longueur de texte est dans l''intervalle (en octets).'
  sa_rules:
  - HTML_IMAGE_ONLY_04
  title: Message HTML presque sans texte, avec image (0 à 400 octets de texte)
  why: 'Le HTML contient une ou des images et moins de 400 octets de texte : le message est en pratique
    une affiche. Les filtres ne lisent pas les images, ce qui est la technique des spams en image. Cas
    courant : flyer exporté de Canva collé dans le corps.'
  fix:
  - Ajoutez du vrai texte dans le HTML (titre, paragraphes, appel à l'action) au lieu de le mettre dans
    l'image.
  - Visez au moins quelques centaines de mots de texte réel ; gardez les images pour l'illustration.
  - Renseignez un attribut alt descriptif sur chaque image.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_html_tests.cf
