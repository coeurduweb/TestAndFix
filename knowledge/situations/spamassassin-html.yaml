- id: sa.html_font_low_contrast
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(HTML_FONT_LOW_CONTRAST)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : html_test(''font_low_contrast'')
      : la distance entre la couleur du texte et celle du fond calculée par le parseur HTML est inférieure
      à 12.'
  sa_rules:
  - HTML_FONT_LOW_CONTRAST
  title: Texte de couleur trop proche du fond
  why: Une partie du texte a presque la même couleur que son fond, donc est invisible ou illisible. Les
    spammeurs cachent ainsi du texte pour tromper les filtres. Dans une newsletter, cela vient souvent
    d'un texte blanc sur une image de fond que SpamAssassin ne voit pas, ou d'un preheader caché en couleur
    du fond.
  fix:
  - Déclarez une couleur de fond (bgcolor ou background-color) sur la cellule qui porte le texte clair,
    en plus de l'image de fond.
  - Masquez le preheader avec display:none et mso-hide:all plutôt qu'en couleur identique au fond.
  example_bad: <td style="background:url(fond.jpg)"><font color="#ffffff">Texte</font></td>
  example_good: <td bgcolor="#1a3c6e" style="background:#1a3c6e url(fond.jpg)"><font color="#ffffff">Texte</font></td>
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_html_tests.cf
