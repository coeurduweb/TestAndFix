  title: Dix div vides ou plus à la suite
  why: 'Le HTML contient au moins dix balises <div> d''affilée, souvent vides. Score symbolique : c''est
    un reste de mise en page d''un éditeur.'
  fix:
  - Supprimez les div vides ; utilisez des marges ou un espacement de tableau.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/kmcgrail/20_ac_rules_test.cf
- id: sa.ac_br_bonanza
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(AC_BR_BONANZA)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : rawbody /(?:<br>\s*){30}/i.'
  sa_rules:
  - AC_BR_BONANZA
  title: Trente retours à la ligne ou plus à la suite
  why: Le HTML contient au moins trente <br> consécutifs. Technique pour pousser du texte hors de la vue,
    ou mise en page faite à coups de retours à la ligne. Score symbolique.
  fix:
  - Remplacez les suites de <br> par un espacement en CSS (padding, margin).
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/kmcgrail/20_ac_rules_test.cf
- id: sa.long_invisible_text
  family: spamassassin
  severity: low
  penalty: 0.3
  detect:
    signal: spamassassin.hit(LONG_INVISIBLE_TEXT)
    notes: 'score SA 4.0.x : 0.643 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : div display:none
      ou visibility:hidden suivie de 1 400 caractères sans espace, ou texte caché avec ligne de plus de
      998 caractères (avec exceptions).'
  sa_rules:
  - LONG_INVISIBLE_TEXT
  title: Long bloc de texte caché
  why: Le message contient un long bloc de texte invisible. Les spammeurs y mettent du texte pour « empoisonner
    » les filtres bayésiens.
  fix:
  - Supprimez les blocs de texte masqués inutiles ; un preheader doit faire une phrase.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.word_invis
  family: spamassassin
  severity: high
  penalty: 1.5
  detect:
    signal: spamassassin.hit(WORD_INVIS)
    notes: 'score SA 4.0.x : 2.999 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : balise avec
      font-size 0 ou 1 (px, pt...) ou color:transparent contenant un mot, hors sondages et lignes QP longues.'
  sa_rules:
  - WORD_INVIS
  title: Un mot rendu invisible
  why: Un mot est caché par une taille de police nulle ou une couleur transparente. C'est une technique
    de masquage, mais des modèles de newsletter l'utilisent aussi pour l'espacement du preheader. 3 points.
  fix:
  - Retirez les éléments en font-size:0 ou color:transparent qui contiennent du texte.
  - Pour le preheader, utilisez display:none ; pour l'espacement, des caractères &zwnj;&nbsp; dans un
    bloc masqué.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.t_remote_image
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(T_REMOTE_IMAGE)
    notes: 'score SA 4.0.x : 0.01 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : HTML_IMAGE_ONLY
      ou image cliquable, sans texte d''abonnement, liste, expéditeur robot ni image jointe. Règle de
      test T_. Pas de ligne score : valeur par défaut de SpamAssassin.'
  sa_rules:
  - T_REMOTE_IMAGE
  title: Le message charge une image distante
  why: 'Le message affiche une image hébergée sur un serveur externe sans texte d''abonnement. Règle de
    test sans poids : simple indication.'
  fix:
  - Rien d'obligatoire. Ajoutez un texte qui explique pourquoi le destinataire reçoit le message.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/khopesh/20_khop_experimental.cf
- id: sa.dc_image_spam_html
  family: spamassassin
  severity: low
  penalty: 0.1
  detect:
    signal: spamassassin.hit(DC_IMAGE_SPAM_HTML)
    notes: 'score SA 4.0.x : 0.1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : aucun lien,
      HTML_IMAGE_ONLY ou rapport image/texte très faible, et une grande image GIF ou PNG (180 000 à 475
      000 pixels).'
  sa_rules:
  - DC_IMAGE_SPAM_HTML
  title: Possible spam en image (HTML)
  why: Le message contient une grande image, presque pas de texte et aucun lien. Profil des spams en image
    qui affichent leur texte dans un GIF.
  fix:
  - Mettez le texte en HTML et ajoutez au moins un lien vers votre site.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_imageinfo.cf
- id: sa.dc_image_spam_text
  family: spamassassin
  severity: low
  penalty: 0.1
  detect:
    signal: spamassassin.hit(DC_IMAGE_SPAM_TEXT)
    notes: 'score SA 4.0.x : 0.1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : aucun lien,
      rapport image/texte inférieur à 0,008 et une grande image GIF ou PNG.'
  sa_rules:
  - DC_IMAGE_SPAM_TEXT
  title: Possible spam en image avec peu de texte
  why: Une grande image, presque pas de texte et pas de lien. Même profil que DC_IMAGE_SPAM_HTML.
  fix:
  - Ajoutez du texte réel et un lien vers votre site.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_imageinfo.cf
- id: sa.long_img_uri
  family: spamassassin
  severity: low
  penalty: 0.1
  detect:
    signal: spamassassin.hit(LONG_IMG_URI)
    notes: 'score SA 4.0.x : 0.296 (sa-update r1939780, jeu réseau + Bayes). Teste : meta uri m;/[0-9a-z]{45,}/\w+\.(?:png|gif|jpe?g|webp)$;i,
      hors réseau de confiance, Errors-To et PayPal.'
  sa_rules:
  - LONG_IMG_URI
  title: Adresse d'image avec un très long identifiant
  why: Une image est chargée depuis une adresse qui contient un segment de 45 caractères ou plus, comme
    les pixels espions. Les outils d'envoi produisent des adresses de ce type. Pénalité faible.
  fix:
  - Hébergez les images du message à des adresses lisibles sous votre domaine.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.uri_img_wp_redir
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(URI_IMG_WP_REDIR)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta uri m;://i[02]\.wp\.com/.*\.(?:jpe?g|gif|png|webp)$;i.'
  sa_rules:
  - URI_IMG_WP_REDIR
  title: Image servie par le proxy d'images de WordPress.com
  why: 'Une image passe par i0.wp.com ou i2.wp.com, le service d''accélération d''images de Jetpack. Les
    spammeurs utilisent ce proxy pour cacher l''origine de leurs images : SpamAssassin ajoute un point.
    Cela arrive quand une newsletter reprend les images d''un article WordPress avec Jetpack actif.'
  fix:
  - Utilisez l'adresse directe de l'image sur votre site (https://{domain}/wp-content/uploads/...).
  fix_by_provider:
    wordpress: Désactivez l'accélérateur d'images (Site Accelerator) de Jetpack, ou copiez l'adresse d'origine
      de l'image depuis la médiathèque.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
