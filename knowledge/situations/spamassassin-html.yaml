  fix:
  - Supprimez le texte caché inutile. Pour un preheader, utilisez un seul bloc masqué par display:none.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
