  fix:
  - Mettez dans <title> le même texte que l'objet, ou un titre court.
  - Dans l'outil d'envoi, vérifiez si le titre du modèle se remplit avec l'objet de la campagne.
  example_bad: 'Subject: Nouveautés  /  <title>Lettre d''information mensuelle de l''atelier, toutes nos
    actualités</title>'
  example_good: 'Subject: Nouveautés de novembre  /  <title>Nouveautés de novembre</title>'
