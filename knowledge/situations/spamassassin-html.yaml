      ''!= 0'').'
  sa_rules:
  - HTML_TAG_BALANCE_HEAD
  title: Balises head ouvrantes et fermantes déséquilibrées
  why: Le HTML contient un <head> sans </head>, ou l'inverse. Cas courant d'un modèle découpé en morceaux
    par un CMS. Près d'un point.
  fix:
  - Fermez la balise head avant <body> et vérifiez le HTML final généré, pas le modèle.
