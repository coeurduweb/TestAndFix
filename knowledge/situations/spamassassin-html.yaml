      ''!= 0''), hors serveur d''envoi au rDNS mail ou smtp.'
  sa_rules:
  - HTML_TAG_BALANCE_CENTER
  title: Balises center déséquilibrées
  why: Le HTML contient des balises <center> qui ne se referment pas correctement. SpamAssassin y voit
    un HTML de spam mal généré et ajoute 3,5 points. Le cas se présente avec de vieux modèles de newsletter.
  fix:
  - Remplacez les balises <center> par align="center" sur les tableaux ou text-align:center en style.
  - À défaut, vérifiez que chaque <center> a son </center>.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
