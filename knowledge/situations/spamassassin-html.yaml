  detect:
    signal: spamassassin.hit(HTML_OBFUSCATE_05_10)
    notes: 'score SA 4.0.x : 0.26 (sa-update r1939780, jeu réseau + Bayes). Teste : html_range(''obfuscation_ratio'',
      ''.05'', ''.1'') : part des balises qui coupent un mot (texte collé avant et après la balise) dans
      l''intervalle.'
  sa_rules:
  - HTML_OBFUSCATE_05_10
  title: 5 à 10 % des balises HTML coupent des mots
  why: Des balises s'insèrent au milieu de mots (Pro<b>mo</b>tion). Les spammeurs le font pour masquer
    des mots-clés ; un éditeur qui applique un style à une partie de mot produit le même effet.
  fix:
  - Repérez les mots coupés par des balises (<span>, <b>, <font>) au milieu d'un mot et nettoyez le HTML.
  - Si le HTML vient d'un copier-coller depuis Word ou Google Docs, collez le texte sans mise en forme
    puis remettez les styles.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_html_tests.cf
