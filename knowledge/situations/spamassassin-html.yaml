  title: Couleur HTML invalide
  why: 'Un attribut de couleur (color, bgcolor) contient une valeur illisible : # manquant, code à 5 chiffres,
    nom inconnu. Règle de test sans poids, mais elle entre dans des règles combinées (CONTENT_AFTER_HTML).'
  fix:
  - 'Écrivez les couleurs en hexadécimal complet avec le dièse : #1a3c6e.'
  example_bad: <td bgcolor="1a3c6e">
  example_good: <td bgcolor="#1a3c6e">
  references:
