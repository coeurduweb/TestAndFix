- id: sa.t_kam_html_font_invalid
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(T_KAM_HTML_FONT_INVALID)
    notes: 'score SA 4.0.x : 0.01 (sa-update r1939780, jeu réseau + Bayes). Teste : meta html_test(''font_invalid_color'')
      : un attribut color, text ou bgcolor n''a pas pu être lu comme une couleur. Règle de test T_. Pas
      de ligne score : valeur par défaut de SpamAssassin.'
  sa_rules:
