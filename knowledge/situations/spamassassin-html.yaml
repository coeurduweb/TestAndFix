    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : html_range(''max_size'',
      ''24'', ''inf'') : taille de police maximale estimée par le parseur à 24 ou plus.'
  sa_rules:
  - HTML_FONT_SIZE_HUGE
  title: Police HTML très grande (24 et plus)
