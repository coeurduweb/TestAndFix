  sa_rules:
  - BANG_GUAR
  title: « Guaranteed! » avec point d'exclamation
  why: Le texte contient « guarantee! » ou « guaranteed! ». 1 point.
  fix:
  - Retirez le point d'exclamation ou l'expression.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_phrases.cf
- id: sa.free_quote_instant
  family: spamassassin
  severity: medium
  penalty: 0.6
  detect:
    signal: spamassassin.hit(FREE_QUOTE_INSTANT)
    notes: 'score SA 4.0.x : 1.297 (sa-update r1939780, jeu réseau + Bayes). Teste : body /free.{0,12}(?:(?:instant|express|online|no.?obligation).{0,4})+.{0,32}\bquote/i.'
  sa_rules:
  - FREE_QUOTE_INSTANT
  title: Offre de devis gratuit et immédiat
  why: Le texte propose un « free instant quote » ou « free no-obligation quote ». Formule des spams de
    prospection en anglais. Plus d'un point.
  fix:
  - Reformulez l'appel à l'action sans « free » ni « instant » accolés à « quote ».
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_phrases.cf
- id: sa.low_price
  family: spamassassin
  severity: low
  penalty: 0.1
  detect:
    signal: spamassassin.hit(LOW_PRICE)
    notes: 'score SA 4.0.x : 0.1 (sa-update r1939780, jeu réseau + Bayes). Teste : body /\blow.{0,4} (?-i:P)rice/i
      : « Low Price », « Lowest Price » avec P majuscule.'
  sa_rules:
  - LOW_PRICE
  title: Mention « lowest price »
  why: Le texte contient « Low Price » ou « Lowest Price ». Pénalité faible.
  fix:
  - Rien d'obligatoire ; évitez la formule dans l'objet.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_phrases.cf
- id: sa.act_now_caps
  family: spamassassin
  severity: low
  penalty: 0.1
  detect:
    signal: spamassassin.hit(ACT_NOW_CAPS)
    notes: 'score SA 4.0.x : 0.1 (sa-update r1939780, jeu réseau + Bayes). Teste : body /\bA(?i:ct) N(?i:ow)\b/.'
  sa_rules:
  - ACT_NOW_CAPS
  title: « Act Now » en capitales
  why: Le texte contient « Act Now » avec majuscules. Pénalité faible.
  fix:
  - Remplacez par un appel à l'action précis (« Réservez votre place »).
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_phrases.cf
- id: sa.this_ad
  family: spamassassin
  severity: high
  penalty: 1.3
  detect:
    signal: spamassassin.hit(THIS_AD)
    notes: 'score SA 4.0.x : 2.699 (sa-update r1939780, jeu réseau + Bayes). Teste : meta body /(?:\b|_)this[-
      _]+(?:ad(?:vertisement)?|promo(?:tion)?)s?(?:\b|_)/i, hors Message-ID Mozilla, From encodé QP, retour
      chariot dans l''objet et Return-Path cohérent.'
  sa_rules:
  - THIS_AD
  title: Le texte parle de « this ad » ou « this promotion »
  why: Le texte contient « this ad », « this advertisement » ou « this promotion ». Souvent dans une mention
    légale anglaise du pied de page. Près de 3 points.
  fix:
  - Retirez ou traduisez la mention anglaise du pied de page.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.admits_spam
  family: spamassassin
  severity: high
  penalty: 1.0
  detect:
    signal: spamassassin.hit(ADMITS_SPAM)
    notes: 'score SA 4.0.x : 1.999 (sa-update r1939780, jeu réseau + Bayes). Teste : meta body « this
      is an advertisement », « the above is an e-mail advertisement »..., hors X-Campaignid, texte caché
      et listes Lyris/ezmlm.'
  sa_rules:
  - ADMITS_SPAM
  title: Le texte se présente comme une publicité
  why: 'Le message contient « This is an advertisement » : certaines lois imposent cette mention, mais
    les filtres la traitent comme un aveu. 2 points.'
  fix:
  - Si la mention n'est pas exigée pour votre public, retirez-la.
  - Sinon, utilisez un outil d'envoi qui ajoute ses en-têtes de campagne (la règle ne s'applique pas avec
    X-Campaignid).
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.ad_prefs
  family: spamassassin
  severity: low
  penalty: 0.1
  detect:
    signal: spamassassin.hit(AD_PREFS)
    notes: 'score SA 4.0.x : 0.25 (sa-update r1939780, jeu réseau + Bayes). Teste : body /(?:\b|_)(?:ad(?:vertising)?|promo(?:tion)?|marketing)[-
      _](?:pref(?:s|erences)|settings)(?:\b|_)/i.'
  sa_rules:
  - AD_PREFS
  title: Lien ou mention « advertising preferences »
  why: Le texte contient « marketing preferences » ou « ad settings ». Pénalité faible, souvent due au
    lien de gestion des préférences en anglais.
  fix:
  - Traduisez le libellé du lien de préférences (« Gérer mes préférences »).
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.excuse_remove
  family: spamassassin
  severity: high
  penalty: 1.6
  detect:
    signal: spamassassin.hit(EXCUSE_REMOVE)
    notes: 'score SA 4.0.x : 3.299 (sa-update r1939780, jeu réseau + Bayes). Teste : body /to be removed
      from.{0,20}(?:mailings|offers)/i.'
  sa_rules:
  - EXCUSE_REMOVE
  title: Formule « to be removed from our mailings »
  why: Le texte contient « to be removed from ... mailings » ou « ... offers ». Formule des vieux spams
    en anglais, pénalisée de plus de 3 points.
  fix:
  - 'Remplacez la phrase par un lien de désinscription direct : « Se désinscrire ».'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_phrases.cf
- id: sa.excuse_4
  family: spamassassin
  severity: medium
  penalty: 0.7
  detect:
    signal: spamassassin.hit(EXCUSE_4)
    notes: 'score SA 4.0.x : 1.325 (sa-update r1939780, jeu réseau + Bayes). Teste : body /To Be Removed,?
      Please/i.'
  sa_rules:
  - EXCUSE_4
  title: Formule « To Be Removed, Please »
  why: Le texte contient « To be removed, please... ». Plus d'un point.
  fix:
  - Remplacez par un lien de désinscription en un clic.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_phrases.cf
- id: sa.end_future_emails
  family: spamassassin
  severity: low
  penalty: 0.2
  detect:
    signal: spamassassin.hit(END_FUTURE_EMAILS)
    notes: 'score SA 4.0.x : 0.314 (sa-update r1939780, jeu réseau + Bayes). Teste : meta body « stop
      receiving these emails », « do not wish to receive future mailings », « discontinue future messages
      »..., sans DKIM, Errors-To, X-Mailer-LID, en-têtes en casse anormale ni relais .gov.'
  sa_rules:
  - END_FUTURE_EMAILS
  title: Formule de désinscription typique du spam
  why: Le texte de désinscription utilise une formule anglaise que les spammeurs emploient beaucoup et
    le message n'est pas signé en DKIM. Pénalité faible.
  fix:
  - 'Signez le message en DKIM : la règle ne s''applique pas aux messages signés.'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.remove_before_link
  family: spamassassin
  severity: low
  penalty: 0.1
  detect:
    signal: spamassassin.hit(REMOVE_BEFORE_LINK)
    notes: 'score SA 4.0.x : 0.1 (sa-update r1939780, jeu réseau + Bayes). Teste : body m{(?:no thanks|not
      interested|unsubscribe here).{0,5}http://}i.'
  sa_rules:
  - REMOVE_BEFORE_LINK
  title: « No thanks » ou « unsubscribe here » juste avant un lien http
  why: Une formule de refus est suivie d'un lien en http:// non chiffré. Pénalité faible.
  fix:
  - Utilisez un lien https:// et un libellé cliquable plutôt qu'une adresse affichée.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_phrases.cf
- id: sa.obfu_unsub_ul
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(OBFU_UNSUB_UL)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta body /(?:click_here|remove_your|our_e?mail|this_list|to_unsubscribe|future_e?mail|our_list)/,
      hors MAILING_LIST_MULTI. Pas de ligne score : valeur par défaut de SpamAssassin.'
  sa_rules:
  - OBFU_UNSUB_UL
  title: Texte de désinscription avec des tirets bas à la place des espaces
  why: Le texte contient des expressions comme « click_here » ou « to_unsubscribe », écrites avec des
    tirets bas pour échapper aux filtres. Un nom de fichier ou de variable laissé visible peut aussi la
    déclencher.
  fix:
  - Écrivez le texte normalement, avec des espaces.
  - Vérifiez qu'aucune balise de modèle (to_unsubscribe, click_here) n'apparaît non remplacée.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.marketing_partners
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(MARKETING_PARTNERS)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : body /\b(?:marketing|network)
      partner|\bpartner (?:web)?site/i.'
  sa_rules:
  - MARKETING_PARTNERS
  title: Mention de partenaires marketing
  why: Le texte mentionne un « marketing partner » ou un « partner site », formule des listes louées.
    Score symbolique.
  fix:
  - Rien d'obligatoire. N'envoyez qu'à des contacts qui se sont inscrits chez vous.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_phrases.cf
- id: sa.cant_see_ad
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(CANT_SEE_AD)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : formule anglaise
      du type « can''t see this newsletter / the images below », sans en-tête List-Unsubscribe.'
  sa_rules:
  - CANT_SEE_AD
  title: Formule « can't see the images below »
  why: Le message contient la formule anglaise « If you can't see this newsletter... » et n'a pas d'en-tête
    List-Unsubscribe. 1 point.
  fix:
  - Ajoutez l'en-tête List-Unsubscribe (la règle ne s'applique plus) ou traduisez la phrase du lien «
    version en ligne ».
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.not_spam
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(NOT_SPAM)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : body /\b(?:(?:this (?:e?-?mail|message)|we)
      (?:is not|are not|cannot be considered) Spam|ESTE CORREO NO PUEDE SER CONSIDERADO ...|Diese Nachricht
      ist KEIN SPAM)/i. Pas de ligne score : valeur par défaut de SpamAssassin.'
  sa_rules:
  - NOT_SPAM
  title: Le message affirme ne pas être du spam
  why: Le texte affirme « This email is not spam » (en anglais, espagnol ou allemand). Les messages légitimes
    n'ont pas besoin de le dire. 1 point.
  fix:
  - Supprimez la phrase. Expliquez plutôt pourquoi le destinataire reçoit le message (inscription, client).
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.urg_biz
  family: spamassassin
  severity: low
  penalty: 0.3
  detect:
    signal: spamassassin.hit(URG_BIZ)
    notes: 'score SA 4.0.x : 0.573 (sa-update r1939780, jeu réseau + Bayes). Teste : meta body /urgent.{0,16}(?:assistance|business|buy|confidential|notice|proposal|reply|request|response)/i.'
  sa_rules:
  - URG_BIZ
  title: Le texte parle d'une affaire urgente
  why: Le texte contient « urgent reply », « urgent business », « urgent request ». Formule des fraudes
