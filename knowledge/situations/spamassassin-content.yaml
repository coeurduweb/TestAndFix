  severity: high
  penalty: 1.3
  detect:
    signal: spamassassin.hit(GUARANTEED_100_PERCENT)
    notes: 'score SA 4.0.x : 2.699 (sa-update r1939780, jeu réseau + Bayes). Teste : body /100% GUARANTEED/i.'
  sa_rules:
  - GUARANTEED_100_PERCENT
  title: Mention « 100% guaranteed »
  why: Le texte contient « 100% guaranteed ». Près de 3 points pour cette seule expression.
  fix:
  - Retirez l'expression ou formulez la garantie précisément (durée, conditions).
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_phrases.cf
- id: sa.bang_guar
