  severity: low
  penalty: 0.1
  detect:
    signal: spamassassin.hit(INVESTMENT_ADVICE)
    notes: 'score SA 4.0.x : 0.1 (sa-update r1939780, jeu réseau + Bayes). Teste : body /\binvestment
      advice/i.'
  sa_rules:
  - INVESTMENT_ADVICE
  title: Mention « investment advice »
  why: Le texte contient « investment advice », souvent dans un avertissement légal. Pénalité faible.
  fix:
  - Rien d'obligatoire si la mention est requise.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_phrases.cf
- id: sa.fin_free
  family: spamassassin
  severity: low
  penalty: 0.1
  detect:
    signal: spamassassin.hit(FIN_FREE)
    notes: 'score SA 4.0.x : 0.1 (sa-update r1939780, jeu réseau + Bayes). Teste : body /\bfinancial(?:ly)?
      (?:free|independen)/i.'
  sa_rules:
  - FIN_FREE
  title: Promesse de liberté financière
  why: Le texte promet « financial freedom » ou « financially independent ». Pénalité faible.
  fix:
  - Reformulez sans promesse de gain.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_phrases.cf
- id: sa.compensation
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(COMPENSATION)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : meta body /\b(?:compensat(?:e|ion)|recompensed?|ausgleich)\b/i,
      sans List-Unsubscribe, lien de désinscription, commentaire HTML, authentification, ni autres signes
      légitimes.'
  sa_rules:
  - COMPENSATION
  title: Mention de compensation financière
  why: Le texte parle de « compensation » sans aucun signe de liste ou d'authentification. Score symbolique.
  fix:
  - Rien d'obligatoire. Authentifiez le message (SPF, DKIM).
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_lotsa_money.cf
- id: sa.fill_this_form
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(FILL_THIS_FORM)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : formule longue
      « fill in the form » ou plus de 4 champs d''informations personnelles demandés (nom, adresse, téléphone,
      âge...), hors fil de discussion et liste.'
  sa_rules:
  - FILL_THIS_FORM
  title: Demande de remplir un formulaire avec des informations personnelles
  why: Le message demande de répondre en donnant nom, adresse, téléphone, profession... Schéma des fraudes
    en anglais. Score symbolique, mais base de règles combinées plus lourdes.
  fix:
  - Renvoyez vers un formulaire sur votre site plutôt que de demander les informations par réponse à l'e-mail.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_fillform.cf
- id: sa.fsl_bulk_sig
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(FSL_BULK_SIG)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : DCC_CHECK,
      RAZOR2_CHECK ou PYZOR_CHECK, sans List-Unsubscribe ni lien de désinscription, VERP ou relais smtp.'
  sa_rules:
  - FSL_BULK_SIG
  title: Envoi en nombre détecté sans lien de désinscription
  why: 'Un réseau collaboratif a vu ce message en grand nombre et il ne contient aucun moyen de se désinscrire.
    Score symbolique, mais c''est un défaut réel : Gmail et Yahoo exigent la désinscription en un clic
    pour les envois en nombre.'
  fix:
  - Ajoutez un lien de désinscription visible et les en-têtes List-Unsubscribe et List-Unsubscribe-Post.
  example_good: 'List-Unsubscribe: <https://exemple.fr/desinscription?id=abc>, <mailto:desinscription@exemple.fr>

    List-Unsubscribe-Post: List-Unsubscribe=One-Click'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/smf/30_smf_nontest.cf
  - https://www.rfc-editor.org/rfc/rfc8058
  - https://support.google.com/a/answer/81126
- id: sa.english_uce_subject
  family: spamassassin
  severity: high
  penalty: 1.4
  detect:
    signal: spamassassin.hit(ENGLISH_UCE_SUBJECT)
    notes: 'score SA 4.0.x : 2.899 (sa-update r1939780, jeu réseau + Bayes). Teste : header Subject =~
      /^[^0-9a-z]*adv(?:ert)?\b/i.'
  sa_rules:
  - ENGLISH_UCE_SUBJECT
  title: Objet qui commence par « ADV »
  why: L'objet commence par « ADV » ou « ADVERT », étiquette de publicité imposée par certaines lois américaines
    et cherchée par les filtres. Près de 3 points.
  fix:
  - Retirez le préfixe ADV de l'objet sauf obligation légale pour votre public.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_head_tests.cf
- id: sa.subj_as_seen
  family: spamassassin
  severity: medium
  penalty: 0.7
  detect:
    signal: spamassassin.hit(SUBJ_AS_SEEN)
    notes: 'score SA 4.0.x : 1.461 (sa-update r1939780, jeu réseau + Bayes). Teste : header Subject =~
      /\bAs Seen/i.'
  sa_rules:
  - SUBJ_AS_SEEN
  title: Objet contenant « As Seen »
  why: L'objet contient « As Seen » (« as seen on TV »). Près d'1,5 point.
  fix:
  - Reformulez l'objet.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_head_tests.cf
- id: sa.unicode_obfu_zw
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(UNICODE_OBFU_ZW)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : plus d''une
      occurrence de caractères de largeur nulle (U+200B, U+200C, U+200D, BOM) au milieu de texte, sans
      texte d''abonnement, liste, VERP, List-Unsubscribe ni DKIM.'
  sa_rules:
  - UNICODE_OBFU_ZW
  title: Caractères invisibles insérés dans les mots
  why: Des caractères invisibles (espaces de largeur nulle) sont insérés dans des mots. C'est une technique
    d'obfuscation ; des modèles de preheader en ajoutent aussi. Score symbolique.
  fix:
  - Retirez les caractères de largeur nulle du texte visible ; signez le message en DKIM.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.unicode_obfu_zw_many
  family: spamassassin
  severity: high
  penalty: 1.5
  detect:
    signal: spamassassin.hit(UNICODE_OBFU_ZW_MANY)
    notes: 'score SA 4.0.x : 2.999 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : plus de 9
      occurrences de caractères de largeur nulle au milieu du texte, hors relais au rDNS mail.'
  sa_rules:
  - UNICODE_OBFU_ZW_MANY
  title: Nombreux caractères invisibles insérés dans les mots
  why: Le texte est truffé de caractères de largeur nulle. Les preheaders qui enchaînent des &zwnj; ou
    &#8203; pour masquer le début du message en produisent beaucoup. 3 points.
  fix:
  - 'Limitez le remplissage du preheader : quelques &nbsp; suffisent, ou aucun.'
  - Retirez les caractères de largeur nulle collés au texte visible.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.unicode_obfu_asc
  family: spamassassin
  severity: high
  penalty: 1.2
  detect:
    signal: spamassassin.hit(UNICODE_OBFU_ASC)
    notes: 'score SA 4.0.x : 2.499 (sa-update r1939780, jeu réseau + Bayes). Teste : meta body : lettres
      cyrilliques а, е, о, р, с (identiques à a, e, o, p, c latins) intercalées dans des mots latins.'
  sa_rules:
  - UNICODE_OBFU_ASC
  title: Lettres cyrilliques mêlées à des mots latins
  why: Des lettres cyrilliques qui ressemblent aux lettres latines sont mélangées au texte. Technique
    pour déjouer les filtres de mots. Un copier-coller depuis un document mal encodé peut en introduire.
    2,5 points.
  fix:
  - Retapez les mots concernés au clavier ou passez le texte dans un outil qui signale les caractères
    non latins.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.percent_random
  family: spamassassin
  severity: medium
  penalty: 0.9
  detect:
    signal: spamassassin.hit(PERCENT_RANDOM)
    notes: 'score SA 4.0.x : 1.838 (sa-update r1939780, jeu réseau + Bayes). Teste : meta header ALL ou
      rawbody =~ /%RA?ND(?:OM)?(?:_|\b|[A-Z]{3})/i.'
  sa_rules:
  - PERCENT_RANDOM
  title: Macro %RND ou %RANDOM non remplacée
  why: 'Le message contient une macro %RND ou %RANDOM laissée telle quelle : un logiciel d''envoi de masse
    n''a pas substitué sa variable aléatoire. Près de 2 points.'
  fix:
  - Repérez la macro dans l'objet, les en-têtes ou le HTML et retirez-la du modèle.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_meta_tests.cf
- id: sa.longwords
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(LONGWORDS)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : au moins deux
      motifs parmi 6 mots de 8 lettres et plus, 9 mots de 6 lettres et plus, 10 mots de 5 lettres et plus,
      consécutifs et en minuscules. Pas de ligne score : valeur par défaut de SpamAssassin.'
  sa_rules:
  - LONGWORDS
  title: Longue suite de mots longs
  why: Le texte contient de longues suites de mots longs en minuscules, comme les textes aléatoires ajoutés
    par les spammeurs pour tromper les filtres. 1 point.
  fix:
  - Vérifiez qu'aucun texte de remplissage ou mot-clé en série ne traîne dans le message (balise alt,
    texte caché, liste de mots-clés).
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_body_tests.cf
- id: sa.unwanted_language_body
  family: spamassassin
  severity: high
  penalty: 1.4
  detect:
    signal: spamassassin.hit(UNWANTED_LANGUAGE_BODY)
    notes: 'score SA 4.0.x : 2.8 (sa-update r1939780, jeu réseau + Bayes). Teste : check_language() (plugin
      TextCat) : la langue détectée du corps n''est pas dans ok_languages. Dépend du plugin TextCat, non
      chargé par défaut dans SpamAssassin 4.0 : la règle n''apparaît que si le serveur de test l''active.'
  sa_rules:
  - UNWANTED_LANGUAGE_BODY
  title: Message rédigé dans une langue non acceptée
  why: Le serveur de test n'accepte que certaines langues et le message est rédigé dans une autre. Ne
    se produit que si ok_languages a été restreint. 2,8 points.
  fix:
  - Aucune correction côté message si la langue est voulue ; signalez que le serveur de test filtre les
    langues.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/25_textcat.cf
- id: sa.nice_reply_a
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(NICE_REPLY_A)
    notes: 'score SA 4.0.x : -2.92 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : objet commençant
      par Re:, Sv:, Vs:, Aw: avec In-Reply-To et References présents, et logiciel de messagerie connu.'
  sa_rules:
  - NICE_REPLY_A
  title: Le message ressemble à une vraie réponse
  why: Le message a les en-têtes d'une vraie réponse dans un fil de discussion. Gros bonus (près de 3
    points).
  fix:
  - 'Rien à corriger. Ne simulez pas de faux Re: dans une campagne : cela ne déclenche pas cette règle
    et irrite les lecteurs.'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/fredt/99_zFVGT_FakeReply.cf
- id: sa.gtube
  family: spamassassin
  severity: critical
  penalty: 3.0
  detect:
    signal: spamassassin.hit(GTUBE)
    notes: 'score SA 4.0.x : 1000 (sa-update r1939780, jeu réseau + Bayes). Teste : body : contient la
      chaîne de test XJS*C4JDBQADN1.NSBN3*2IDNEN*GTUBE-STANDARD-ANTI-UBE-TEST-EMAIL*C.34X.'
  sa_rules:
  - GTUBE
  title: Message de test antispam GTUBE
  why: Le message contient la chaîne GTUBE, faite exprès pour être reconnue comme spam par tous les filtres.
    1 000 points.
  fix:
  - 'Retirez la chaîne GTUBE : elle ne sert qu''à vérifier qu''un filtre fonctionne.'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_body_tests.cf

- id: spamassassin.over_threshold
  family: spamassassin
  severity: critical
  impact: blocking
  # The points are carried by the rules themselves: this entry only states the consequence.
  penalty: 0
  detect:
    signal: spamassassin.score >= spamassassin.threshold
    notes: "required_score vaut 5.0 par défaut dans SpamAssassin (Mail::SpamAssassin::Conf)."
  sa_rules: []
  title: "SpamAssassin classe ce message en spam ({value} points, seuil {rule_score})"
  why: >
    Au-delà de ce seuil, un serveur qui filtre avec SpamAssassin et son réglage par défaut range le
    message en indésirables ou le refuse. Les points viennent des règles listées dans « Risque
    d'indésirables ».
  fix:
    - "Corrigez d'abord les règles SpamAssassin qui coûtent le plus de points."
    - "Renvoyez ensuite un message de test : il doit passer sous {rule_score} points."
  references:
    - https://spamassassin.apache.org/full/4.0.x/doc/Mail_SpamAssassin_Conf.html
