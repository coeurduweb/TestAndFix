  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(NEW_PRODUCTS)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta body « here are
      new products », « we are pleased to introduce our... », « our company has recently launched... »,
      hors beaucoup de texte caché.'
  sa_rules:
  - NEW_PRODUCTS
