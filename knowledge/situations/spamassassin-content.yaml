# Famille spamassassin, groupe content. Généré par research/scripts/sa_build.py
# depuis research/work/sa/src/content.yaml et les règles sa-update r1939780 (SpamAssassin 4.0.x).
# Ne pas éditer à la main : modifier la source puis régénérer.
- id: sa.uppercase_50_75
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(UPPERCASE_50_75)
    notes: 'score SA 4.0.x : 0.008 (sa-update r1939780, jeu réseau + Bayes). Teste : meta check_for_uppercase(''50'',
      ''75'') : part des lettres en majuscules dans le corps.'
  sa_rules:
  - UPPERCASE_50_75
  title: Texte du message à 50 à 75 % en majuscules
  why: Plus de la moitié des lettres du corps sont en capitales. Score symbolique aujourd'hui, mais le
    message paraît crié et les lecteurs le signalent plus volontiers.
  fix:
  - Réécrivez le texte en casse normale ; gardez les capitales pour les sigles.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_meta_tests.cf
- id: sa.uppercase_75_100
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(UPPERCASE_75_100)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : meta check_for_uppercase(''75'',
      ''100'').'
  sa_rules:
  - UPPERCASE_75_100
  title: Texte du message presque entièrement en majuscules
  why: Plus des trois quarts des lettres sont en capitales. Score symbolique.
  fix:
  - Réécrivez le texte en casse normale.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_meta_tests.cf
- id: sa.lots_of_money
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(LOTS_OF_MONEY)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : montants avec
      symbole monétaire et au moins 4 chiffres, ou « million », « thousand », « sum of »..., hors itinéraire
      de voyage.'
  sa_rules:
  - LOTS_OF_MONEY
  title: Le message cite de grosses sommes d'argent
  why: Le texte mentionne de grosses sommes (10 000 €, « millions »). Score symbolique, mais cette règle
    entre dans plusieurs règles combinées de fraude.
  fix:
  - Rien d'obligatoire. Évitez d'aligner de gros montants dans l'objet et le premier paragraphe.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_lotsa_money.cf
- id: sa.money_back
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(MONEY_BACK)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : body /money back guarantee/i.
      Pas de ligne score : valeur par défaut de SpamAssassin.'
  sa_rules:
  - MONEY_BACK
  title: Mention « money back guarantee »
  why: Le texte contient l'expression anglaise « money back guarantee ». 1 point.
  fix:
  - Reformulez (« remboursement sous 30 jours ») ou retirez l'expression anglaise du pied de page.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_phrases.cf
- id: sa.risk_free
  family: spamassassin
  severity: high
  penalty: 1.3
  detect:
    signal: spamassassin.hit(RISK_FREE)
    notes: 'score SA 4.0.x : 2.699 (sa-update r1939780, jeu réseau + Bayes). Teste : meta body « no risk
      », « risk free », « free of risk », « 100% safe » (et une variante allemande), hors lien de désinscription,
      liste, image cliquable, texte d''abonnement et Re:/Fw:.'
  sa_rules:
  - RISK_FREE
  title: Promesse « sans risque »
  why: 'Le texte promet l''absence de risque (« risk free », « 100% safe ») sans aucun signe de liste
    de diffusion. Près de 3 points : la formule est typique des arnaques.'
  fix:
  - 'Retirez la formule, ou ajoutez un vrai lien de désinscription et l''en-tête List-Unsubscribe : la
    règle ne s''applique plus alors.'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_lotsa_money.cf
- id: sa.guaranteed_100_percent
