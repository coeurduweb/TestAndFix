  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_misc_testing.cf
- id: sa.ready_to_ship
  family: spamassassin
  severity: medium
  penalty: 0.6
  detect:
    signal: spamassassin.hit(READY_TO_SHIP)
    notes: 'score SA 4.0.x : 1.249 (sa-update r1939780, jeu réseau + Bayes). Teste : body : « ready to
      ship », « in our warehouse », « we ship from our factory », « shipping directly to you »...'
  sa_rules:
  - READY_TO_SHIP
