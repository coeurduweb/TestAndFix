  sa_rules:
  - URIBL_DBL_ABUSE_SPAM
  title: Un lien pointe vers un domaine légitime mais détourné pour du spam
  why: Spamhaus signale un domaine légitime dont des pages sont utilisées par des spammeurs (service d'hébergement,
    de formulaire ou de partage). Le lien vous pénalise par association.
  fix:
  - Remplacez le lien vers ce service partagé par un lien vers une page de votre propre domaine.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/25_uribl.cf
  - https://www.spamhaus.org/dbl/
