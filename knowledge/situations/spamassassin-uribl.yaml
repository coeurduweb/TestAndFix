    notes: 'score SA 4.0.x : 2.5 (sa-update r1939780, jeu réseau + Bayes). Teste : check_uridnsbl(''URIBL_DBL_PHISH'')
      : domaine listé dans la DBL comme domaine d''hameçonnage. Gravité fixée à la main, indépendamment
      du score SA, qui sous-estime ici l''effet réel de ce défaut chez les destinataires.'
  sa_rules:
  - URIBL_DBL_PHISH
  title: Un lien pointe vers un domaine Spamhaus DBL (hameçonnage)
  why: Un lien mène à un domaine classé comme site d'hameçonnage par Spamhaus. Si c'est votre domaine,
    il a probablement été piraté pour héberger une fausse page de connexion.
  fix:
