    notes: 'score SA 4.0.x : 2.5 (sa-update r1939780, jeu réseau + Bayes). Teste : check_uridnsbl(''URIBL_DBL_SPAM'')
      : domaine des URL listé dans dbl.spamhaus.org comme domaine de spam.'
  sa_rules:
  - URIBL_DBL_SPAM
  title: Un lien pointe vers un domaine Spamhaus DBL (spam)
  why: Un domaine cité dans le message est inscrit dans la Spamhaus DBL comme domaine de spam. C'est un
    des signaux de lien les plus lourds, et beaucoup de passerelles bloquent sur cette liste.
  fix:
  - 'Repérez le lien concerné ({url}) : c''est parfois un domaine tiers (raccourcisseur, image, réseau
    social) et non le vôtre.'
  - Retirez ou remplacez ce lien, puis renvoyez le test.
  - Si le domaine listé est le vôtre, cherchez la cause (site piraté, campagne non sollicitée) avant de
