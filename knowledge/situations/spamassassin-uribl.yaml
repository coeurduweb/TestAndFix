# Famille spamassassin, groupe uribl. Généré par research/scripts/sa_build.py
# depuis research/work/sa/src/uribl.yaml et les règles sa-update r1939780 (SpamAssassin 4.0.x).
# Ne pas éditer à la main : modifier la source puis régénérer.
- id: sa.uribl_black
  family: spamassassin
  severity: medium
  penalty: 0.9
  detect:
    signal: spamassassin.hit(URIBL_BLACK)
    notes: 'score SA 4.0.x : 1.7 (sa-update r1939780, jeu réseau + Bayes). Teste : check_uridnsbl(''URIBL_BLACK'')
      : un domaine extrait des URL du corps est listé noir sur multi.uribl.com.'
  sa_rules:
  - URIBL_BLACK
  title: Un lien pointe vers un domaine de la liste noire URIBL
  why: Un domaine présent dans les liens du message figure dans la liste noire URIBL, réservée aux domaines
    vus dans du spam. Cela suffit à alourdir nettement le score, même si votre propre domaine est propre.
  fix:
  - 'Repérez le lien concerné ({url}) : c''est parfois un domaine tiers (raccourcisseur, image, réseau
    social) et non le vôtre.'
  - Retirez ou remplacez ce lien, puis renvoyez le test.
  - Si le domaine listé est le vôtre, cherchez la cause (site piraté, campagne non sollicitée) avant de
    demander le retrait via {delist_url}.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/25_uribl.cf
  - https://uribl.com/
- id: sa.uribl_grey
  family: spamassassin
  severity: low
  penalty: 0.2
  detect:
    signal: spamassassin.hit(URIBL_GREY)
    notes: 'score SA 4.0.x : 0.424 (sa-update r1939780, jeu réseau + Bayes). Teste : check_uridnsbl(''URIBL_GREY'')
      : domaine listé gris sur multi.uribl.com.'
  sa_rules:
  - URIBL_GREY
  title: Un lien pointe vers un domaine de la liste grise URIBL
  why: La liste grise URIBL regroupe des domaines d'envoi en nombre qui reçoivent des plaintes, sans être
    des spammeurs avérés. Les domaines de suivi de clics des outils de newsletter y figurent parfois.
  fix:
  - Identifiez le domaine listé ({url}). S'il s'agit du domaine de suivi de votre outil d'envoi, configurez
    un domaine de suivi personnalisé sous votre propre domaine.
  - Si c'est votre domaine, réduisez les plaintes (désinscription visible, envois sollicités) puis demandez
    le retrait via {delist_url}.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/25_uribl.cf
  - https://uribl.com/
- id: sa.uribl_red
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(URIBL_RED)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : check_uridnsbl(''URIBL_RED'')
      : domaine listé rouge sur multi.uribl.com.'
  sa_rules:
  - URIBL_RED
  title: Un lien pointe vers un domaine de la liste rouge URIBL
  why: La liste rouge URIBL signale des domaines surveillés par URIBL sans être assez avérés pour la liste
    noire. SpamAssassin ne la note presque pas, mais c'est un avertissement.
  fix:
  - Vérifiez le domaine signalé ({url}) et retirez le lien s'il ne vous appartient pas.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/25_uribl.cf
  - https://uribl.com/
- id: sa.uribl_blocked
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(URIBL_BLOCKED)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : check_uridnsbl(''URIBL_BLOCKED'')
      : URIBL a refusé la requête (volume ou résolveur public).'
  sa_rules:
  - URIBL_BLOCKED
  title: Requête URIBL refusée au serveur de test
  why: 'Avis d''administration : URIBL n''a pas répondu au serveur d''analyse. Les liens n''ont pas été
    contrôlés sur cette liste, mais votre message n''est pas en cause.'
  fix:
  - Aucune action de votre part.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/25_uribl.cf
  - https://uribl.com/
