  title: Un lien passe par un domaine de suivi listé par SURBL
  why: Le lien passe par un domaine de suivi de clics que SURBL liste parce qu'il sert à des envois sans
    consentement confirmé, jusqu'à des adresses pièges. C'est le cas typique d'un outil d'envoi dont le
    domaine de suivi partagé est aussi utilisé par de mauvais expéditeurs.
  fix:
  - Configurez un domaine de suivi personnalisé (sous-domaine de {domain}) dans votre outil d'envoi.
  - Ou désactivez le suivi des clics pour ce message et testez à nouveau.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/25_uribl.cf
  - https://www.surbl.org/
