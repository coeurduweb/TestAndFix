# Famille spamassassin, groupe headers-identity. Généré par research/scripts/sa_build.py
# depuis research/work/sa/src/headers-identity.yaml et les règles sa-update r1939780 (SpamAssassin 4.0.x).
# Ne pas éditer à la main : modifier la source puis régénérer.
- id: sa.freemail_from
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(FREEMAIL_FROM)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : check_freemail_from()
      : une adresse From appartient à la liste freemail_domains (gmail.com, outlook.*, hotmail.*, yahoo.*,
      orange.fr, free.fr, laposte.net, gmx.*...).'
  sa_rules:
  - FREEMAIL_FROM
  title: L'expéditeur utilise une messagerie gratuite
  why: L'adresse d'expédition est sur une messagerie grand public. Le score est quasi nul, mais cette
    règle sert de condition à d'autres plus lourdes, et une entreprise qui écrit depuis Gmail ou Orange
    inspire moins confiance qu'une adresse de son domaine.
  fix:
  - Pour des envois professionnels, utilisez une adresse de votre propre domaine.
  - 'N''envoyez jamais de newsletter avec une adresse Gmail, Outlook.com ou Yahoo en From : envoyé depuis
    un autre service, le message ne peut pas passer DMARC pour ce domaine, et Yahoo publie une politique
    de rejet.'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_freemail.cf
- id: sa.freemail_replyto
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(FREEMAIL_REPLYTO)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta check_freemail_replyto(''replyto'')
      : Reply-To est une adresse de messagerie gratuite différente du From (ou une adresse gratuite citée
      dans le corps diffère), hors transfert et liste de diffusion.'
  sa_rules:
  - FREEMAIL_REPLYTO
  title: Reply-To sur une messagerie gratuite différente de l'expéditeur
  why: Les réponses partent vers une adresse gratuite qui n'est pas celle de l'expéditeur. C'est le montage
    des arnaques (on écrit depuis une adresse, on récupère les réponses ailleurs), mais aussi celui d'un
    formulaire qui met l'adresse Gmail du visiteur en Reply-To.
  fix:
  - 'Si c''est un formulaire de contact, c''est attendu : vérifiez seulement que le From est une adresse
    de votre domaine authentifiée par SPF et DKIM.'
  - Pour une campagne, mettez en Reply-To une adresse de votre domaine.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_freemail.cf
- id: sa.freemail_forged_replyto
  family: spamassassin
  severity: high
  penalty: 1.0
  detect:
    signal: spamassassin.hit(FREEMAIL_FORGED_REPLYTO)
    notes: 'score SA 4.0.x : 2.095 (sa-update r1939780, jeu réseau + Bayes). Teste : meta check_freemail_header(''Reply-To'')
      && !FREEMAIL_FROM, hors transfert et liste de diffusion.'
  sa_rules:
  - FREEMAIL_FORGED_REPLYTO
  title: Reply-To sur une messagerie gratuite alors que l'expéditeur n'en est pas une
  why: Le message vient d'une adresse d'entreprise mais demande de répondre à une adresse Gmail, Outlook
    ou similaire. C'est très typique des fraudes au président et des fausses factures, d'où une pénalité
    de plus de 2 points.
  fix:
  - Mettez en Reply-To une adresse de votre domaine, ou retirez l'en-tête Reply-To.
  - Pour un formulaire de site qui place l'adresse du visiteur en Reply-To, acceptez cette pénalité ou
    recopiez plutôt l'adresse du visiteur dans le corps du message.
  fix_by_provider:
    wordpress: 'Dans Contact Form 7 ou WPForms, l''en-tête Reply-To: [your-email] provoque cette règle
      quand le visiteur a une adresse gratuite. C''est sans risque pour une notification interne.'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_freemail.cf
- id: sa.freemail_reply
  family: spamassassin
  severity: medium
  penalty: 0.5
  detect:
    signal: spamassassin.hit(FREEMAIL_REPLY)
    notes: 'score SA 4.0.x : 1 (sa-update r1939780, jeu réseau + Bayes). Teste : meta check_freemail_replyto(''reply'')
      : l''expéditeur et une adresse citée dans le corps sont deux messageries gratuites différentes,
      sans Reply-To gratuit.'
  sa_rules:
  - FREEMAIL_REPLY
  title: Le corps du message cite une adresse gratuite différente de l'expéditeur
  why: Le message invite à écrire à une autre adresse gratuite que celle qui envoie. Les arnaques s'en
    servent pour faire répondre à une boîte qui n'a pas encore été signalée.
  fix:
  - Indiquez dans le message une adresse de contact identique à l'expéditeur, ou une adresse de votre
    domaine.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_freemail.cf
- id: sa.freemail_envfrom_end_digit
  family: spamassassin
  severity: low
  penalty: 0.1
  detect:
    signal: spamassassin.hit(FREEMAIL_ENVFROM_END_DIGIT)
    notes: 'score SA 4.0.x : 0.25 (sa-update r1939780, jeu réseau + Bayes). Teste : check_freemail_header(''EnvelopeFrom'',
      ''\d@'') : MAIL FROM gratuit dont l''identifiant finit par un chiffre.'
  sa_rules:
  - FREEMAIL_ENVFROM_END_DIGIT
  title: Adresse d'enveloppe gratuite terminée par un chiffre
  why: L'adresse d'enveloppe est une boîte gratuite du type jean.dupont75@gmail.com. Les comptes créés
    en masse par les spammeurs ont souvent ce format. Pénalité faible.
  fix:
  - Envoyez depuis une adresse de votre domaine pour éviter cette règle et les règles voisines.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_freemail.cf
- id: sa.freemail_replyto_end_digit
  family: spamassassin
  severity: low
  penalty: 0.1
  detect:
    signal: spamassassin.hit(FREEMAIL_REPLYTO_END_DIGIT)
    notes: 'score SA 4.0.x : 0.25 (sa-update r1939780, jeu réseau + Bayes). Teste : check_freemail_header(''Reply-To'',
      ''\d@'').'
  sa_rules:
  - FREEMAIL_REPLYTO_END_DIGIT
  title: Reply-To gratuit terminé par un chiffre
  why: L'adresse de réponse est une boîte gratuite dont l'identifiant finit par un chiffre. Signal faible
    qui s'ajoute aux autres règles freemail.
  fix:
  - Utilisez en Reply-To une adresse de votre domaine.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rules/20_freemail.cf
- id: sa.freemail_forged_fromdomain
  family: spamassassin
  severity: info
  penalty: 0.0
  detect:
    signal: spamassassin.hit(FREEMAIL_FORGED_FROMDOMAIN)
    notes: 'score SA 4.0.x : 0.001 (sa-update r1939780, jeu réseau + Bayes). Teste : meta FREEMAIL_FROM
      && HEADER_FROM_DIFFERENT_DOMAINS.'
  sa_rules:
  - FREEMAIL_FORGED_FROMDOMAIN
  title: Expéditeur gratuit envoyé depuis un autre domaine d'enveloppe
  why: Le From est une adresse gratuite (Gmail, Orange...) mais l'enveloppe appartient à un autre domaine.
    C'est ce que produit un outil d'envoi ou un site configuré avec une adresse Gmail en expéditeur. Le
    message ne peut alors pas être aligné sur le domaine du fournisseur gratuit et échoue à DMARC partout
    où ce domaine publie un enregistrement DMARC.
  fix:
  - Utilisez comme expéditeur une adresse de votre propre domaine, authentifiée dans l'outil d'envoi.
  - Si vous n'avez pas de domaine, envoyez depuis le webmail du fournisseur gratuit lui-même, pas depuis
    un service tiers.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/kmcgrail/20_freemail.cf
  - https://www.rfc-editor.org/rfc/rfc7489
- id: sa.header_from_different_domains
  family: spamassassin
  severity: low
  penalty: 0.1
  detect:
    signal: spamassassin.hit(HEADER_FROM_DIFFERENT_DOMAINS)
    notes: 'score SA 4.0.x : 0.25 (sa-update r1939780, jeu réseau + Bayes). Teste : check_equal_from_domains()
      : les deux derniers niveaux du domaine du From et du MAIL FROM (Return-Path) sont différents.'
  sa_rules:
  - HEADER_FROM_DIFFERENT_DOMAINS
  title: Le domaine du From diffère du domaine d'enveloppe
  why: Le From affiche {domain} mais le Return-Path appartient à {envelope_domain}. C'est le réglage par
    défaut de nombreux outils d'envoi (Brevo, Mailchimp, Mailjet) qui gèrent les retours sur leur propre
    domaine. Pénalité faible, mais SPF n'est alors pas aligné pour DMARC.
  fix:
  - Configurez dans l'outil d'envoi un domaine de retour personnalisé (Return-Path) sous {domain}, par
    exemple bounce.{domain}.
  - À défaut, assurez-vous que DKIM signe avec {domain} pour que DMARC passe malgré tout.
  fix_by_provider:
    brevo: 'Authentifiez {domain} dans la rubrique Domaines de Brevo : la signature DKIM se fait alors
      avec votre domaine, et DMARC passe par DKIM même si le Return-Path n''est pas sous {domain}.'
    mailchimp: 'Authentifiez {domain} dans la rubrique Domains de Mailchimp : la signature DKIM se fait
      alors avec votre domaine, et DMARC passe par DKIM même si le Return-Path n''est pas sous {domain}.'
    amazon_ses: Configurez un MAIL FROM personnalisé (sous-domaine de {domain}) dans l'identité SES.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/kmcgrail/20_freemail.cf
  - https://www.rfc-editor.org/rfc/rfc7489#section-3.1.2
- id: sa.replyto_without_to_cc
  family: spamassassin
  severity: medium
  penalty: 0.8
  detect:
    signal: spamassassin.hit(REPLYTO_WITHOUT_TO_CC)
    notes: 'score SA 4.0.x : 1.552 (sa-update r1939780, jeu réseau + Bayes). Teste : meta exists:Reply-To
      && !exists:ToCc : un Reply-To mais aucun en-tête To ou Cc.'
  sa_rules:
  - REPLYTO_WITHOUT_TO_CC
  title: Reply-To présent sans destinataire To ni Cc
  why: 'Le message a une adresse de réponse mais aucun destinataire visible : tous les destinataires sont
    en copie cachée. C''est ce que fait un envoi groupé depuis une messagerie avec la liste en Cci, schéma
    fréquent dans le spam.'
  fix:
  - 'Ajoutez un en-tête To : l''adresse du destinataire pour un envoi individuel, ou votre propre adresse
    si vous gardez la liste en Cci.'
  - Pour plus de quelques dizaines de destinataires, utilisez un outil d'envoi qui adresse chaque message
    individuellement.
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jm/20_basic.cf
- id: sa.to_no_brkts_dynip
  family: spamassassin
  severity: high
  penalty: 1.5
  detect:
    signal: spamassassin.hit(TO_NO_BRKTS_DYNIP)
    notes: 'score SA 4.0.x : 3.029 (sa-update r1939780, jeu réseau + Bayes). Teste : meta : To sans >
      final (adresse nue), RDNS_DYNAMIC, et absence de signes légitimes (fil de discussion, lien de désinscription,
      Thunderbird, liste de diffusion).'
  sa_rules:
  - TO_NO_BRKTS_DYNIP
  title: Destinataire sans chevrons et IP d'envoi grand public
  why: Le To contient une adresse nue (sans « Nom <...> ») et le message part d'une IP au reverse DNS
    de connexion résidentielle. La combinaison est caractéristique des machines infectées qui envoient
    du spam, d'où une pénalité de 3 points.
  fix:
  - 'Écrivez le destinataire avec un nom et des chevrons : "Prénom Nom" <adresse@exemple.fr>. Les outils
    d''envoi le font si le champ nom est renseigné.'
  - 'Ajoutez l''en-tête List-Unsubscribe et un lien de désinscription : plusieurs variantes de cette règle
    ne s''appliquent plus alors.'
  example_bad: 'To: client@exemple.fr'
  example_good: 'To: "Marie Martin" <client@exemple.fr>'
  references:
  - https://github.com/apache/spamassassin/blob/trunk/rulesrc/sandbox/jhardin/20_tbird_image_spam.cf
