  severity: low
  penalty: 0.1
  detect:
    signal: spamassassin.hit(TO_MALFORMED)
    notes: 'score SA 4.0.x : 0.1 (sa-update r1939780, jeu réseau + Bayes). Teste : header To !~ adresse
